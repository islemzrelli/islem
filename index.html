     drag-reorder stays a List-view feature exactly as it already was. */
  .view-switch{ display:flex; border:1px solid var(--line); }
  .view-switch button{ font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); padding:6px 14px; }
  .view-switch button.active{ color:var(--ink); background:var(--white); }
  .row-title-input, .grid-title-input{ background:transparent; border:none; border-bottom:1px solid transparent; color:var(--white); font:inherit; font-weight:600; padding:0 0 1px; width:100%; }
  .row-title-input:hover, .grid-title-input:hover{ border-bottom-color:var(--line); }
  .row-title-input:focus, .grid-title-input:focus{ border-bottom-color:var(--white); }
  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .grid-card{ border:1px solid var(--line); background:#0c0c0c; position:relative; }
  .grid-card.row-checked{ border-color:var(--white); }
  .grid-thumb-wrap{ position:relative; aspect-ratio:1/1; background:#1a1a1a; overflow:hidden; }
  .grid-thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .grid-select{ position:absolute; top:8px; left:8px; z-index:2; accent-color:var(--white); width:16px; height:16px; }
  .grid-badges{ position:absolute; top:8px; right:8px; z-index:2; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .grid-badge{ font-size:.6rem; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; background:rgba(0,0,0,.65); }
  .grid-badge.on{ color:#8de08d; } .grid-badge.off{ color:var(--dim-2); }
  .grid-badge.featured{ color:#e0c98d; }
  .grid-body{ padding:9px 10px; display:flex; flex-direction:column; gap:5px; }
  .grid-body .sub{ font-size:.68rem; color:var(--dim-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .grid-actions button{ font-size:.64rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); }
  .grid-actions button:hover{ color:var(--white); }

  /* Drag & drop / paste upload target — see wireUploadDropzone(). Sits
     alongside the existing buttons, never replaces them; every file that
     arrives through it goes through the exact same beginBulkFilesSelected()
     entry point the file-picker input already used. */
  .upload-dropzone{ border:1px dashed var(--line); padding:18px; text-align:center; color:var(--dim-2); font-size:.78rem; letter-spacing:.02em; margin-bottom:16px; transition:border-color 150ms var(--ease), color 150ms var(--ease), background 150ms var(--ease); }
  .upload-dropzone.drag-over{ border-color:var(--white); color:var(--white); background:rgba(255,255,255,.04); }

  /* Quick Review grid — shown automatically right after a clean bulk
     upload finishes (see processBulkItem), instead of dropping the admin
     back on the plain list. Card layout intentionally mirrors .assign-grid
     (same thumbnail-first, grid-of-cards feel) but each card carries its
     own small edit form so title/category/tags/location/date can be
     fixed without opening the full editor — see wireReviewGrid(). */
  .review-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .review-header h3{ margin:0 0 4px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:1.05rem; }
  .review-header .sub{ max-width:60ch; }
  .review-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  .review-card{ border:1px solid var(--line); display:flex; flex-direction:column; background:#0c0c0c; }
  .review-thumb{ width:100%; aspect-ratio:4/3; background:#1a1a1a; overflow:hidden; }
  .review-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .review-fields{ display:flex; flex-direction:column; gap:8px; padding:12px; }
  .review-fields input[type="text"], .review-fields input[type="date"], .review-fields select{
    background:#151515; border:1px solid var(--line); color:var(--white); padding:7px 9px; font-family:var(--font-body); font-size:max(14px, .78rem); width:100%;
  }
  .review-title{ font-weight:500; }
  .review-tags{ display:flex; flex-wrap:wrap; align-items:center; gap:5px; border:1px solid var(--line); padding:6px 7px; min-height:34px; }
  .review-tag{ display:inline-flex; align-items:center; gap:4px; font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); border:1px solid var(--line); padding:3px 6px 3px 8px; white-space:nowrap; }
  .review-tag-remove{ color:var(--dim-2); font-size:.8rem; line-height:1; padding:0 1px; }
  .review-tag-remove:hover{ color:var(--white); }
  .review-tag-input{ flex:1 1 60px; min-width:60px; background:transparent; border:none; color:var(--white); font-size:.76rem; padding:3px; }
  .review-card-actions{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .review-save-status{ font-size:.64rem; letter-spacing:.04em; text-transform:uppercase; color:#8de08d; opacity:0; transition:opacity 200ms var(--ease); }
  .review-save-status.show{ opacity:1; }
  .review-save-status.error{ color:#e08d8d; }
  .review-full-edit{ font-size:.68rem; letter-spacing:.03em; text-transform:uppercase; color:var(--dim); white-space:nowrap; }
  .review-full-edit:hover{ color:var(--white); }

  /* ============ REORDER TAB (drag & drop) ============ */
  .reorder-scope-row{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .reorder-scope-row select{ background:#151515; border:1px solid var(--line); color:var(--white); padding:8px 10px; font-family:var(--font-body); font-size:.85rem; }
  .reorder-list{ display:flex; flex-direction:column; border:1px solid var(--line); }
  .reorder-row{ display:flex; align-items:center; gap:12px; padding:8px 12px; border-bottom:1px solid var(--line-soft); background:#0c0c0c; position:relative; }
  .reorder-row:last-child{ border-bottom:none; }
  .reorder-handle{ color:var(--dim-2); font-size:1rem; line-height:1; user-select:none; padding:2px 4px; cursor:grab; touch-action:none; flex-shrink:0; }
  .reorder-row img{ width:40px; height:40px; object-fit:cover; background:#1a1a1a; flex-shrink:0; }
  .reorder-row .reorder-num{ width:26px; flex-shrink:0; color:var(--dim-2); font-size:.72rem; font-variant-numeric:tabular-nums; }
  .reorder-row .reorder-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.85rem; }
  /* Drag handle re-used inside .admin-row-actions on the Photos tab list —
     same touch-friendly pointer-based engine (makeListSortable) as the
     Reorder tab above, just a differently-shaped row. */
  .admin-row-actions .drag-handle{ color:var(--dim-2); font-size:1rem; line-height:1; user-select:none; padding:2px 6px; cursor:grab; touch-action:none; }
  /* Applied by makeListSortable() to whichever row is currently being
     dragged (in either list) — lifted, slightly enlarged, above its
     siblings while it follows the pointer. */
  .sorting-active{ position:relative; z-index:5; box-shadow:0 10px 24px rgba(0,0,0,.5); background:#161616; cursor:grabbing; }
  .sorting-active .drag-handle, .sorting-active .reorder-handle{ cursor:grabbing; }

  /* ============ LANDING TAB (picker + crop tool) ============ */
  .landing-mode-row{ display:flex; gap:10px; margin-bottom:16px; }
  .landing-mode-btn{ padding:9px 16px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); color:var(--dim); background:transparent; }
  .landing-mode-btn.active{ color:var(--ink); background:var(--white); border-color:var(--white); }
  .landing-picker-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px; max-height:320px; overflow-y:auto; border:1px solid var(--line); padding:10px; margin-bottom:14px; }
  .landing-picker-thumb{ position:relative; aspect-ratio:1; overflow:hidden; cursor:pointer; border:2px solid transparent; background:#1a1a1a; }
  .landing-picker-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .landing-picker-thumb.selected{ border-color:var(--white); }
  .landing-picker-thumb .pick-order{ position:absolute; top:4px; right:4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; background:var(--white); color:var(--ink); font-size:11px; font-weight:700; line-height:18px; text-align:center; font-family:var(--font-body); }
  .landing-picker-search{ margin-bottom:10px; }
  .crop-tool-wrap{ display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  .crop-preview-tabs{ display:flex; gap:8px; }
  .crop-preview-tab{ font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; padding:4px 2px; }
  .crop-preview-tab.active{ color:var(--white); border-color:var(--white); }
  /* Visually identical to .crop-preview-tab above but a genuinely separate
     class — NOT reused — so this preview's device toggle can never get
     caught by the crop tool's own `.crop-preview-tab` click handler
     (which queries by that class and blindly clears .active from every
     match on the page). Two same-looking tab groups sharing one class was
     exactly what broke the live preview: clicking either one fired BOTH
     handlers and stripped the wrong group's active state. */
  .hero-preview-device-tab{ font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); border-bottom:2px solid transparent; padding:4px 2px; }
  .hero-preview-device-tab.active{ color:var(--white); border-color:var(--white); }
  .storage-orphan-list{ max-height:360px; overflow-y:auto; border:1px solid var(--line); margin:10px 0 16px; }
  .storage-orphan-row{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-bottom:1px solid var(--line-soft); font-size:.78rem; }
  .storage-orphan-row:last-child{ border-bottom:none; }
  .storage-orphan-path{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); }
  .storage-orphan-bucket{ font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); opacity:.7; }
  .storage-orphan-size{ font-variant-numeric:tabular-nums; min-width:56px; text-align:right; }
  .crop-frame{ position:relative; width:100%; max-width:480px; overflow:hidden; background:#000; touch-action:none; cursor:grab; border:1px solid var(--line); }
  .crop-frame.desktop{ aspect-ratio:16/9; }
  .crop-frame.mobile{ aspect-ratio:9/16; max-width:220px; }
  .crop-frame.dragging{ cursor:grabbing; }
  .crop-frame img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; pointer-events:none; will-change:transform, object-position; }
  .crop-frame .crop-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; background:rgba(0,0,0,.4); pointer-events:none; }
  .crop-zoom-row{ display:flex; align-items:center; gap:10px; max-width:480px; }
  .crop-zoom-row input[type="range"]{ flex:1; }
  .crop-zoom-row span{ font-size:.72rem; color:var(--dim); min-width:34px; text-align:right; }
  .admin-error{ color:#ff8b7a; font-size:.8rem; }
  .admin-saved{ color:#8de08d; font-size:.78rem; align-self:center; }

  /* ---- Hero Text editor (form + live preview, side by side) ---- */
  .hero-text-editor{ display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; margin-top:14px; }
  .hero-text-form{ flex:1 1 340px; min-width:280px; }
  .hero-text-preview{ flex:1 1 320px; min-width:260px; position:sticky; top:12px; }
  .hero-text-size-row{ margin:0 0 16px; }
  .hero-text-size-row .row-label{ display:flex; justify-content:space-between; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .hero-text-size-row input[type="range"]{ width:100%; }
  .hero-text-extra{ border-top:1px solid var(--line-soft); padding-top:14px; margin-top:14px; }
  .hero-text-extra input[type="text"][disabled]{ opacity:.4; }
  .hero-text-extra .hero-text-size-row input[disabled]{ opacity:.4; }
  /* The iframe is rendered at its true simulated size (e.g. 1280×800 for
     "desktop", 375×780 for "mobile" — see HERO_PREVIEW_SIZES) and then
     scaled DOWN via CSS transform to fit the admin column — never sized
     directly to the container — because vw/vh-based clamp() sizing and
     the 860px layout breakpoint need a real viewport of that size to
     evaluate correctly; a same-size iframe scaled visually is the only
     way to preview "how this looks on a phone" from a desktop admin
     screen. See updateHeroPreview() for the scale-factor math. */
  .hero-preview-viewport{ position:relative; overflow:hidden; border-radius:10px; border:1px solid var(--line); background:#050505; }
  .hero-preview-viewport iframe{ position:absolute; top:0; left:0; transform-origin:top left; border:0; pointer-events:none; display:block; }
  .hero-text-tabs{ display:flex; gap:10px; margin:18px 0 16px; }

  /* Undo toast — replaces confirm() on delete. Sits inside the admin panel
     itself (not the site-wide .toast) so it's visible above the modal and
     never gets hidden behind admin-overlay's own z-index. */
  .admin-undo-toast{ position:absolute; left:50%; bottom:22px; transform:translate(-50%, 12px); display:flex; align-items:center; gap:14px; background:var(--white); color:var(--ink); font-size:.82rem; padding:11px 16px; border-radius:2px; box-shadow:0 6px 24px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity 220ms var(--ease), transform 220ms var(--ease); z-index:20; }
  .admin-undo-toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  .admin-undo-toast .undo-btn{ font-weight:600; letter-spacing:.04em; text-transform:uppercase; font-size:.72rem; color:var(--ink); border-bottom:1px solid var(--ink); flex-shrink:0; }
  .admin-undo-toast .undo-btn:hover{ opacity:.65; }

  @media (max-width: 720px){
    .admin-row{ grid-template-columns:44px 1fr; grid-template-areas:"thumb title" "actions actions"; }
    .admin-row .row-thumb{ grid-area:thumb; width:40px; height:40px; }
    .admin-row .row-thumb img{ width:40px; height:40px; }
    .admin-row .col-title{ grid-area:title; }
    .admin-row-actions{ grid-area:actions; }
    .admin-row > *:not(.row-thumb):not(.col-title):not(.admin-row-actions){ display:none; }
    .admin-field-grid{ grid-template-columns:1fr; }
    .admin-panel{ height:94vh; }
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div class="scroll-nav" id="scrollNav" aria-hidden="true">
  <button class="scroll-up" id="scrollUpBtn" type="button" aria-label="Previous photo">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M5 15l7-7 7 7"/></svg>
  </button>
  <button class="scroll-down" id="scrollDownBtn" type="button" aria-label="Next photo">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><path d="M5 9l7 7 7-7"/></svg>
  </button>
</div>

<nav class="cat-nav" id="catNav" aria-label="Photo categories"></nav>

<div class="lang-switch" id="langSwitch" aria-label="Choose story language"></div>

<div class="dl-overlay" id="dlOverlay" data-state="loading" role="status" aria-live="polite" aria-busy="true">
  <div class="dl-spin" aria-hidden="true"></div>
  <p class="dl-title" id="dlTitle"></p>
  <p class="dl-sub" id="dlSub"></p>
  <div class="dl-actions" id="dlActions"></div>
</div>

<main class="scroller" id="scroller">
<header class="hero" id="hero">
  <div class="hero-backdrop" id="heroBackdrop" aria-hidden="true">
    <img id="heroBackdropImg" alt="" decoding="async">
  </div>
  <div class="hero-orbit" id="heroOrbit" aria-hidden="true"></div>
  <div class="hero-scrim" aria-hidden="true"></div>
  <div class="hero-inner">
    <h1 class="signature-wrap">
      <svg class="signature-svg" id="signatureSvgA" viewBox="0 0 700 160" preserveAspectRatio="xMidYMid meet">
        <text id="signatureTextA" x="50%" y="62%" text-anchor="middle" dominant-baseline="middle">Islem Zrelli</text>
      </svg>
    </h1>
    <p class="hero-role" id="heroRoleLine">Activist &middot; Photographer &middot; Filmmaker</p>
    <p class="hero-extra-line hero-extra-1" id="heroAExtra1" style="display:none;"></p>
    <p class="hero-extra-line hero-extra-2" id="heroAExtra2" style="display:none;"></p>
    <button class="enter" id="enterBtn" aria-label="Enter gallery">
      <span id="enterBtnLabel">Enter Gallery</span>
      <span class="arrow-line" aria-hidden="true"></span>
      <svg class="arrow-chevron" viewBox="0 0 20 11" aria-hidden="true"><path d="M1 1l9 9 9-9"/></svg>
    </button>
  </div>
  <!-- Same circular icon badges as Hero B's #heroContact (see
       renderHeroContact() in the JS) — nested directly inside <header>,
       not .hero-inner, so it gets its own bottom-anchored position and
       independent fade-in delay instead of being swept into the
       staggered .hero-inner > * reveal. -->
  <div class="hero-contact" id="heroContactA" aria-label="Contact and social links"></div>
  <span class="hero-mark" id="izMark" aria-hidden="true" style="pointer-events:auto;">I. Z.</span>
</header>
<script>
  // ================= HIDDEN ADMIN GESTURE — setupIZAdminTrigger =================
  // Lives in its own tiny, standalone script — separate from the large app
  // script near the end of the page — for two reasons:
  //  1. It keeps working even if something else on the page throws an error
  //     first (that large script is one big closure; an early failure in it
  //     would otherwise silently take this down with it).
  //  2. It captures the page's first script error, so if the 10th tap ever
  //     finds the rest of the app isn't ready (window.__openAdminGate
  //     missing), it can show that error directly on screen — no DevTools
  //     needed to see what broke.
  //
  // Replaces the old click()-only counter: a single authoritative Pointer
  // Events state machine (down → up, one shared definition of "valid tap")
  // that's structurally isolated from the swipe system (every event this
  // interaction could also fire is stopped from bubbling past izMark), plus
  // an enlarged, invisible hit area (see .hero-mark padding in the CSS) and
  // touch-action:none so the browser's own native gesture recognizer can't
  // claim the touch as a scroll before pointerup ever fires.
  (function setupIZAdminTrigger(){
    var firstError = null;
    window.addEventListener('error', function(e){
      if(firstError) return;
      firstError = (e && e.message) ? e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '') : 'Unknown script error';
    });
    window.addEventListener('unhandledrejection', function(e){
      if(firstError) return;
      var r = e && e.reason;
      firstError = 'Unhandled promise rejection: ' + (r && r.message ? r.message : r);
    });

    var izMark = document.getElementById('izMark');
    if(!izMark) return;

    // ---- Diagnostic self-check ----
    function runCoverageCheck(){
      var r = izMark.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var hit = document.elementFromPoint(cx, cy);
      var covered = !!(hit && hit !== izMark && !izMark.contains(hit));
      var hitLabel = hit ? (hit.id ? '#' + hit.id : hit.className ? '.' + String(hit.className).split(' ')[0] : hit.tagName) : 'none';
      console.log('[IZ_ADMIN_TRIGGER] coverage check | rect=' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' | elementAtCenter=' + hitLabel + ' | coveredByAnotherElement=' + covered);
      if(covered){
        console.warn('[IZ_ADMIN_TRIGGER] izMark is covered by another element at its own center point — taps here may never reach izMark. Investigate the element named above (z-index / position).');
      }
    }
    if(document.readyState === 'complete') runCoverageCheck();
    else window.addEventListener('load', runCoverageCheck);

    var MOVE_TOLERANCE = 14;     // px — generous enough for normal finger jitter during fast repeated tapping
    var MAX_TAP_DURATION = 800;  // ms — long enough for a real tap, short enough to exclude a long-press/hold
    var SEQUENCE_TIMEOUT = 2500; // ms of silence before an in-progress sequence resets to 0

    var activePointerId = null;
    var startX = 0, startY = 0, startTime = 0;
    var tapCount = 0;
    var sequenceTimer = null;

    function resetSequence(reason){
      if(tapCount > 0) console.log('IZ_SEQUENCE_RESET | reason=' + (reason || 'manual') + ' | tapCountWas=' + tapCount);
      tapCount = 0;
      if(sequenceTimer){ clearTimeout(sequenceTimer); sequenceTimer = null; }
    }
    function armTimeout(){
      if(sequenceTimer) clearTimeout(sequenceTimer);
      sequenceTimer = setTimeout(function(){ resetSequence('timeout — ' + SEQUENCE_TIMEOUT + 'ms of silence'); }, SEQUENCE_TIMEOUT);
    }
    function triggerAdmin(){
      resetSequence();
      if(typeof window.__openAdminGate === 'function'){
        window.__openAdminGate();
      } else {
        alert('The admin gesture worked, but the site\'s main script didn\'t finish loading, so the login screen can\'t open yet.\n\n' +
          (firstError ? 'Captured error: ' + firstError : 'No specific error was captured — try a hard refresh (clear cache) or a different browser/network.'));
      }
    }

    ['touchstart','touchmove','touchend','touchcancel','click'].forEach(function(type){
      izMark.addEventListener(type, function(e){ e.stopPropagation(); }, { passive:false });
    });

    izMark.addEventListener('pointerdown', function(e){
      console.log('IZ_EVENT_RECEIVED | type=' + e.type + ' | pointerType=' + e.pointerType + ' | target=' + (e.target && (e.target.id || e.target.tagName)) + ' | currentTarget=' + (e.currentTarget && e.currentTarget.id));
      if(activePointerId !== null) return;
      activePointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY; startTime = Date.now();
      try{ izMark.setPointerCapture(e.pointerId); }catch(err){}
      e.stopPropagation();
    }, { passive:true });

    izMark.addEventListener('pointerup', function(e){
      if(e.pointerId !== activePointerId) return;
      activePointerId = null;
      e.stopPropagation();
      e.preventDefault();
      var dx = e.clientX - startX, dy = e.clientY - startY;
      var moved = Math.sqrt(dx*dx + dy*dy);
      var duration = Date.now() - startTime;
      var accepted = !(moved > MOVE_TOLERANCE || duration > MAX_TAP_DURATION);
      console.log('IZ_POINTERUP | accepted=' + accepted + ' | movedPx=' + Math.round(moved) + ' | durationMs=' + duration + ' | tapCountBefore=' + tapCount);
      if(!accepted) return;
      tapCount++;
      if(tapCount >= 10){
        triggerAdmin();
        return;
      }
      armTimeout();
    }, { passive:false });

    izMark.addEventListener('pointercancel', function(e){
      if(e.pointerId === activePointerId){
        console.warn('IZ_POINTERCANCEL | tapCountWas=' + tapCount + ' | note=Browser took over this touch as a scroll/pan gesture instead of delivering pointerup — the tap was lost.');
        activePointerId = null;
      }
    }, { passive:true });

    if(!window.PointerEvent){
      izMark.addEventListener('click', function(e){
        console.log('IZ_EVENT_RECEIVED | type=' + e.type + ' | pointerType=none (no PointerEvent support) | target=' + (e.target && (e.target.id || e.target.tagName)) + ' | currentTarget=' + (e.currentTarget && e.currentTarget.id));
        e.stopPropagation();
        tapCount++;
        if(tapCount >= 10){ triggerAdmin(); return; }
        armTimeout();
      });
    }
  })();
</script>

<script>
(function(){
  "use strict";

  /* ================= ZOOM PREVENTION =================
     Belt-and-suspenders alongside the viewport meta tag's
     maximum-scale=1/user-scalable=no (CSS touch-action:manipulation is set
     page-wide too — see html,body above). Safari's pinch-zoom is driven by
     its own non-standard gesture* events, which touch-action and the
     viewport meta tag don't fully cover on every iOS version, so it's
     blocked directly here. This never touches 'click' events, so it has
     no effect on the double-tap-to-like handler (scroller's click
     listener) or any other tap/click-based interaction — only the
     browser's own native zoom gestures are suppressed. */
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length > 1) e.preventDefault(); // multi-touch pinch only — single-finger scroll/pan is untouched
  }, { passive:false });

  /* ================= CONFIG — fill these in once, then you're done ================
     SUPABASE_URL / SUPABASE_ANON_KEY: Project Settings -> API in your Supabase project.

     AUTH MODEL: the "I.Z" x10 gesture only ever OPENS THE LOGIN SCREEN — it never
     grants access by itself. Real admin access requires signing in with a Supabase
     Auth account (email + password) created ONCE in Supabase dashboard ->
     Authentication -> Users -> Add user. Give that user Islem's email + a strong
     password. That single account is "the admin" — see ADMIN-ONLY RLS below for
     how the database recognizes it.

     The anon key below is meant to be public (it ships in every page load of every
     Supabase project — that's normal). It grants NOTHING by itself; every table and
     storage bucket below is locked down with Row Level Security so that only a
     request carrying the signed-in admin's own auth token can write anything. */
  var SUPABASE_URL = "https://bkjwzdspuriquurfxcnp.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_8SR8bCmRJAcQtP1eGe6PDA_YDr3AXJ1";
  // Opens the connection to the image hosts before the first photo is
  // actually requested, so that request doesn't also have to pay for
  // DNS/TLS/handshake time on top of the download itself. Covers both
  // the Supabase project (API/db/storage) and wsrv.nl (see
  // sizedPhotoUrl below — that's who actually serves the resized
  // gallery photos).
  (function preconnectImageHost(){
    try{
      [new URL(SUPABASE_URL).origin, 'https://wsrv.nl'].forEach(function(origin){
        ['preconnect', 'dns-prefetch'].forEach(function(rel){
          var link = document.createElement('link');
          link.rel = rel;
          link.href = origin;
          if(rel === 'preconnect') link.crossOrigin = 'anonymous';
          document.head.appendChild(link);
        });
      });
    } catch(e){}
  })();
  /* ================================================================================

     ADMIN-ONLY RLS — run this once in the Supabase SQL editor, AFTER creating the
     admin user above. It replaces the old "anyone with the anon key can write"
     policies with policies that check the request is (a) authenticated AND
     (b) signed in as that exact admin account. Adjust the email in
     ADMIN_EMAIL below to match the account you created, then run the whole block.

  -- Helper: true only when the current request's JWT belongs to the one
  -- admin account (matched by email, since Supabase Auth email addresses
  -- are unique and this project only ever has one admin user). Every
  -- write policy below calls this instead of repeating the same check —
  -- change the email in ONE place if the admin account ever changes.
  create or replace function is_site_admin()
  returns boolean
  language sql stable
  as $$
    select auth.role() = 'authenticated'
       and coalesce(auth.jwt() ->> 'email', '') = 'ADMIN_EMAIL@example.com';
  $$;

  -- photos: public can read published rows only; only the admin can
  -- insert/update/delete or see unpublished/draft rows.
  alter table photos enable row level security;
  drop policy if exists "public write photos" on photos;
  drop policy if exists "public update photos" on photos;
  drop policy if exists "public delete photos" on photos;
  drop policy if exists "public read photos" on photos;
  drop policy if exists "public read published photos" on photos;
  drop policy if exists "admin write photos" on photos;
  drop policy if exists "admin update photos" on photos;
  drop policy if exists "admin delete photos" on photos;
  create policy "public read published photos" on photos
    for select using (published = true or is_site_admin());
  create policy "admin write photos" on photos
    for insert with check (is_site_admin());
  create policy "admin update photos" on photos
    for update using (is_site_admin()) with check (is_site_admin());
  create policy "admin delete photos" on photos
    for delete using (is_site_admin());

  -- about: single public-facing row, publicly readable, admin-only writes.
  -- Landing-page contact/social strip + hero image: run this once to add
  -- the columns the About admin tab now saves to (safe to re-run; no-ops
  -- if already present). A social platform/contact field only appears on
  -- the public site once it's non-empty — leaving one blank hides it.
  -- hero_image_url overrides the auto-picked featured-photo backdrop when
  -- set, and falls back to it when left empty.
  alter table about add column if not exists facebook_url text;
  alter table about add column if not exists tiktok_url text;
  alter table about add column if not exists whatsapp_number text;
  alter table about add column if not exists hero_image_url text;
  alter table about add column if not exists next_project text;
  alter table about add column if not exists finale_tag text;
  alter table about add column if not exists finale_heading text;
  alter table about enable row level security;
  drop policy if exists "public write about" on about;
  drop policy if exists "public update about" on about;
  drop policy if exists "public read about" on about;
  drop policy if exists "admin update about" on about;
  drop policy if exists "admin insert about" on about;
  create policy "public read about" on about for select using (true);
  create policy "admin update about" on about
    for update using (is_site_admin()) with check (is_site_admin());
  create policy "admin insert about" on about
    for insert with check (is_site_admin());

  -- site_settings (watermark config): publicly readable (it only affects
  -- how public images render), admin-only writes.
  alter table site_settings enable row level security;
  drop policy if exists "public write settings" on site_settings;
  drop policy if exists "public update settings" on site_settings;
  drop policy if exists "public read settings" on site_settings;
  drop policy if exists "admin write settings" on site_settings;
  drop policy if exists "admin update settings" on site_settings;
  create policy "public read settings" on site_settings for select using (true);
  create policy "admin write settings" on site_settings
    for insert with check (is_site_admin());
  create policy "admin update settings" on site_settings
    for update using (is_site_admin()) with check (is_site_admin());

  -- categories / photo_categories: publicly readable, admin-only writes.
  alter table categories enable row level security;
  drop policy if exists "public write categories" on categories;
  drop policy if exists "public update categories" on categories;
  drop policy if exists "public delete categories" on categories;
  drop policy if exists "public read categories" on categories;
  drop policy if exists "admin write categories" on categories;
  drop policy if exists "admin update categories" on categories;
  drop policy if exists "admin delete categories" on categories;
  create policy "public read categories" on categories for select using (true);
  create policy "admin write categories" on categories
    for insert with check (is_site_admin());
  create policy "admin update categories" on categories
    for update using (is_site_admin()) with check (is_site_admin());
  create policy "admin delete categories" on categories
    for delete using (is_site_admin());

  alter table photo_categories enable row level security;
  drop policy if exists "public write photo_categories" on photo_categories;
  drop policy if exists "public delete photo_categories" on photo_categories;
  drop policy if exists "public read photo_categories" on photo_categories;
  drop policy if exists "admin write photo_categories" on photo_categories;
  drop policy if exists "admin delete photo_categories" on photo_categories;
  create policy "public read photo_categories" on photo_categories for select using (true);
  create policy "admin write photo_categories" on photo_categories
    for insert with check (is_site_admin());
  create policy "admin delete photo_categories" on photo_categories
    for delete using (is_site_admin());

  -- STORAGE: public "photos" bucket — anyone can read (it's the public
  -- gallery), only the admin can upload/replace/delete.
  drop policy if exists "public read photos bucket" on storage.objects;
  drop policy if exists "admin write photos bucket" on storage.objects;
  drop policy if exists "admin update photos bucket" on storage.objects;
  drop policy if exists "admin delete photos bucket" on storage.objects;
  create policy "public read photos bucket" on storage.objects
    for select using (bucket_id = 'photos');
  create policy "admin write photos bucket" on storage.objects
    for insert with check (bucket_id = 'photos' and is_site_admin());
  create policy "admin update photos bucket" on storage.objects
    for update using (bucket_id = 'photos' and is_site_admin());
  create policy "admin delete photos bucket" on storage.objects
    for delete using (bucket_id = 'photos' and is_site_admin());

  -- STORAGE: private "photos-originals" bucket — admin-only for every
  -- operation, including insert. There is still deliberately NO select
  -- policy for anyone but the admin, so a signed-out (or non-admin) request
  -- can never read, list or download an original master file.
  drop policy if exists "anon insert originals" on storage.objects;
  drop policy if exists "admin read originals" on storage.objects;
  drop policy if exists "admin insert originals" on storage.objects;
  drop policy if exists "admin delete originals" on storage.objects;
  create policy "admin read originals" on storage.objects
    for select using (bucket_id = 'photos-originals' and is_site_admin());
  create policy "admin insert originals" on storage.objects
    for insert with check (bucket_id = 'photos-originals' and is_site_admin());
  create policy "admin delete originals" on storage.objects
    for delete using (bucket_id = 'photos-originals' and is_site_admin());

     ================================================================================

     PRIVATE ORIGINALS BUCKET — no longer required. Photo uploads used to
     store the untouched, full-resolution master file here before this was
     removed: with 150+ photos, that full-resolution copy — routinely
     several MB to tens of MB each, since it was never resized or
     recompressed like the public copy is — was the entire cause of a real
     Supabase storage-quota overage despite the visible site needing barely
     any space at all (see uploadFile's own comment). Uploads no longer
     write anything here.
     If you already created this bucket and it has old files in it from
     before this change, the admin "Storage" tab's scanner still lists and
     lets you bulk-delete them (nothing on the site reads from this bucket
     for anything, so clearing it out entirely is always safe) — that
     reclaims real space right away, on top of no new files accumulating.
     The bucket and its RLS policies above are otherwise harmless to leave
     in place unused, or you can delete the bucket entirely from the
     Supabase dashboard if you're confident you'll never want it again.

     ================================================================================

     WATERMARK FEATURE — run this once in the Supabase SQL editor before the
     admin "Watermark" tab or per-photo overrides will have anywhere to save
     to. Until you run it, the site falls back to sensible in-code defaults
     (visible watermark, bottom-right, 35% opacity) and the admin tab will
     just show those defaults with a Save button that creates the row.

  create table if not exists site_settings (
    id int primary key default 1,
    watermark_enabled boolean default true,
    watermark_text text default 'Islem Zrelli',
    watermark_opacity numeric default 0.35,
    watermark_position text default 'bottom-right',
    watermark_x_offset int default 20,
    watermark_y_offset int default 20,
    watermark_scale numeric default 1,
    updated_at timestamptz default now()
  );
  insert into site_settings (id) values (1) on conflict (id) do nothing;

  -- Per-photo override columns
  alter table photos add column if not exists watermark_override boolean default false;
  alter table photos add column if not exists watermark_position text;
  alter table photos add column if not exists watermark_x_offset int;
  alter table photos add column if not exists watermark_y_offset int;
  alter table photos add column if not exists watermark_scale numeric;

  -- "All" nav tab visibility. Lives here (not the `categories` table)
  -- because "All" isn't a real category row — see navCategoryList()'s own
  -- comment — it's a synthetic system tab, so its one on/off switch is
  -- just a plain site-wide setting like the watermark fields above.
  alter table site_settings add column if not exists hide_all_category boolean default false;

  -- (RLS for site_settings is set in the ADMIN-ONLY RLS block above.)

     ================================================================================

     CATEGORY NAVIGATION — run this once in the Supabase SQL editor before the
     admin "Categories" tab, the per-photo category chips, or the public
     category nav bar will have anywhere to read/write. Until you run it, the

     row in this table — driven entirely by the photos.is_favorite column.

  create table if not exists categories (
    id uuid primary key default gen_random_uuid(),
    name text not null,
    slug text not null,
    sort_order int default 0,
    is_visible boolean default true,
    created_at timestamptz default now()
  );

  create table if not exists photo_categories (
    photo_id bigint references photos(id) on delete cascade,
    category_id uuid references categories(id) on delete cascade,
    primary key (photo_id, category_id)
  );
  -- NOTE: adjust photo_id's type above to match your photos.id column type
  -- (bigint/int8 is Supabase's default identity type — change to uuid if
  -- your photos table uses uuid primary keys instead).

  alter table photos add column if not exists is_favorite boolean default false;

  -- Seed the six starting categories (Favorite is not included — see above):
  insert into categories (name, slug, sort_order) values

    ('Wall',          'wall',          3),
    ('Landscape',     'landscape',     4)
  on conflict do nothing;

  -- (RLS for categories/photo_categories is set in the ADMIN-ONLY RLS block above.)

     ================================================================================

     STORY TRANSLATIONS — run this once in the Supabase SQL editor before the
     admin "Translations" fields on each photo, or the public language
     switcher, will have anywhere to read/write. Until you run it, the
     switcher still appears but every language just falls back to the

  alter table photos add column if not exists translations jsonb default '{}'::jsonb;
  -- Shape: { "fr": { "title": "...", "story": "..." }, "ar": { "title": "...", "story": "..." } }
  -- One JSON column rather than per-language columns, so adding a new

  -- (RLS: this rides on the existing photos table policies above — no new
  -- policy needed, translations are just another column on that row.)

     PER-CATEGORY & FAVORITES ORDER — run this once before using the admin

  -- global display_order and of its position in any other category. Two

     LANDING PAGE IMAGE & CROP — run this once before using the admin
     "Landing" tab's photo picker or crop/position tool. Until you run it,

  alter table about add column if not exists hero_crop jsonb default '{"scale":1,"x":50,"y":50}'::jsonb;
  -- The admin's chosen composition for the landing backdrop: x/y are the
  -- focal point as a percentage (0-100) of the image, and scale is the
  -- zoom factor (1 = fit, >1 = zoomed in). Applied on the public site via

  alter table about add column if not exists work_title_crop jsonb default '{"scale":1,"x":50,"y":50}'::jsonb;
  -- Same shape/meaning as hero_image_url/hero_crop above, just a second,

     "ABOUT ISLEM" STORY SECTION — no schema change needed; this is a

     ================================================================================

     HERO TEXT CONTROL — run this once before using the admin Landing
     Page tab's new "Hero A Text" / "Hero B Text" sections. Until you run

     before — nothing changes on the public site pre-migration, the admin
     fields just have nowhere to save to yet.

  alter table about add column if not exists hero_a_text jsonb;
  -- Shape: { name, name_scale, name_y, role, role_scale, role_y, button_label,
  --          extra1:{enabled,text,scale,y}, extra2:{...}, scrim_opacity,
  --          block_y, contact_scale, contact_y }
  -- name/role/button_label/extraN.text are the actual words shown.
  -- *_scale (default 1) multiplies that line's existing responsive
  -- clamp()/rem font-size — see applyHeroTextConfig() — so "bigger" stays
  -- proportionally bigger on a phone AND a desktop, never a fixed px size
  -- that's huge on one and tiny on the other.
  -- *_y (default 0, px) nudges that ONE line up/down within a small safe
  -- range. block_y (default 0, px, wider range) instead moves the WHOLE
  -- text block together — the actual fix for a specific backdrop photo's
  -- subject landing right where the centered text naturally sits (e.g. a
  -- face behind the "Enter Gallery" button) — one slider that repositions
  -- everything as a group rather than re-nudging every line individually.
  -- contact_scale/contact_y (defaults 1/0) do the same for the contact/
  -- social-links row specifically, independently of the text block above
  -- it. All of these stay clamped (in applyHeroTextConfig() as well as the
  -- admin UI's sliders) to ranges that can't push anything into the
  -- corner mark, language switcher, or each other on any screen size.
  -- scrim_opacity (default 1 = current design) multiplies the dark
  -- gradient behind the text, so a bright photo can get more overlay
  -- without touching the photo itself.
  -- A null/missing row (or a missing key within it) falls back to
  -- exactly the current hardcoded value for that field — see the
  -- defaults object in applyHeroTextConfig().

  alter table about add column if not exists hero_b_text jsonb;
  -- Same idea, for Hero B: { location, location_scale, location_y,
  -- credit, credit_scale, credit_y, button_label, extra1:{...}, extra2:{...},
  -- scrim_opacity, block_y, contact_scale, contact_y }. button_label is
  -- Hero B's own "keep scrolling" cue (the .enter button + arrow below
  -- the credit line, same treatment as Hero A's) — same convention as
  -- Hero A's button_label. Hero B's own story-count line (the dynamic "N
  -- stories of documentary photography") is intentionally NOT part of
  -- this config — it's computed from the real photo count, not
  -- admin-authored text, so it stays exactly as it already worked.

  -- (RLS: rides on the existing about table policies above — no new
  -- policy needed, these are just more columns on the same row.)

  ================================================================================ */

  // Storage adapter picks localStorage (persists across browser restarts)
  // when the admin checked "Remember me" on their last login, sessionStorage
  // (cleared when the browser/tab closes) otherwise. The flag itself is not
  // sensitive — it's just a UI preference — so it's fine to keep in
  // localStorage regardless of which storage ends up holding the session.
  var REMEMBER_FLAG_KEY = 'zr_admin_remember';
  function adminAuthStorage(){
    try{
      return localStorage.getItem(REMEMBER_FLAG_KEY) === '1' ? window.localStorage : window.sessionStorage;
    } catch(e){
      return window.sessionStorage;
    }
  }
  function createSbClient(){
    var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: adminAuthStorage(), persistSession: true, autoRefreshToken: true }
    });
    // Keeps `session` in sync and, if the admin's token expires or they
    // sign out in another tab while the panel is open here, drops back to
    // the login form rather than leaving a stale-looking panel on screen.
    // Re-registered on every createSbClient() call so it stays attached to
    // whichever client instance is actually live after a login swaps `sb`
    // to the storage the user just picked.
    client.auth.onAuthStateChange(function(event, newSession){
      session = newSession;
      document.body.classList.toggle('is-admin-viewer', !!newSession);
      if(!newSession && typeof adminOverlay !== 'undefined' && adminOverlay &&
         adminOverlay.style.display === 'flex' && adminPanelEl && adminPanelEl.style.display !== 'none'){
        showAdminLogin();
      }
    });
    return client;
  }
  var sb = createSbClient();
  sb.auth.getSession().then(function(res){
    var restored = res && res.data && res.data.session;
    if(restored){ session = restored; document.body.classList.add('is-admin-viewer'); }
  }).catch(function(){});
  var BUCKET = "photos";                    // public — watermarked copies only
  var ORIGINALS_BUCKET = "photos-originals"; // private — untouched masters, never read back by the app

  // Reverses getPublicUrl(): given a photo's full public URL, returns just
  // the storage path inside `bucket` (what storage.remove() needs), or
  // null if the URL doesn't look like it belongs to that bucket at all
  // (e.g. it's already null/empty, or was hand-entered oddly) — callers
  // treat null as "nothing we can safely delete," never as "delete
  // everything," since a wrong guess here would delete the wrong file.
  function storagePathFromPublicUrl(url, bucket){
    if(!url) return null;
    var marker = '/object/public/' + bucket + '/';
    var idx = url.indexOf(marker);
    if(idx === -1) return null;
    var path = url.slice(idx + marker.length).split('?')[0];
    try{ return decodeURIComponent(path); } catch(e){ return path; }
  }
  // Deletes the public watermarked copy behind one or more photos'
  // image_url — used wherever a photo record stops pointing at a file
  // (deleted outright, or its image replaced with a new upload) so that
  // file doesn't sit in storage forever, unreferenced, still being billed.
  // Deliberately best-effort: storage cleanup failing (network hiccup,
  // already gone, etc.) never blocks or rolls back the database change
  // that's the actual point of the action — see each call site's own
  // try/catch. Does NOT touch the private original in `photos-originals`;
  // that file's path was never saved anywhere on the photo record to
  // begin with (see uploadFile()'s own comment), so it can't be targeted
  // individually — it's exactly what the "Find Orphaned Storage Files"
  // admin tool cleans up instead, retroactively, by listing the bucket
  // rather than needing a stored path per photo.
  async function removeStorageFilesForUrls(urls){
    var paths = urls.map(function(u){ return storagePathFromPublicUrl(u, BUCKET); }).filter(Boolean);
    if(!paths.length) return;
    try{ await sb.storage.from(BUCKET).remove(paths); } catch(e){ /* best-effort — see comment above */ }
  }

  /* SITE_URL: used for canonical links, Open Graph/Twitter urls, clean per-photo
     URLs, and the admin sitemap export. No trailing slash.
     The domain is read live from window.location.origin — never hardcoded
     — so every one of those (including the Share button, which is what
     was actually reported wrong) always matches wherever the site is
     genuinely running, with nothing to update if the domain ever changes
     again. This used to be a fully hardcoded string, which is exactly how
     it silently went stale after the last domain move — same root cause
     was quietly also affecting the Open Graph/canonical/sitemap URLs,
     not just the visible Share link.
     Only the PATH portion — a GitHub Pages *project*-site subpath, needed
     because this is served at username.github.io/repo-name rather than a
     custom domain — has to stay a fixed setting below, since that's a
     deployment detail that doesn't change just because the *username*
     part of the domain does (which is what actually happened here: the
     account is now islemzrelli, but it's still a github.io project site,
     still at the /islem repo path — window.location.origin above already
     picks up the new username on its own; this only covers the repo-name
     part it can't infer). Update this the one time the repo itself is
     ever renamed or the site moves to its own custom domain (in which
     case set it back to ""). */
  var SITE_SUBPATH = "/islem";
  var SITE_URL = window.location.origin + SITE_SUBPATH;
  var BASE_PATH = SITE_SUBPATH;

  // Every history.pushState/replaceState call in this file goes through
  // here. Browsers require the target URL to resolve to the SAME ORIGIN as
  // the actual document — true on the real deployed site (BASE_PATH is
  // built from that same origin above), but NOT true in a few other
  // contexts this file can end up loaded in: a sandboxed preview iframe
  // (document URL literally "about:srcdoc"), opened locally via file://,
  // or embedded in someone else's page. In those, the browser throws an
  // uncaught SecurityError — and since URL updates now fire on nearly
  // every scroll step (see setupSceneBehavior), an uncaught throw there
  // would silently cut off the rest of that scroll observer's batch.
  // Swallowing it here just means the address bar doesn't update in those
  // unsupported contexts; every actual feature (scroll position, head/meta
  // updates, in-app navigation) still works normally either way.
  function safeHistory(method, state, url){
    // While a deep link (/work/<slug>, /category/<slug>) is still unresolved — or has resolved to
    // an intentional not-found/error screen — NOTHING is allowed to rewrite the address bar. This is
    // the guard that stops any observer/initializer from replacing the requested URL with "/" (or
    // another photo's URL) before the requested route has actually been shown. See routeHold().
    if(routeHold()){
      dlog('URL WRITE BLOCKED (deep link unresolved)', method, url, dlCaller());
      return false;
    }
    try{
      history[method](state, '', url);
      dlog('URL WRITE', method, url, dlCaller());
      return true;
    } catch(e){ return false; }
  }

  /* ================= DEEP-LINK ROUTING STATE ================= */
  // What used to go wrong: the requested route was only ever "stored" in window.location itself, and
  // several unrelated systems (the hero IntersectionObserver, the per-scene observer, head updates)
  // write to window.location as a side effect of merely existing. One of them (the hero observer)
  // fires ~1 frame after load — long before the Supabase fetch returns — and replaced
  // /work/<slug>/ with "/". By the time applyInitialRoute() looked, the deep link was already gone,
  // so it saw a plain landing visit. The route is therefore captured ONCE, synchronously, below,
  // before anything asynchronous can run, and every later step reads DEEP — never the live URL.
  //
  //   DEEP.status:  'none'     not a deep link, or already resolved (normal operation)
  //                 'loading'  a deep link is being resolved — show the loading screen, block URL writes
  //                 'notfound' resolved to "no such (published) photo" — intentional screen, URL kept
  //                 'error'    the data could not be loaded — intentional screen with Retry, URL kept
  //
  // Debug logging: OFF by default. Turn on with ?dldebug=1 on the URL, or
  // localStorage.setItem('iz_debug_deeplink','1') — prints the full deep-link timeline to the console.
  var DL_DEBUG = false;
  try{ DL_DEBUG = /[?&]dldebug=1(&|$)/.test(window.location.search) || window.localStorage.getItem('iz_debug_deeplink') === '1'; }catch(e){}
  function dlog(){
    if(!DL_DEBUG) return;
    var a = Array.prototype.slice.call(arguments);
    a.unshift('[deep-link +' + Math.round(performance.now()) + 'ms]');
    try{ console.log.apply(console, a); }catch(e){}
  }
  function dlCaller(){
    if(!DL_DEBUG) return '';
    try{ return (new Error().stack || '').split('\n').slice(3, 5).map(function(l){ return l.trim(); }).join(' < '); }catch(e){ return ''; }
  }

  var DEEP = { kind:null, slug:null, status:'none', dataReady:false, loadSeq:0, slowTimer:null };
  function routeHold(){ return DEEP.status === 'loading' || DEEP.status === 'notfound' || DEEP.status === 'error'; }
  function decodeSlug(s){ try{ return decodeURIComponent(s); }catch(e){ return s; } }
  function readRouteFromLocation(){
    var path = window.location.pathname;
    var work = slugFromPath(path);
    if(work) return { kind:'photo', slug:decodeSlug(work) };
    var cat = categorySlugFromPath(path);
    if(cat) return { kind:'category', slug:decodeSlug(cat) };
    return { kind:null, slug:null };
  }

  // A 404.html bounce (?redirect=/work/x/) is turned back into the real path FIRST, so everything
  // below — the route capture, the boot gate, initCategoryState — sees the address the visitor
  // actually asked for.
  restoreRedirectedPath();
  (function captureInitialRoute(){
    dlog('REQUESTED PATH', window.location.pathname);
    var r = readRouteFromLocation();
    if(r.kind){
      DEEP.kind = r.kind; DEEP.slug = r.slug; DEEP.status = 'loading';
      dlog('DEEP LINK DETECTED', r.kind, r.slug);
    } else {
      dlog('NOT A DEEP LINK (plain landing visit)');
    }
    // The head-level boot gate has served its purpose; the real, state-driven gate takes over below.
    document.documentElement.classList.remove('dl-boot');
  })();

  var DEFAULT_TITLE = document.title;
  var DEFAULT_DESC = document.querySelector('meta[name="description"]').content;
  var DEFAULT_OG_IMAGE = document.getElementById('ogImage').content;
  var DEFAULT_OG_IMAGE_ALT = document.querySelector('meta[property="og:image:alt"]').content;

  var photos = [];
  var activePhotos = [];       // currently displayed (filtered) subset of `photos`
  var categories = [];         // rows from Supabase `categories` table
  var photoCategoryMap = {};   // photo_id -> [category_id, ...]
  var photoCategoryRows = [];  // raw photo_categories rows (id, category_id, sort_order) — used for per-category order
  var currentCategorySlug = 'favorite';
  // Sentinel visualActiveNavSlug value for "the visitor is on the landing
  // hero itself, before entering any category" — deliberately not null,
  // since null means "no opinion, fall back to currentCategorySlug" (see
  // renderCategoryNav()'s `visualActiveNavSlug || currentCategorySlug`),
  // and currentCategorySlug defaults to 'favorite' even before the
  // visitor has scrolled anywhere. Without this distinct sentinel, that
  // default was exactly what made the nav bar show "FAVORITE" as active
  // while still sitting on the hero, having never browsed anything.
  // Guaranteed to never match a real category slug, so every nav button
  // simply renders un-active whenever this is the active value. Declared
  // above visualActiveNavSlug specifically so its very first value below
  // can already be this sentinel — var assignments run in source order
  // (only the declaration itself hoists), so referencing it any later
  // would read back undefined on that first line.
  var NO_ACTIVE_NAV_SLUG = '__hero__';
  // Which nav button LOOKS active, as opposed to currentCategorySlug
  // (which is the real, data-backing category and drives activePhotos).
  // Starts as NO_ACTIVE_NAV_SLUG since the visitor always starts on the
  // landing hero before any scrolling has happened. null means "no
  // opinion, fall back to currentCategorySlug" — updateOnScroll() sets it
  // to that once the visitor actually leaves the hero, or to
  // ISLEM_INTRO_SLUG while scrolled into the #introStory scenes, so the
  // "ISLEM ZRELLI" tab lights up while looking at that content — it's
  // never allowed to become currentCategorySlug itself (see the big
  // comment on ISLEM_INTRO_SLUG below) so this is the only way the nav
  // bar can reflect it.
  var visualActiveNavSlug = NO_ACTIVE_NAV_SLUG;
  // The slug of the virtual "ISLEM ZRELLI" nav chapter — reuses the same
  // slug as the existing hidden "Islem Zrelli" About category (see the
  // SQL setup comment above), since they're the same underlying photos,
  // but this value is only ever compared against. It must never be
  // passed into selectCategory()/renderScenes() as a real, renderable
  // category — see navCategoryList(), selectCategory()'s own guard, and
  // the catNav click handler below — or its 3 photos would render a
  // second time inside #scenesTrack alongside their existing #introStory
  // copy.
  var ISLEM_INTRO_SLUG = 'islem-zrelli';
  var about = {};
  var session = null;

  /* ================= STORY TRANSLATIONS ================= */
  // Add a language here (and run the matching alter table in the SQL note
  // above if it's a brand-new column set) and it shows up everywhere:
  // the public switcher, the per-photo admin fields, and tText()'s
  // fallback logic — nothing else to touch.
  var SUPPORTED_LANGS = [
    { code:'en', label:'EN', name:'English' },
    { code:'fr', label:'FR', name:'Français' },
    { code:'ar', label:'AR', name:'العربية' }
  ];
  var LANG_KEY = 'iz_lang';
  function getLang(){ try{ return localStorage.getItem(LANG_KEY) || 'en'; }catch(e){ return 'en'; } }
  function setLang(code){ try{ localStorage.setItem(LANG_KEY, code); }catch(e){} }
  var currentLang = getLang();
  if(SUPPORTED_LANGS.every(function(l){ return l.code !== currentLang; })) currentLang = 'en';

  // Resolves a photo's title/story in the current language, falling back
  // to the original English field whenever that language has no
  // translation yet for this photo (missing column, empty admin field, or
  // a photo added before translations existed all land here safely).
  function tText(photo, field){
    if(currentLang === 'en') return photo[field];
    var t = photo && photo.translations && photo.translations[currentLang];
    return (t && t[field]) ? t[field] : photo[field];
  }

  // Live machine translation, used by the "Auto-translate" button in the
  // admin's per-photo Translations section. Uses MyMemory
  // (api.mymemory.translated.net) — free, no signup, no billing account,
  // and CORS-enabled so it can be called directly from the browser with
  // no backend/edge function needed at all. Rate-limited (5,000 chars/day
  // anonymously; MyMemory raises that to 50,000/day if a contact email is
  // attached — see the &de= param below, used automatically when the
  // About tab has a contact email configured). Quality is a blend of
  // crowdsourced translation memory and machine translation — decent for
  // short captions, but a notch below a paid engine on some sentences.
  // Deliberately NOT called automatically anywhere: this is admin-
  // triggered only, so nothing gets machine-translated without a human
  // choosing to, and the draft it returns is always editable before Save
  // actually persists it.
  async function myMemoryTranslateOne(text, targetLangCode){
    if(!text) return '';
    var langpair = 'en|' + targetLangCode;
    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + encodeURIComponent(langpair);
    if(about.contact_email) url += '&de=' + encodeURIComponent(about.contact_email);
    var resp;
    try{
      resp = await fetch(url);
    } catch(e){
      throw new Error('Could not reach the translation service — check your connection and try again.');
    }
    var data = await resp.json().catch(function(){ return null; });
    if(!data || !data.responseData || typeof data.responseData.translatedText !== 'string'){
      throw new Error('Translation service returned an unexpected response.');
    }
    // MyMemory returns 200 with an error message inside responseData when
    // the daily limit is hit, rather than a proper HTTP error — so check
    // the text itself, not just the status.
    if(/MYMEMORY WARNING|QUOTA/i.test(data.responseData.translatedText)){
      throw new Error('Daily translation limit reached — try again tomorrow, or type it in by hand above.');
    }
    return data.responseData.translatedText;
  }

  async function autoTranslate(title, story, targetLangCode){
    var translatedTitle = await myMemoryTranslateOne(title, targetLangCode);
    var translatedStory = await myMemoryTranslateOne(story, targetLangCode);
    return { title: translatedTitle, story: translatedStory };
  }

  function renderLangSwitch(){
    var el = document.getElementById('langSwitch');
    if(!el) return;
    el.innerHTML = SUPPORTED_LANGS.map(function(l){
      return '<button type="button" data-lang="'+l.code+'" class="'+(l.code===currentLang?'active':'')+'" aria-label="'+escapeHtml(l.name)+'" aria-pressed="'+(l.code===currentLang)+'">'+l.label+'</button>';
    }).join('<span class="lang-divider" aria-hidden="true">/</span>');
    el.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', function(){
        var code = btn.getAttribute('data-lang');
        if(code === currentLang) return;
        currentLang = code;
        setLang(code);
        renderLangSwitch();
        renderIntroStory();
        renderScenes();
      });
    });
  }

  /* ================= WATERMARK ================= */
  // Shared by applyHeroTextConfig() (public renderer) and the Landing
  // Page admin tab, so the two can never drift out of sync — an
  // unconfigured/pre-migration site renders using exactly these values,
  // which ARE the site's original hardcoded hero copy.
  var HERO_A_TEXT_DEFAULTS = { name:'Islem Zrelli', name_scale:1, name_y:0, role:'Activist · Photographer · Filmmaker', role_scale:1, role_y:0, button_label:'Enter Gallery', extra1:{enabled:false,text:'',scale:1,y:0}, extra2:{enabled:false,text:'',scale:1,y:0}, scrim_opacity:1, block_y:0, contact_scale:1, contact_y:0 };
  var HERO_B_TEXT_DEFAULTS = { location:'Gabès, Tunisia', location_scale:1, location_y:0, credit:'By Islem Zrelli', credit_scale:1, credit_y:0, button_label:'Continue', extra1:{enabled:false,text:'',scale:1,y:0}, extra2:{enabled:false,text:'',scale:1,y:0}, scrim_opacity:1, block_y:0, contact_scale:1, contact_y:0 };
  function mergeHeroTextConfig(defaults, raw){
    raw = raw || {};
    var merged = Object.assign({}, defaults, raw);
    merged.extra1 = Object.assign({}, defaults.extra1, raw.extra1 || {});
    merged.extra2 = Object.assign({}, defaults.extra2, raw.extra2 || {});
    return merged;
  }

  // ---- Hero text FOUC fix ----
  // applyHeroTextConfig() needs real data from `about`, which only exists
  // after loadPublicData()'s network fetch resolves — but the hero's
  // entrance animation used to fire independently, right on load, with
  // no such wait. Net effect: text became visible at its CSS defaults
  // (unconfigured position/size) for a beat, then visibly snapped to the
  // real configured position once the fetch finished. Two-part fix:
  //  1. Cache the last-fetched hero_a_text/hero_b_text in localStorage
  //     after every successful load (saveHeroTextConfigToCache, called
  //     from loadPublicData()). On the *next* visit, that cached config
  //     is applied synchronously, before anything is revealed — a
  //     same-tab best guess that's right unless the site owner changed
  //     something since the visitor's last visit, in which case the real
  //     fetch corrects it moments later (a harmless, rare re-snap, not a
  //     flash from nothing).
  //  2. On a visitor's very first-ever visit, there's nothing cached to
  //     guess from — for that case specifically, the entrance animation
  //     is deferred until the real fetch resolves and applies the actual
  //     config (see fireHeroEntranceOnce() below), rather than racing it.
  var HERO_TEXT_CACHE_KEY = 'izHeroTextCache_v1';
  function loadCachedHeroTextConfig(){
    try{
      var raw = localStorage.getItem(HERO_TEXT_CACHE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : null;
    } catch(e){ return null; } // private-mode/storage-disabled/corrupt — just skip the optimization
  }
  function saveHeroTextConfigToCache(){
    try{
      localStorage.setItem(HERO_TEXT_CACHE_KEY, JSON.stringify({
        hero_a_text: about.hero_a_text || null,
        hero_b_text: about.hero_b_text || null
      }));
    } catch(e){ /* storage full/disabled — fine, this is only ever a nice-to-have */ }
  }

  // This object has grown beyond just watermark config (see
  // hide_all_category below) — it mirrors the `site_settings` table as a
  // whole, one row of misc site-wide toggles, not only watermark fields.
  var DEFAULT_WATERMARK = {
    watermark_enabled: true,
    watermark_text: 'Islem Zrelli',
    watermark_opacity: 0.35,
    watermark_position: 'bottom-right',
    watermark_x_offset: 20,
    watermark_y_offset: 20,
    watermark_scale: 1,
    hide_all_category: false
  };
  var settings = Object.assign({}, DEFAULT_WATERMARK);

  var WM_POSITIONS = [
    { value:'bottom-right',  label:'Bottom Right' },
    { value:'bottom-left',   label:'Bottom Left' },
    { value:'top-right',     label:'Top Right' },
    { value:'top-left',      label:'Top Left' },
    { value:'center-bottom', label:'Center Bottom' },
    { value:'center',        label:'Center' }
  ];
  function wmPositionOptionsHtml(selected){
    var html = '';
    WM_POSITIONS.forEach(function(p){
      html += '<option value="'+p.value+'" '+(selected===p.value?'selected':'')+'>'+p.label+'</option>';
    });
    return html;
  }

  // Merges global watermark settings with a photo's own override (if it has
  // one) into the concrete {text, opacity, position, x, y} the CSS needs.
  // Returns null when the watermark is switched off globally — callers
  // then simply don't stamp data-wm-text on that photo's frame.
  function watermarkConfigFor(p){
    if(!settings.watermark_enabled) return null;
    var useOverride = !!(p && p.watermark_override && p.watermark_position);
    return {
      text: settings.watermark_text || 'Islem Zrelli',
      opacity: (settings.watermark_opacity != null ? settings.watermark_opacity : 0.35),
      position: useOverride ? p.watermark_position : settings.watermark_position,
      x: (useOverride && p.watermark_x_offset != null) ? p.watermark_x_offset : settings.watermark_x_offset,
      y: (useOverride && p.watermark_y_offset != null) ? p.watermark_y_offset : settings.watermark_y_offset,
      scale: (useOverride && p.watermark_scale != null) ? p.watermark_scale : (settings.watermark_scale != null ? settings.watermark_scale : 1)
    };
  }

  // Builds the class + attribute string for a scene's inner .wm-frame
  // wrapper (the box that's sized to match the photo's actual rendered
  // edges — see the CSS comment above). Now purely a sizing wrapper: the
  // watermark itself is already burned into image_url's pixels by the
  // time this runs (see processImageForUpload / drawWatermarkOnCanvas
  // below), so there's nothing watermark-related left to stamp onto the
  // DOM here — see the CSS comment where .wm-frame::after used to live
  // for why that live-overlay approach was replaced.
  function wmFrameAttrs(p){
    var ratio = (p && p.image_width && p.image_height) ? (p.image_width+'/'+p.image_height) : '3/4';
    return ' class="wm-frame" style="aspect-ratio:'+ratio+';"';
  }

  async function loadSettings(){
    try{
      var res = await sb.from('site_settings').select('*').eq('id', 1).single();
      if(res && res.data) settings = Object.assign({}, DEFAULT_WATERMARK, res.data);
    } catch(e){ /* table not created yet (see SQL note above) — keep defaults */ }
  }

  /* ================= CATEGORIES ================= */

  async function loadCategories(){
    try{
      var res = await sb.from('categories').select('*').order('sort_order', { ascending:true });
      categories = res.data || [];
    } catch(e){ categories = []; } // table not created yet (see SQL note above)
  }

  async function loadPhotoCategories(){
    try{
      var res = await sb.from('photo_categories').select('*');
      var rows = res.data || [];
      photoCategoryMap = {};
      photoCategoryRows = rows;
      rows.forEach(function(r){
        if(!photoCategoryMap[r.photo_id]) photoCategoryMap[r.photo_id] = [];
        photoCategoryMap[r.photo_id].push(r.category_id);
      });
    } catch(e){ photoCategoryMap = {}; photoCategoryRows = []; }
  }

  // The public nav list: ISLEM ZRELLI (a virtual chapter — see
  // ISLEM_INTRO_SLUG above — only shown once the admin has actually set
  // up the hidden About-Islem category with photos in it) comes first,
  // then "Favorite" and "All" — always-first system pseudo-categories;
  // "Favorite" is backed by photos.is_favorite, "All" is backed by every
  // published photo, neither is a `categories` row — followed by every
  // visible real category in admin-defined order. "All" can be turned
  // off entirely via the Categories tab's own toggle
  // (settings.hide_all_category, stored in site_settings — see the SQL
  // note above) — unlike a real category, there's no `is_visible` row to
  // check for it, so this is a separate, explicit check.
  function navCategoryList(){
    var list = [];
    if(aboutIslemCategory() && photosForCategory(ISLEM_INTRO_SLUG).length){
      list.push({ id:'islem-zrelli-intro', name:(about && about.name) || 'Islem Zrelli', slug:ISLEM_INTRO_SLUG, virtual:true });
    }
    list.push({ id:'favorite', name:'Favorite', slug:'favorite', system:true });
    if(!settings.hide_all_category) list.push({ id:'all', name:'All', slug:'all', system:true });
    // The real "Islem Zrelli" category row (see the SQL setup comment
    // above) is deliberately excluded here even when it's left visible in
    // admin — it's already represented by the virtual chapter pushed
    // above, and both are the same underlying photos. Without this guard,
    // forgetting to toggle Hide/Show on that category in the admin
    // Categories tab produces two "Islem Zrelli" nav buttons.
    categories.forEach(function(c){ if(c.is_visible !== false && c.slug !== ISLEM_INTRO_SLUG) list.push(c); });
    return list;
  }

  // Sorts by an explicit per-scope order first (favorite_order, or a
  // category's photo_categories.sort_order), falling back to the photo's
  // global display_order for anything not yet manually ordered in this
  // scope — so a brand-new category/Favorites list still has a sensible
  // order before the admin ever touches the Reorder tab.
  function sortByScopeOrder(list, orderOf){
    return list.slice().sort(function(a, b){
      var ao = orderOf(a), bo = orderOf(b);
      var aHas = ao != null, bHas = bo != null;
      if(aHas && bHas && ao !== bo) return ao - bo;
      if(aHas !== bHas) return aHas ? -1 : 1;
      return (a.display_order || 0) - (b.display_order || 0);
    });
  }

  function photosForCategory(slug){
    if(slug === 'favorite'){
      // Routed through galleryPhotos() (not `photos` directly) so a photo
      // that's part of the hidden "Islem Zrelli" About story never shows
      // up in Favorite even if it's also marked is_favorite — those 3
      // photos already have their own dedicated ISLEM ZRELLI chapter (see
      // ISLEM_INTRO_SLUG/#introStory) and Favorite should only ever
      // surface the documentary photographs the visitor can favorite.
      var favs = galleryPhotos().filter(function(p){ return !!p.is_favorite; });
      return sortByScopeOrder(favs, function(p){ return p.favorite_order; });
    }
    if(slug === 'all'){
      // Every published photo, automatically — never manually assigned,
      // never a separate photo_categories/order column of its own. `photos`
      // is already the full published set (see loadPublicData's query),
      // and the existing global display_order IS the canonical order per
      // the task's requirement, so this is just that same order applied —
      // no duplicate ordering system, no per-photo "All" record. Routed
      // through galleryPhotos() rather than `photos` directly so the
      // hidden "Islem Zrelli" intro photos (see the SQL comment above)
      // never show up here either — they're an introduction to the
      // photographer, not one of the documentary stories being counted.
      return galleryPhotos().slice().sort(function(a, b){ return (a.display_order || 0) - (b.display_order || 0); });
    }
    var cat = categories.find(function(c){ return c.slug === slug; });
    if(!cat) return photos.slice();
    var orderMap = {};
    photoCategoryRows.forEach(function(r){
      if(r.category_id === cat.id) orderMap[String(r.photo_id)] = r.sort_order;
    });
    var list = photos.filter(function(p){ return (photoCategoryMap[p.id] || []).indexOf(cat.id) !== -1; });
    return sortByScopeOrder(list, function(p){ return orderMap[String(p.id)]; });
  }

  // The "Islem Zrelli" hidden category (see the SQL comment above) — looked
  // up by its slug rather than assumed to exist, since a fresh site won't
  // have created it yet. Returns null until the admin sets it up; every
  // caller below treats that as "no intro story configured" instead of
  // erroring or falling back to something unintended.
  function aboutIslemCategory(){
    return categories.find(function(c){ return c.slug === ISLEM_INTRO_SLUG; }) || null;
  }

  // `photos` with the Islem Zrelli intro photos (if any) removed — the
  // single shared filter for anywhere the site counts or lists "every
  // photograph": the landing page's story count and the "All" tab above.
  // A photo assigned to Islem Zrelli is deliberately left out of both, no
  // matter what else it's also assigned to.
  function galleryPhotos(){
    var aboutCat = aboutIslemCategory();
    if(!aboutCat) return photos;
    return photos.filter(function(p){ return (photoCategoryMap[p.id] || []).indexOf(aboutCat.id) === -1; });
  }

  function categorySlugFromPath(path){
    var base = BASE_PATH.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('^' + base + '\\/category\\/([^\\/]+)\\/?$');
    var m = String(path || '').replace(/\/+$/, '').match(re);
    return m ? m[1] : null;
  }

  function categoryUrlPath(slug){
    return slug === 'favorite' ? (BASE_PATH + '/') : (BASE_PATH + '/category/' + slug + '/');
  }

  // Resolves a photo's displayed category label (the free-text
  // `photo.category` field shown as the .tag on each scene) to an actual,
  // navigable category slug from the real `categories` table, so tapping
  // it can reuse the exact same selectCategory()/URL system as the
  // category nav bar — no separate/duplicate category system involved.
  function categorySlugForLabel(name){
    if(!name) return null;
    var norm = String(name).trim().toLowerCase();
    var found = categories.find(function(c){ return c.name && c.name.trim().toLowerCase() === norm; });
    if(found) return found.slug;
    // No structured category shares this exact name — most likely this is
    // simply the free-text label for whichever category is already being
    // browsed (the common case: every photo shown while filtered to a
    // category typically carries that category's own name as its label),
    // so treat it as pointing there. Skipped while browsing Favorites or
    // All, where a single scroll mixes photos from several different real
    // categories — guessing which one a mismatched label meant could send
    // the visitor somewhere they didn't ask for instead of leaving the
    // label as plain, non-clickable text.
    if(currentCategorySlug && currentCategorySlug !== 'favorite' && currentCategorySlug !== 'all') return currentCategorySlug;
    return null;
  }

  // Used when the visitor taps a photo's own category label to jump back
  // to the top of that category. If they're already browsing that exact
  // category, this is a same-category "scroll to top", not a new page —
  // so it replaces the current history entry with the category's own
  // canonical URL instead of pushing a duplicate one on top of it (this
  // also correctly covers landing back at the top when already viewing
  // the category's first photo: the scroll target is the same either
  // way, it just has nowhere further to move). If the label names a
  // DIFFERENT category than the one currently active, this is a real
  // navigation and behaves exactly like clicking the category nav bar.
  function goToCategoryTop(slug){
    if(!slug) return;
    if(slug === currentCategorySlug){
      requestAnimationFrame(function(){
        var top = firstCategorySceneTop();
        if(top != null) scroller.scrollTop = top;
        updateScrollNavState();
      });
      safeHistory('replaceState', { category: slug }, categoryUrlPath(slug));
      updateHeadForCategory(slug);
      return;
    }
    selectCategory(slug);
  }

  function updateHeadForCategory(slug){
    var list = navCategoryList();
    var cat = list.find(function(c){ return c.slug === slug; });
    if(!cat || slug === 'favorite'){ resetHeadToDefault(); return; }
    var title = 'Islem Zrelli — ' + cat.name;
    document.title = title;
    setMetaContent('meta[property="og:title"]', title);
    setMetaContent('meta[name="twitter:title"]', title);
    var canon = document.getElementById('canonicalLink');
    var url = SITE_URL + '/category/' + slug + '/';
    if(canon) canon.href = url;
    setMetaContent('meta[property="og:url"]', url);
  }

  function renderCategoryNav(){
    var nav = document.getElementById('catNav');
    if(!nav) return;
    var list = navCategoryList();
    var activeSlug = visualActiveNavSlug || currentCategorySlug;
    nav.innerHTML = list.map(function(c){
      var active = c.slug === activeSlug;
      return '<button type="button" class="cat-btn'+(active?' active':'')+'" data-slug="'+escapeHtml(c.slug)+'" aria-current="'+(active?'true':'false')+'">'+escapeHtml(c.name)+'</button>';
    }).join('');
  }

  // Switches the visible gallery to a category, without a page reload.
  // Reuses the existing one-photo-at-a-time scene engine — this only
  // changes which photo array feeds it (see renderScenes()).
  // The first slide of the CURRENTLY RENDERED category's gallery — i.e.
  // the actual target for "jump to the top of this category", regardless
  // of how many hero/intro-story slides sit before it in
  // sceneNav.navSlides() (that count isn't fixed: it grows/shrinks with
  // how many "Islem Zrelli" intro photos are configured). Reads
  // #scenesTrack's own first .scene directly instead of assuming a fixed
  // index into navSlides() — index 1 in that list used to BE the
