          var toAdd = ids.filter(function(id){ return prevIds.indexOf(id) === -1; });
          var toRemove = prevIds.filter(function(id){ return ids.indexOf(id) === -1; });
          var ops = [];
          if(toAdd.length) ops.push(sb.from('photos').update({ is_favorite:true }).in('id', toAdd));
          if(toRemove.length) ops.push(sb.from('photos').update({ is_favorite:false }).in('id', toRemove));
          await Promise.all(ops);
        } else {
          await sb.from('photo_categories').delete().eq('category_id', assigningCategory.id);
          if(ids.length){
            await sb.from('photo_categories').insert(ids.map(function(id){ return { photo_id:id, category_id:assigningCategory.id }; }));
          }
        }
      } catch(e){
        btn.disabled = false; btn.textContent = 'Save Assignments';
        alert('Could not save: ' + e.message);
        return;
      }
      closeCategoryAssign();
    });
  }

  function categoryFormHtml(c){
    var isNew = !c.id;
    return ''+
    '<div class="admin-form" id="categoryForm">'+
      '<h3>'+(isNew?'New Category':'Rename Category')+'</h3>'+
      '<div class="admin-field"><label>Category name</label><input type="text" id="c-name" value="'+escapeHtml(c.name)+'"></div>'+
      '<div class="admin-field row"><input type="checkbox" id="c-visible" '+(c.is_visible!==false?'checked':'')+'><label for="c-visible">Show in navigation</label></div>'+
      '<p class="admin-error" id="categoryFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<button class="admin-btn secondary" id="categoryCancelBtn">Cancel</button>'+
        '<button class="admin-btn" id="categorySaveBtn">'+(isNew?'Create Category':'Save')+'</button>'+
      '</div>'+
    '</div>';
  }

  function wireCategoryForm(){
    document.getElementById('categoryCancelBtn').addEventListener('click', function(){ editingCategory = null; drawCategoriesAdmin(); });
    document.getElementById('categorySaveBtn').addEventListener('click', async function(){
      var name = document.getElementById('c-name').value.trim();
      if(!name){ showCategoryFormError('Please enter a category name.'); return; }
      var payload = { name: name, slug: slugify(name), is_visible: document.getElementById('c-visible').checked };
      var btn = document.getElementById('categorySaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result;
      if(editingCategory.id){
        result = await sb.from('categories').update(payload).eq('id', editingCategory.id);
      } else {
        var maxOrder = adminCategories.reduce(function(m,c){ return Math.max(m, c.sort_order||0); }, -1);
        payload.sort_order = maxOrder + 1;
        result = await sb.from('categories').insert(payload);
      }
      btn.disabled = false; btn.textContent = editingCategory.id ? 'Save' : 'Create Category';
      if(result.error){ showCategoryFormError(result.error.message); return; }
      editingCategory = null;
      renderCategoriesAdmin();
    });
  }

  function showCategoryFormError(msg){
    var el = document.getElementById('categoryFormError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  /* ---------- Reorder tab ---------- */
  // One place to reorder photos in any of the three scopes the spec calls
  // for: the global gallery order, the order WITHIN one specific category,
  // and the order within Favorites. Each scope writes to a different
  // column (see the SQL note above) but shares the same drag & drop list
  // UI via makeListSortable().
  var reorderScope = 'global';

  async function renderReorderAdmin(){
    renderAdminStats();
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    await Promise.all([loadAdminPhotos(), loadCategories(), loadPhotoCategories()]);
    drawReorderAdmin();
  }

  function reorderScopeItems(){
    if(reorderScope === 'global'){
      return adminPhotos.slice().sort(function(a,b){ return (a.display_order||0)-(b.display_order||0); });
    }
    if(reorderScope === 'favorite'){
      var favs = adminPhotos.filter(function(p){ return !!p.is_favorite; });
      return sortByScopeOrder(favs, function(p){ return p.favorite_order; });
    }
    var orderMap = {};
    photoCategoryRows.forEach(function(r){
      if(String(r.category_id) === reorderScope) orderMap[String(r.photo_id)] = r.sort_order;
    });
    var list = adminPhotos.filter(function(p){ return orderMap.hasOwnProperty(String(p.id)); });
    return sortByScopeOrder(list, function(p){ return orderMap[String(p.id)]; });
  }

  function drawReorderAdmin(){
    var scopeOptions = '<option value="global">All Photos — Global Order</option>'+
      categories.map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'; }).join('')+
      '<option value="favorite">Favorites</option>';
    var items = reorderScopeItems();
    adminScroll.innerHTML = ''+
    '<div class="reorder-scope-row">'+
      '<label class="sub">Reordering:</label>'+
      '<select id="reorderScopeSelect">'+scopeOptions+'</select>'+
    '</div>'+
    (items.length === 0
      ? '<p class="admin-empty">'+(reorderScope==='favorite' ? 'No favorites yet — mark some photos ★ Favorite in the Photos tab.' : reorderScope==='global' ? 'No photos yet.' : 'No photos in this category yet — assign some in the Photos tab.')+'</p>'
      : '<p class="sub" style="margin:0 0 10px;">Drag rows by the handle to reorder. The sequence here is exactly what visitors will scroll through.</p>'+
        '<div class="reorder-list" id="reorderList">'+
        items.map(function(p, i){
          return '<div class="reorder-row" data-id="'+p.id+'">'+
            '<span class="reorder-handle" title="Drag to reorder">⠿</span>'+
            '<span class="reorder-num">'+String(i+1).padStart(2,'0')+'</span>'+
            '<img '+adminThumbAttrs(p.image_url, 100)+' alt="">'+
            '<span class="reorder-title">'+escapeHtml(p.title||'Untitled')+'</span>'+
          '</div>';
        }).join('')+
        '</div>');
    document.getElementById('reorderScopeSelect').value = reorderScope;
    document.getElementById('reorderScopeSelect').addEventListener('change', function(){
      reorderScope = this.value;
      drawReorderAdmin();
    });
    var listEl = document.getElementById('reorderList');
    if(!listEl) return;
    makeListSortable(listEl, { handle: '.reorder-handle', onReorder: async function(orderedIds){
      // Renumber the little "01 / 02 / …" labels immediately so the drop
      // feels instant, before the save round-trip finishes.
      Array.prototype.slice.call(listEl.querySelectorAll('.reorder-row')).forEach(function(row, i){
        row.querySelector('.reorder-num').textContent = String(i+1).padStart(2,'0');
      });
      if(reorderScope === 'global'){
        await Promise.all(orderedIds.map(function(id, i){ return sb.from('photos').update({ display_order: i }).eq('id', id); }));
      } else if(reorderScope === 'favorite'){
        await Promise.all(orderedIds.map(function(id, i){ return sb.from('photos').update({ favorite_order: i }).eq('id', id); }));
      } else {
        try{
          await Promise.all(orderedIds.map(function(id, i){
            return sb.from('photo_categories').update({ sort_order: i }).eq('photo_id', id).eq('category_id', reorderScope);
          }));
        } catch(e){ /* sort_order column not added yet — see SQL note above */ }
      }
      await Promise.all([loadAdminPhotos(), loadPhotoCategories()]);
    }});
  }

  /* ---------- Landing Page tab (image picker + crop/position tool) ---------- */
  var landingState = null; // { mode, url, crop:{scale,x,y}, workMode, workUrl, heroAText, heroBText } — working copy, only saved on "Save Changes"
  var landingPickerQuery = '';
  var workPickerQuery = ''; // search box for the Hero B picker grid below
  var orbitPickerQuery = ''; // search box for the Hero Orbit Ring multi-select grid below
  var heroPreviewWhich = 'a';       // 'a' | 'b' — which hero the live preview iframe is showing
  var heroPreviewDevice = 'desktop'; // 'desktop' | 'mobile' — simulated viewport for the preview

  // Pulls the actual hero-related CSS straight out of this page's own
  // stylesheet (rather than a hand-copied second version that could
  // silently drift from the real thing) for the live preview iframe
  // below. Cached — the stylesheet doesn't change at runtime, so this
  // only needs to run once no matter how many times the preview redraws.
  // Deliberately excludes anything to do with .hero-mark/#izMark: the
  // preview never renders that element at all (see heroPreviewMarkup),
  // so its rules would be inert here regardless, but leaving them out
  // entirely keeps this feature unambiguously separate from the admin
  // gesture rather than relying on that inertness.
  var cachedHeroPreviewCss = null;
  function extractHeroPreviewCss(){
    if(cachedHeroPreviewCss !== null) return cachedHeroPreviewCss;
    var include = [':root', '.hero', '.signature', '.enter', '.arrow', '.sr-only', 'html', 'body'];
    var out = [];
    function included(selectorText){
      if(!selectorText || selectorText.indexOf('hero-mark') !== -1) return false;
      return include.some(function(token){ return selectorText.indexOf(token) !== -1; });
    }
    function walk(rules){
      Array.prototype.forEach.call(rules, function(rule){
        if(typeof CSSMediaRule !== 'undefined' && rule instanceof CSSMediaRule){
          var inner = [];
          Array.prototype.forEach.call(rule.cssRules, function(r){
            if(r.selectorText && included(r.selectorText)) inner.push(r.cssText);
          });
          if(inner.length) out.push('@media ' + rule.media.mediaText + '{' + inner.join('\n') + '}');
        } else if(typeof CSSKeyframesRule !== 'undefined' && rule instanceof CSSKeyframesRule){
          if(/drip|heroChevronPulse/i.test(rule.name || '')) out.push(rule.cssText);
        } else if(rule.selectorText && included(rule.selectorText)){
          out.push(rule.cssText);
        }
      });
    }
    Array.prototype.forEach.call(document.styleSheets, function(sheet){
      var rules;
      try{ rules = sheet.cssRules; } catch(e){ return; } // cross-origin (Google Fonts) sheet — nothing to extract from it anyway
      if(rules) walk(rules);
    });
    cachedHeroPreviewCss = out.join('\n');
    return cachedHeroPreviewCss;
  }

  // Builds a standalone (no app JS, no admin gesture, no contact/language
  // chrome) copy of just the hero being edited, styled with the real
  // extracted CSS above and the config currently being typed/dragged in
  // the form — this is what makes the preview an accurate rendering
  // rather than a hand-built approximation. .ready/.filled/.in-view are
  // applied immediately (no entrance animation) since the point here is
  // instant feedback on a slider drag, not replaying the reveal.
  function heroPreviewMarkup(which, cfg, backdropUrl){
    var bg = '<div class="hero-backdrop in-view"><img src="'+escapeHtml(backdropUrl || '')+'" alt=""></div><div class="hero-scrim"></div>';
    // Five plain placeholder circles standing in for the real social-icon
    // badges (renderHeroContact()'s own SOCIAL_ICON_DATA) — same classes,
    // same sizing/spacing/transform math, just without embedding five
    // base64 icon images into every preview reload. The point here is
    // showing the CONTACT ROW'S size/position accurately, not which icons
    // are in it.
    var contactHtml = '<div class="hero-contact has-content" style="opacity:1;"><div class="social-badges">'+
      '<span class="social-badge"></span><span class="social-badge"></span><span class="social-badge"></span><span class="social-badge"></span><span class="social-badge"></span>'+
    '</div></div>';
    if(which === 'a'){
      var varsA = '--sig-scale:'+cfg.name_scale+'; --sig-y:'+cfg.name_y+'px; --role-scale:'+cfg.role_scale+'; --role-y:'+cfg.role_y+'px; --extra1-scale:'+cfg.extra1.scale+'; --extra1-y:'+cfg.extra1.y+'px; --extra2-scale:'+cfg.extra2.scale+'; --extra2-y:'+cfg.extra2.y+'px; --scrim-opacity:'+cfg.scrim_opacity+'; --block-y:'+cfg.block_y+'px; --contact-scale:'+cfg.contact_scale+'; --contact-y:'+cfg.contact_y+'px;';
      return '<header class="hero ready" style="position:relative; height:100vh; '+varsA+'">'+bg+
        '<div class="hero-inner">'+
          '<h1 class="signature-wrap"><svg class="signature-svg" viewBox="0 0 700 160" preserveAspectRatio="xMidYMid meet"><text class="filled" x="50%" y="62%" text-anchor="middle" dominant-baseline="middle">'+escapeHtml(cfg.name)+'</text></svg></h1>'+
          '<p class="hero-role">'+escapeHtml(cfg.role)+'</p>'+
          (cfg.extra1.enabled && cfg.extra1.text ? '<p class="hero-extra-line hero-extra-1">'+escapeHtml(cfg.extra1.text)+'</p>' : '')+
          (cfg.extra2.enabled && cfg.extra2.text ? '<p class="hero-extra-line hero-extra-2">'+escapeHtml(cfg.extra2.text)+'</p>' : '')+
          '<button class="enter" style="pointer-events:none;">'+escapeHtml(cfg.button_label)+'<span class="arrow-line"></span></button>'+
        '</div>'+
        contactHtml+
      '</header>';
    }
    var varsB = '--place-scale:'+cfg.location_scale+'; --place-y:'+cfg.location_y+'px; --credit-scale:'+cfg.credit_scale+'; --credit-y:'+cfg.credit_y+'px; --extra1-scale:'+cfg.extra1.scale+'; --extra1-y:'+cfg.extra1.y+'px; --extra2-scale:'+cfg.extra2.scale+'; --extra2-y:'+cfg.extra2.y+'px; --scrim-opacity:'+cfg.scrim_opacity+'; --block-y:'+cfg.block_y+'px; --contact-scale:'+cfg.contact_scale+'; --contact-y:'+cfg.contact_y+'px;';
    return '<header class="hero hero-work ready" style="position:relative; height:100vh; '+varsB+'">'+bg+
      '<div class="hero-inner">'+
        '<div class="hero-kicker"><p class="hero-work-place">'+escapeHtml(cfg.location)+'</p><p class="hero-count">14 stories of documentary photography</p></div>'+
        '<p class="hero-credit">'+escapeHtml(cfg.credit)+'</p>'+
        (cfg.extra1.enabled && cfg.extra1.text ? '<p class="hero-extra-line hero-extra-1">'+escapeHtml(cfg.extra1.text)+'</p>' : '')+
        (cfg.extra2.enabled && cfg.extra2.text ? '<p class="hero-extra-line hero-extra-2">'+escapeHtml(cfg.extra2.text)+'</p>' : '')+
        '<button class="enter" style="pointer-events:none;">'+escapeHtml(cfg.button_label)+'<span class="arrow-line"></span></button>'+
      '</div>'+
      contactHtml+
    '</header>';
  }

  var HERO_PREVIEW_SIZES = { desktop: { w:1280, h:800 }, mobile: { w:375, h:780 } };

  function buildHeroPreviewSrcdoc(which, cfg, backdropUrl){
    var fontLink = document.querySelector('link[href*="fonts.googleapis"]');
    var fontHref = fontLink ? fontLink.href : 'https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@300;400;500;600&display=swap';
    // The grab-cursor/outline rules below exist ONLY inside this throwaway
    // preview document — never touch extractHeroPreviewCss()'s output or
    // leak onto the real public site, which never renders this markup.
    // They're what make .hero-inner/.hero-contact visibly grabbable (a
    // dashed outline on hover) rather than looking like static text you'd
    // have no reason to try dragging — see wireHeroPreviewDrag() for the
    // actual drag handling, wired after this document finishes loading.
    var dragAffordanceCss = ''+
      '.hero-inner,.hero-contact{cursor:grab;outline:1px dashed transparent;outline-offset:6px;transition:outline-color 150ms;-webkit-user-select:none;user-select:none;}'+
      '.hero-inner:hover,.hero-contact:hover{outline-color:rgba(255,255,255,.35);}'+
      '.hero-inner.dragging-preview,.hero-contact.dragging-preview{cursor:grabbing;outline-color:rgba(255,255,255,.8);transition:none;}';
    return '<!DOCTYPE html><html><head><meta charset="utf-8">'+
      '<link href="'+fontHref+'" rel="stylesheet">'+
      '<style>html,body{margin:0;padding:0;background:#050505;overflow:hidden;}'+extractHeroPreviewCss()+dragAffordanceCss+'</style>'+
      '</head><body>'+heroPreviewMarkup(which, cfg, backdropUrl)+'</body></html>';
  }

  // Makes the whole text block and the contact/social-links row directly
  // draggable ON the live preview itself — the actual point being that a
  // slider is precise but abstract ("is +40 enough to clear his face?"),
  // while grabbing the text and watching it in real time answers that
  // instantly. Re-run every time the iframe document reloads (see its
  // call site in updateHeroPreview() — a fresh srcdoc means a fresh DOM,
  // so old listeners are gone with it; this just re-attaches to the new
  // one, there's no accumulation to worry about).
  //
  // Coordinates need no scale correction despite the iframe being shown
  // visually shrunk in the sidebar (see updateHeroPreview()'s own
  // transform:scale()) — that CSS transform is applied in the PARENT
  // document to how the iframe is painted; it has no effect on the
  // iframe's own internal viewport or the coordinates its own mouse/touch
  // events report, which stay in that internal (e.g. 1280×800 or
  // 375×780) space throughout — exactly the space --block-y/--contact-y
  // are already defined in.
  //
  // While dragging: mutates the CSS variable directly on the iframe's own
  // header element (instant, no re-render) and mirrors the value onto the
  // matching sidebar slider + readout, rather than calling
  // updateHeroPreview() (which fully regenerates the iframe's HTML) on
  // every pixel of movement — that would be a visible stutter, not a
  // smooth drag. landingState is also updated live, so releasing the
  // drag leaves everything already consistent — Save Changes needs no
  // extra step afterward.
  function wireHeroPreviewDrag(frame, which){
    var doc = frame.contentDocument;
    if(!doc) return;
    var headerEl = doc.querySelector('.hero');
    if(!headerEl) return;

    function attach(el, field, range, isScale){
      if(!el) return;
      el.addEventListener('mousedown', startDrag);
      el.addEventListener('touchstart', startDrag, { passive:false });

      function startDrag(e){
        e.preventDefault();
        var cfg = which === 'a' ? landingState.heroAText : landingState.heroBText;
        var startClientY = e.touches ? e.touches[0].clientY : e.clientY;
        var startVal = cfg[field];
        el.classList.add('dragging-preview');

        function onMove(e2){
          var clientY = e2.touches ? e2.touches[0].clientY : e2.clientY;
          var delta = clientY - startClientY;
          var newVal = isScale ? startVal + delta / 200 : Math.round(startVal + delta);
          newVal = Math.max(range[0], Math.min(range[1], newVal));
          if(isScale) newVal = Math.round(newVal * 100) / 100;
          cfg[field] = newVal;
          headerEl.style.setProperty('--' + field.replace(/_/g,'-'), newVal + (isScale ? '' : 'px'));
          syncHeroTextSlider(field, newVal);
        }
        function onUp(){
          el.classList.remove('dragging-preview');
          doc.removeEventListener('mousemove', onMove);
          doc.removeEventListener('mouseup', onUp);
          doc.removeEventListener('touchmove', onMove);
          doc.removeEventListener('touchend', onUp);
          document.removeEventListener('mouseup', onUp); // failsafe if the pointer left the iframe entirely
        }
        doc.addEventListener('mousemove', onMove);
        doc.addEventListener('mouseup', onUp);
        doc.addEventListener('touchmove', onMove, { passive:false });
        doc.addEventListener('touchend', onUp);
        document.addEventListener('mouseup', onUp);
      }
    }

    attach(doc.querySelector('.hero-inner'), 'block_y', [-160,160], false);
    attach(doc.querySelector('.hero-contact'), 'contact_y', [-60,60], false);
  }

  // Mirrors a value produced by dragging on the preview (see
  // wireHeroPreviewDrag() above) onto the matching slider + readout in the
  // sidebar form, so the two stay in sync regardless of which one the
  // admin actually used — dragging the preview moves the slider, and the
  // slider still works normally too. A no-op if that field has no visible
  // control (shouldn't happen for block_y/contact_y, both always shown).
  function syncHeroTextSlider(field, value){
    var input = document.querySelector('#heroTextForm input[data-field="'+field+'"]');
    if(input) input.value = value;
    var readout = document.querySelector('#heroTextForm [data-readout="'+field+'"]');
    if(readout){
      var isY = field.indexOf('_y') !== -1 || field.slice(-2) === '.y';
      readout.textContent = isY ? (value + 'px') : (Math.round(value * 100) + '%');
    }
  }

  // Regenerates the preview iframe's whole document (simplest reliable
  // way to reflect a config change — an iframe's own internal viewport is
  // what makes vw/vh-based clamp() sizing and the min-width:860px layout
  // switch evaluate correctly for a *simulated* 375px phone or 1280px
  // desktop, which a same-document clone can't do: those units always
  // resolve against the real browser window, not any wrapping element's
  // size, no matter how that element is sized or scaled). Debounced by
  // its caller so a slider drag doesn't reload the iframe on every pixel —
  // dragging directly ON the preview (see wireHeroPreviewDrag()) never
  // goes through this path at all while the drag is in progress, for the
  // same reason.
  function updateHeroPreview(){
    var frame = document.getElementById('heroPreviewFrame');
    var viewport = document.getElementById('heroPreviewViewport');
    if(!frame || !viewport || !landingState) return;
    try{
      var size = HERO_PREVIEW_SIZES[heroPreviewDevice];
      var which = heroPreviewWhich;
      var cfg = which === 'a' ? landingState.heroAText : landingState.heroBText;
      var backdropUrl = which === 'a'
        ? (landingState.url || (adminPhotos[0] && adminPhotos[0].image_url) || '')
        : (landingState.workUrl || landingState.url || (adminPhotos[0] && adminPhotos[0].image_url) || '');
      frame.width = size.w; frame.height = size.h;
      var displayW = viewport.clientWidth || 300;
      var scale = displayW / size.w;
      frame.style.transform = 'scale(' + scale + ')';
      viewport.style.height = Math.round(size.h * scale) + 'px';
      frame.onload = function(){ wireHeroPreviewDrag(frame, which); };
      frame.srcdoc = buildHeroPreviewSrcdoc(which, cfg, backdropUrl);
      frame.style.display = '';
      var errEl = document.getElementById('heroPreviewError');
      if(errEl) errEl.style.display = 'none';
    } catch(err){
      // Fails loud rather than leaving a blank box with no clue why —
      // e.g. if a future browser blocks reading a stylesheet's cssRules
      // for a reason try/catch inside extractHeroPreviewCss() doesn't
      // already cover.
      frame.style.display = 'none';
      var msg = document.getElementById('heroPreviewError');
      if(!msg){
        msg = document.createElement('p');
        msg.id = 'heroPreviewError';
        msg.className = 'admin-error';
        viewport.parentNode.insertBefore(msg, viewport.nextSibling);
      }
      msg.textContent = 'Preview failed to render: ' + err.message;
      msg.style.display = 'block';
    }
  }
  var heroPreviewDebounceTimer = null;
  function scheduleHeroPreviewUpdate(){
    if(heroPreviewDebounceTimer) clearTimeout(heroPreviewDebounceTimer);
    heroPreviewDebounceTimer = setTimeout(updateHeroPreview, 90);
  }

  async function renderLandingAdmin(){
    renderAdminStats();
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    var res = await sb.from('about').select('*').eq('id', 1).single();
    var a = res.data || {};
    await loadAdminPhotos();
    landingState = {
      mode: a.hero_image_mode || (a.hero_image_url ? 'upload' : 'gallery'),
      url: a.hero_image_url || '',
      crop: Object.assign({ scale:1, x:50, y:50 }, a.hero_crop || {}),
      // Hero B has no stored "mode" of its own (no work_title_image_mode
      // column — see the SQL comment) since, unlike the landing hero, it
      // has no crop tool that needs to remember how the current URL got
      // there. Reopening this tab always starts on the picker grid; that
      // choice only decides which control is shown right now, not
      // anything saved.
      workMode: 'gallery',
      workUrl: a.work_title_image_url || '',
      // Working copies of both heroes' text config — see the "HERO TEXT
      // CONTROL" SQL comment and applyHeroTextConfig() for what each field
      // does. mergeHeroTextConfig() fills in anything missing from the
      // defaults, so a brand-new site (raw = null) starts the form showing
      // exactly its current hardcoded copy, not blank fields.
      heroAText: mergeHeroTextConfig(HERO_A_TEXT_DEFAULTS, a.hero_a_text),
      heroBText: mergeHeroTextConfig(HERO_B_TEXT_DEFAULTS, a.hero_b_text),
      // hero_orbit_enabled undefined (pre-migration, or just never
      // touched) means "on" — only an explicit false turns it off. See
      // the "HERO ORBIT RING" SQL comment.
      orbitEnabled: a.hero_orbit_enabled !== false,
      orbitPhotoIds: Array.isArray(a.hero_orbit_photo_ids) ? a.hero_orbit_photo_ids.slice() : [],
      // How many photos the ring shows — admin-adjustable via the -/+
      // stepper below; see clampOrbitCount()/ORBIT_MIN_PHOTOS/
      // ORBIT_MAX_CARDS above for the bounds and the unset-value default.
      orbitCount: clampOrbitCount(a.hero_orbit_count)
    };
    heroPreviewWhich = 'a';
    drawLandingAdmin();
  }

  function drawLandingAdmin(){
    var s = landingState;
    var previewSrc = s.url || (adminPhotos.find(function(p){ return p.featured; }) || adminPhotos[0] || {}).image_url || '';
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>Landing Page</h3>'+
      '<p class="sub" style="margin:0 0 4px;">Choose exactly which photograph appears behind your name on the landing page, and exactly how it\'s framed.</p>'+
      '<div class="admin-field"><label>Image Source</label>'+
        '<div class="landing-mode-row">'+
          '<button type="button" class="landing-mode-btn'+(s.mode==='gallery'?' active':'')+'" id="landingModeGallery">Use Existing Photo</button>'+
          '<button type="button" class="landing-mode-btn'+(s.mode==='upload'?' active':'')+'" id="landingModeUpload">Upload Landing-Only Photo</button>'+
        '</div>'+
      '</div>'+
      (s.mode === 'gallery' ? ''+
        '<div class="admin-field" id="landingPickerWrap">'+
          '<input type="text" id="landingPickerSearch" class="landing-picker-search" placeholder="Search by title, category, location…" value="'+escapeHtml(landingPickerQuery)+'">'+
          '<div class="landing-picker-grid" id="landingPickerGrid"></div>'+
        '</div>'
      : ''+
        '<div class="admin-field" id="landingUploadWrap">'+
          '<input type="file" accept="image/*" id="landingUploadFile">'+
          uploadProgressHtml('landingUpload')+
          '<p class="sub" style="margin:2px 0 0;">This photo is landing-page only — it never appears in the gallery, needs no category, and isn\'t counted as a regular photograph.</p>'+
        '</div>'
      )+
      '<div class="admin-field">'+
        '<label>Position &amp; Crop</label>'+
        '<p class="sub" style="margin:0 0 6px;">Drag the photo to reposition it, use the slider to zoom. This focal point is preserved responsively across screen sizes — check both previews below.</p>'+
        '<div class="crop-tool-wrap">'+
          '<div class="crop-preview-tabs">'+
            '<button type="button" class="crop-preview-tab active" data-device="desktop">Desktop Preview</button>'+
            '<button type="button" class="crop-preview-tab" data-device="mobile">Mobile Preview</button>'+
          '</div>'+
          '<div class="crop-frame desktop" id="cropFrame">'+
            (previewSrc ? '<img id="cropImg" src="'+escapeHtml(previewSrc)+'" alt="">' : '<div class="crop-hint">Choose or upload a photo first</div>')+
          '</div>'+
          '<div class="crop-zoom-row"><label class="sub">Zoom</label><input type="range" id="cropZoom" min="1" max="2.5" step="0.01" value="'+s.crop.scale+'"><span id="cropZoomVal">'+Math.round(s.crop.scale*100)+'%</span></div>'+
        '</div>'+
      '</div>'+
      '<h3 style="margin-top:28px;">Hero Orbit Ring</h3>'+
      '<p class="sub" style="margin:0 0 4px;">Instead of (or behind, if this is off) the single backdrop photo above, the landing hero can show a slow-turning ring of photos scattered around your name. Pick exactly which photos appear in it below — leave nothing picked and it fills itself with a fresh random spread of your published work on every visit instead.</p>'+
      '<div class="admin-field row"><input type="checkbox" id="orbitEnabledToggle"'+(s.orbitEnabled?' checked':'')+'><label for="orbitEnabledToggle">Show the orbit ring on the landing page</label></div>'+
      (s.orbitEnabled ? ''+
        '<div class="admin-field" id="orbitCountWrap">'+
          '<label>Number of photos in the ring</label>'+
          '<div class="stepper-row">'+
            '<button type="button" class="admin-btn secondary stepper-btn" id="orbitCountMinus"'+(s.orbitCount<=ORBIT_MIN_PHOTOS?' disabled':'')+' aria-label="Fewer photos">−</button>'+
            '<span class="stepper-value" id="orbitCountValue">'+s.orbitCount+'</span>'+
            '<button type="button" class="admin-btn secondary stepper-btn" id="orbitCountPlus"'+(s.orbitCount>=ORBIT_MAX_CARDS?' disabled':'')+' aria-label="More photos">+</button>'+
          '</div>'+
          '<p class="sub" style="margin:6px 0 0;">Between '+ORBIT_MIN_PHOTOS+' and '+ORBIT_MAX_CARDS+'.'+(s.orbitPhotoIds.length ? ' With specific photos picked below, this caps how many of them actually show.' : ' A random spread always uses exactly this many.')+'</p>'+
        '</div>'
      : '')+
      (s.orbitEnabled ? ''+
        '<div class="admin-field" id="orbitPickerWrap">'+
          '<label>Photos in the ring'+(s.orbitPhotoIds.length ? ' — '+s.orbitPhotoIds.length+' selected' : ' — none picked, using a random spread')+'</label>'+
          '<input type="text" id="orbitPickerSearch" class="landing-picker-search" placeholder="Search by title, category, location…" value="'+escapeHtml(orbitPickerQuery)+'">'+
          '<div class="landing-picker-grid" id="orbitPickerGrid"></div>'+
          (s.orbitPhotoIds.length ? '<button type="button" class="admin-btn secondary" id="orbitClearBtn" style="margin-top:8px;">Clear Picks (Go Back To Random)</button>' : '')+
        '</div>'
      : '')+
      '<h3 style="margin-top:28px;">Work Title Backdrop</h3>'+
      '<p class="sub" style="margin:0 0 4px;">The background photo for the second landing screen — the "title page" right before the gallery begins (location, story count, language picker, signature). Leave unset to reuse the exact same photo as above.</p>'+
      '<div class="admin-field"><label>Image Source</label>'+
        '<div class="landing-mode-row">'+
          '<button type="button" class="landing-mode-btn'+(s.workMode==='gallery'?' active':'')+'" id="workModeGallery">Use Existing Photo</button>'+
          '<button type="button" class="landing-mode-btn'+(s.workMode==='upload'?' active':'')+'" id="workModeUpload">Upload Photo</button>'+
        '</div>'+
      '</div>'+
      (s.workMode === 'gallery' ? ''+
        '<div class="admin-field" id="workPickerWrap">'+
          '<input type="text" id="workPickerSearch" class="landing-picker-search" placeholder="Search by title, category, location…" value="'+escapeHtml(workPickerQuery)+'">'+
          '<div class="landing-picker-grid" id="workPickerGrid"></div>'+
        '</div>'
      : ''+
        '<div class="admin-field" id="workUploadWrap">'+
          '<input type="file" accept="image/*" id="workUploadFile">'+
          uploadProgressHtml('workUpload')+
        '</div>'
      )+
      '<div class="admin-field">'+
        (s.workUrl
          ? '<label>Currently set</label><div class="landing-work-preview"><img src="'+escapeHtml(s.workUrl)+'" alt=""><button type="button" class="admin-btn secondary" id="workBackdropClearBtn">Use Same Photo As Above Instead</button></div>'
          : '<p class="sub">Not set — currently falling back to the same photo as the landing hero above.</p>')+
      '</div>'+
      '<h3 style="margin-top:28px;">Hero Text</h3>'+
      '<p class="sub" style="margin:0 0 4px;">Full control over every line of text on both hero screens — what it says, how large it is, and how far up or down it sits — without waiting on an HTML change. Sizes are relative (a slider, not a fixed pixel value) so "bigger" stays proportionally bigger on a phone and a desktop alike; position is limited to a safe range that can\'t push text into the corner mark, language switcher, or contact badges on any screen. <strong>You can drag the text block and the contact/social links directly on the live preview</strong> — click and hold, then move up or down — or use the matching sliders below; both stay in sync either way.</p>'+
      '<div class="hero-text-tabs">'+
        '<button type="button" class="landing-mode-btn'+(heroPreviewWhich==='a'?' active':'')+'" id="heroTextTabA">Hero A — Landing</button>'+
        '<button type="button" class="landing-mode-btn'+(heroPreviewWhich==='b'?' active':'')+'" id="heroTextTabB">Hero B — Work Title</button>'+
      '</div>'+
      '<div class="hero-text-editor">'+
        '<div class="hero-text-form" id="heroTextForm">'+heroTextFormHtml(heroPreviewWhich, heroPreviewWhich==='a'?s.heroAText:s.heroBText)+'</div>'+
        '<div class="hero-text-preview">'+
          '<div class="crop-preview-tabs">'+
            '<button type="button" class="hero-preview-device-tab'+(heroPreviewDevice==='desktop'?' active':'')+'" id="heroPreviewDesktopBtn">Desktop Preview</button>'+
            '<button type="button" class="hero-preview-device-tab'+(heroPreviewDevice==='mobile'?' active':'')+'" id="heroPreviewMobileBtn">Mobile Preview</button>'+
          '</div>'+
          '<div class="hero-preview-viewport" id="heroPreviewViewport"><iframe id="heroPreviewFrame" title="Hero preview" scrolling="no"></iframe></div>'+
        '</div>'+
      '</div>'+
      '<p class="admin-error" id="landingFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="landingSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn" id="landingSaveBtn">Save Changes</button>'+
      '</div>'+
    '</div>';
    wireLandingAdmin();
  }

  // One labeled text input + (optionally) a size slider and a position
  // slider, for a single line of hero text. `key` is the field's path
  // inside the hero's config object (e.g. "role" or "extra1.text") — read
  // by heroTextFormHtml() below to pre-fill the value, and written back by
  // the delegated input handler in wireLandingAdmin() via the same path,
  // so adding a field here only ever means adding one call to this
  // function plus the matching key in HERO_A/B_TEXT_DEFAULTS — nothing
  // else needs to change.
  function heroTextRow(label, key, value, opts){
    opts = opts || {};
    return '<div class="admin-field"><label>'+label+'</label>'+
      '<input type="text" data-field="'+key+'" value="'+escapeHtml(value || '')+'" maxlength="'+(opts.maxlength || 60)+'"'+(opts.disabled?' disabled':'')+'></div>';
  }
  function heroTextSizeRow(label, scaleKey, scaleVal, yKey, yVal, opts){
    opts = opts || {};
    var dis = opts.disabled ? ' disabled' : '';
    var yMin = opts.yRange ? opts.yRange[0] : -30;
    var yMax = opts.yRange ? opts.yRange[1] : 30;
    var rows = '';
    if(scaleKey){
      rows += ''+
      '<div class="hero-text-size-row"><div class="row-label"><span>'+label+' size</span><span data-readout="'+scaleKey+'">'+Math.round(scaleVal*100)+'%</span></div>'+
        '<input type="range" data-field="'+scaleKey+'" min="0.6" max="1.8" step="0.02" value="'+scaleVal+'"'+dis+'></div>';
    }
    if(yKey){
      rows += ''+
      '<div class="hero-text-size-row"><div class="row-label"><span>'+label+' position</span><span data-readout="'+yKey+'">'+yVal+'px</span></div>'+
        '<input type="range" data-field="'+yKey+'" min="'+yMin+'" max="'+yMax+'" step="1" value="'+yVal+'"'+dis+'></div>';
    }
    return rows;
  }
  function heroTextExtraBlock(n, cfg){
    var ex = cfg['extra'+n];
    var dis = !ex.enabled;
    var cbId = 'heroExtra'+n+'Enabled';
    return '<div class="hero-text-extra">'+
      '<div class="admin-field row"><input type="checkbox" id="'+cbId+'" data-field="extra'+n+'.enabled"'+(ex.enabled?' checked':'')+'><label for="'+cbId+'">Extra line '+n+'</label></div>'+
      heroTextRow('Text', 'extra'+n+'.text', ex.text, { maxlength:80, disabled:dis })+
      heroTextSizeRow('Line', 'extra'+n+'.scale', ex.scale, 'extra'+n+'.y', ex.y, { disabled:dis })+
    '</div>';
  }
  // Builds the whole editable-fields column for whichever hero is
  // currently selected (heroPreviewWhich) — the fixed set of fields per
  // hero matches HERO_A_TEXT_DEFAULTS / HERO_B_TEXT_DEFAULTS exactly (see
  // the SQL comment): a few required lines with size/position control,
  // plus two optional "extra line" slots either can turn on.
  function heroTextFormHtml(which, cfg){
    var blockRow = '<div class="hero-text-extra" style="border-top-color:var(--line);"><div class="row-label" style="margin-bottom:8px;"><span><strong>Whole text block position</strong></span></div>'+
      '<p class="sub" style="margin:0 0 8px;">Moves every line above together, as a group — use this to slide the whole block clear of a face or busy area in this specific backdrop photo, instead of nudging each line separately.</p>'+
      heroTextSizeRow('Block', null, null, 'block_y', cfg.block_y, { yRange:[-160,160] })+
    '</div>';
    var contactRow = '<div class="hero-text-extra"><div class="row-label" style="margin-bottom:8px;"><span><strong>Contact / social links</strong></span></div>'+
      heroTextSizeRow('Links', 'contact_scale', cfg.contact_scale, 'contact_y', cfg.contact_y, { yRange:[-60,60] })+
    '</div>';
    if(which === 'a'){
      return ''+
        heroTextRow('Name / Signature', 'name', cfg.name, { maxlength:40 })+
        heroTextSizeRow('Name', 'name_scale', cfg.name_scale, 'name_y', cfg.name_y)+
        heroTextRow('Role / Tagline', 'role', cfg.role, { maxlength:80 })+
        heroTextSizeRow('Role', 'role_scale', cfg.role_scale, 'role_y', cfg.role_y)+
        heroTextRow('Button Label', 'button_label', cfg.button_label, { maxlength:24 })+
        heroTextExtraBlock(1, cfg)+
        heroTextExtraBlock(2, cfg)+
        '<div class="hero-text-size-row" style="margin-top:14px;"><div class="row-label"><span>Overlay darkness</span><span data-readout="scrim_opacity">'+Math.round(cfg.scrim_opacity*100)+'%</span></div>'+
          '<input type="range" data-field="scrim_opacity" min="0" max="1" step="0.02" value="'+cfg.scrim_opacity+'"></div>'+
        blockRow + contactRow;
    }
    return ''+
      heroTextRow('Location', 'location', cfg.location, { maxlength:60 })+
      heroTextSizeRow('Location', 'location_scale', cfg.location_scale, 'location_y', cfg.location_y)+
      heroTextRow('Credit / Byline', 'credit', cfg.credit, { maxlength:60 })+
      heroTextSizeRow('Credit', 'credit_scale', cfg.credit_scale, 'credit_y', cfg.credit_y)+
      heroTextRow('Button Label', 'button_label', cfg.button_label, { maxlength:24 })+
      heroTextExtraBlock(1, cfg)+
      heroTextExtraBlock(2, cfg)+
      '<div class="hero-text-size-row" style="margin-top:14px;"><div class="row-label"><span>Overlay darkness</span><span data-readout="scrim_opacity">'+Math.round(cfg.scrim_opacity*100)+'%</span></div>'+
        '<input type="range" data-field="scrim_opacity" min="0" max="1" step="0.02" value="'+cfg.scrim_opacity+'"></div>'+
      blockRow + contactRow;
  }

  function landingFilteredPhotos(){
    var q = landingPickerQuery.trim().toLowerCase();
    var list = adminPhotos.filter(function(p){ return p.published; });
    if(!q) return list;
    return list.filter(function(p){
      return [p.title, p.category, p.location].some(function(f){ return f && f.toLowerCase().indexOf(q) !== -1; });
    });
  }

  function drawLandingPickerGrid(){
    var grid = document.getElementById('landingPickerGrid');
    if(!grid) return;
    var items = landingFilteredPhotos();
    grid.innerHTML = items.length ? items.map(function(p){
      var selected = landingState.url === p.image_url;
      return '<div class="landing-picker-thumb'+(selected?' selected':'')+'" data-url="'+escapeHtml(p.image_url)+'" title="'+escapeHtml(p.title||'')+'"><img '+adminThumbAttrs(p.image_url, 160)+' alt=""></div>';
    }).join('') : '<p class="admin-empty">No matching photos.</p>';
    grid.querySelectorAll('.landing-picker-thumb').forEach(function(el){
      el.addEventListener('click', function(){
        landingState.url = el.getAttribute('data-url');
        landingState.mode = 'gallery';
        grid.querySelectorAll('.landing-picker-thumb').forEach(function(t){ t.classList.remove('selected'); });
        el.classList.add('selected');
        var img = document.getElementById('cropImg');
        var frame = document.getElementById('cropFrame');
        if(frame){
          if(!img){ frame.innerHTML = '<img id="cropImg" alt="">'; img = document.getElementById('cropImg'); wireCropDrag(); }
          img.src = landingState.url;
          applyCropStyle();
        }
      });
    });
  }

  // Multi-select counterpart to drawLandingPickerGrid()/drawWorkPickerGrid()
  // above — those two swap a single landingState.url on click; this one
  // toggles membership in landingState.orbitPhotoIds, an ordered array
  // (the numbered badge shows each pick's position, since that order
  // becomes the ring's angle order on the public site — see
  // renderHeroOrbit()). Capped at landingState.orbitCount — the same
  // number the stepper above sets — so the admin can't quietly build a
  // selection larger than the ring will actually show.
  function drawOrbitPickerGrid(){
    var grid = document.getElementById('orbitPickerGrid');
    if(!grid) return;
    var q = orbitPickerQuery.trim().toLowerCase();
    var items = adminPhotos.filter(function(p){ return p.published; });
    if(q){
      items = items.filter(function(p){
        return [p.title, p.category, p.location].some(function(f){ return f && f.toLowerCase().indexOf(q) !== -1; });
      });
    }
    grid.innerHTML = items.length ? items.map(function(p){
      var order = landingState.orbitPhotoIds.indexOf(p.id);
      var selected = order !== -1;
      return '<div class="landing-picker-thumb'+(selected?' selected':'')+'" data-id="'+escapeHtml(String(p.id))+'" title="'+escapeHtml(p.title||'')+'">'+
        '<img '+adminThumbAttrs(p.image_url, 160)+' alt="">'+
        (selected ? '<span class="pick-order">'+(order+1)+'</span>' : '')+
      '</div>';
    }).join('') : '<p class="admin-empty">No matching photos.</p>';
    grid.querySelectorAll('.landing-picker-thumb').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.getAttribute('data-id');
        // Photo ids come back from the DB as whatever type the column
        // is (often not a string) — indexOf needs the exact match a
        // fresh string wouldn't give it, so re-find the real id off the
        // photo object itself rather than trusting the DOM attribute's
        // type.
        var photo = adminPhotos.find(function(p){ return String(p.id) === id; });
        if(!photo) return;
        var idx = landingState.orbitPhotoIds.indexOf(photo.id);
        if(idx !== -1){
          landingState.orbitPhotoIds.splice(idx, 1);
        } else {
          if(landingState.orbitPhotoIds.length >= landingState.orbitCount){
            var el2 = document.getElementById('landingFormError');
            el2.textContent = 'The ring is currently set to show '+landingState.orbitCount+' photos — remove one, or raise the number above, before adding another.';
            el2.style.display = 'block';
            return;
          }
          landingState.orbitPhotoIds.push(photo.id);
        }
        drawLandingAdmin();
      });
    });
  }

  function wireLandingAdmin(){
    document.getElementById('landingModeGallery').addEventListener('click', function(){
      landingState.mode = 'gallery';
      drawLandingAdmin();
    });
    document.getElementById('landingModeUpload').addEventListener('click', function(){
      landingState.mode = 'upload';
      drawLandingAdmin();
    });
    if(landingState.mode === 'gallery'){
      drawLandingPickerGrid();
      document.getElementById('landingPickerSearch').addEventListener('input', function(){
        landingPickerQuery = this.value;
        drawLandingPickerGrid();
      });
    }
    var uploadInput = document.getElementById('landingUploadFile');
    if(uploadInput){
      uploadInput.addEventListener('change', async function(e){
        var file = e.target.files[0];
        if(!file) return;
        var progressUi = wireUploadProgress('landingUpload');
        progressUi.show();
        try{
          // skipWatermark: true — a landing-only backdrop is never one of
          // the watermarked gallery photographs. isHero: true — this
          // renders full-bleed on the landing page, so it gets the larger
          // hero size cap (see HERO_MAX_PORTRAIT_W/H above), not the
          // smaller cap regular gallery photos use.
          var res = await uploadFile(file, null, true, progressUi.onProgress, true);
          landingState.url = res.url;
          var img = document.getElementById('cropImg');
          var frame = document.getElementById('cropFrame');
          if(frame){
            if(!img){ frame.innerHTML = '<img id="cropImg" alt="">'; img = document.getElementById('cropImg'); wireCropDrag(); }
            img.src = landingState.url;
            applyCropStyle();
          }
        } catch(err){
          var el = document.getElementById('landingFormError');
          el.textContent = err.message; el.style.display = 'block';
        } finally {
          progressUi.hide();
        }
      });
    }

    document.querySelectorAll('.crop-preview-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        document.querySelectorAll('.crop-preview-tab').forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        var frame = document.getElementById('cropFrame');
        frame.classList.toggle('mobile', tab.getAttribute('data-device') === 'mobile');
        frame.classList.toggle('desktop', tab.getAttribute('data-device') === 'desktop');
      });
    });

    var zoom = document.getElementById('cropZoom');
    zoom.addEventListener('input', function(){
      landingState.crop.scale = parseFloat(this.value);
      document.getElementById('cropZoomVal').textContent = Math.round(landingState.crop.scale*100)+'%';
      applyCropStyle();
    });

    wireCropDrag();
    applyCropStyle();

    // ---- Hero Orbit Ring — enable toggle + multi-select picker grid.
    // Mirrors the mode-toggle redraw pattern used everywhere else in this
    // form (toggle → drawLandingAdmin()) rather than patching the DOM in
    // place, since showing/hiding the whole picker section needs a real
    // re-render anyway.
    var orbitToggle = document.getElementById('orbitEnabledToggle');
    if(orbitToggle){
      orbitToggle.addEventListener('change', function(){
        landingState.orbitEnabled = orbitToggle.checked;
        drawLandingAdmin();
      });
    }
    if(landingState.orbitEnabled){
      var orbitCountMinus = document.getElementById('orbitCountMinus');
      var orbitCountPlus = document.getElementById('orbitCountPlus');
      if(orbitCountMinus) orbitCountMinus.addEventListener('click', function(){
        landingState.orbitCount = clampOrbitCount(landingState.orbitCount - 1);
        drawLandingAdmin();
      });
      if(orbitCountPlus) orbitCountPlus.addEventListener('click', function(){
        landingState.orbitCount = clampOrbitCount(landingState.orbitCount + 1);
        drawLandingAdmin();
      });
      drawOrbitPickerGrid();
      document.getElementById('orbitPickerSearch').addEventListener('input', function(){
        orbitPickerQuery = this.value;
        drawOrbitPickerGrid();
      });
      var orbitClearBtn = document.getElementById('orbitClearBtn');
      if(orbitClearBtn) orbitClearBtn.addEventListener('click', function(){
        landingState.orbitPhotoIds = [];
        drawLandingAdmin();
      });
    }

    // ---- Work Title Backdrop (Hero B) — mode toggle, picker grid, upload,
    // and "clear" (fall back to the same photo as the landing hero). No
    // crop-drag tool for this one — deliberately simpler than the hero
    // picker above; see the SQL comment for work_title_crop if a
    // drag-to-reposition tool is ever wanted here too.
    document.getElementById('workModeGallery').addEventListener('click', function(){
      landingState.workMode = 'gallery';
      drawLandingAdmin();
    });
    document.getElementById('workModeUpload').addEventListener('click', function(){
      landingState.workMode = 'upload';
      drawLandingAdmin();
    });
    if(landingState.workMode === 'gallery'){
      drawWorkPickerGrid();
      document.getElementById('workPickerSearch').addEventListener('input', function(){
        workPickerQuery = this.value;
        drawWorkPickerGrid();
      });
    }
    var workUploadInput = document.getElementById('workUploadFile');
    if(workUploadInput){
      workUploadInput.addEventListener('change', async function(e){
        var file = e.target.files[0];
        if(!file) return;
        var progressUi = wireUploadProgress('workUpload');
        progressUi.show();
        try{
          // isHero: true — Hero B is the same full-bleed treatment as the
          // landing hero above, so it gets the same larger size cap.
          var res = await uploadFile(file, null, true, progressUi.onProgress, true);
          landingState.workUrl = res.url;
          drawLandingAdmin();
        } catch(err){
          var el2 = document.getElementById('landingFormError');
          el2.textContent = err.message; el2.style.display = 'block';
        } finally {
          progressUi.hide();
        }
      });
    }
    var workClearBtn = document.getElementById('workBackdropClearBtn');
    if(workClearBtn) workClearBtn.addEventListener('click', function(){
      landingState.workUrl = '';
      drawLandingAdmin();
    });

    // ---- Hero Text: A/B tabs, device toggle, and the delegated field
    // handler that both heroes' forms share (one listener on the shared
    // container, not one per input — the fields differ between Hero A and
    // Hero B, but the read/write-by-data-field logic doesn't need to).
    document.getElementById('heroTextTabA').addEventListener('click', function(){
      heroPreviewWhich = 'a';
      drawLandingAdmin();
    });
    document.getElementById('heroTextTabB').addEventListener('click', function(){
      heroPreviewWhich = 'b';
      drawLandingAdmin();
    });
    document.getElementById('heroPreviewDesktopBtn').addEventListener('click', function(){
      heroPreviewDevice = 'desktop';
      document.getElementById('heroPreviewDesktopBtn').classList.add('active');
      document.getElementById('heroPreviewMobileBtn').classList.remove('active');
      updateHeroPreview();
    });
    document.getElementById('heroPreviewMobileBtn').addEventListener('click', function(){
      heroPreviewDevice = 'mobile';
      document.getElementById('heroPreviewMobileBtn').classList.add('active');
      document.getElementById('heroPreviewDesktopBtn').classList.remove('active');
      updateHeroPreview();
    });

    var heroTextForm = document.getElementById('heroTextForm');
    // Writes `value` into cfg.a.b (from a "a.b" data-field path) without
    // needing a switch/if per field — every field this form can ever grow
    // is just another key in HERO_A_TEXT_DEFAULTS / HERO_B_TEXT_DEFAULTS
    // plus a call to heroTextRow()/heroTextSizeRow() above; this write path
    // never needs to change to support it.
    function setHeroTextField(cfg, path, value){
      var parts = path.split('.');
      var obj = cfg;
      for(var i=0; i<parts.length-1; i++) obj = obj[parts[i]];
      obj[parts[parts.length-1]] = value;
    }
    heroTextForm.addEventListener('input', function(e){
      var field = e.target.getAttribute('data-field');
      if(!field) return;
      var cfg = heroPreviewWhich === 'a' ? landingState.heroAText : landingState.heroBText;
      var isCheckbox = e.target.type === 'checkbox';
      var isRange = e.target.type === 'range';
      var value = isCheckbox ? e.target.checked : (isRange ? parseFloat(e.target.value) : e.target.value);
      setHeroTextField(cfg, field, value);
      var readout = heroTextForm.querySelector('[data-readout="'+field+'"]');
      if(readout) readout.textContent = field.indexOf('_y') !== -1 || field.slice(-2) === '.y' ? (value + 'px') : (Math.round(value*100) + '%');
      if(isCheckbox){
        // Toggling an extra line's "enabled" checkbox enables/disables its
        // sibling text + size/position inputs in place — cheap DOM tweak,
        // not a full form redraw, so nothing else on the page loses focus
        // or mid-drag state over one checkbox click.
        var group = e.target.closest('.hero-text-extra');
        if(group){
          group.querySelectorAll('input:not([type="checkbox"])').forEach(function(input){
            input.disabled = !value;
          });
        }
      }
      scheduleHeroPreviewUpdate();
    });

    updateHeroPreview();

    document.getElementById('landingSaveBtn').addEventListener('click', async function(){
      if(!landingState.url){
        var el = document.getElementById('landingFormError');
        el.textContent = 'Choose or upload a landing image first.'; el.style.display = 'block';
        return;
      }
      var btn = document.getElementById('landingSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var payload = {
        hero_image_url: landingState.url,
        hero_image_mode: landingState.mode,
        hero_crop: landingState.crop,
        work_title_image_url: landingState.workUrl || null,
        hero_a_text: landingState.heroAText,
        hero_b_text: landingState.heroBText,
        hero_orbit_enabled: landingState.orbitEnabled,
        hero_orbit_photo_ids: landingState.orbitPhotoIds,
        hero_orbit_count: landingState.orbitCount,
        updated_at: new Date().toISOString()
      };
      var result = await sb.from('about').update(payload).eq('id', 1);
      btn.disabled = false; btn.textContent = 'Save Changes';
      var errEl = document.getElementById('landingFormError');
      var savedEl = document.getElementById('landingSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
      about = Object.assign({}, about, payload);
      renderHeroBackdrop(); // reflect the new image/crop on the live landing page immediately
      renderHeroOrbit(); // and the orbit ring's own enabled/picked-photos state
      renderHeroWorkBackdrop();

    });

  // Translates the stored/working {scale,x,y} into the actual CSS that
  // reproduces the admin's chosen composition. object-position (a
  // percentage of the image, not a fixed pixel offset) is what makes this
  // responsive: the SAME x/y focal point re-crops correctly no matter the
  // element's current aspect ratio/size, unlike a hard-coded pixel crop.
  // scale is layered on top via transform for the zoom-in effect.
  function applyCropStyle(){
    var img = document.getElementById('cropImg');
    if(!img) return;
    var c = landingState.crop;
    img.style.objectPosition = c.x + '% ' + c.y + '%';
    img.style.transform = 'scale(' + c.scale + ')';
  }

  // Pointer-based drag-to-reposition on the crop preview frame. Converts
  // pixel drag distance into a percentage-of-image delta so it works the
  // same regardless of the frame's current size (desktop vs mobile
  // preview, or any future frame size) — see applyCropStyle(). The
  // window-level move/up listeners are registered exactly ONCE (module
  // scope) rather than per-render, and always look up the CURRENT
  // #cropFrame/#cropImg by id — since the Landing tab re-renders its DOM
  // on every mode toggle, re-adding these on each render would silently
  // stack up duplicate listeners on stale, detached frames.
  var cropDragState = { active:false, startX:0, startY:0, startCrop:null };
  function wireCropDrag(){
    var frame = document.getElementById('cropFrame');
    if(!frame || frame._cropMousedownWired) return;
    frame._cropMousedownWired = true;
    function onDown(e){
      cropDragState.active = true;
      frame.classList.add('dragging');
      var pt = e.touches ? e.touches[0] : e;
      cropDragState.startX = pt.clientX; cropDragState.startY = pt.clientY;
      cropDragState.startCrop = Object.assign({}, landingState.crop);
      e.preventDefault();
    }
    frame.addEventListener('mousedown', onDown);
    frame.addEventListener('touchstart', onDown, { passive:false });
  }
  (function setupCropDragGlobalListeners(){
    function onMove(e){
      if(!cropDragState.active) return;
      var frame = document.getElementById('cropFrame');
      if(!frame){ cropDragState.active = false; return; }
      var pt = e.touches ? e.touches[0] : e;
      var rect = frame.getBoundingClientRect();
      var dx = ((pt.clientX - cropDragState.startX) / rect.width) * 100;
      var dy = ((pt.clientY - cropDragState.startY) / rect.height) * 100;
      // Dragging the photo right/down should reveal more of its
      // left/top — i.e. the focal point (object-position) moves the
      // opposite direction of the pointer, matching the felt "grab and
      // slide the photo" interaction.
      landingState.crop.x = Math.min(100, Math.max(0, cropDragState.startCrop.x - dx));
      landingState.crop.y = Math.min(100, Math.max(0, cropDragState.startCrop.y - dy));
      applyCropStyle();
    }
    function onUp(){
      if(!cropDragState.active) return;
      cropDragState.active = false;
      var frame = document.getElementById('cropFrame');
      if(frame) frame.classList.remove('dragging');
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive:false });
    window.addEventListener('touchend', onUp);
  })();

  /* ---------- Watermark tab ---------- */
  /* ---------- Storage tab (orphaned-file scanner + cleanup) ---------- */
  function formatBytes(n){
    if(n == null) return '—';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    return (n/(1024*1024)).toFixed(1) + ' MB';
  }

  // Lists every object in `bucket`, paginating past Supabase Storage's
  // default page size rather than assuming everything fits in one call —
  // with 150+ photos × 2 buckets (public + private original each), this
  // library is well past that default.
  async function listAllStorageObjects(bucket){
    var all = [];
    var offset = 0;
    var pageSize = 1000;
    while(true){
      var res = await sb.storage.from(bucket).list('', { limit: pageSize, offset: offset, sortBy: { column:'name', order:'asc' } });
      if(res.error) throw new Error(res.error.message);
      var items = res.data || [];
      all = all.concat(items);
      if(items.length < pageSize) break;
      offset += pageSize;
    }
    // Storage list() can include folder-placeholder-style entries with no
    // real id/metadata in some setups — filter those out defensively so
    // they never get treated as a deletable file.
    return all.filter(function(f){ return f && f.name && f.id; });
  }

  // Cross-references both storage buckets against every URL currently in
  // use anywhere on the site — every photo (published or not), the
  // landing hero, the work title backdrop, and the About profile photo —
  // and returns whatever's left over: files nothing points to anymore,
  // almost always left behind by a photo deletion or image replacement
  // from before removeStorageFilesForUrls() existed. Safe by construction:
  // a file only shows up here if NONE of those sources reference it, so a
  // live, in-use file can never be flagged by mistake.
  async function findOrphanedStorageFiles(){
    var photosRes = await sb.from('photos').select('image_url');
    if(photosRes.error) throw new Error(photosRes.error.message);
    var aboutRes = await sb.from('about').select('hero_image_url, work_title_image_url, profile_image_url').eq('id', 1).single();
    var aboutRow = (aboutRes && aboutRes.data) || {};
    var inUseUrls = (photosRes.data || []).map(function(p){ return p.image_url; })
      .concat([aboutRow.hero_image_url, aboutRow.work_title_image_url, aboutRow.profile_image_url]);

    var inUsePublicPaths = {};
    var inUseBaseNames = {};
    inUseUrls.forEach(function(url){
      var path = storagePathFromPublicUrl(url, BUCKET);
      if(!path) return;
      inUsePublicPaths[path] = true;
      // "<timestamp>-<random>-web.<ext>" → "<timestamp>-<random>" — the
      // shared prefix uploadFile() gives a photo's public copy AND its
      // private original (see uploadFile()'s own comment on why the
      // original's path isn't stored anywhere directly), used here to
      // match originals that have no stored path of their own.
      inUseBaseNames[path.replace(/-web\.[a-z0-9]+$/i, '')] = true;
    });

    var publicFiles = await listAllStorageObjects(BUCKET);
    var originalFiles = await listAllStorageObjects(ORIGINALS_BUCKET);

    var publicOrphans = publicFiles.filter(function(f){ return !inUsePublicPaths[f.name]; })
      .map(function(f){ return { bucket: BUCKET, path: f.name, size: f.metadata && f.metadata.size }; });

    var originalOrphans = originalFiles.filter(function(f){
      return !inUseBaseNames[f.name.replace(/\.[a-z0-9]+$/i, '')];
    }).map(function(f){ return { bucket: ORIGINALS_BUCKET, path: f.name, size: f.metadata && f.metadata.size }; });

    return publicOrphans.concat(originalOrphans);
  }

  async function renderStorageAdmin(){
    renderAdminStats();
    adminScroll.innerHTML = '<p class="admin-empty">Scanning both storage buckets against every photo, the landing hero, the work title backdrop, and the profile photo — this can take a few seconds on a large library…</p>';
    var orphans, allOriginals;
    try{
      orphans = await findOrphanedStorageFiles();
      allOriginals = await listAllStorageObjects(ORIGINALS_BUCKET);
    } catch(err){
      adminScroll.innerHTML = '<div class="admin-form"><h3>Storage Cleanup</h3><p class="admin-error">Could not scan storage: '+escapeHtml(err.message)+'</p></div>';
      return;
    }
    drawStorageAdmin(orphans, allOriginals);
  }

  function drawStorageAdmin(orphans, allOriginals){
    var totalBytes = orphans.reduce(function(sum, o){ return sum + (o.size || 0); }, 0);
    var originalsBytes = allOriginals.reduce(function(sum, f){ return sum + ((f.metadata && f.metadata.size) || 0); }, 0);
    var html = ''+
    '<div class="admin-form">'+
      '<h3>Storage Cleanup</h3>'+
      '<p class="sub" style="margin:0 0 4px;">Finds files sitting in storage that nothing on the site references anymore — the usual cause of storage usage climbing well past what your actual published photos would need. Cross-checked against every current photo (published or not), the landing hero, the work title backdrop, and the About profile photo, so nothing still in use can ever show up here. Deleting a photo or replacing its image now cleans up after itself automatically — this tool is for the leftovers from before that fix.</p>';

    if(!orphans.length){
      html += '<p class="admin-empty">No orphaned files found — storage is clean.</p>'+
        '<div class="admin-form-actions"><button class="admin-btn secondary" id="storageRescanBtn">Rescan</button></div>';
    } else {
      html += ''+
        '<p class="sub"><strong>'+orphans.length+'</strong> orphaned file'+(orphans.length===1?'':'s')+' found, totaling <strong>'+formatBytes(totalBytes)+'</strong>.</p>'+
        '<div class="storage-orphan-list">'+orphans.map(function(o){
          return '<div class="storage-orphan-row"><span class="storage-orphan-path" title="'+escapeHtml(o.path)+'">'+escapeHtml(o.path)+'</span><span class="storage-orphan-bucket">'+(o.bucket===ORIGINALS_BUCKET?'original':'public')+'</span><span class="storage-orphan-size">'+formatBytes(o.size)+'</span></div>';
        }).join('')+'</div>'+
        '<p class="admin-error" id="storageError" style="display:none;"></p>'+
        '<div class="admin-form-actions">'+
          '<button class="admin-btn secondary" id="storageRescanBtn">Rescan</button>'+
          '<button class="admin-btn" id="storageDeleteBtn">Delete All ('+formatBytes(totalBytes)+')</button>'+
        '</div>';
    }

    html += ''+
      '<h3 style="margin-top:28px;">Private Originals Bucket</h3>'+
      '<p class="sub" style="margin:0 0 4px;">Full-resolution masters are no longer stored on upload — every new photo now only creates the small, resized public copy the site actually shows. But if you were using this before that change, the "'+ORIGINALS_BUCKET+'" bucket may still be holding a full-resolution copy of every photo you\'ve ever uploaded, whether or not it\'s "orphaned" in the sense above — clearing it here is separate from the scan and reclaims that space immediately.</p>';

    if(!allOriginals.length){
      html += '<p class="admin-empty">The private originals bucket is empty — nothing to clear.</p>';
    } else {
      html += ''+
        '<p class="sub"><strong>'+allOriginals.length+'</strong> file'+(allOriginals.length===1?'':'s')+' in "'+ORIGINALS_BUCKET+'", totaling <strong>'+formatBytes(originalsBytes)+'</strong>.</p>'+
        '<p class="sub" style="color:#ff8b7a;">This deletes every full-resolution master you have, including ones still tied to live, published photos. Nothing on the site reads from this bucket, so the site itself is unaffected — but if you ever wanted an un-watermarked, full-quality copy of an older photo for a print or a re-edit, this is the only place it still exists. Once cleared, the only backup left is whatever you kept on your own device.</p>'+
        '<p class="admin-error" id="originalsError" style="display:none;"></p>'+
        '<div class="admin-form-actions">'+
          '<button class="admin-btn secondary" id="originalsDeleteBtn">Delete All Originals ('+formatBytes(originalsBytes)+')</button>'+
        '</div>';
    }
    html += '</div>';
    adminScroll.innerHTML = html;

    document.getElementById('storageRescanBtn').addEventListener('click', renderStorageAdmin);
    var delBtn = document.getElementById('storageDeleteBtn');
    if(delBtn) delBtn.addEventListener('click', async function(){
      if(!confirm('Permanently delete '+orphans.length+' orphaned file'+(orphans.length===1?'':'s')+' ('+formatBytes(totalBytes)+')? This cannot be undone.')) return;
      delBtn.disabled = true; delBtn.textContent = 'Deleting…';
      try{
        var byBucket = {};
        orphans.forEach(function(o){ (byBucket[o.bucket] = byBucket[o.bucket] || []).push(o.path); });
        for(var bucket in byBucket){
          // Storage remove() has its own batch-size ceiling — chunk
          // defensively rather than assuming an arbitrarily long list
          // always succeeds in one call.
          var paths = byBucket[bucket];
          for(var i=0; i<paths.length; i+=100){
            var chunk = paths.slice(i, i+100);
            var res = await sb.storage.from(bucket).remove(chunk);
            if(res.error) throw new Error(res.error.message);
          }
        }
        renderStorageAdmin();
      } catch(err){
        delBtn.disabled = false; delBtn.textContent = 'Delete All ('+formatBytes(totalBytes)+')';
        var errEl = document.getElementById('storageError');
        errEl.textContent = err.message; errEl.style.display = 'block';
      }
    });

    var origDelBtn = document.getElementById('originalsDeleteBtn');
    if(origDelBtn) origDelBtn.addEventListener('click', async function(){
      if(!confirm('Permanently delete ALL '+allOriginals.length+' files in the private originals bucket ('+formatBytes(originalsBytes)+')? This includes full-resolution masters for photos still live on the site. This cannot be undone.')) return;
      origDelBtn.disabled = true; origDelBtn.textContent = 'Deleting…';
      try{
        var allPaths = allOriginals.map(function(f){ return f.name; });
        for(var i=0; i<allPaths.length; i+=100){
          var chunk = allPaths.slice(i, i+100);
          var res = await sb.storage.from(ORIGINALS_BUCKET).remove(chunk);
          if(res.error) throw new Error(res.error.message);
        }
        renderStorageAdmin();
      } catch(err){
        origDelBtn.disabled = false; origDelBtn.textContent = 'Delete All Originals ('+formatBytes(originalsBytes)+')';
        var oErrEl = document.getElementById('originalsError');
        oErrEl.textContent = err.message; oErrEl.style.display = 'block';
      }
    });
  }

  function drawWatermarkAdmin(saved){
    var previewImg = (adminPhotos[0] && adminPhotos[0].image_url) || 'https://picsum.photos/seed/wm-preview/600/800';
    adminScroll.innerHTML = ''+
    '<div class="admin-form">'+
      '<h3>Watermark Settings</h3>'+
      '<div class="admin-field row"><input type="checkbox" id="wm-enabled" '+(saved.watermark_enabled?'checked':'')+'><label for="wm-enabled">Enable Watermark</label></div>'+
      '<div class="admin-field"><label>Text</label><input type="text" id="wm-text" value="'+escapeHtml(saved.watermark_text)+'"></div>'+
      '<div class="admin-field"><label>Opacity: <span id="wm-opacity-val">'+Math.round(saved.watermark_opacity*100)+'%</span></label><input type="range" min="5" max="100" id="wm-opacity" value="'+Math.round(saved.watermark_opacity*100)+'"></div>'+
      '<div class="admin-field"><label>Size: <span id="wm-size-val">'+Math.round((saved.watermark_scale!=null?saved.watermark_scale:1)*100)+'%</span> <span class="sub" id="wm-size-pct"></span></label><input type="range" min="50" max="500" id="wm-size" value="'+Math.round((saved.watermark_scale!=null?saved.watermark_scale:1)*100)+'"></div>'+
      '<div class="admin-field"><label>Position</label><select id="wm-position">'+wmPositionOptionsHtml(saved.watermark_position)+'</select></div>'+
      '<div class="admin-field-grid">'+
        '<div class="admin-field"><label>X Offset: <span id="wm-x-val">'+saved.watermark_x_offset+'px</span></label><input type="range" min="0" max="120" id="wm-x" value="'+saved.watermark_x_offset+'"></div>'+
        '<div class="admin-field"><label>Y Offset: <span id="wm-y-val">'+saved.watermark_y_offset+'px</span></label><input type="range" min="0" max="120" id="wm-y" value="'+saved.watermark_y_offset+'"></div>'+
      '</div>'+
      '<div class="admin-field"><label>Preview</label>'+
        '<p class="sub" style="margin:0 0 8px;">This shows exactly what gets burned into new uploads — not a live overlay. Already-published photos keep whatever was baked in at their own upload time; changing these settings does not retroactively touch them.</p>'+
        '<canvas id="wmPreviewCanvas" width="1200" height="1800" style="width:100%; max-width:360px; aspect-ratio:2/3; background:#1a1a1a; display:block;"></canvas>'+
      '</div>'+
      '<p class="admin-error" id="wmFormError" style="display:none;"></p>'+
      '<div class="admin-form-actions">'+
        '<span class="admin-saved" id="wmSaved" style="display:none;">Saved.</span>'+
        '<button class="admin-btn secondary" id="wmResetBtn">Reset</button>'+
        '<button class="admin-btn" id="wmSaveBtn">Save</button>'+
      '</div>'+
    '</div>';

    function readForm(){
      return {
        watermark_enabled: document.getElementById('wm-enabled').checked,
        watermark_text: document.getElementById('wm-text').value || 'Islem Zrelli',
        watermark_opacity: (parseInt(document.getElementById('wm-opacity').value,10)||35)/100,
        watermark_position: document.getElementById('wm-position').value,
        watermark_x_offset: parseInt(document.getElementById('wm-x').value,10)||0,
        watermark_y_offset: parseInt(document.getElementById('wm-y').value,10)||0,
        watermark_scale: (parseInt(document.getElementById('wm-size').value,10)||100)/100
      };
    }

    // Renders the SAME drawWatermarkOnCanvas() the real upload pipeline
    // uses, onto a preview canvas — so what you see here is exactly what
    // new uploads will get, not a separate approximation of it. The
    // canvas's internal resolution (1200x1800, set on the element above)
    // deliberately matches MAX_PORTRAIT_W/H, the real size uploaded photos
    // get processed at — NOT just a display-size choice. Watermark
    // font-size has a 14px floor (see drawWatermarkOnCanvas) so it never
    // becomes illegibly tiny on a genuinely small source photo; on a
    // much-smaller preview canvas (this used to be 180x270) that floor
    // dominates the entire "Size" slider range, making it look like size
    // changes do nothing. Matching a real upload's resolution here is
    // what makes the slider actually visible — a bigger CSS display size
    // alone wouldn't fix that.
    var previewCanvas = document.getElementById('wmPreviewCanvas');
    var previewCtx = previewCanvas.getContext('2d');
    var previewImgEl = new Image();
    var previewImgLoaded = false;
    previewImgEl.onload = function(){ previewImgLoaded = true; updatePreview(); };
    previewImgEl.src = previewImg;

    async function updatePreview(){
      var v = readForm();
      document.getElementById('wm-opacity-val').textContent = Math.round(v.watermark_opacity*100)+'%';
      document.getElementById('wm-x-val').textContent = v.watermark_x_offset+'px';
      document.getElementById('wm-y-val').textContent = v.watermark_y_offset+'px';
      document.getElementById('wm-size-val').textContent = Math.round(v.watermark_scale*100)+'%';

      previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
      // Defaults to the full canvas until the image has loaded, matching
      // the pre-letterbox behavior for that brief window.
      var dx = 0, dy = 0, dw = previewCanvas.width, dh = previewCanvas.height;
      if(previewImgLoaded){
        // object-fit:contain (letterboxed, full image always visible) —
        // matching what actually happens on real upload: the burn-in
        // canvas in processImageForUpload() is sized to the photo's own
        // aspect ratio and never crops anything. This preview box has a
        // fixed shape only because it's a small thumbnail, so it letterboxes
        // instead of cropping, rather than cutting off part of the photo
        // to force it into that shape.
        var cw = previewCanvas.width, ch = previewCanvas.height;
        var ir = previewImgEl.naturalWidth / previewImgEl.naturalHeight, cr = cw / ch;
        if(ir > cr){ dw = cw; dh = cw / ir; dx = 0; dy = (ch - dh) / 2; }
        else { dh = ch; dw = ch * ir; dx = (cw - dw) / 2; dy = 0; }
        previewCtx.drawImage(previewImgEl, 0, 0, previewImgEl.naturalWidth, previewImgEl.naturalHeight, dx, dy, dw, dh);
      }
      if(v.watermark_enabled){
        // Same drawWatermarkOnCanvas() the real upload burn-in calls (see
        // its comment) — this preview is guaranteed to match exactly
        // because it's literally the same code path, not a look-alike.
        // Translated to the image's own letterboxed rectangle (dx,dy) and
        // sized to it (dw,dh) rather than the full canvas — otherwise the
        // watermark would anchor to the canvas edge and float in the empty
        // letterbox margin instead of sitting on the actual visible photo,
        // whenever the photo's aspect ratio doesn't match this fixed box.
        previewCtx.save();
        previewCtx.translate(dx, dy);
        var wmResult = await drawWatermarkOnCanvas(previewCtx, dw, dh, {
          text: v.watermark_text, opacity: v.watermark_opacity, position: v.watermark_position,
          x: v.watermark_x_offset, y: v.watermark_y_offset, scale: v.watermark_scale
        });
        previewCtx.restore();
        // Concrete readout next to the Size slider — "100%" on its own
        // doesn't tell you much when it's a percentage of a formula you
        // can't see, so show what it actually measures out to on the photo.
        var pctEl = document.getElementById('wm-size-pct');
        if(pctEl) pctEl.textContent = (wmResult && dw) ? '(\u2248 ' + Math.round((wmResult.textWidth / dw) * 100) + '% of image width)' : '';
      } else {
        var pctElOff = document.getElementById('wm-size-pct');
        if(pctElOff) pctElOff.textContent = '';
      }
    }
    ['wm-enabled','wm-text','wm-opacity','wm-size','wm-position','wm-x','wm-y'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePreview);
    });
    updatePreview();

    document.getElementById('wmResetBtn').addEventListener('click', function(){
      drawWatermarkAdmin(saved); // discard unsaved edits, back to last-saved values
    });

    document.getElementById('wmSaveBtn').addEventListener('click', async function(){
      var payload = readForm();
      payload.id = 1;
      payload.updated_at = new Date().toISOString();
      var btn = document.getElementById('wmSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      var result = await sb.from('site_settings').upsert(payload);
      btn.disabled = false; btn.textContent = 'Save';
      var errEl = document.getElementById('wmFormError');
      var savedEl = document.getElementById('wmSaved');
      if(result.error){ errEl.textContent = result.error.message; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      savedEl.style.display = 'inline';
      settings = Object.assign({}, DEFAULT_WATERMARK, payload);
      saved = Object.assign({}, payload);
      renderScenes(); // reflect the change on the gallery straight away
    });
  }
