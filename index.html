  /* ---------- Bulk photo upload ---------- */
  // A second, additive way to add photos alongside the "+ Add Photo" form
  // above (which is untouched). Select several files at once; each gets
  // processed/uploaded through the exact same uploadFile() pipeline and,
  // on success, becomes its own row in `photos` with a filename-derived
  // title. Published defaults to on (see bs-published's `checked` default
  // in bulkSettingsPanelHtml) so a normal bulk upload appears on the public
  // site immediately, matching the single "+ Add Photo" form's own default
  // — the admin can still uncheck Published in Batch Settings before
  // uploading to keep a batch private, and can Unpublish/Edit any photo
  // individually afterward exactly as before.
  var bulkQueue = [];           // [{ id, file, status, pct, error, uploadResult, order }]
  var BULK_CONCURRENCY = 3;     // conservative — a few files in flight overlaps
                                 // network latency without flooding the browser,
                                 // the network, or Supabase with simultaneous requests
  function titleFromFilename(name){
    var base = name.replace(/\.[^.]+$/, '');
    base = base.replace(/[_-]+/g, ' ').trim();
    if(!base) return 'Untitled';
    return base.replace(/\w\S*/g, function(w){ return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); });
  }

  // Flags a title that still looks like an unedited camera/phone/app export
  // filename rather than something a person actually typed — e.g. what
  // bulk upload used to auto-fill from the file name before that default
  // was removed (see titleFromFilename above and its old call site). Feeds
  // the "Clean Filename Titles" tool below. Deliberately a heuristic: for
  // photos already saved, the real original filename is gone for good —
  // uploadFile() names the file in storage from a timestamp+random string,
  // never the original — so there's nothing exact left to compare against.
  // This instead matches the common SHAPES those filenames come in. Always
  // shown to a human to confirm/uncheck before anything is cleared — never
  // runs unattended, and a title that happens to be short or numeric for a
  // real, deliberate reason can simply be left unchecked.
  function looksLikeFilenameTitle(title){
    var t = String(title || '').trim();
    if(!t) return false;
    // Nothing but digits, spaces and dots — a bare timestamp/serial, e.g.
    // "20230521 143022" or "1000023456".
    if(/^[\d\s.]+$/.test(t)) return true;
    // A common camera/phone/app export prefix immediately followed by a
    // digit run: "Img 1234", "Dscn0045", "Screenshot 2023 05 21 143022",
    // "Whatsapp Image 2023 05 21 At 14.30.22".
    if(/^(img|image|dsc|dscn|dscf|dcim|mvimg|mvi|pxl|vid|video|photo|pic|picture|snapshot|screenshot|screen shot|whatsapp image|whatsapp video|received image|received file|fb img|signal)\b[\s._-]*\d/i.test(t)) return true;
    // A short letter prefix mashed directly against a long digit run with
    // no separator at all, e.g. "P1010234", "Dscf1234567" — common on
    // cameras that don't use underscores in their default names.
    if(/^[a-z]{1,6}\d{4,}$/i.test(t)) return true;
    // Mostly digits with only a couple of stray letters — catches odds
    // and ends the patterns above miss, e.g. "20230521 143022 Edited".
    var digits = t.replace(/[^0-9]/g, '').length;
    var letters = t.replace(/[^a-z]/gi, '').length;
    if(digits >= 8 && letters <= 3) return true;
    return false;
  }
  function filenameStyleTitleCandidates(){
    return adminPhotos.filter(function(p){ return looksLikeFilenameTitle(p.title); });
  }

  // Runs `worker` over `items` with at most `limit` running concurrently.
  // Generic — not photo-specific — so it stays out of the way of anything
  // else the admin does; nothing here touches the DOM directly.
  function runWithConcurrency(items, limit, worker){
    return new Promise(function(resolve){
      if(!items.length){ resolve(); return; }
      var idx = 0, active = 0;
      function launchNext(){
        if(idx >= items.length) return;
        var item = items[idx++];
        active++;
        Promise.resolve(worker(item)).catch(function(){ /* individual failures are recorded on the item itself */ }).then(function(){
          active--;
          if(idx < items.length) launchNext();
          else if(active === 0) resolve();
        });
      }
      var starters = Math.min(limit, items.length);
      for(var i=0;i<starters;i++) launchNext();
    });
  }
  function bulkStageLabel(status){
    return { waiting:'Waiting…', processing:'Processing…', uploading:'Uploading…', saving:'Saving…', done:'Complete', error:'Failed' }[status] || status;
  }
  // Per-item contribution to the overall bar. Real network progress is
  // used wherever it exists (uploading); the other stages don't have a
  // byte-level source, so they get a small fixed nudge rather than being
  // left at 0 the whole time they're active — this keeps the OVERALL
  // number honest about actual work in flight, per item 8's requirement
  // that it not simply track "files completed".
  function bulkItemContribution(item){
    if(item.status === 'done') return 100;
    if(item.status === 'uploading' && typeof item.pct === 'number') return item.pct;
    if(item.status === 'saving') return 95;
    if(item.status === 'processing') return 8;
    return 0; // waiting, or error (doesn't count as progress)
  }
  // Same before/after numbers the single-upload "optimized" panel shows
  // (see renderOptimizeResult / formatBytes above), just laid out compactly
  // for one row in the bulk list. Real measured File/Blob sizes only —
  // nothing estimated. Empty string until the item has actually finished
  // processing (or if this file type wasn't resized at all).
  function bulkItemSizeLine(item){
    var res = item.uploadResult;
    if(!res || !res.resized || res.origSize == null || res.processedSize == null) return '';
    var reductionPct = res.origSize > 0 ? (100 * (1 - (res.processedSize / res.origSize))) : 0;
    var reductionLabel = (reductionPct >= 0 ? reductionPct.toFixed(0) + '% smaller' : Math.abs(reductionPct).toFixed(0) + '% larger');
    return formatBytes(res.origSize) + ' → <span class="after">' + formatBytes(res.processedSize) + '</span> · <span class="pct">' + reductionLabel + '</span>';
  }
  // Aggregate before/after across every item that's actually finished
  // processing so far — updates live as the batch runs, not just once at
  // the end. Items still waiting/processing/failed simply aren't counted
  // yet (failed ones never got a processed size to add).
  function bulkTotalsLine(){
    var totalOrig = 0, totalProcessed = 0, counted = 0;
    bulkQueue.forEach(function(item){
      var res = item.uploadResult;
      if(res && res.resized && res.origSize != null && res.processedSize != null){
        totalOrig += res.origSize; totalProcessed += res.processedSize; counted++;
      }
    });
    if(!counted) return '';
    var reductionPct = totalOrig > 0 ? (100 * (1 - (totalProcessed / totalOrig))) : 0;
    var reductionLabel = (reductionPct >= 0 ? reductionPct.toFixed(0) + '% smaller' : Math.abs(reductionPct).toFixed(0) + '% larger');
    return 'Total so far: ' + formatBytes(totalOrig) + ' → <span class="opt-after">' + formatBytes(totalProcessed) + '</span> · <span class="opt-reduction">' + reductionLabel + '</span>';
  }
  function bulkItemInnerHtml(item){
    var fillClass = item.status === 'done' ? 'done' : item.status === 'error' ? 'error' : (item.status === 'uploading' && typeof item.pct === 'number') ? '' : 'indeterminate';
    var width = item.status === 'uploading' && typeof item.pct === 'number' ? item.pct : (item.status === 'waiting' ? 0 : undefined);
    var sizeLine = bulkItemSizeLine(item);
    return '<div class="bulk-item-row"><span class="bulk-item-name">'+escapeHtml(item.file.name)+'</span><span class="bulk-item-status '+item.status+'">'+bulkStageLabel(item.status)+(item.status==='uploading' && typeof item.pct==='number' ? ' '+item.pct+'%' : '')+'</span></div>'+
      '<div class="bulk-item-track"><div class="bulk-item-fill '+fillClass+'"'+(width!=null?' style="width:'+width+'%;"':'')+'></div></div>'+
      (sizeLine ? '<div class="bulk-item-size">'+sizeLine+'</div>' : '')+
      (item.status==='error' ? '<div class="bulk-item-error">'+escapeHtml(item.error||'Upload failed.')+'</div><button class="bulk-item-retry" data-retry="'+item.id+'">Retry</button>' : '');
  }
  // Full structural (re)build: the header, the summary strip, and every
  // item card from scratch. Only call this when the SET of items actually
  // changed (a batch starting) — every per-item progress update should go
  // through updateBulkItemUI()/updateBulkSummary() instead, which never
  // touch .bulk-list's own DOM node and so never reset its scroll position
  // (previously this function ran on every single progress tick from every
  // concurrent upload, via panel.innerHTML = html, which silently blew away
  // and recreated the scrollable list — and with it, its scrollTop — dozens
  // of times a minute during a real batch).
  function renderBulkPanel(){
    var panel = document.getElementById('bulkPanel');
    if(!panel) return; // admin has navigated away from the Photos tab — queue keeps running in the background regardless
    // This is a full rebuild — should now only run on first mount (nothing
    // to preserve yet) or the rare fallback in updateBulkItemUI(). Still,
    // explicitly save/restore .bulk-list's scroll position around it rather
    // than relying on "this path shouldn't normally fire mid-batch" — a
    // real re-render, if one ever does happen here, should never be able
    // to move the admin's view.
    var prevList = document.getElementById('bulkList');
    var savedScroll = prevList ? prevList.scrollTop : 0;
    var html = '<h4 id="bulkHeading">Bulk Upload — '+bulkQueue.length+' photo'+(bulkQueue.length===1?'':'s')+'</h4>'+
      '<div id="bulkSummaryWrap"></div>'+
      '<div class="bulk-list" id="bulkList">'+
      bulkQueue.map(function(item){
        return '<div class="bulk-item" data-item-id="'+item.id+'">'+bulkItemInnerHtml(item)+'</div>';
      }).join('')+
      '</div>'+
      '<div class="bulk-panel-actions" id="bulkPanelActions"></div>';
    panel.innerHTML = html;
    panel.querySelectorAll('.bulk-item-retry').forEach(function(btn){
      btn.addEventListener('click', function(){
        var item = bulkQueue.find(function(i){ return i.id === btn.getAttribute('data-retry'); });
        if(item) processBulkItem(item);
      });
    });
    updateBulkSummary();
    var newList = document.getElementById('bulkList');
    if(newList && savedScroll) newList.scrollTop = savedScroll;
  }
  // Refreshes only the header strip above the scrollable list (completed
  // count, overall %, the totals line, and the Dismiss/"still uploading"
  // action row) — none of which live inside .bulk-list, so rebuilding this
  // small chunk never touches the list's scroll position.
  function updateBulkSummary(){
    var wrap = document.getElementById('bulkSummaryWrap');
    var actions = document.getElementById('bulkPanelActions');
    if(!wrap || !actions) return; // admin has navigated away
    var heading = document.getElementById('bulkHeading');
    if(heading) heading.textContent = 'Bulk Upload — '+bulkQueue.length+' photo'+(bulkQueue.length===1?'':'s');
    var doneCount = bulkQueue.filter(function(i){ return i.status === 'done'; }).length;
    var errorCount = bulkQueue.filter(function(i){ return i.status === 'error'; }).length;
    var overallPct = bulkQueue.length ? Math.round(bulkQueue.reduce(function(s,i){ return s + bulkItemContribution(i); }, 0) / bulkQueue.length) : 0;
    var allSettled = bulkQueue.every(function(i){ return i.status === 'done' || i.status === 'error'; });
    wrap.innerHTML = '<div class="bulk-summary"><span>'+doneCount+' / '+bulkQueue.length+' completed'+(errorCount?' · '+errorCount+' failed':'')+'</span><span class="overall-pct">'+overallPct+'%</span></div>'+
      '<div class="bulk-summary-track"><div class="bulk-summary-fill" style="width:'+overallPct+'%;"></div></div>'+
      (bulkTotalsLine() ? '<div class="bulk-totals">'+bulkTotalsLine()+'</div>' : '');
    actions.innerHTML = allSettled ? '<button class="admin-btn secondary" id="bulkDismissBtn">Dismiss</button>' : '<span class="sub">Uploading — you can switch tabs, this keeps running.</span>';
    var dismissBtn = document.getElementById('bulkDismissBtn');
    if(dismissBtn) dismissBtn.addEventListener('click', function(){
      bulkQueue = [];
      renderPhotosAdmin();
    });
  }
  // Updates exactly one item card's inner content by id — the card element
  // itself (and every other card, and .bulk-list itself) is left completely
  // untouched, which is what actually keeps the admin's scroll position
  // (e.g. looking at photos 17–20) stable while other items in the batch
  // keep progressing around it.
  //
  // Coalesced to at most one repaint per animation frame PER ITEM: XHR's
  // upload.onprogress can fire dozens of times a second on a fast
  // connection uploading a large photography file, and with several files
  // uploading concurrently (BULK_CONCURRENCY) that's a lot of redundant
  // innerHTML writes for progress numbers nobody can actually read at
  // that rate. item.status/item.pct are always updated synchronously by
  // the caller before this runs, so a coalesced frame always paints the
  // latest value — nothing is ever shown stale, only intermediate values
  // between two same-frame updates are skipped.
  var _bulkPaintQueued = {};
  function updateBulkItemUI(item){
    if(_bulkPaintQueued[item.id]) return;
    _bulkPaintQueued[item.id] = true;
    requestAnimationFrame(function(){
      _bulkPaintQueued[item.id] = false;
      var panel = document.getElementById('bulkPanel');
      if(!panel) return;
      var card = panel.querySelector('.bulk-item[data-item-id="'+item.id+'"]');
      if(!card){ renderBulkPanel(); return; } // shouldn't normally happen — fall back to a full rebuild
      card.innerHTML = bulkItemInnerHtml(item);
      var retryBtn = card.querySelector('.bulk-item-retry');
      if(retryBtn) retryBtn.addEventListener('click', function(){ processBulkItem(item); });
      updateBulkSummary();
    });
  }
  // Processes exactly one queue item: upload (skipped if a previous
  // attempt already got the files stored — see the retry comment on
  // xhrUploadToBucket for why that matters) then insert its `photos` row.
  // Safe to call again on a single item after failure without touching
  // any other item in the queue (item 9's per-file retry requirement).
  // item.defaults (set once for the whole batch in startBulkUpload, from
  // the Batch Settings step — see bulkSettingsPanelHtml) supplies
  // category/tags/location/date/published/featured so every photo in the
  // batch starts pre-filled instead of blank; any field left empty there
  // just falls back to the same blank defaults bulk upload always had.
  async function processBulkItem(item){
    item.status = 'processing'; item.pct = null; item.error = null;
    updateBulkItemUI(item);
    try{
      if(!item.uploadResult){
        item.uploadResult = await uploadFile(item.file, null, false, function(state){
          item.status = state.stage; item.pct = state.pct;
          updateBulkItemUI(item);
        });
      }
      item.status = 'saving'; updateBulkItemUI(item);
      var res = item.uploadResult;
      var d = item.defaults || {};
      var payload = {
        title:'', story:'', category: d.categoryName || '', location: d.location || '', tags: d.tags || '', date: d.date || null, alt_text:'',
        published: !!d.published, featured: !!d.featured, is_favorite:false,
        image_url: res.url, image_width: res.width, image_height: res.height, display_order: item.order
      };
      var insertRes = await sb.from('photos').insert(payload).select().single();
      if(insertRes.error) throw new Error(insertRes.error.message);
      item.photoId = insertRes.data && insertRes.data.id;
      // Mirror the single-photo edit form's category behavior: the free-
      // text `category` column above is a display/search label (already a
      // comma-separated list of every checked category — see
      // categoryLabelFromIds), but the photo_categories junction is what
      // actually places a photo on each of those categories' gallery
      // pages, so EVERY category checked in Batch Settings needs its own
      // junction row here, not just the first one. Tolerant of the table
      // not existing yet, same as the single-photo save path.
      if(d.categoryIds && d.categoryIds.length){
        try{
          await sb.from('photo_categories').insert(d.categoryIds.map(function(cid){ return { photo_id: item.photoId, category_id: cid }; }));
        } catch(e){}
      }
      item.status = 'done'; item.pct = 100;
    } catch(err){
      item.status = 'error'; item.error = err.message;
    }
    updateBulkItemUI(item);
    if(bulkQueue.every(function(i){ return i.status === 'done' || i.status === 'error'; })){
      // Whole batch settled — pull the fresh rows into the normal list
      // below so Publish/Edit/reorder/Delete (all unchanged) work on
      // them immediately, without wiping the queue panel itself.
      var settledQueue = bulkQueue;
      loadAdminPhotos().then(function(){
        var errorCount = settledQueue.filter(function(i){ return i.status === 'error'; }).length;
        var newIds = settledQueue.filter(function(i){ return i.status === 'done' && i.photoId; }).map(function(i){ return i.photoId; });
        if(errorCount === 0 && newIds.length){
          // Clean batch — this is the fast path the whole Quick Review
          // workflow exists for: don't just dump the admin back on the
          // plain list (they'd have to search up their own new photos and
          // open each one's full form just to catch a typo or set a
          // location). Land on a lightweight review grid over the whole
          // batch instead — see reviewGridHtml() — so the common case
          // (everything looks right, maybe one or two exceptions) takes
          // seconds instead of one full-form round-trip per photo. Any
          // category set in Batch Settings is already applied to every
          // photo at this point either way; Quick Review's per-card
          // Category field is there for the exceptions, not required.
          bulkQueue = [];
          reviewBatchIds = newIds;
          Promise.all([loadCategories(), loadPhotoCategories()]).then(drawPhotosAdmin);
        } else {
          drawPhotosAdmin();
        }
      });
    }
  }
  function startBulkUpload(files, defaults){
    var maxOrder = adminPhotos.reduce(function(m,p){ return Math.max(m, p.display_order||0); }, -1);
    var items = Array.prototype.slice.call(files).map(function(file, i){
      return { id: 'bulk-'+Date.now()+'-'+i, file: file, status:'waiting', pct:null, error:null, uploadResult:null, order: maxOrder + 1 + i, defaults: defaults || null };
    });
    bulkQueue = bulkQueue.concat(items);
    var list = document.getElementById('bulkList');
    if(list){
      // A batch is already running and its list is on screen — append the
      // new cards to the end without touching anything already there. This
      // can't move the admin's scroll position, viewport, or focus: adding
      // content below whatever they're currently looking at never causes a
      // browser to reflow/rescroll existing content above or at the view.
      var frag = document.createDocumentFragment();
      items.forEach(function(item){
        var card = document.createElement('div');
        card.className = 'bulk-item';
        card.setAttribute('data-item-id', item.id);
        card.innerHTML = bulkItemInnerHtml(item);
        frag.appendChild(card);
      });
      list.appendChild(frag);
      updateBulkSummary();
    } else {
      // Nothing mounted yet (first batch, or the admin isn't currently on
      // the Photos tab) — a full rebuild is unavoidable, but there's also
      // nothing on screen for it to disrupt.
      drawPhotosAdmin();
    }
    runWithConcurrency(items, BULK_CONCURRENCY, processBulkItem);
  }

  /* ---------- Translate Pending (item 13) ---------- */
  // "Missing" means this language has no title AND no story yet for this
  // photo — not "still an unreviewed AI draft". A photo that already has
  // *any* translation for a language, AI-sourced or manual, is never
  // touched here; the only way to redo an already-answered language is
  // the per-photo Auto-translate button in that exact photo's editor,
  // which the admin has to click on purpose. That's what keeps this
  // batch action safe to run repeatedly as new photos get added, without
  // ever clobbering a manually-written or already-drafted translation.
  var TRANSLATE_CONCURRENCY = 2; // MyMemory is a free public service — stay polite, not just fast
  function isTranslationMissing(photo, langCode){
    var t = photo.translations && photo.translations[langCode];
    return !t || (!t.title && !t.story);
  }
  function pendingTranslationCounts(){
    var counts = {};
    SUPPORTED_LANGS.forEach(function(l){
      if(l.code === 'en') return;
      counts[l.code] = adminPhotos.filter(function(p){ return isTranslationMissing(p, l.code); }).length;
    });
    return counts;
  }
  function translatePendingPanelHtml(){
    var counts = pendingTranslationCounts();
    var langs = SUPPORTED_LANGS.filter(function(l){ return l.code !== 'en'; });
    var totalPending = langs.reduce(function(s,l){ return s + counts[l.code]; }, 0);
    if(totalPending === 0){
      return '<div class="bulk-assign-panel"><h4>Translate Pending</h4>'+
        '<p class="sub">Every photo already has a translation (or an English fallback isn\'t needed) in every language — nothing missing right now.</p>'+
        '<div class="bulk-panel-actions"><button class="admin-btn secondary" id="translatePendingCloseBtn">Close</button></div></div>';
    }
    return '<div class="bulk-assign-panel">'+
      '<h4>Translate Pending</h4>'+
      '<p class="sub">Fills a machine-translated draft for photos with no translation yet in a language — never overwrites one that already has a draft or a manual translation. Review each draft afterward from that photo\'s editor; drafts are clearly marked "AI DRAFT" there until you do.</p>'+
      '<div style="display:flex; flex-direction:column; gap:8px; margin:12px 0;">'+
      langs.map(function(l){
        return '<label class="admin-field row"><input type="checkbox" class="tp-lang-check" data-lang="'+l.code+'" '+(counts[l.code]>0?'checked':'disabled')+'> '+escapeHtml(l.name)+' — '+counts[l.code]+' missing</label>';
      }).join('')+
      '</div>'+
      '<div class="bulk-panel-actions">'+
        '<button class="admin-btn secondary" id="translatePendingCloseBtn">Cancel</button>'+
        '<button class="admin-btn" id="translatePendingStartBtn">Translate Selected</button>'+
      '</div>'+
    '</div>';
  }
  function wireTranslatePendingPanel(){
    var closeBtn = document.getElementById('translatePendingCloseBtn');
    if(closeBtn) closeBtn.addEventListener('click', function(){
      translatePendingPanelOpen = false;
      drawPhotosAdmin();
    });
    var startBtn = document.getElementById('translatePendingStartBtn');
    if(startBtn) startBtn.addEventListener('click', function(){
      var codes = Array.prototype.slice.call(document.querySelectorAll('.tp-lang-check:checked')).map(function(cb){ return cb.getAttribute('data-lang'); });
      if(!codes.length) return;
      startTranslateQueue(codes);
    });
  }
  function startTranslateQueue(langCodes){
    var items = [];
    adminPhotos.forEach(function(p){
      langCodes.forEach(function(lang){
        if(isTranslationMissing(p, lang)) items.push({ id:'tr-'+p.id+'-'+lang, photoId:p.id, photoTitle: p.title || 'Untitled', lang: lang, status:'waiting', error:null });
      });
    });
    translateQueue = items;
    translatePendingPanelOpen = false;
    drawPhotosAdmin();
    runWithConcurrency(items, TRANSLATE_CONCURRENCY, processTranslateItem);
  }
  async function processTranslateItem(item){
    item.status = 'translating';
    renderTranslatePanel();
    try{
      var photo = adminPhotos.find(function(p){ return p.id === item.photoId; });
      if(!photo) throw new Error('Photo no longer exists.');
      var result = await autoTranslate(photo.title, photo.story, item.lang);
      var translations = Object.assign({}, photo.translations || {});
      translations[item.lang] = { title: result.title, story: result.story, source: 'ai' };
      var res = await sb.from('photos').update({ translations: translations }).eq('id', photo.id);
      if(res.error) throw new Error(res.error.message);
      photo.translations = translations;
      item.status = 'done';
    } catch(err){
      item.status = 'error';
      item.error = err.message;
    }
    renderTranslatePanel();
    await sleep(250); // stay polite to MyMemory's free tier between requests
  }
  function renderTranslatePanel(){
    var panel = document.getElementById('translatePanel');
    if(!panel) return; // admin navigated away — the queue keeps running in the background regardless
    var doneCount = translateQueue.filter(function(i){ return i.status === 'done'; }).length;
    var errorCount = translateQueue.filter(function(i){ return i.status === 'error'; }).length;
    var allSettled = translateQueue.every(function(i){ return i.status === 'done' || i.status === 'error'; });
    var overallPct = translateQueue.length ? Math.round((doneCount + errorCount) / translateQueue.length * 100) : 0;
    var html = '<h4>Translate Pending — '+translateQueue.length+' item'+(translateQueue.length===1?'':'s')+'</h4>'+
      '<div class="bulk-summary"><span>'+doneCount+' / '+translateQueue.length+' completed'+(errorCount?' · '+errorCount+' failed':'')+'</span><span class="overall-pct">'+overallPct+'%</span></div>'+
      '<div class="bulk-summary-track"><div class="bulk-summary-fill" style="width:'+overallPct+'%;"></div></div>'+
      '<div class="bulk-list">'+
      translateQueue.map(function(item){
        var langMeta = SUPPORTED_LANGS.find(function(l){ return l.code === item.lang; });
        var label = item.status === 'done' ? 'Done' : item.status === 'error' ? 'Failed' : item.status === 'translating' ? 'Translating…' : 'Waiting';
        var fillClass = item.status === 'done' ? 'done' : item.status === 'error' ? 'error' : item.status === 'translating' ? 'indeterminate' : '';
        return '<div class="bulk-item">'+
          '<div class="bulk-item-row"><span class="bulk-item-name">'+escapeHtml(item.photoTitle)+' — '+escapeHtml(langMeta ? langMeta.name : item.lang)+'</span><span class="bulk-item-status '+item.status+'">'+label+'</span></div>'+
          '<div class="bulk-item-track"><div class="bulk-item-fill '+fillClass+'"></div></div>'+
          (item.status === 'error' ? '<div class="bulk-item-error">'+escapeHtml(item.error || 'Translation failed.')+'</div>' : '')+
        '</div>';
      }).join('')+
      '</div>'+
      '<div class="bulk-panel-actions">'+(allSettled ? '<button class="admin-btn secondary" id="translateDismissBtn">Dismiss</button>' : '<span class="sub">Translating — you can switch tabs, this keeps running.</span>')+'</div>';
    panel.innerHTML = html;
    var dismissBtn = document.getElementById('translateDismissBtn');
    if(dismissBtn) dismissBtn.addEventListener('click', function(){
      translateQueue = [];
      drawPhotosAdmin();
    });
  }

  /* ---------- Drag & drop / folder drop / clipboard paste ---------- */
  // One shared entry point for every way files can arrive — the file-
  // picker <input>, a drag-and-drop of files or a whole folder, and a
  // clipboard paste — so all of them land on the exact same Batch
  // Settings step (bulkSettingsPanelHtml) the picker always used, instead
  // of each input method growing its own parallel path.
  function beginBulkFilesSelected(files){
    var images = files.filter(function(f){ return f && f.type && f.type.indexOf('image/') === 0; });
    if(!images.length) return;
    loadCategories().then(function(){
      bulkPendingFiles = images;
      drawPhotosAdmin();
    });
  }
  // Recursively walks a dropped folder (Chrome/Edge/Safari support the
  // non-standard but widely-implemented webkitGetAsEntry() API this needs;
  // browsers without it just fall through to the plain file list a drop
  // event always provides, per the "where browser support allows it"
  // requirement — nothing breaks, folders just come through as whatever
  // individual files the browser handed over).
  function readAllEntries(reader){
    return new Promise(function(resolve){
      var all = [];
      function readBatch(){
        reader.readEntries(function(batch){
          if(!batch.length){ resolve(all); return; }
          all = all.concat(batch);
          readBatch(); // readEntries only returns a page at a time — keep going until empty
        }, function(){ resolve(all); });
      }
      readBatch();
    });
  }
  function filesFromEntry(entry){
    if(!entry) return Promise.resolve([]);
    if(entry.isFile){
      return new Promise(function(resolve){ entry.file(function(f){ resolve([f]); }, function(){ resolve([]); }); });
    }
    if(entry.isDirectory){
      var reader = entry.createReader();
      return readAllEntries(reader).then(function(entries){
        return Promise.all(entries.map(filesFromEntry)).then(function(lists){
          return lists.reduce(function(a,b){ return a.concat(b); }, []);
        });
      });
    }
    return Promise.resolve([]);
  }
  function filesFromDataTransfer(dataTransfer){
    var items = dataTransfer && dataTransfer.items;
    if(items && items.length && items[0].webkitGetAsEntry){
      var entries = Array.prototype.slice.call(items).map(function(it){ return it.webkitGetAsEntry && it.webkitGetAsEntry(); }).filter(Boolean);
      if(entries.length){
        return Promise.all(entries.map(filesFromEntry)).then(function(lists){ return lists.reduce(function(a,b){ return a.concat(b); }, []); });
      }
    }
    return Promise.resolve(dataTransfer && dataTransfer.files ? Array.prototype.slice.call(dataTransfer.files) : []);
  }
  function wireUploadDropzone(){
    var zone = document.getElementById('uploadDropzone');
    if(!zone) return;
    ['dragenter','dragover'].forEach(function(evt){
      zone.addEventListener(evt, function(e){ e.preventDefault(); zone.classList.add('drag-over'); });
    });
    ['dragleave','dragend'].forEach(function(evt){
      zone.addEventListener(evt, function(e){ e.preventDefault(); zone.classList.remove('drag-over'); });
    });
    zone.addEventListener('drop', function(e){
      e.preventDefault();
      zone.classList.remove('drag-over');
      filesFromDataTransfer(e.dataTransfer).then(beginBulkFilesSelected);
    });
  }
  // Clipboard paste — only acts while the plain Photos list/toolbar is
  // showing (not mid-edit, mid-review, or mid-Batch-Settings), so pasting
  // into a text field elsewhere in the admin (a title, a story, a tag)
  // never gets hijacked into starting an upload.
  document.addEventListener('paste', function(e){
    if(currentAdminTab !== 'photos') return;
    if(editingPhoto || bulkPendingFiles || reviewBatchIds) return;
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    var images = [];
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf('image/') === 0){
        var f = items[i].getAsFile();
        if(f) images.push(f);
      }
    }
    if(images.length) beginBulkFilesSelected(images);
  });

  /* ---------- Quick Review (post-bulk-upload) ---------- */
  // The fast path a batch lands on right after upload — see the
  // processBulkItem completion branch above. One card per photo, each with
  // its own tiny inline form (title/category/tags/location/date) that
  // saves as soon as a field changes, no per-photo Save button and no
  // detour through the full editor unless something needs EN/FR/AR text
  // or advanced settings (Full Editor → link on each card, via the shared
  // openFullEditor() above).
  function reviewGridHtml(){
    var batch = reviewBatchIds
      .map(function(id){ return adminPhotos.find(function(p){ return String(p.id) === String(id); }); })
      .filter(Boolean);
    var cards = batch.map(function(p){
      var tags = parseTags(p);
      var currentCatId = (photoCategoryMap[p.id] || [])[0] || '';
      var catOptionsHtml = '<option value="">No category</option>' + categories.map(function(c){
        return '<option value="'+c.id+'"'+(String(c.id)===String(currentCatId)?' selected':'')+'>'+escapeHtml(c.name)+'</option>';
      }).join('');
      return ''+
      '<div class="review-card" data-id="'+p.id+'">'+
        '<div class="review-thumb"><img '+adminThumbAttrs(p.image_url, 260)+' alt=""></div>'+
        '<div class="review-fields">'+
          '<input type="text" class="review-title" data-field="title" value="'+escapeHtml(p.title)+'" placeholder="Title">'+
          '<select class="review-category" data-field="category">'+catOptionsHtml+'</select>'+
          '<div class="review-tags">'+
            tags.map(function(t){ return '<span class="review-tag">'+escapeHtml(t)+'<button type="button" class="review-tag-remove" data-tag="'+escapeHtml(t)+'">\u00d7</button></span>'; }).join('')+
            '<input type="text" class="review-tag-input" placeholder="+ tag">'+
          '</div>'+
          '<input type="text" class="review-location" data-field="location" value="'+escapeHtml(p.location||'')+'" placeholder="Location">'+
          '<input type="date" class="review-date" data-field="date" value="'+escapeHtml(p.date||'')+'">'+
          '<div class="review-card-actions">'+
            '<span class="review-save-status"></span>'+
            '<button type="button" class="review-full-edit">Full Editor \u2192</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
    return ''+
    '<div class="review-header">'+
      '<div><h3>Review '+batch.length+' Uploaded Photo'+(batch.length===1?'':'s')+'</h3>'+
      '<p class="sub">Edits here save automatically. Use Full Editor on a card for EN/FR/AR text, alt text, or watermark settings.</p></div>'+
      '<button class="admin-btn" id="reviewDoneBtn">Done — Back to Photo List</button>'+
    '</div>'+
    '<div class="review-grid">'+cards+'</div>';
  }
  // Re-renders just one card's tag pills after an add/remove, instead of
  // redrawing the whole grid — keeps focus/scroll intact on every other
  // card the admin might be mid-edit on.
  function updateTagsUI(container, photo){
    var input = container.querySelector('.review-tag-input');
    container.querySelectorAll('.review-tag').forEach(function(el){ el.remove(); });
    parseTags(photo).forEach(function(t){
      var span = document.createElement('span');
      span.className = 'review-tag';
      span.textContent = t;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'review-tag-remove'; btn.textContent = '\u00d7'; btn.setAttribute('data-tag', t);
      span.appendChild(btn);
      container.insertBefore(span, input);
    });

  // Quick Review's Category field is a single-select convenience (unlike
  // the full editor's multi-category chips) — picking one here replaces
  // whatever categories the photo had with just that one. Fine for the
  // "catch the exceptions right after upload" use case this screen exists
  // for; anything needing multiple categories still goes through the full
  // editor's chip picker.
  async function quickSetCategory(photo, categoryId){
    var categoryName = '';
    if(categoryId){
      var match = categories.find(function(c){ return String(c.id) === String(categoryId); });
      categoryName = match ? match.name : '';
    }
    await sb.from('photo_categories').delete().eq('photo_id', photo.id);
    if(categoryId){
      var insertRes = await sb.from('photo_categories').insert({ photo_id: photo.id, category_id: categoryId });
      if(insertRes.error) throw new Error(insertRes.error.message);
    }
    var updateRes = await sb.from('photos').update({ category: categoryName }).eq('id', photo.id);
    if(updateRes.error) throw new Error(updateRes.error.message);
    photoCategoryMap[photo.id] = categoryId ? [categoryId] : [];
    photo.category = categoryName;
  }
  function wireReviewGrid(){
    var grid = document.querySelector('.review-grid');
    if(!grid) return;

    function flashStatus(card, msg, isError){
      var el = card.querySelector('.review-save-status');
      if(!el) return;
      el.textContent = msg;
      el.classList.toggle('error', !!isError);
      el.classList.add('show');
      clearTimeout(el._hideTimer);
      el._hideTimer = setTimeout(function(){ el.classList.remove('show'); }, 1600);
    }
    function photoForCard(card){
      return adminPhotos.find(function(p){ return String(p.id) === card.getAttribute('data-id'); });
    }

    // Delegated (not per-field) so nothing needs re-wiring after
    // updateTagsUI() rebuilds a card's tag pills.
    grid.addEventListener('change', async function(e){
      var card = e.target.closest('.review-card');
      if(!card) return;
      var photo = photoForCard(card);
      if(!photo) return;
      if(e.target.classList.contains('review-category')){
        try{ await quickSetCategory(photo, e.target.value || null); flashStatus(card, 'Saved'); }
        catch(err){ flashStatus(card, err.message, true); }
        return;
      }
      var field = e.target.getAttribute('data-field');
      if(!field) return;
      var value = e.target.value || (field === 'date' ? null : '');
      var payload = {}; payload[field] = value;
      try{
        var res = await sb.from('photos').update(payload).eq('id', photo.id);
        if(res.error) throw new Error(res.error.message);
        photo[field] = value;
        flashStatus(card, 'Saved');
      } catch(err){ flashStatus(card, err.message, true); }
    });

    grid.addEventListener('keydown', async function(e){
      if(!e.target.classList.contains('review-tag-input')) return;
      if(e.key !== 'Enter' && e.key !== ',') return;
      e.preventDefault();
      var raw = e.target.value.replace(/,$/, '').trim();
      if(!raw) return;
      var card = e.target.closest('.review-card');
      var photo = photoForCard(card);
      if(!photo) return;
      var tags = parseTags(photo);
      if(tags.indexOf(raw) === -1) tags.push(raw);
      var joined = tags.join(', ');
      e.target.value = '';
      try{
        var res = await sb.from('photos').update({ tags: joined }).eq('id', photo.id);
        if(res.error) throw new Error(res.error.message);
        photo.tags = joined;
        updateTagsUI(card.querySelector('.review-tags'), photo);
        flashStatus(card, 'Saved');
      } catch(err){ flashStatus(card, err.message, true); }
    });

    grid.addEventListener('click', async function(e){
      if(e.target.classList.contains('review-tag-remove')){
        var card = e.target.closest('.review-card');
        var photo = photoForCard(card);
        if(!photo) return;
        var tagToRemove = e.target.getAttribute('data-tag');
        var joined = parseTags(photo).filter(function(t){ return t !== tagToRemove; }).join(', ');
        try{
          var res = await sb.from('photos').update({ tags: joined }).eq('id', photo.id);
          if(res.error) throw new Error(res.error.message);
          photo.tags = joined;
          updateTagsUI(card.querySelector('.review-tags'), photo);
          flashStatus(card, 'Saved');
        } catch(err){ flashStatus(card, err.message, true); }
        return;
      }
      if(e.target.classList.contains('review-full-edit')){
        var card2 = e.target.closest('.review-card');
        var photo2 = photoForCard(card2);
        if(photo2) openFullEditor(photo2);
      }
    });

    var doneBtn = document.getElementById('reviewDoneBtn');
    if(doneBtn) doneBtn.addEventListener('click', function(){
      reviewBatchIds = null;
      renderPhotosAdmin();
    });
  }

    // Drag & drop is an alternative to the ↑/↓ buttons above, not a
    // replacement — both write to the same display_order column. The
    // handle is always available now, even mid-filter or mid-"Load more"
    // (see reorderFullList()), so dropping a row only has the dragged
    // photo's TWO nearest real neighbors in the full dataset to figure
    // out — everything else keeps its existing position untouched.
    var listEl = adminScroll.querySelector('.admin-list');
    if(listEl){
      makeListSortable(listEl, { handle: '.drag-handle', onReorder: async function(orderedIds, draggedId){
        var newFull = reorderFullList(orderedIds, draggedId);
        if(!newFull) return; // nothing actually moved

        // Only write rows whose position actually changed — a drag on a
        // long list should touch a handful of rows, not rewrite
        // display_order for the entire table every time.
        var writes = [];
        newFull.forEach(function(p, i){
          if((p.display_order||0) !== i){
            p.display_order = i;
            writes.push(sb.from('photos').update({ display_order: i }).eq('id', p.id));
          }
        });
        await Promise.all(writes);
        adminPhotos.sort(function(a,b){ return (a.display_order||0)-(b.display_order||0); });

        // No renderPhotosAdmin() here on purpose — that wipes and rebuilds
        // the whole list, which flashes and resets scroll position. The
        // rows dropped into place already sit in the right DOM order
        // (makeListSortable did that locally); we only need to refresh
        // the ↑/↓ disabled states, since those depend on global position.
        var kids = Array.prototype.slice.call(listEl.children).filter(function(el){ return el.hasAttribute('data-id'); });
        var globalOrder = adminPhotos.slice().sort(function(a,b){ return (a.display_order||0)-(b.display_order||0); });
        kids.forEach(function(row){
          var rid = row.getAttribute('data-id');
          var gIdx = globalOrder.findIndex(function(g){ return String(g.id) === rid; });
          var upBtn = row.querySelector('[data-act="up"]');
          var downBtn = row.querySelector('[data-act="down"]');
          if(upBtn) upBtn.disabled = (gIdx <= 0);
          if(downBtn) downBtn.disabled = (gIdx === globalOrder.length - 1);
        });
      }});
    }
  }

  // Figures out the new position for exactly the ONE photo that moved,
  // within the TRUE full adminPhotos order — not just among the rows
  // currently on screen. `.admin-list` can be showing a filtered and/or
  // paginated subset, so treating `orderedVisibleIds` as if it were the
  // whole dataset (like a naive "write index i for every id" approach
  // would) could silently scramble display_order for every photo NOT
  // currently visible. Instead: take the dragged photo (identified
  // explicitly by makeListSortable via `draggedId` — NOT guessed by
  // diffing the before/after order, which breaks for downward drags: the
  // first index where the two arrays differ is wherever a row shifted up
  // to fill the gap, not necessarily the row that was actually dragged)
  // and splice it directly next to its nearest visible neighbor's real
  // position in the full list — everyone else keeps their existing
  // relative order untouched.
  // Returns the new full ordering (array of photo objects), or null if
  // nothing actually moved.
  function reorderFullList(orderedVisibleIds, draggedId){
    var fullOrder = adminPhotos.slice().sort(function(a,b){ return (a.display_order||0)-(b.display_order||0); });
    if(draggedId == null) return null;

    var draggedPhoto = fullOrder.find(function(p){ return String(p.id) === String(draggedId); });
    if(!draggedPhoto) return null;
    fullOrder = fullOrder.filter(function(p){ return String(p.id) !== String(draggedId); });

    var newVisIdx = orderedVisibleIds.indexOf(draggedId);
    var prevNeighborId = newVisIdx > 0 ? orderedVisibleIds[newVisIdx-1] : null;
    var nextNeighborId = newVisIdx < orderedVisibleIds.length-1 ? orderedVisibleIds[newVisIdx+1] : null;
    var insertAt = 0;
    if(prevNeighborId != null){
      var pIdx = fullOrder.findIndex(function(p){ return String(p.id) === String(prevNeighborId); });
      insertAt = pIdx === -1 ? fullOrder.length : pIdx + 1;
    } else if(nextNeighborId != null){
      var nIdx = fullOrder.findIndex(function(p){ return String(p.id) === String(nextNeighborId); });
      insertAt = nIdx === -1 ? 0 : nIdx;
    }
    fullOrder.splice(insertAt, 0, draggedPhoto);
    return fullOrder;
  }

  function wireSelectionToolbar(){
    var toolbar = adminScroll.querySelector('.selection-toolbar');
    if(!toolbar) return;
    toolbar.querySelectorAll('button').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var action = btn.getAttribute('data-bulk');
        var ids = Array.from(selectedPhotoIds);
        if(action === 'clear'){ selectedPhotoIds.clear(); bulkAssignOpen = false; bulkEditFieldsOpen = false; drawPhotosAdmin(); return; }
        if(action === 'assign'){ bulkAssignOpen = true; bulkEditFieldsOpen = false; drawPhotosAdmin(); return; }
        if(action === 'editfields'){ bulkEditFieldsOpen = true; bulkAssignOpen = false; drawPhotosAdmin(); return; }
        if(action === 'publish' || action === 'unpublish'){
          btn.disabled = true;
          await sb.from('photos').update({ published: action === 'publish' }).in('id', ids);
          renderPhotosAdmin();
          return;
        }
        if(action === 'delete'){
          var photosSnapshot = adminPhotos.filter(function(p){ return ids.indexOf(String(p.id)) !== -1; });
          var label = ids.length === 1 ? 'Deleted 1 photo' : 'Deleted '+ids.length+' photos';
          bulkAssignOpen = false; bulkEditFieldsOpen = false;
          scheduleDelete(ids, photosSnapshot, label);
        }
      });
    });
  }

  function wireBulkEditFieldsPanel(){
    var panel = document.getElementById('bulkEditFieldsPanel');
    if(!panel) return;
    document.getElementById('bulkEditFieldsCancel').addEventListener('click', function(){
      bulkEditFieldsOpen = false;
      drawPhotosAdmin();
    });
    document.getElementById('bulkEditFieldsApply').addEventListener('click', async function(){
      var tagsInput = document.getElementById('bef-tags').value.trim();
      var tagsMode = (panel.querySelector('input[name="bef-tags-mode"]:checked') || {}).value || 'add';
      var location = document.getElementById('bef-location').value.trim();
      var date = document.getElementById('bef-date').value;
      if(!tagsInput && !location && !date){
        var err = document.getElementById('bulkEditFieldsError');
        err.textContent = 'Fill in at least one field to apply.'; err.style.display = 'block';
        return;
      }
      var btn = this;
      btn.disabled = true; btn.textContent = 'Applying…';
      var ids = Array.from(selectedPhotoIds);
      try{
        var newTags = tagsInput ? tagsInput.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];
        var ops = [];
        if(newTags.length){
          // Tags need a per-photo merge (to respect "add, don't overwrite"),
          // so these go one call per photo rather than a single .in(ids) —
          // location/date below are identical for every photo and can stay
          // as one batched update.
          ids.forEach(function(id){
            var photo = adminPhotos.find(function(p){ return String(p.id) === id; });
            var finalTags;
            if(tagsMode === 'replace'){
              finalTags = newTags;
            } else {
              var existing = photo ? parseTags(photo) : [];
              finalTags = existing.slice();
              newTags.forEach(function(t){ if(finalTags.indexOf(t) === -1) finalTags.push(t); });
            }
            var joined = finalTags.join(', ');
            ops.push(sb.from('photos').update({ tags: joined }).eq('id', id).then(function(res){
              if(res.error) throw new Error(res.error.message);
              if(photo) photo.tags = joined;
            }));
          });
        }
        if(location) ops.push(sb.from('photos').update({ location: location }).in('id', ids));
        if(date) ops.push(sb.from('photos').update({ date: date }).in('id', ids));
        await Promise.all(ops);
      } catch(e){
        btn.disabled = false; btn.textContent = 'Apply';
        var err2 = document.getElementById('bulkEditFieldsError');
        err2.textContent = e.message; err2.style.display = 'block';
        return;
      }
      selectedPhotoIds.clear();
      bulkEditFieldsOpen = false;
      renderPhotosAdmin();
    });
  }

  function wirePhotoForm(opts){
    opts = opts || {};
    var onCancel = opts.onCancel || function(){ editingPhoto = null; drawPhotosAdmin(); };
    var onSaved = opts.onSaved || function(){ renderPhotosAdmin(); };
    document.getElementById('photoCancelBtn').addEventListener('click', onCancel);
    // Only present when editing an existing photo opened via the on-site
    // homepage Edit pencil (see photoFormHtml) — the dashboard's own Photos
    // list already has its own Publish/Unpublish and Delete row actions, so
    // these aren't rendered there and this wiring is a no-op in that case.
    var unpublishBtn = document.getElementById('photoUnpublishBtn');
    if(unpublishBtn){
      unpublishBtn.addEventListener('click', async function(){
        var goingPublished = !editingPhoto.published;
        unpublishBtn.disabled = true;
        var res = await sb.from('photos').update({ published: goingPublished }).eq('id', editingPhoto.id);
        unpublishBtn.disabled = false;
        if(res.error){ showPhotoFormError(res.error.message); return; }
        editingPhoto.published = goingPublished;
        if(!goingPublished){
          // Must disappear from the public gallery immediately. Closing
          // through the same exact-photo return flow Save uses handles
          // this correctly on its own: the photo simply won't be in the
          // freshly-reloaded published set, so returnToPublicPhoto's
          // not-found branch lands on the ALL category instead of a dead
          // scene — never treated as a delete, the row stays in the DB.
          var idToClose = editingPhoto.id;
          editingPhoto = null;
          returnToPublicPhoto(idToClose);
        } else {
          // Re-published from here — stay in the form; keep its own
          // Published checkbox and this button's label in sync so a
          // subsequent Save doesn't stomp the change back to unpublished.
          unpublishBtn.textContent = 'Unpublish';
          var publishedCheckbox = document.getElementById('f-published');
          if(publishedCheckbox) publishedCheckbox.checked = true;
        }
      });
    }
    var deleteBtn = document.getElementById('photoDeleteBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', async function(){
        var confirmed = window.confirm('Delete this photograph permanently?\nThis action cannot be undone.');
        if(!confirmed) return;
        var idToDelete = editingPhoto.id;
        var urlToDelete = editingPhoto.image_url;
        deleteBtn.disabled = true;
        // A real, immediate delete (not the dashboard list's undo-window
        // delete) — the confirmation step above IS this entry point's
        // undo-equivalent (cancel keeps the photo), and returnToPublicPhoto
        // right after needs the DB to already reflect the deletion so it
        // doesn't try to land back on a photo that's supposed to be gone.
        var res = await sb.from('photos').delete().eq('id', idToDelete);
        if(res.error){
          deleteBtn.disabled = false;
          showPhotoFormError(res.error.message);
          return;
        }
        removeStorageFilesForUrls([urlToDelete]); // don't await — DB delete above is what matters for the UI to proceed on
        // photo_categories rows for this photo are cleaned up automatically
        // (on delete cascade — see the SQL near the top of this file), same
        // as every other delete path in this admin.
        adminPhotos = adminPhotos.filter(function(p){ return String(p.id) !== String(idToDelete); });
        selectedPhotoIds.delete(String(idToDelete));
        editingPhoto = null;
        returnToPublicPhoto(idToDelete);
      });
    }
    document.getElementById('f-wm-override').addEventListener('change', function(){
      document.getElementById('wmOverrideFields').style.display = this.checked ? 'grid' : 'none';
    });
    document.querySelectorAll('.cat-chip-input').forEach(function(inp){
      inp.addEventListener('change', function(){
        inp.closest('.cat-chip').classList.toggle('checked', inp.checked);
      });
    });
    // Item 13: distinguishing AI-generated from manually-edited
    // translations. Seeded from whatever was already saved for this
    // photo, a language moves from the "ai" set to manually-edited the
    // moment the admin types into its field — including editing text
    // Auto-translate just filled in, which is exactly the point (a
    // reviewed-and-touched AI draft becomes a manual translation from
    // then on). This set is what Save (below) writes as each language's
    // `source`, and it's the same flag Translate Pending relies on to
    // never treat an already-answered language as still missing.
    var aiFilledLangs = {};
    SUPPORTED_LANGS.forEach(function(l){
      if(l.code === 'en') return;
      var existing = editingPhoto.translations && editingPhoto.translations[l.code];
      if(existing && existing.source === 'ai') aiFilledLangs[l.code] = true;
    });
    document.querySelectorAll('.f-tr-title, .f-tr-story').forEach(function(fld){
      fld.addEventListener('input', function(){ delete aiFilledLangs[fld.getAttribute('data-lang')]; });
    });
    // Live machine translation via MyMemory (see autoTranslate() above) —
    // free, no setup required. Purely a drafting aid: it fills the fields
    // below, you still review/edit them, and Save is what actually
    // persists anything.
    document.querySelectorAll('.auto-tr-btn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var lang = btn.getAttribute('data-lang');
        var statusEl = document.querySelector('.auto-tr-status[data-lang="'+lang+'"]');
        var titleEl = document.querySelector('.f-tr-title[data-lang="'+lang+'"]');
        var storyEl = document.querySelector('.f-tr-story[data-lang="'+lang+'"]');
        var sourceTitle = document.getElementById('f-title').value;
        var sourceStory = document.getElementById('f-story').value;
        if(!sourceTitle && !sourceStory){
          statusEl.textContent = 'Write the English title/story first.';
          statusEl.style.display = 'block';
          return;
        }
        btn.disabled = true; btn.textContent = 'Translating…';
        statusEl.style.display = 'none';
        try{
          var result = await autoTranslate(sourceTitle, sourceStory, lang);
          titleEl.value = result.title;
          storyEl.value = result.story;
          aiFilledLangs[lang] = true;
          statusEl.textContent = 'Draft filled in — review before saving.';
          statusEl.style.display = 'block';
        } catch(err){
          statusEl.textContent = err.message;
          statusEl.style.display = 'block';
        } finally {
          btn.disabled = false; btn.textContent = 'Auto-translate';
        }
      });
    });
    document.getElementById('photoFile').addEventListener('change', async function(e){
      var file = e.target.files[0];
      if(!file) return;
      var progressUi = wireUploadProgress('photoUpload');
      progressUi.show();
      try{
        // Read the override fields as they stand right now — the
        // watermark is burned in during THIS upload, not at save time,
        // so if you want a custom position/offset for this photo, check
        // "Custom position for this photo" and set it BEFORE choosing
        // the file (or just re-choose the file afterwards to re-bake it).
        var wmOverride = {
          watermark_override: document.getElementById('f-wm-override').checked,
          watermark_position: document.getElementById('f-wm-position').value,
          watermark_x_offset: parseInt(document.getElementById('f-wm-x').value,10) || 0,
          watermark_y_offset: parseInt(document.getElementById('f-wm-y').value,10) || 0,
          watermark_scale: (parseInt(document.getElementById('f-wm-scale').value,10) || 100) / 100
        };
        var res = await uploadFile(file, wmOverride, false, progressUi.onProgress);
        var oldUrl = editingPhoto.image_url;
        editingPhoto.image_url = res.url;
        editingPhoto.image_width = res.width;
        editingPhoto.image_height = res.height;
        if(oldUrl && oldUrl !== res.url) removeStorageFilesForUrls([oldUrl]); // the just-replaced file would otherwise sit in storage forever, unreferenced
        var preview = document.getElementById('photoPreview');
        preview.src = res.url;
        preview.style.display = 'block';
        var ratioBadge = document.getElementById('photoRatioBadge');
        var ratioName = getAspectRatioName(res.width, res.height);
        if(ratioName){ ratioBadge.textContent = ratioName; ratioBadge.style.display = 'inline-block'; }
        else { ratioBadge.style.display = 'none'; }
        renderOptimizeResult(res);
      } catch(err){
        showPhotoFormError(err.message);
      } finally {
        progressUi.hide();
      }
    });
    document.getElementById('photoSaveBtn').addEventListener('click', async function(){
      var selectedCatIds = Array.prototype.slice.call(document.querySelectorAll('.cat-chip-input:checked')).map(function(el){ return el.value; });
      var translations = {};
      SUPPORTED_LANGS.forEach(function(l){
        if(l.code === 'en') return;
        var titleEl = document.querySelector('.f-tr-title[data-lang="'+l.code+'"]');
        var storyEl = document.querySelector('.f-tr-story[data-lang="'+l.code+'"]');
        var title = titleEl ? titleEl.value.trim() : '';
        var story = storyEl ? storyEl.value.trim() : '';
        if(title || story) translations[l.code] = { title: title, story: story, source: aiFilledLangs[l.code] ? 'ai' : 'manual' };
      });
      var payload = {
        title: document.getElementById('f-title').value || 'Untitled',
        story: document.getElementById('f-story').value,
        translations: translations,
        category: categoryLabelFromIds(selectedCatIds),
        location: document.getElementById('f-location').value,
        tags: document.getElementById('f-tags').value,
        date: document.getElementById('f-date').value || null,
        alt_text: document.getElementById('f-alt').value,
        published: document.getElementById('f-published').checked,
        featured: document.getElementById('f-featured').checked,
        is_favorite: document.getElementById('f-favorite').checked,
        image_url: editingPhoto.image_url,
        image_width: editingPhoto.image_width || null,
        image_height: editingPhoto.image_height || null,
        watermark_override: document.getElementById('f-wm-override').checked,
        watermark_position: document.getElementById('f-wm-override').checked ? document.getElementById('f-wm-position').value : null,
        watermark_x_offset: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-x').value,10)||0) : null,
        watermark_y_offset: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-y').value,10)||0) : null,
        watermark_scale: document.getElementById('f-wm-override').checked ? (parseInt(document.getElementById('f-wm-scale').value,10)||100)/100 : null
      };
      if(!payload.image_url){ showPhotoFormError('Please upload a photo first.'); return; }
      var saveBtn = document.getElementById('photoSaveBtn');
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      var result;
      if(editingPhoto.id){
        result = await sb.from('photos').update(payload).eq('id', editingPhoto.id).select().single();
      } else {
        var maxOrder = adminPhotos.reduce(function(m,p){ return Math.max(m, p.display_order||0); }, -1);
        payload.display_order = maxOrder + 1;
        result = await sb.from('photos').insert(payload).select().single();
      }
      if(result.error){
        saveBtn.disabled = false; saveBtn.textContent = 'Save';
        showPhotoFormError(result.error.message);
        return;
      }
      var savedId = (result.data && result.data.id) || editingPhoto.id;
      // Sync the many-to-many category assignment: clear, then re-insert
      // whatever's currently checked. Never touches the categories or
      // photos themselves.
      try{
        await sb.from('photo_categories').delete().eq('photo_id', savedId);
        if(selectedCatIds.length){
          await sb.from('photo_categories').insert(selectedCatIds.map(function(cid){ return { photo_id: savedId, category_id: cid }; }));
        }
      } catch(e){ /* photo_categories table not created yet — see SQL note above */ }
      saveBtn.disabled = false; saveBtn.textContent = 'Save';
      var wasNewPhoto = !editingPhoto.id;
      editingPhoto = null;
      onSaved(Object.assign({}, payload, { id: savedId, category_ids: selectedCatIds }), wasNewPhoto);
    });
  }

  function showPhotoFormError(msg){
    var el = document.getElementById('photoFormError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  /* ---------- Categories tab ---------- */
  var adminCategories = [];
  var editingCategory = null;
  var assigningCategory = null;   // { id, name, system? } while the bulk photo-picker is open
  var assignSelectedIds = null;   // Set of photo ids currently checked in the picker
  var assignSearchTerm = '';

  async function loadAdminCategories(){
    var res = await sb.from('categories').select('*').order('sort_order', { ascending:true });
    adminCategories = res.data || [];
  }

  async function renderCategoriesAdmin(){
    renderAdminStats();
    adminScroll.innerHTML = '<p class="admin-empty">Loading…</p>';
    await Promise.all([loadAdminCategories(), loadPhotoCategories(), loadAdminPhotos(), loadSettings()]);
    drawCategoriesAdmin();
  }

  function blankCategory(){ return { name:'', is_visible:true }; }

  // One canonical category system: `categories` + the `photo_categories`
  // junction table are the only place a category is ever created or
  // assigned (see photoFormHtml's single "Category" chip picker and
  // categoryFormHtml's controlled name field — nothing free-text). The one
  // gap that can still exist is DATA, not a code path: a photo whose
  // legacy free-text `category` column was set before the junction table
  // existed, and that was never linked up — that's real categorization
  // information sitting somewhere the rest of the app doesn't look
  // anymore. This finds exactly that (and only that: a photo that already
  // has real photo_categories rows is skipped, since its `category` text
  // is just the derived display label at that point, not an independent
  // value — see categoryLabelFromIds) so it can be imported as real
  // categories instead of silently ignored.
  function findOrphanCategoryNames(){
    var known = {};
    adminCategories.forEach(function(c){ known[c.name.trim().toLowerCase()] = true; });
    var orphans = {};
    adminPhotos.forEach(function(p){
      if(!p.category || (photoCategoryMap[p.id] || []).length) return;
      String(p.category).split(',').map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(name){
        var key = name.toLowerCase();
        if(known[key]) return;
        if(!orphans[key]) orphans[key] = { name: name, photoIds: [] };
        orphans[key].photoIds.push(p.id);
      });
    });
    return orphans;
  }
  async function importLegacyCategories(orphans){
    var names = Object.keys(orphans);
    var maxOrder = adminCategories.reduce(function(m,c){ return Math.max(m, c.sort_order||0); }, -1);
    for(var i=0;i<names.length;i++){
      var entry = orphans[names[i]];
      maxOrder++;
      var res = await sb.from('categories').insert({ name: entry.name, slug: slugify(entry.name), is_visible:true, sort_order: maxOrder }).select().single();
      if(res.error) throw new Error(res.error.message);
      var rows = entry.photoIds.map(function(pid){ return { photo_id: pid, category_id: res.data.id }; });
      if(rows.length){
        var linkRes = await sb.from('photo_categories').insert(rows);
        if(linkRes.error) throw new Error(linkRes.error.message);
      }
    }
  }

  // Counts against adminPhotos (published + unpublished) rather than the
  // public `photos` list — a category with only unpublished photos in it
  // used to silently count as 0 here.
  function categoryPhotoCount(catId){
    return adminPhotos.filter(function(p){ return (photoCategoryMap[p.id] || []).indexOf(catId) !== -1; }).length;
  }

  function favoritePhotoCount(){
    return adminPhotos.filter(function(p){ return p.is_favorite; }).length;
  }

  function drawCategoriesAdmin(){
    if(assigningCategory){ drawCategoryAssign(); return; }

    var html = '';
    if(editingCategory){
      html += categoryFormHtml(editingCategory);
    } else {
      html += '<div class="admin-toolbar"><button class="admin-btn" id="addCategoryBtn">+ New Category</button>'+
        (adminCategories.length ? '<button class="admin-btn secondary" id="hideAllCatBtn">Hide All</button><button class="admin-btn secondary" id="showAllCatBtn">Show All</button>' : '')+
      '</div>';
      var orphans = findOrphanCategoryNames();
      var orphanNames = Object.keys(orphans);
      if(orphanNames.length){
        html += '<div class="bulk-panel" id="legacyCatPanel">'+
          '<h4>'+orphanNames.length+' legacy category name'+(orphanNames.length===1?'':'s')+' found on photos</h4>'+
          '<p class="sub">These photos have a category label ('+orphanNames.map(function(k){ return '"'+escapeHtml(orphans[k].name)+'"'; }).join(', ')+') that isn\'t in your category list — likely from before categories were controlled. Import them as real categories so nothing gets lost.</p>'+
          '<div class="admin-form-actions"><button class="admin-btn" id="importLegacyCatBtn">Import as Categories</button></div>'+
        '</div>';
      }
    }

    if(!editingCategory){
      html += '<div class="admin-list">';
      html += ''+
        '<div class="admin-row cat-row" data-id="favorite">'+
          '<div class="col-title"><strong>★ Favorite</strong><span class="sub">'+favoritePhotoCount()+(favoritePhotoCount()===1?' photograph':' photographs')+' — set per-photo, not a category row</span></div>'+
          '<span class="status on">SYSTEM</span>'+
          '<div class="admin-row-actions"><button data-act="assign">Assign Photos</button></div>'+
        '</div>'+
        '<div class="admin-row cat-row" data-id="all-pseudo">'+
          '<div class="col-title"><strong>All</strong><span class="sub">'+galleryPhotos().length+(galleryPhotos().length===1?' photograph':' photographs')+' — every published photo, automatically</span></div>'+
          '<span class="status '+(settings.hide_all_category?'off':'on')+'">'+(settings.hide_all_category?'HIDDEN':'SYSTEM')+'</span>'+
          '<div class="admin-row-actions"><button data-act="toggle-all-pseudo">'+(settings.hide_all_category?'Show':'Hide')+'</button></div>'+
        '</div>';
      adminCategories.forEach(function(c, i){
        var count = categoryPhotoCount(c.id);
        html += ''+
        '<div class="admin-row cat-row" data-id="'+c.id+'">'+
          '<div class="col-title"><strong>'+escapeHtml(c.name)+'</strong><span class="sub">'+count+(count===1?' photograph':' photographs')+'</span></div>'+
          '<span class="status '+(c.is_visible?'on':'off')+'">'+(c.is_visible?'ACTIVE':'HIDDEN')+'</span>'+
          '<div class="admin-row-actions">'+
            '<button data-act="assign">Assign Photos</button>'+
            '<button data-act="up" '+(i===0?'disabled':'')+'>↑</button>'+
            '<button data-act="down" '+(i===adminCategories.length-1?'disabled':'')+'>↓</button>'+
            '<button data-act="toggle">'+(c.is_visible?'Hide':'Show')+'</button>'+
            '<button data-act="edit">Rename</button>'+
            '<button data-act="delete">Delete</button>'+
          '</div>'+
        '</div>';
      });
      html += '</div>';
      if(adminCategories.length === 0) html += '<p class="admin-empty">No categories yet — create your first one above.</p>';
    }

    adminScroll.innerHTML = html;

    var addBtn = document.getElementById('addCategoryBtn');
    if(addBtn) addBtn.addEventListener('click', function(){ editingCategory = blankCategory(); drawCategoriesAdmin(); });
    // Bulk on/off switch for every real category at once (Favorite is a
    // system row, not a category, so it's excluded — its own visibility
    // isn't a thing, it's just whichever photos are marked favorite).
    // Same is_visible field, same per-row update the single Hide/Show
    // button already uses below — this just fires it for every row in
    // one go instead of one at a time. The public nav (navCategoryList())
    // and photo-category resolution (categoryForPhoto()) already skip
    // anything with is_visible === false, so toggling this instantly
    // removes/restores every category from the visible site — no photos
    // are touched or unpublished, only their category visibility.
    var hideAllBtn = document.getElementById('hideAllCatBtn');
    if(hideAllBtn) hideAllBtn.addEventListener('click', async function(){
      if(!confirm('Hide all '+adminCategories.length+' categories from the website? Photos stay published — only the category nav and pages disappear. You can bring them all back with "Show All" any time.')) return;
      hideAllBtn.disabled = true; hideAllBtn.textContent = 'Hiding…';
      try{
        await Promise.all(adminCategories.map(function(c){ return sb.from('categories').update({ is_visible:false }).eq('id', c.id); }));
        await renderCategoriesAdmin();
      } catch(err){
        hideAllBtn.disabled = false; hideAllBtn.textContent = 'Hide All';
        alert(err.message);
      }
    });
    var showAllBtn = document.getElementById('showAllCatBtn');
    if(showAllBtn) showAllBtn.addEventListener('click', async function(){
      showAllBtn.disabled = true; showAllBtn.textContent = 'Showing…';
      try{
        await Promise.all(adminCategories.map(function(c){ return sb.from('categories').update({ is_visible:true }).eq('id', c.id); }));
        await renderCategoriesAdmin();
      } catch(err){
        showAllBtn.disabled = false; showAllBtn.textContent = 'Show All';
        alert(err.message);
      }
    });
    if(editingCategory) wireCategoryForm();
    var importBtn = document.getElementById('importLegacyCatBtn');
    if(importBtn) importBtn.addEventListener('click', async function(){
      importBtn.disabled = true; importBtn.textContent = 'Importing…';
      try{
        await importLegacyCategories(findOrphanCategoryNames());
        renderCategoriesAdmin();
      } catch(err){
        importBtn.disabled = false; importBtn.textContent = 'Import as Categories';
        alert(err.message);
      }
    });

    adminScroll.querySelectorAll('.admin-row[data-id]').forEach(function(row){
      var id = row.getAttribute('data-id');
      if(id === 'all-pseudo'){
        var toggleAllBtn = row.querySelector('button[data-act="toggle-all-pseudo"]');
        if(toggleAllBtn) toggleAllBtn.addEventListener('click', async function(){
          var next = !settings.hide_all_category;
          toggleAllBtn.disabled = true; toggleAllBtn.textContent = next ? 'Hiding…' : 'Showing…';
          try{
            var payload = { id:1, hide_all_category: next, updated_at: new Date().toISOString() };
            var result = await sb.from('site_settings').upsert(payload);
            if(result.error) throw new Error(result.error.message);
            settings.hide_all_category = next;
            drawCategoriesAdmin();
          } catch(err){
            toggleAllBtn.disabled = false; toggleAllBtn.textContent = next ? 'Hide' : 'Show';
            alert(err.message);
          }
        });
        return;
      }
      var isFavoriteRow = id === 'favorite';
      var cat = isFavoriteRow ? { id:'favorite', name:'Favorite', system:true } : adminCategories.find(function(c){ return String(c.id) === id; });
      row.querySelectorAll('button').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var act = btn.getAttribute('data-act');
          if(act === 'assign'){
            btn.disabled = true; btn.textContent = 'Loading…';
            await loadAdminPhotos();
            openCategoryAssign(cat);
            return;
          }
          if(isFavoriteRow) return; // Favorite only has the assign action
          if(act === 'edit'){ editingCategory = Object.assign({}, cat); drawCategoriesAdmin(); return; }
          if(act === 'toggle'){
            await sb.from('categories').update({ is_visible: !cat.is_visible }).eq('id', id);
            renderCategoriesAdmin();
            return;
          }
          if(act === 'delete'){
            var count = categoryPhotoCount(cat.id);
            var msg = count > 0
              ? ('Delete "'+cat.name+'"? '+count+' photograph(s) will be removed from this category — the photographs themselves are never deleted.')
              : ('Delete "'+cat.name+'"?');
            if(!confirm(msg)) return;
            await sb.from('photo_categories').delete().eq('category_id', id);
            await sb.from('categories').delete().eq('id', id);
            renderCategoriesAdmin();
            return;
          }
          if(act === 'up' || act === 'down'){
            var idx = adminCategories.findIndex(function(c){ return String(c.id) === id; });
            var swapIdx = act === 'up' ? idx - 1 : idx + 1;
            if(swapIdx < 0 || swapIdx >= adminCategories.length) return;
            var other = adminCategories[swapIdx];
            await Promise.all([
              sb.from('categories').update({ sort_order: other.sort_order }).eq('id', cat.id),
              sb.from('categories').update({ sort_order: cat.sort_order }).eq('id', other.id)
            ]);
            renderCategoriesAdmin();
          }
        });
      });
    });
  }

  /* ---------- Category bulk photo-assign picker ---------- */
  // Solves the "hundreds of photos, one by one" problem: pick a category
  // (or Favorite) from the list above, and this shows every photo —
  // published and unpublished alike — as a checkable thumbnail grid so
  // dozens/hundreds can be assigned to it in a single save.

  function openCategoryAssign(cat){
    assigningCategory = cat;
    assignSearchTerm = '';
    assignSelectedIds = new Set(
      cat.system
        ? adminPhotos.filter(function(p){ return p.is_favorite; }).map(function(p){ return p.id; })
        : adminPhotos.filter(function(p){ return (photoCategoryMap[p.id] || []).indexOf(cat.id) !== -1; }).map(function(p){ return p.id; })
    );
    drawCategoriesAdmin();
  }

  function closeCategoryAssign(){
    assigningCategory = null;
    assignSelectedIds = null;
    renderCategoriesAdmin();
  }

  function drawCategoryAssign(){
    var term = assignSearchTerm.trim().toLowerCase();
    var list = !term ? adminPhotos : adminPhotos.filter(function(p){
      return (p.title || '').toLowerCase().indexOf(term) !== -1;
    });

    var html = ''+
      '<div class="assign-toolbar">'+
        '<button class="admin-btn secondary" id="assignBackBtn">← Back to Categories</button>'+
        '<h3>'+escapeHtml(assigningCategory.name)+' — Assign Photos</h3>'+
      '</div>'+
      '<div class="assign-controls">'+
        '<input type="text" id="assignSearch" placeholder="Search by title…" value="'+escapeHtml(assignSearchTerm)+'">'+
        '<span class="sub" id="assignCount">'+assignSelectedIds.size+' selected</span>'+
        '<button class="admin-btn secondary" id="assignSelectAllBtn">Select all shown ('+list.length+')</button>'+
        '<button class="admin-btn secondary" id="assignClearBtn">Clear selection</button>'+
      '</div>';

    if(list.length === 0){
      html += '<p class="admin-empty">No photos match "'+escapeHtml(assignSearchTerm)+'".</p>';
    } else {
      html += '<div class="assign-grid">' + list.map(function(p){
        var checked = assignSelectedIds.has(p.id);
        return ''+
          '<label class="assign-thumb'+(checked?' checked':'')+'" data-id="'+p.id+'">'+
            '<input type="checkbox" '+(checked?'checked':'')+'>'+
            '<img '+adminThumbAttrs(p.image_url, 160)+' loading="lazy" alt="">'+
            '<span class="assign-thumb-status '+(p.published?'on':'off')+'">'+(p.published?'Published':'Hidden')+'</span>'+
            '<span class="assign-thumb-title">'+escapeHtml(p.title||'Untitled')+'</span>'+
          '</label>';
      }).join('') + '</div>';
    }

    html += ''+
      '<div class="admin-form-actions">'+
        '<button class="admin-btn secondary" id="assignCancelBtn">Cancel</button>'+
        '<button class="admin-btn" id="assignSaveBtn">Save Assignments</button>'+
      '</div>';

    adminScroll.innerHTML = html;
    wireCategoryAssign(list);
  }

  function wireCategoryAssign(list){
    document.getElementById('assignBackBtn').addEventListener('click', closeCategoryAssign);
    document.getElementById('assignCancelBtn').addEventListener('click', closeCategoryAssign);

    var searchInput = document.getElementById('assignSearch');
    searchInput.addEventListener('input', function(){
      assignSearchTerm = this.value;
      drawCategoryAssign();
      document.getElementById('assignSearch').focus();
      var v = document.getElementById('assignSearch').value;
      document.getElementById('assignSearch').setSelectionRange(v.length, v.length);
    });

    document.getElementById('assignSelectAllBtn').addEventListener('click', function(){
      list.forEach(function(p){ assignSelectedIds.add(p.id); });
      drawCategoryAssign();
    });
    document.getElementById('assignClearBtn').addEventListener('click', function(){
      assignSelectedIds.clear();
      drawCategoryAssign();
    });

    adminScroll.querySelectorAll('.assign-thumb').forEach(function(el){
      var input = el.querySelector('input');
      function toggle(nextChecked){
        var id = el.getAttribute('data-id');
        if(nextChecked) assignSelectedIds.add(id); else assignSelectedIds.delete(id);
        el.classList.toggle('checked', nextChecked);
        input.checked = nextChecked;
        document.getElementById('assignCount').textContent = assignSelectedIds.size + ' selected';
      }
      el.addEventListener('click', function(e){
        e.preventDefault();
        toggle(!input.checked);
      });
    });

    document.getElementById('assignSaveBtn').addEventListener('click', async function(){
      var btn = this;
      btn.disabled = true; btn.textContent = 'Saving…';
      var ids = Array.from(assignSelectedIds);
      try{
        if(assigningCategory.system){
          var prevIds = adminPhotos.filter(function(p){ return p.is_favorite; }).map(function(p){ return p.id; });
