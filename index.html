<style>
  :root{
    --ink:#050505;
    --white:#f6f4ef;
    --dim:rgba(246,244,239,0.58);
    --dim-2:rgba(246,244,239,0.36);
    --line:rgba(246,244,239,0.16);

    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --safe-l:env(safe-area-inset-left, 0px);
    --safe-r:env(safe-area-inset-right, 0px);
    --dur-1:560ms;
    --ease:cubic-bezier(.19,1,.22,1);
    --font-display:'Newsreader', serif;
    --font-body:'Inter', sans-serif;
    --size-title: clamp(2.5rem, 5vw, 6rem);
    --size-desc:  clamp(0.95rem, 1.2vw, 1.25rem);
    --size-nav:   0.88rem;
    --size-meta:  0.75rem;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink); color:var(--white);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    overflow:hidden; /* .scroller (now holding hero + every scene) is the only thing that ever scrolls */
    /* Page-wide default: allow panning/scrolling and normal tap-to-click,
       but tell the browser's own gesture recognizer this page is never
       pinch- or double-tap-zoomable. More specific elements below keep
       their own touch-action (.hero-mark:none, .frame-img:manipulation,
       admin drag handles:none) — this only sets the default for
       everything else, including the expanded story's own vertical
       scroll (see .caption.expanded), which just needs this page-wide
       manipulation default, not an override. */
    touch-action:manipulation;
  }
  ::selection{ background:var(--white); color:var(--ink); }
  a{ color:inherit; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .meta{ font-family:var(--font-body); font-weight:500; letter-spacing:.18em; text-transform:uppercase; font-size:var(--size-meta); color:var(--dim-2); }

  .grain{
    position:fixed; inset:0; pointer-events:none; z-index:60; opacity:.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  .vignette{ position:fixed; inset:0; z-index:55; pointer-events:none; background:radial-gradient(130% 100% at 50% 100%, transparent 40%, rgba(0,0,0,.5) 100%); }

  /* Desktop scroll-nav: a pair of up/down arrow buttons for mouse/trackpad
     users, since wheel-driven scene advance (see setupWheelAdvance) can feel
     imprecise without a native scrollbar to grab. Hidden entirely on touch
     devices — .scroller's native momentum + scroll-snap already handles
     that case well, and the buttons would just be dead weight there.
     Gated on both a min-width AND (pointer:fine) so a wide touch tablet
     doesn't get controls it can't use as precisely as a mouse. */
  .scroll-nav{ display:none; }
  @media (min-width: 860px) and (pointer:fine){
    .scroll-nav{
      display:flex; flex-direction:column; gap:10px;
      position:fixed; z-index:50; right:calc(32px + var(--safe-r)); top:50%; transform:translateY(-50%);
      opacity:0; transition:opacity 700ms var(--ease);
    }
    .scroll-nav.show{ opacity:1; }
    .scroll-nav button{
      width:44px; height:44px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      border:1px solid var(--line); background:rgba(5,5,5,.42);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      color:var(--white); transition:border-color 260ms var(--ease), background 260ms var(--ease), transform 160ms var(--ease), opacity 260ms var(--ease);
    }
    .scroll-nav button svg{ width:15px; height:15px; stroke:currentColor; transition:transform 220ms var(--ease); }
    .scroll-nav button:hover:not(:disabled){ border-color:var(--white); background:rgba(5,5,5,.62); }
    .scroll-nav button:hover:not(:disabled) svg{ transform:translateY(-2px); }
    .scroll-nav .scroll-down:hover:not(:disabled) svg{ transform:translateY(2px); }
    .scroll-nav button:active:not(:disabled){ transform:scale(.92); }
    .scroll-nav button:disabled{ opacity:.28; cursor:default; }
  }

  /* Category navigation — a single-line, horizontally swipeable bar
     (TikTok/Instagram-style category browsing). Hidden on the hero (shown
     via the same "show" trigger the scroll-nav arrows use) and never wraps
     to a second line — it scrolls horizontally instead, with the
     scrollbar hidden but the scroll behavior preserved for touch/trackpad. */
  .cat-nav{
    position:fixed; z-index:50; left:0; right:0; top:calc(24px + var(--safe-t));
    display:flex; gap:26px; overflow-x:auto; overflow-y:hidden;
    padding:0 calc(22px + var(--safe-l)) 6px calc(22px + var(--safe-l));
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
    opacity:0; transition:opacity 700ms var(--ease); white-space:nowrap;
  }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-nav.show{ opacity:1; }
  .cat-nav.empty{ display:none; }
  .cat-btn{
    flex:0 0 auto; font-family:var(--font-body); font-weight:500; font-size:.72rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--dim-2); cursor:pointer;
    padding:8px 1px; border-bottom:1px solid transparent;
    transition:color 260ms var(--ease), border-color 260ms var(--ease);
  }
  .cat-btn:hover{ color:var(--dim); }
  .cat-btn.active{ color:var(--white); border-color:var(--white); }
  /* The active tab is also a quiet "jump to the top of this section"
     button (see the click handler) — kept deliberately understated
     rather than turned into a distinct, larger control: same size and
     position as any other tab, just a hint on hover/press that there's
     still something to click even though it's already selected. */
  .cat-btn.active:hover{ color:var(--white); opacity:.7; }
  .cat-btn.active:active{ opacity:.5; }
  .cat-btn:focus-visible{ outline:1px solid var(--white); outline-offset:3px; }
  @media (min-width:860px){
    .cat-nav{ justify-content:center; }
  }

  /* Language switcher for per-photo story translations (see tText() and
     SUPPORTED_LANGS in the JS). Bottom-left is the one fixed-position
     corner nothing else claims: .cat-nav owns the top, .scroll-nav the
     right-middle (desktop only), .toast bottom-center. Text-shadow gives
     it the same over-any-photo legibility as the watermark, without
     needing each scene's .scrim to account for it. */
  .lang-switch{
    position:fixed; z-index:52; left:calc(22px + var(--safe-l)); bottom:calc(20px + var(--safe-b));
    display:flex; align-items:center; gap:9px;
    font-family:var(--font-body); font-weight:500; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,.7);
    opacity:0; pointer-events:none; transition:opacity 400ms var(--ease);
  }
  .lang-switch.show{ opacity:1; pointer-events:auto; }
  .lang-switch button{ color:var(--dim-2); padding:2px 0; border-bottom:1px solid transparent; transition:color 220ms var(--ease), border-color 220ms var(--ease); }
  .lang-switch button:hover{ color:var(--white); }
  .lang-switch button.active{ color:var(--white); border-color:var(--white); }
  .lang-divider{ color:var(--dim-2); opacity:.5; }

  /* The block below is vertically centered, but not within the full
     viewport — .hero reserves real weight at the bottom for the pinned
     .hero-contact strip (see its own comment further down) via a much
     larger bottom padding than top padding. Centering inside that
     shrunk box is what gives the "optical" balance the brief asked for.

     The math: since .hero-inner is the only in-flow child (backdrop,
     scrim and the contact strip are all position:absolute), the total
     "dead" space above and below the content is fixed by viewport
     height minus content height minus the contact strip's own
     reserved zone — padding-bottom only controls how that fixed total
     is SPLIT between the gap above the name and the gap between the
     CTA and the contact row, it can't shrink the total. So this value
     is deliberately weighted heavily toward the bottom split: most of
     the leftover space ends up as the (intentional, per the brief's
     own diagram) larger gap between "Enter Gallery" and the contact
     row, while the gap above the name shrinks to a modest one. Scales
     with viewport height (vh) so it stays roughly proportional on any
     screen; the short-viewport rules further down already compress the
     content's own internal margins, so the two adjustments don't fight
     each other. */
  .hero{ height:100vh; height:100dvh; height:100svh; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(50px + var(--safe-b)); background:var(--ink); scroll-snap-align:start; scroll-snap-stop:always; }
  /* Laptop/desktop only: nudge the hero text block up slightly by shifting
     the padding balance (more on top, less on bottom) — justify-content:center
     centers within the padded box, so this moves the visual center upward
     without touching the mobile layout. */
  @media (min-width: 860px){
    .hero{ padding-top:calc(24px + var(--safe-t)); padding-bottom:calc(140px + var(--safe-b)); }
  }
  /* Same reveal treatment as .scene / .finale photos: blurred, desaturated
     and darkened at rest, clearing once .in-view is added. Uses cover (not
     contain) since this is a full-bleed backdrop, not a letterboxed frame,
     so there's no letterbox edge to hide and no scale-up trick is needed. */
  .hero-backdrop{ position:absolute; inset:0; z-index:0; overflow:hidden; background:var(--ink); }
  .hero-backdrop img{ width:100%; height:100%; object-fit:cover; object-position:center; opacity:0; filter:blur(6px) grayscale(.32) brightness(.6); transition:opacity 1100ms var(--ease), filter 1600ms var(--ease); -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  .hero-backdrop.in-view img{ opacity:1; filter:blur(0) grayscale(.18) brightness(.8); }

  /* Hero A's orbiting photo ring — a scatter of the site's own photos
     drifting slowly around the hero text, in place of (or alongside, if
     renderHeroOrbit() finds no photos) the flat single-image backdrop
     above. Positioning trick: each card sits at top:50%/left:50% and is
     pushed out along its own radius with
     rotate(angle) translateY(-radius) rotate(-angle) — the two rotates
     cancel out so the card itself stays upright rather than tipping over
     as it goes around the circle. --ring-rotation is a single CSS custom
     property written by startHeroOrbitSpin()'s rAF loop on the shared
     .hero-orbit-track ancestor; every card inherits it and subtracts it
     inside that same counter-rotation, so one JS-updated variable spins
     the whole ring while every card still holds its own fixed --card-tilt
     jitter on top. The elliptical mask (wider than tall) is what fades
     cards out near the top/bottom of the ring rather than the sides —
     same "portal" vignette look as the reference video. */
  .hero-orbit{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .hero-orbit-track{
    position:absolute; inset:0;
    /* mask-image is set dynamically per render by renderHeroOrbit() in JS
       (sized to how far the cards actually reach, in px) — a fixed
       percentage here looked right on desktop's roughly-square framing
       but was way too generous on a phone's tall, narrow box, so the
       fade never visibly kicked in there. This is just a safe fallback
       in case JS hasn't set it yet. */
    -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 40%, transparent 88%);
    mask-image:radial-gradient(ellipse 60% 60% at 50% 50%, #000 40%, transparent 88%);
  }
  @media (max-width:639px){
    /* Matches the looser vertical fade renderHeroOrbit() sets dynamically
       in JS (see its comment there) — this fallback only ever shows for
       an instant before JS runs, but keeping it in sync avoids a visible
       jump from "photos nearly gone at top" to "photos visible" on load. */
    .hero-orbit-track{
      -webkit-mask-image:radial-gradient(ellipse 78% 75% at 50% 50%, #000 62%, transparent 98%);
      mask-image:radial-gradient(ellipse 78% 75% at 50% 50%, #000 62%, transparent 98%);
    }
  }
  .hero-orbit-card{
    position:absolute; top:50%; left:50%;
    width:var(--card-size, 84px); height:var(--card-size, 84px);
    transform:translate(-50%, -50%) rotate(calc(var(--card-angle) + var(--ring-rotation, 0deg))) translateY(calc(var(--radius) * -1)) rotate(calc((var(--card-angle) + var(--ring-rotation, 0deg)) * -1)) rotate(var(--card-tilt));
    will-change:transform;
  }
  /* Split from .hero-orbit-card above so the ring's positioning transform
     (rotation/orbit) and this inner element's own opacity/blur/"breathing"
     scale never fight over the same `transform`/`opacity` property. Each
     card gets its own fixed --card-opacity and --card-blur (assigned in JS
     from a random "depth" value per card) so the ring reads as photographs
     scattered at different distances — some nearly gone into the dark —
     rather than N identical cards on a perfect circle. */
  .hero-orbit-card-inner{
    width:100%; height:100%;
    border-radius:14px; overflow:hidden;
    box-shadow:0 18px 44px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
    opacity:0;
    filter:blur(var(--card-blur, 0px));
    transition:opacity 1400ms var(--ease);
    transition-delay:var(--card-delay, 0ms);
  }
  .hero-orbit.ready .hero-orbit-card-inner{ opacity:var(--card-opacity, .85); }
  .hero-orbit-card-inner img{ width:100%; height:100%; object-fit:cover; display:block; -webkit-user-drag:none; user-select:none; }
  /* The one "living" detail: a minority of cards (flagged by JS, never
     all of them) very slowly scale up/brighten and back down — a
     photograph drifting slightly toward the viewer, then receding.
     Durations are long and desynced (each card's own random duration
     plus a negative delay to start mid-cycle) so it never reads as a
     synchronized pulse, and it's skipped entirely under reduced-motion,
     same as the ring's own rotation. Scoped to .ready so it only starts
     once the initial fade-in transition above has already run, instead
     of the animation's own 0%/100% opacity fighting that fade-in. */
  @media not (prefers-reduced-motion: reduce){
    .hero-orbit.ready .hero-orbit-card-inner[data-breathe="1"]{
      animation:heroOrbitBreathe var(--breathe-duration, 30s) ease-in-out infinite;
      animation-delay:var(--breathe-delay, 0s);
    }
  }
  @keyframes heroOrbitBreathe{
    0%, 100%{ transform:scale(1); opacity:var(--card-opacity, .85); }
    50%{ transform:scale(1.12); opacity:calc(var(--card-opacity, .85) * 1.18); }
  }

  /* Hero B's photo wall — real gallery photos in columns that drift
     slowly up/down, standing in for the flat single-image backdrop on
     the screen right after the Islem Zrelli intro (Hero A keeps its
     original orbit ring, untouched). #heroWork .hero-backdrop is hidden
     below so this is what actually paints — renderHeroWorkBackdrop()
     still runs exactly as before, it just no longer shows anything, so
     nothing that depends on it (the admin's Landing Page image picker)
     is broken, only hidden behind this.

     Deliberately soft, not a sharp thumbnail grid: each tile is blurred
     and dimmed (filter below) and scaled up slightly so the blur never
     reveals a crisp edge at the tile boundary — the wall should read as
     a slowly-moving, out-of-focus wash of the work, closer to bokeh than
     a photo grid, so the location/count/credit text sitting on top of it
     always stays the clearest thing on screen, on any screen size. */
  #heroWork .hero-backdrop{ display:none; }
  #heroWork .photo-wall{ position:absolute; inset:0; z-index:0; display:flex; gap:1px; overflow:hidden; background:var(--ink); pointer-events:none; }
  #heroWork .photo-wall .wcol{ flex:1 1 0; display:flex; flex-direction:column; gap:1px; min-width:0; will-change:transform; }
  #heroWork .photo-wall .wcol img{
    display:block; width:100%; aspect-ratio:16/9; object-fit:cover;
    -webkit-user-select:none; user-select:none;
    filter:blur(4px) saturate(.88) brightness(.64);
    transform:scale(1.08); /* hides the blur's own soft edge at each tile's boundary — a smaller scale than before since there's less blur to hide now */
    transition:filter .6s ease;
  }
  #heroWork:hover .photo-wall .wcol img{ filter:blur(3px) saturate(.94) brightness(.7); }
  #heroWork .photo-wall .wcol.up, #heroWork .photo-wall .wcol.down{ animation-timing-function:linear; animation-iteration-count:infinite; }
  /* Animation-name is only assigned once #heroWork has been scrolled into
     view (the same .ready class setupHeroWorkReveal() already adds for
     the text stagger below) rather than unconditionally on page load —
     otherwise the drift had already been quietly running in the
     background the whole time the visitor was still on Hero A / the
     Islem Zrelli intro, so by the time they actually reached Hero B it
     was mid-loop and barely looked like it was moving at all. Gating it
     here means the drift visibly starts from its very first frame right
     as the visitor scrolls in. */
  #heroWork.ready .photo-wall .wcol.up{ animation-name:heroWallDriftUp; }
  #heroWork.ready .photo-wall .wcol.down{ animation-name:heroWallDriftDown; }
  #heroWork:hover .photo-wall .wcol{ animation-play-state:paused; }
  @keyframes heroWallDriftUp{ from{ transform:translate3d(0,0,0); } to{ transform:translate3d(0,-50%,0); } }
  @keyframes heroWallDriftDown{ from{ transform:translate3d(0,-50%,0); } to{ transform:translate3d(0,0,0); } }
  @media (prefers-reduced-motion: reduce){
    /* !important: without it this loses to #heroWork.ready .photo-wall
       .wcol.up/.down above on specificity alone (4 classes vs 2), which
       would silently re-enable the drift for reduced-motion visitors. */
    #heroWork .photo-wall .wcol{ animation:none !important; }
  }
  /* Phone: fewer, wider columns (a 3rd/4th narrow column of blurred 16:9
     tiles reads as noise on a small screen) and an extra touch of blur +
     darkening, since text sits closer to the eye and has less room to
     spare here than on desktop. */
  @media (max-width:720px){
    #heroWork .photo-wall .wcol:nth-child(3), #heroWork .photo-wall .wcol:nth-child(4){ display:none; }
    #heroWork .photo-wall .wcol img{ filter:blur(6px) saturate(.84) brightness(.56); }
  }

  .hero-scrim{ position:absolute; inset:0; z-index:1; background:linear-gradient(to bottom, rgba(5,5,5,.32) 0%, rgba(5,5,5,.4) 46%, rgba(5,5,5,.86) 100%); pointer-events:none; opacity:var(--scrim-opacity, 1); }
  .hero-inner{ position:relative; z-index:2; max-width:820px; transform:translateY(var(--block-y, 0px)); }
  /* Staggered fade-and-rise entrance, matching the considered reveal every
     scene already gets (see .scene .tag / h2 / p.caption below) — the hero
     text used to just snap into view with none of that. */
  .hero-inner > *{ opacity:0; transform:translateY(18px); transition:opacity 900ms var(--ease), transform 900ms var(--ease); }
  .hero.ready .hero-inner > *{ opacity:1; transform:translateY(0); }
  .hero.ready .hero-inner > *:nth-child(2){ transition-delay:0ms; }
  .hero.ready .hero-inner > *:nth-child(3){ transition-delay:160ms; }
  .hero.ready .hero-inner > *:nth-child(4){ transition-delay:340ms; }
  .hero.ready .hero-inner > *:nth-child(5){ transition-delay:480ms; }
  .hero.ready .hero-inner > *:nth-child(6){ transition-delay:600ms; }

  /* ================= HERO A "EMERGENCE" ENTRANCE ================= */
  /* A more cinematic, restrained entrance for the landing hero's central
     text specifically — layered on top of the shared .hero-inner > *
     stagger above (which #heroWork / Hero B keeps using exactly as-is;
     everything here is scoped to #hero by ID so none of it reaches Hero
     B). Still driven by the exact same #hero.ready class / one-time
     fireHeroEntranceOnce() call as the rest of the hero's reveal —
     nothing here adds a new trigger (no IntersectionObserver, no scroll
     listener), so it plays once, the same way the rest of the hero
     already does, and is unaffected by scrolling away and back, resizing,
     or category navigation. The orbiting photos are untouched by any of
     this — they're already animating independently before this even
     starts. Reduced-motion is handled by the two rules added to the
     existing prefers-reduced-motion block above, not duplicated here. */

  /* The name: starts slightly blurred, a few px low, and very faintly
     tracked-out, then settles into sharp focus — "the typography
     gradually resolving into focus", not individual letters animating.
     --enter-name-y is additive with the admin's own --sig-y position
     offset (see .signature-wrap below) rather than replacing it — a
     plain `transform:` override here would silently blow away whatever
     vertical position the admin has configured for the name. */
  #hero .signature-wrap{
    --enter-name-y:8px;
    filter:blur(8px);
    transition:opacity 1000ms var(--ease), transform 1000ms var(--ease), filter 1000ms var(--ease);
  }
  #hero.ready .signature-wrap{ --enter-name-y:0px; filter:blur(0); }
  #hero .signature-svg text{ letter-spacing:.05em; transition:letter-spacing 1000ms var(--ease); }
  #hero.ready .signature-svg text{ letter-spacing:normal; }

  /* The role line: begins only once the name is already underway, with
     its own shorter duration and much smaller travel — it stays
     visually subordinate rather than arriving alongside the name.
     --enter-role-y is additive with --role-y for the same reason as
     --enter-name-y above. */
  #hero .hero-role{
    --enter-role-y:5px;
    transition:opacity 620ms var(--ease), transform 620ms var(--ease);
    transition-delay:320ms;
  }
  #hero.ready .hero-role{ --enter-role-y:0px; }

  /* Enter Gallery: waits until the role has substantially appeared
     (~2.3s from load) before its own small, quiet reveal — no scaling,
     no bounce, just opacity and a few px of settling, matching the
     name/role above rather than the old 480ms-delay group timing. The
     button has no admin-configurable position of its own (unlike the
     name/role above), so a plain transform override is safe here. */
  #hero .hero-inner > *:nth-child(5){
    transform:translateY(10px);
    transition:opacity 700ms var(--ease), transform 700ms var(--ease);
    transition-delay:2300ms;
  }
  #hero.ready .hero-inner > *:nth-child(5){ transform:translateY(0); }
  /* Hero text order is: location headline + count phrase, "By", signature
     (name). Both hero-work-place and hero-count wrap naturally on narrow
     phones rather than forcing a single tight line.

     Spacing below is deliberately asymmetric rather than one repeated
     value: "By" sits tight against the signature since together they read
     as a single primary unit (the name), then the gap widens noticeably
     before the role line (secondary), and widens again — more than any
     other gap — before the CTA (tertiary), so the composition reads as
     distinct layers rather than one centered stack of text. */
  .hero-kicker{ margin-bottom:clamp(30px, 5.6vw, 60px); }
  /* Hero A's name is no longer plain text sized to match — it now reuses
     the exact same .signature-wrap/.signature-svg markup as Hero B's own
     signature (see the HTML), so the two are guaranteed pixel-identical at
     every viewport width automatically, including the two short-viewport
     overrides on .signature-svg below — one shared class, not two sizes
     kept in sync by hand.

     .hero-work-place is Hero B's "Gabès, Tunisia" location line — it used
     to incorrectly share the .hero-place class with Hero A's name, which
     meant matching Hero A's name to the signature's ~92px size also
     silently blew up this location line to the same huge size. Split into
     its own class, restored to its original, sensible kicker-line size,
     then bumped up a step further from that original size — now that
     Hero B no longer builds up to a second giant signature, this
     location line is Hero B's own primary heading, so it gets the visual
     weight to carry that job. */
  .hero-work-place{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:calc(clamp(2.2rem, 6.2vw, 3.4rem) * var(--place-scale, 1)); line-height:1.1; color:var(--white); margin:0 0 10px; transform:translateY(var(--place-y, 0px)); }
  .hero-count{ font-family:var(--font-body); font-style:normal; font-weight:400; font-size:.82rem; letter-spacing:.16em; text-transform:uppercase; line-height:1.5; color:var(--dim); margin:0; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .hero-credit{ font-family:var(--font-display); font-style:italic; font-weight:400; font-size:calc(clamp(1.3rem, 2.8vw, 1.7rem) * var(--credit-scale, 1)); letter-spacing:.01em; text-transform:none; color:rgba(246,244,239,.85); margin:0 0 clamp(12px, 2vw, 18px); transform:translateY(var(--credit-y, 0px)); }
  .signature-wrap{ margin:clamp(18px, 3.6vw, 36px) 0 clamp(56px, 9.6vw, 104px); display:flex; justify-content:center; transform:translateY(calc(var(--sig-y, 0px) + var(--enter-name-y, 0px))) scale(var(--sig-scale, 1)); }
  .signature-svg{ width:min(90vw, 700px); height:auto; display:block; overflow:visible; }
  .signature-svg text{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:102px; fill:var(--white); fill-opacity:0; stroke:var(--white); stroke-width:1.4; stroke-linejoin:round; paint-order:stroke fill; }
  .signature-svg text.filled{ transition:fill-opacity 1100ms var(--ease); fill-opacity:1; }
  .hero-role{ font-family:var(--font-body); font-weight:400; font-size:calc(.72rem * var(--role-scale, 1)); letter-spacing:.19em; text-transform:uppercase; color:var(--dim); margin:0 0 clamp(52px, 9.6vw, 108px); transform:translateY(calc(var(--role-y, 0px) + var(--enter-role-y, 0px))); }
  /* Admin-editable "extra line" slots (see applyHeroTextConfig() and the
     Landing Page admin tab) — up to 2 per hero, hidden by default
     (display:none inline in the HTML) and only shown when the admin
     enables one with actual text. Shares .hero-role's quiet meta-line
     look by default since that fits either hero's existing typographic
     rhythm; -1/-2 each get their own scale/offset variable so the two
     slots can be sized/nudged independently. */
  .hero-extra-line{ font-family:var(--font-body); font-weight:400; letter-spacing:.1em; line-height:1.5; color:var(--dim); margin:0 0 14px; }
  .hero-extra-line.hero-extra-1{ font-size:calc(.82rem * var(--extra1-scale, 1)); transform:translateY(var(--extra1-y, 0px)); }
  .hero-extra-line.hero-extra-2{ font-size:calc(.82rem * var(--extra2-scale, 1)); transform:translateY(var(--extra2-y, 0px)); }
  @media (max-width:430px){
    .hero-count{ font-size:.7rem; letter-spacing:.12em; }
    .hero-credit{ font-size:calc(1.2rem * var(--credit-scale, 1)); }
    .hero-role{ font-size:calc(.7rem * var(--role-scale, 1)); letter-spacing:.12em; }
    .hero-extra-line.hero-extra-1{ font-size:calc(.7rem * var(--extra1-scale, 1)); }
    .hero-extra-line.hero-extra-2{ font-size:calc(.7rem * var(--extra2-scale, 1)); }
  }
  .enter{ display:inline-flex; flex-direction:column; align-items:center; gap:16px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.16em; text-transform:uppercase; color:var(--white); padding:6px; border-bottom:1px solid transparent; transition:border-color 300ms var(--ease), opacity 900ms var(--ease), transform 900ms var(--ease); }
  .enter:hover{ border-color:var(--line); }
  .enter .arrow-line{ width:1px; height:34px; background:var(--line); position:relative; overflow:hidden; }
  .enter .arrow-line::after{ content:""; position:absolute; left:0; top:-100%; width:100%; height:100%; background:var(--white); animation:drip 2.4s var(--ease) infinite; }
  @keyframes drip{ 0%{ top:-100%; } 60%{ top:100%; } 100%{ top:100%; } }

  /* Hero-only "scroll to enter" cue — a tall glowing line + chevron that
     stretches down to fill the gap between the button and .hero-contact,
     instead of the small 34px tick mark that used to leave that space
     looking unfinished. Scoped under .hero (rather than changing .enter/
     .arrow-line themselves) so the compact version used by the
     "Continue Exploring" card between categories — rendered outside the
     hero — is completely untouched.
     The line itself is now two layers: ::before is the thin static wire
     (same look as before, just fading out toward the bottom), ::after is
     a soft blurred streak of light that travels down it — this is why
     .arrow-line's own width grows to 20px (an invisible track so that
     glow has room to breathe) while the visible wire stays 1px via
     ::before. The chevron below reinforces the "go down" direction with
     a gentle, independent breathing pulse. */
  .hero .enter{ gap:18px; }
  .enter.hero-arrow{ gap:18px; }
  .hero .enter .arrow-line, .enter.hero-arrow .arrow-line{ width:20px; height:clamp(64px, 15vh, 190px); background:none; }
  .hero .enter .arrow-line::before, .enter.hero-arrow .arrow-line::before{
    content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; transform:translateX(-50%);
    background:linear-gradient(to bottom, var(--line) 0%, var(--line) 72%, transparent 100%);
  }
  .hero .enter .arrow-line::after, .enter.hero-arrow .arrow-line::after{
    left:50%; top:-30%; width:3px; height:30%; transform:translateX(-50%);
    background:linear-gradient(to bottom, transparent 0%, var(--white) 50%, transparent 100%);
    box-shadow:0 0 7px 1px rgba(255,255,255,.5);
    animation:heroDrip 3.2s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes heroDrip{
    0%{ top:-30%; opacity:0; }
    12%{ opacity:1; }
    82%{ opacity:1; }
    100%{ top:100%; opacity:0; }
  }
  .hero .enter .arrow-chevron, .enter.hero-arrow .arrow-chevron{
    width:14px; height:auto; margin-top:-6px;
    fill:none; stroke:var(--dim); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;
    animation:heroChevronPulse 2.6s var(--ease) infinite;
  }
  @keyframes heroChevronPulse{
    0%, 100%{ opacity:.4; transform:translateY(0); }
    50%{ opacity:1; transform:translateY(4px); }
  }
  @media (max-width: 480px){
    .hero .enter .arrow-line, .enter.hero-arrow .arrow-line{ height:clamp(48px, 12vh, 120px); }
  }

  /* Short viewports (a laptop browser window, not a phone — this is a
     height query, the max-width:430px rules above are a separate, phone-
     width-only concern) can't fit the hero's full desktop-sized vertical
     rhythm: the centered text stack was tall enough to push "Enter
     Gallery" down into the social/contact row pinned near the bottom.
     Tightening the stack's own margins here reclaims that room instead of
     moving .hero-contact again, so its clearance from .lang-switch (see
     above) is untouched. */
  @media (max-height:820px){
    .hero-kicker{ margin-bottom:16px; }
    .hero-credit{ margin-bottom:10px; }
    .signature-wrap{ margin-bottom:16px; }
    .signature-svg{ width:min(64vw, 480px); }
    .hero-role{ margin-bottom:20px; }
    .enter{ gap:10px; }
    .enter .arrow-line{ height:20px; }
  }
  @media (max-height:660px){
    .hero-kicker{ margin-bottom:10px; }
    .signature-wrap{ margin-bottom:10px; }
    .signature-svg{ width:min(56vw, 380px); }
    .hero-role{ margin-bottom:14px; }
    .enter{ gap:8px; }
    .enter .arrow-line{ height:14px; }
  }

  /* Quiet contact/social strip pinned near the bottom of the hero — kept
     absolutely positioned so it never affects the vertical centering of
     .hero-inner above it. Hidden entirely (via .has-content) whenever no
     contact fields are configured in the About admin tab, so an unfilled
     site shows nothing here rather than an empty row. Lifted well clear
     of .lang-switch (fixed at the very bottom-left, see above) so the two
     never crowd each other. */
  .hero-contact{ position:absolute; left:0; right:0; bottom:calc(58px + var(--safe-b)); z-index:3; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 24px; opacity:0; pointer-events:none; transition:opacity 900ms var(--ease), transform 300ms var(--ease); transition-delay:520ms; transform:translateY(var(--contact-y, 0px)) scale(var(--contact-scale, 1)); transform-origin:center bottom; }
  .hero.ready .hero-contact.has-content{ opacity:1; pointer-events:auto; }
  /* Circular icon badges (see renderHeroContact()/SOCIAL_ICON_DATA in the
     JS) — soft depth at rest via the shadow, then a deliberate lift +
     glow on hover/focus so each one feels like a physical button rather
     than a flat image. The icon itself (a small transparent-background
     glyph baked in as a data: URI) just sits centered inside; all the
     "chrome" — background, border, shadow — lives on the badge container
     so it can animate independently of the glyph. */
  .social-badges{ display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
  .social-badge{
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    opacity:0; transform:translateY(10px) scale(.9);
    transition:opacity 500ms var(--ease), transform 260ms var(--ease), box-shadow 260ms var(--ease), background 260ms var(--ease), border-color 260ms var(--ease);
  }
  .hero.ready .social-badges .social-badge{ opacity:1; transform:translateY(0) scale(1); }
  /* Each value list below lines up positionally with the 5 properties in
     .social-badge's `transition` above (opacity, transform, box-shadow,
     background, border-color). Only the first (opacity) actually varies
     per badge, to stagger the entrance fade-in — the other four stay at
     0ms in every rule so a later hover's lift/glow always responds
     instantly, never inheriting that stagger delay. */
  .social-badges .social-badge:nth-child(1){ transition-delay:0ms, 0ms, 0ms, 0ms, 0ms; }
  .social-badges .social-badge:nth-child(2){ transition-delay:60ms, 0ms, 0ms, 0ms, 0ms; }
  .social-badges .social-badge:nth-child(3){ transition-delay:120ms, 0ms, 0ms, 0ms, 0ms; }
  .social-badges .social-badge:nth-child(4){ transition-delay:180ms, 0ms, 0ms, 0ms, 0ms; }
  .social-badges .social-badge:nth-child(5){ transition-delay:240ms, 0ms, 0ms, 0ms, 0ms; }
  .social-badge img{ width:18px; height:18px; display:block; opacity:.86; transition:opacity 260ms var(--ease); pointer-events:none; }
  .social-badge:hover, .social-badge:focus-visible{
    transform:translateY(-4px) scale(1);
    background:rgba(255,255,255,.11);
    border-color:rgba(255,255,255,.4);
    box-shadow:0 12px 26px rgba(0,0,0,.5), 0 0 24px rgba(255,255,255,.4), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .social-badge:hover img, .social-badge:focus-visible img{ opacity:1; }
  .social-badge:active{ transform:translateY(-1px) scale(.95); }
  .social-badge:focus-visible{ outline:none; }
  @media (max-width:430px){
    .hero-contact{ bottom:calc(50px + var(--safe-b)); }
    .social-badge{ width:40px; height:40px; }
    .social-badge img{ width:16px; height:16px; }
  }

  /* The hidden admin gesture's real target (10 taps/clicks within 2s —
     see the JS). Deliberately styled as inert decorative text, not a
     control: no cursor change, no :hover/:active/:focus rule of any
     kind, no underline, nothing that would visually suggest it responds
     to anything. It sits in its own bottom-right corner, independent of
     the centered .hero-contact row, so it never gets swept up by
     :hover/click handling meant for the actual social/contact links.

     TAP TARGET FIX: the element used to be exactly the size of its own
     text glyphs (~14px tall). A real fingertip is much wider than that,
     and pointer/touch events resolve against a single coordinate, not a
     whole contact patch — so most real taps aimed "at" the tiny visible
     mark actually landed a few px outside its true hit box and never
     reached it at all. Padding now gives it a real ~44px+ hit box
     (Apple/Google's own minimum recommended touch target); `right`/
     `bottom` are pulled in by exactly the new padding amount so the
     VISIBLE text glyph doesn't move a single pixel — only the invisible
     hit area around it grew.

     touch-action:none matters separately: without it, the browser's OWN
     native gesture recognizer can still claim a touch starting here as a
     scroll/pan candidate (izMark sits inside the scroll-snapping
     .scroller) and fire pointercancel instead of pointerup — before any
     JS ever runs, so stopPropagation can't prevent it. */
  .hero-mark{ position:absolute; z-index:3; right:calc(6px + var(--safe-r)); bottom:calc(8px + var(--safe-b)); padding:14px 16px; touch-action:none; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:.85rem; letter-spacing:.02em; color:var(--dim); opacity:.65; user-select:none; }
  @media (max-width:430px){
    .hero-mark{ font-size:.76rem; right:calc(3px + var(--safe-r)); bottom:calc(3px + var(--safe-b)); padding:15px; }
  }

  /* mandatory ensures every scroll gesture always comes to rest on a full
     scene — never half-way between two — even on a soft swipe or a
     trackpad flick that doesn't carry quite enough momentum to clear the
     midpoint on its own. Desktop wheel input is additionally handled by
     JS (see setupWheelAdvance) since trackpads/mice don't have native
     momentum-to-snap behavior at all. */
  .scroller{ height:100vh; height:100dvh; height:100svh; overflow-y:scroll; overflow-x:hidden; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; }
  .scroller::-webkit-scrollbar{ display:none; }
  /* While a story is open (any .scene.reading), the page itself must not
     scroll AT ALL — no wheel, trackpad, touch, scrollbar, or keyboard
     (Space/PageUp/PageDown/arrows) can carry the visitor to another
     scene. Only the story text's own box (.caption.expanded) scrolls.
     The class is toggled by syncReadingLock() in JS. */
  .scroller.reading-lock{ overflow-y:hidden; scroll-snap-type:none; overscroll-behavior:none; }
  /* Used only when the initial load might land somewhere other than the
     hero (a /work/ or /category/ URL, or a returning visitor's saved
     position) — see the "route gate" set up right before animateHeroEntrance
     and released at the end of applyInitialRoute(). Keeps the hero from
     ever flashing into view (fully animated in) only to be yanked away a
     moment later once the async photo fetch resolves and the real target
     is known. visibility (not opacity) so layout/scroll math and the
     IntersectionObservers set up during this window still work normally —
     body's own var(--ink) background shows through, so this is a brief
     dark screen rather than a flash of white. Never applied on a plain
     first visit to the root URL, so the common case is completely
     unaffected. */
  .scroller.route-pending{ visibility:hidden; }
  html.dl-boot .scroller{ visibility:hidden; }
  /* Deep-link status screen: the ONE thing shown while a /work/<slug> (or /category/<slug>) link is
     being resolved — a quiet loading state, or an intentional "not found" / "couldn't load" message.
     It replaces the old behaviour of quietly dropping the visitor on the landing page. Its
     loading-state text/spinner fade in after a short delay so a fast load never flashes them. */
  .dl-overlay{ position:fixed; inset:0; z-index:150; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b)); background:var(--ink); color:var(--white); text-align:center; }
  .dl-overlay.show, html.dl-boot .dl-overlay{ display:flex; }
  .dl-spin{ width:24px; height:24px; border:1px solid var(--line); border-top-color:var(--white); border-radius:50%; animation:dlSpin 1s linear infinite; }
  .dl-overlay:not([data-state="loading"]) .dl-spin{ display:none; }
  .dl-title{ margin:0; font-family:var(--font-display); font-size:clamp(1.5rem, 3.2vw, 2.2rem); font-weight:400; letter-spacing:.01em; }
  .dl-sub{ margin:0; max-width:36ch; color:var(--dim); font-size:var(--size-nav); line-height:1.6; }
  .dl-title:empty, .dl-sub:empty, .dl-actions:empty{ display:none; }
  .dl-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:10px; }
  .dl-btn{ appearance:none; background:transparent; color:var(--white); border:1px solid var(--line); border-radius:3px; padding:12px 22px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.06em; cursor:pointer; transition:border-color 300ms var(--ease), background 300ms var(--ease); }
  .dl-btn:hover, .dl-btn:focus-visible{ border-color:var(--white); background:rgba(246,244,239,.06); outline:none; }
  .dl-overlay[data-state="loading"] .dl-spin,
  .dl-overlay[data-state="loading"] .dl-title,
  .dl-overlay[data-state="loading"] .dl-sub,
  .dl-overlay[data-state="loading"] .dl-actions{ opacity:0; animation-name:dlFade; animation-duration:500ms; animation-delay:450ms; animation-fill-mode:forwards; animation-timing-function:ease; }
  .dl-overlay[data-state="loading"] .dl-spin{ animation-name:dlFade, dlSpin; animation-duration:500ms, 1s; animation-delay:450ms, 0s; animation-iteration-count:1, infinite; animation-fill-mode:forwards, none; animation-timing-function:ease, linear; }
  @keyframes dlFade{ to{ opacity:1; } }
  @keyframes dlSpin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .dl-spin{ animation-duration:2.4s !important; } }
  .scene{ position:relative; height:100vh; height:100dvh; height:100svh; width:100%; scroll-snap-align:start; scroll-snap-stop:normal; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:calc(22px + var(--safe-t)) 22px calc(22px + var(--safe-b)); background:var(--ink); transition:padding-top 700ms var(--ease); }
  /* The category nav bar (.cat-nav) is position:fixed at the very top of
     the screen, independent of any scene's own layout — a tall enough
     reading block, vertically centered in a now-photo-less scene, can
     otherwise reach up underneath it. Reading mode gets real reserved
     clearance up top (not just its usual small padding) so the title
     never renders under the fixed nav, however tall the story is. */
  .scene.reading{ padding-top:calc(86px + var(--safe-t)); }
  .scene .frame-img{ position:relative; width:100%; flex-grow:1; flex-shrink:1; flex-basis:auto; min-height:34vh; display:flex; align-items:center; justify-content:center; overflow:hidden; touch-action:manipulation; transition:flex-grow 900ms var(--ease), flex-basis 900ms var(--ease), min-height 900ms var(--ease), opacity 800ms var(--ease), filter 900ms var(--ease), transform 900ms var(--ease); }
  /* Photo → story transition, step one: the photograph recedes rather
     than simply vanishing — fades, softens and drifts down slightly —
     and its flex slot collapses to nothing so .scene-content (title +
     story) glides up to fill the space and re-centers in the scene via
     .scene's own justify-content:center. The 260ms head start before
     the caption pane grows (see .scene.reading .scene-content below)
     is what gives the sequence its "photo leaves, then story arrives"
     order instead of everything happening at once. */
  .scene.reading .frame-img{ flex-grow:0; flex-basis:0%; min-height:0; opacity:0; filter:blur(18px) grayscale(.4) brightness(.5); transform:scale(.94) translateY(8px); pointer-events:none; }
  /* .wm-frame sits between .frame-img (the full flex slot the photo is
     centered in) and the <img> itself. It carries the SAME aspect-ratio as
     the photo (set inline per-photo, falling back to 3/4) plus max-width/
     max-height:100%, which makes the browser size it exactly the way it
     sizes a replaced element (like the <img> used to be sized on its own):
     as large as possible without exceeding either dimension of .frame-img.
     The upshot is .wm-frame's box == the photo's actual rendered box, with
     zero letterbox gap — unlike .frame-img, whose own box is the full
     flex slot and can be much taller/wider than the photo once object-fit
     contain has letterboxed it. That mismatch (container box vs. real
     photo box) is what let the watermark drift away from the visible
     photo edge on some screens/aspect ratios; anchoring the watermark to
     .wm-frame instead fixes it consistently across phone/tablet/desktop. */
  .scene .frame-img .wm-frame{
    position:relative; max-width:100%; max-height:100%; aspect-ratio:3/4; overflow:hidden;
    /* Minimal alternative to the earlier "visible spotlight" treatment
       (a drawn hairline + a glowing cone above the photo): no light
       *shape* here at all. A real overhead fixture, in most gallery
       photos, doesn't actually show up as a glow floating in the air —
       it shows as the artwork itself looking lit: slightly brighter,
       slightly crisper than its surroundings. That's already exactly
       what the image transition below does (blurred/dim → sharp/bright
       as it becomes active) — this box-shadow only adds the barest hint
       of the photo's own presence spilling immediately past its edges,
       not a directional light source above it. Faint and symmetric on
       all sides, not top-only, since there's no fixture being implied
       anymore, just the photo settling into slightly sharper focus
       against the dark. */
    box-shadow:0 0 0 0 rgba(255,255,255,0);
    transition:box-shadow 1100ms var(--ease);
  }
  .scene.in-view .frame-img .wm-frame{
    box-shadow:0 0 24px 2px rgba(255,255,255,.04);
  }
  @media (prefers-reduced-motion: reduce){
    .scene .frame-img .wm-frame{ transition:none !important; }
  }
  /* Entrance is tied to the photo's actual image resource finishing
     loading (see armPhotoReveal() in JS) — not to scroll position. A
     photo sits at opacity:0/blurred/very-slightly-scaled-up until its
     `load` (or `error`, so a failed photo never stays stuck hidden)
     fires, then eases into place once, like it's gently coming into
     focus. .in-view below is now purely cosmetic on top of that — it
     only nudges grayscale/brightness once the photo is already fully
     revealed, so scrolling back to an already-loaded photo doesn't
     replay the reveal. */
  .scene .frame-img .wm-frame img{ display:block; width:100%; height:100%; object-fit:contain; object-position:center; opacity:0; transform:scale(1.015); filter:blur(11px) grayscale(.06) brightness(.90); transition:opacity 620ms var(--ease), transform 620ms var(--ease), filter 620ms var(--ease); }
  .scene .frame-img .wm-frame img.is-loaded{ opacity:1; transform:scale(1); filter:blur(0) grayscale(.06) brightness(.90); }
  .scene.in-view .frame-img .wm-frame img.is-loaded{ filter:blur(0) grayscale(0) brightness(1); }
  /* Thin rotating ring shown only while a photo is genuinely still in
     flight (slow connection) — otherwise a stalled load just reads as a
     dead black frame. Sits as the img's next sibling in the markup so a
     plain CSS sibling selector can hide it the instant .is-loaded lands,
     no JS wiring beyond the class it already toggles. The 1ms delayed
     keyframe (not a plain transition) is what keeps it from flashing on
     every normal/cached load — it only becomes visible if loading is
     still in progress ~400ms in. */
  .scene .frame-img .wm-frame .photo-loader{
    position:absolute; top:50%; left:50%; width:32px; height:32px; margin:-16px 0 0 -16px;
    border-radius:50%; pointer-events:none; z-index:2; opacity:0;
    border:1.5px solid rgba(255,255,255,.14);
    border-top-color:rgba(255,255,255,.6);
    border-right-color:rgba(255,255,255,.34);
    animation:photoLoaderSpin 900ms linear infinite, photoLoaderShow 1ms linear 420ms forwards;
  }
  .scene .frame-img .wm-frame img.is-loaded ~ .photo-loader{
    animation:none; opacity:0; transition:opacity 200ms var(--ease);
  }
  @keyframes photoLoaderSpin{ to{ transform:rotate(360deg); } }
  @keyframes photoLoaderShow{ to{ opacity:1; } }
  /* A photo that genuinely failed (or hung past the load timeout, and the
     original fallback also failed) settles into a calm, static state —
     never a broken-image icon flashed in at full opacity, and never a
     spinner left running forever. This is a resting state, not a
     transition, so it never contributes to any flicker. */
  .scene .frame-img .wm-frame img.is-error{
    opacity:.3; transform:scale(1); filter:blur(0) grayscale(1) brightness(.55); transition:opacity 400ms var(--ease), filter 400ms var(--ease);
  }
  .scene .frame-img .wm-frame img.is-error ~ .photo-loader{ animation:none; opacity:0; }
  .scene .frame-img .wm-frame .retry-photo{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:3;
    display:none; align-items:center; gap:8px; font-family:var(--font-body); font-size:.68rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--white); white-space:nowrap;
    background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.22); padding:9px 15px;
    border-radius:2px; cursor:pointer; pointer-events:none; opacity:0; transition:opacity 300ms var(--ease);
  }
  .scene .frame-img .wm-frame.load-error .retry-photo{ display:flex; opacity:1; pointer-events:auto; }
  /* Photo protection, scoped to the photos themselves — not the whole
     page — so captions, the contact email and every other text on the
     site stay normally selectable and clickable. This is friction, not a
     lock: it stops the average right-click/long-press save, nothing more.
     Screenshots, screen recordings and photos-of-the-screen can't be
     blocked by any website; the watermark is what actually survives
     those, since — see the note below — it's now burned into the pixels
     of the file itself rather than drawn on top of it by CSS. */
  .frame-img img{ -webkit-touch-callout:none; -webkit-user-drag:none; user-select:none; }
  /* Watermark system — used to live here as a `.wm-frame::after` CSS
     pseudo-element drawn on top of the photo in the visitor's browser.
     That approach had a hole: the *photo itself* — the actual image
     bytes at image_url — was always the plain, unwatermarked file: the
     mark was just an overlay a viewer's browser painted on top of it.
     Right-click-open-image-in-new-tab, curl-ing the URL directly, or
     just reading the Network tab all bypassed it completely.
     The watermark is now burned into the image's actual pixels at
     upload time (see processImageForUpload / drawWatermarkOnCanvas in
     the admin script below) before the file is ever uploaded to the
     public bucket, so there is no separate unwatermarked file to find —
     image_url IS the watermarked file. `.wm-frame` itself is kept
     purely as the sizing/reveal-animation wrapper described above; it no
     longer carries any watermark-specific class, attribute or custom
     property. */
  /* Base scrim: a full-bleed dark layer sitting between the photo
     (z-index:auto, painted first) and the text (.scene-content,
     z-index:3) — invisible/inert by default (opacity:0) and only ever
     switched on per-state below (.finale, .reading), rather than always
     being in the DOM doing nothing. */
  .scene .scrim{ position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity 700ms var(--ease); }
  /* Photo → story transition ("reading" mode, toggled alongside
     .caption.expanded by the read-more click handler below): the photo
     fades/blurs/recedes and this same scrim darkens over it, turning the
     scene into a calm, clean backdrop for the story — same visual
     language as .finale's card, just triggered per-photo instead of at
     the end of a category. */
  .scene.reading .scrim{ opacity:1; background:radial-gradient(ellipse 90% 70% at 50% 40%, rgba(8,8,8,.88) 0%, rgba(3,3,3,.97) 100%); }
  .scene-content{ position:relative; z-index:3; width:100%; display:flex; flex-direction:column; gap:14px; max-width:640px; flex:0 0 auto; transition:max-width 700ms var(--ease); }
  /* The reading column widens a little beyond the normal caption's
     footprint once the photo has stepped aside — an editorial column,
     not the page's full width. Desktop caps around 800px; mobile just
     uses the scene's existing side padding. */
  .scene.reading .scene-content{ max-width:min(800px, 100%); padding-bottom:78px; }
  .scene .tag{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:500; opacity:0; transform:translateY(8px); transition:opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease); }
  button.tag-link{ display:inline-block; background:none; border:none; padding:11px 3px; margin:-11px -3px; font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:2px; }
  button.tag-link:hover, button.tag-link:focus-visible{ color:var(--white); }
  button.tag-link:focus-visible{ outline:1px solid var(--white); outline-offset:2px; }
  .scene h2{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:var(--size-title); line-height:1.05; margin:0; letter-spacing:-.005em; opacity:0; transform:translateY(12px); transition:opacity var(--dur-1) var(--ease) 70ms, transform var(--dur-1) var(--ease) 70ms; }
  /* Photo → story transition, step two: the title itself doesn't move
     with the photo — it holds its place for a beat while the photo
     fades (see the delay below), then settles slightly upward as the
     story text grows in beneath it. That pause is what makes the title
     read as the hinge of the transition ("photo, then title, then
     story") rather than everything shifting at once. */
  .scene.reading h2{ transform:translateY(-14px); transition:transform 800ms var(--ease) 200ms; }
  .scene p.caption{ font-family:var(--font-body); font-weight:300; font-size:var(--size-desc); line-height:1.65; color:var(--dim); margin:0; max-width:46ch; opacity:0; transform:translateY(12px); transition:opacity var(--dur-1) var(--ease) 160ms, transform var(--dur-1) var(--ease) 160ms; }
  .scene.in-view .tag, .scene.in-view h2, .scene.in-view p.caption{ opacity:1; transform:translateY(0); }
  /* Long-text "Read more" (collapsed/expanded story). Collapsed captions
     get a plain CSS line-clamp — no JS text-slicing, so it behaves the
     same across languages/scripts (including Arabic RTL) and just tracks
     whatever the font/width naturally fits. setupReadMore() below decides
     per-caption, after render, whether the clamp is actually cutting
     anything off; the button only appears when it is (see the acceptance
     requirement: short stories show in full with no button at all). */
  .scene p.caption.clamped{ display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; }
  .read-more-btn{ display:none; align-self:flex-start; margin:-4px 0 0; padding:6px 0; background:none; border:none; font-family:var(--font-body); font-weight:400; font-size:var(--size-desc); line-height:1.3; color:var(--white); opacity:.66; text-decoration:underline; text-underline-offset:3px; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:opacity 200ms var(--ease); }
  .read-more-btn:hover, .read-more-btn:focus-visible{ opacity:1; }
  .read-more-btn:focus-visible{ outline:1px solid var(--line); outline-offset:3px; }
  /* Expanded state ("Read more" tapped): the photo → story transition's
     third and final step. The caption stops being a small 4-line clip
     and becomes the scene's own bounded reading pane — wide (editorial
     column, not the full screen width) and tall (most of the vertical
     space the photo just vacated), with a softer, slightly larger type
     setting since it's now the page's main content rather than a
     caption underneath something else.
     Still a single self-contained scrollable box (not the whole page),
     which is what keeps it compatible with the swipe/wheel guards below
     that check for .caption.expanded specifically — reusing that exact
     mechanism rather than inventing page-level scroll handling.
     max-height is capped with calc(100dvh - 320px - safe-area) rather
     than a flat vh figure — a flat percentage can still add up (with the
     title, gaps and the pinned actions bar below) to more than the
     screen actually has room for, which is exactly what let the reading
     block grow tall enough to reach the fixed .cat-nav bar up top. This
     keeps the whole block — title, pane and the pinned actions bar
     below it — reliably inside the scene on any screen size.
     No background, border or box of its own — the dark .scrim behind it
     is what gives the "clean reading page" backdrop. */
  .scene p.caption.expanded{
    display:block; -webkit-line-clamp:unset;
    max-width:min(800px, 100%);
    max-height:min(46vh, 480px, calc(100dvh - 320px - var(--safe-t) - var(--safe-b)));
    font-size:calc(var(--size-desc) * 1.06); line-height:1.85; color:var(--white); opacity:.86;
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    transition:max-height 650ms var(--ease) 220ms, opacity 500ms var(--ease) 300ms;
  }
  .scene-rule{ height:1px; background:var(--line-soft); margin-top:8px; transform:scaleX(0); transform-origin:left; transition:transform 900ms var(--ease) 260ms; }
  .scene.in-view .scene-rule{ transform:scaleX(1); }
  /* The thin divider belongs to the normal caption/actions footer — once
     the story pane takes over, the pinned actions bar below (see
     .scene.reading .scene-actions) has its own visual separation, so the
     rule is just noise here. */
  .scene.reading .scene-rule{ transform:scaleX(0); }
  .scene-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; opacity:0; transform:translateY(6px); transition:opacity var(--dur-1) var(--ease) 320ms, transform var(--dur-1) var(--ease) 320ms; }
  .scene.in-view .scene-actions{ opacity:1; transform:translateY(0); }
  /* While reading, the like/share/counter row leaves the normal flow
     (which would otherwise trail below a potentially long story) and
     docks to the bottom of the scene instead, so it's always reachable
     without scrolling through the whole story first — a scrim-matching
     gradient underneath keeps it readable over whatever text scrolls
     past behind it. .scene is already position:relative, so this pins
     within the photo/scene itself, not the whole page. */
  .scene.reading .scene-actions{
    position:absolute; left:22px; right:22px; bottom:calc(20px + var(--safe-b)); z-index:4;
    max-width:min(800px, calc(100% - 44px)); margin:0 auto;
    padding-top:22px;
    background:linear-gradient(to top, rgba(3,3,3,.92) 40%, transparent 100%);
  }
  .actions-left{ display:flex; align-items:center; gap:18px; }
  /* The "Read more" control becomes the story pane's own close affordance
     once tapped — a plain underlined text link reads too quiet for that
     job at this size, so it gets a bit more visual weight and centers
     itself under the reading pane instead of hugging the left edge. */
  .scene.reading .read-more-btn{ align-self:center; opacity:1; margin-top:6px; font-size:calc(var(--size-desc) * .96); letter-spacing:.02em; }
  /* =====================================================================
     "Read more" choreography — one sequence, one easing (var(--ease)):
       0ms     photo blurs/sinks away (existing .frame-img transition)
       200ms   title glides up
       450ms   hairline draws under the title, left→right (right→left in RTL)
       600ms   story comes into focus: soft top-to-bottom wipe + rise + de-blur
       1000ms  like/share bar fades in last
     "Go back" is deliberately NOT the reverse: the story fades out fast
     (~240ms, see .story-closing + toggleStory() in JS) and the photo returns.
     The wipe is a CSS mask on the whole pane rather than per-word/per-line
     <span>s: splitting text would mangle Arabic joining and mixed
     Arabic/Latin word order, and a mask needs no DOM changes at all.
     mask/animation live only inside the keyframes, so once the reveal
     finishes NOTHING is left applied to the (scrollable) story pane.
     ===================================================================== */
  .scene h2{ position:relative; }
  .scene h2::after{
    content:''; position:absolute; left:0; right:0; bottom:-9px; height:1px;
    background:var(--line); transform:scaleX(0); transform-origin:left center;
    pointer-events:none; transition:transform 240ms var(--ease);
  }
  .scene h2[dir="rtl"]::after{ transform-origin:right center; }
  .scene.reading h2::after{ transform:scaleX(1); transition:transform 900ms var(--ease) 450ms; }

  @keyframes storyRise{
    from{ transform:translateY(14px); filter:blur(var(--story-blur,7px)); }
    to{ transform:translateY(0); filter:blur(0); }
  }
  @keyframes storySweep{
    from{
      -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 44.4%,transparent 55.6%,transparent 100%);
      mask-image:linear-gradient(to bottom,#000 0,#000 44.4%,transparent 55.6%,transparent 100%);
      -webkit-mask-size:100% 225%; mask-size:100% 225%;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:0 100%; mask-position:0 100%;
    }
    to{
      -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 44.4%,transparent 55.6%,transparent 100%);
      mask-image:linear-gradient(to bottom,#000 0,#000 44.4%,transparent 55.6%,transparent 100%);
      -webkit-mask-size:100% 225%; mask-size:100% 225%;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:0 0; mask-position:0 0;
    }
  }
  @keyframes storyActionsIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .scene.reading p.caption.expanded{
    --story-blur:7px;
    animation:storyRise 1000ms var(--ease) 600ms backwards, storySweep 1300ms cubic-bezier(.4,.1,.3,1) 600ms backwards;
  }
  .scene.reading .scene-actions{ animation:storyActionsIn 700ms var(--ease) 1000ms backwards; }
  @media (max-width:767px){
    /* blurring a big pane is the costliest part on phones — keep the look, lighten the cost */
    .scene.reading p.caption.expanded{ --story-blur:3px; }
  }

  /* Go back: quick, quiet exit. The class is added by toggleStory() for
     ~240ms before the state actually collapses (photo returns). */
  .scene.story-closing p.caption.expanded{
    opacity:0; transform:translateY(6px); filter:blur(4px); animation:none;
    transition:opacity 200ms ease-out, transform 240ms var(--ease), filter 200ms ease-out;
  }
  .scene.story-closing .scene-actions{ opacity:0; animation:none; transition:opacity 180ms ease-out; }
  .scene.story-closing h2::after{ transform:scaleX(0); transition:transform 220ms var(--ease); }

  @media (prefers-reduced-motion: reduce){
    .scene.reading p.caption.expanded, .scene.reading .scene-actions{ animation:none !important; }
    .scene h2::after, .scene.reading h2::after{ transition:none !important; }
  }
  .action-btn{ display:flex; align-items:center; gap:9px; padding:12px 2px; min-height:44px; font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.01em; color:var(--white); }
  .story-btn.loading{ opacity:.5; pointer-events:none; }
  .story-btn.loading svg{ animation:storyBtnSpin 900ms linear infinite; }
  @keyframes storyBtnSpin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .story-btn.loading svg{ animation:none; } }
  .action-btn svg{ width:16px; height:16px; flex-shrink:0; stroke:currentColor; transform-origin:50% 50%; }
  .action-btn:active svg{ transform:scale(.86); transition:transform 120ms var(--ease); }
  @keyframes heartPulse{ 0%{ transform:scale(1); } 38%{ transform:scale(1.22); } 65%{ transform:scale(.94); } 100%{ transform:scale(1); } }
  .like-btn.pulse svg{ animation:heartPulse 420ms var(--ease); }
  .action-divider{ width:1px; height:14px; background:var(--line); }
  .like-count{ font-variant-numeric:tabular-nums; color:var(--dim); transition:color 200ms var(--ease); }
  .like-btn.liked .like-count{ color:var(--white); }
  .frame-counter{ font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.06em; font-variant-numeric:tabular-nums; color:var(--dim-2); }
  .frame-counter b{ color:var(--white); font-weight:500; }
  /* Revealed only for a logged-in admin — see the onAuthStateChange
     listener near createSbClient(), which toggles body.is-admin-viewer.
     Ordinary visitors never see this button; display:none also removes it
     from the tab order and accessibility tree, not just hides it visually. */
  .admin-only{ display:none; }
  body.is-admin-viewer .admin-only{ display:flex; }
  .action-divider.admin-only{ display:none; }
  body.is-admin-viewer .action-divider.admin-only{ display:block; }
  .edit-btn svg{ stroke:var(--dim); transition:stroke 200ms var(--ease); }
  .edit-btn:hover svg{ stroke:var(--white); }
  /* Icon-only (no visible "Edit" label — the aria-label on the button
     itself still covers accessibility) — .action-btn's own padding
     (12px 2px) was sized assuming an icon *and* a text label share the
     tap target; with just the 16px icon left, that shrinks the tap width
     down to ~20px, so this widens it back out to a normal comfortable
     target without changing the icon's own size or position. */
  .edit-btn{ padding:12px 12px; }
  /* Finale keeps the original full-bleed portrait treatment — it's a closing
     statement card, not a photo being showcased uncropped. */
  .scene.finale{ align-items:center; justify-content:center; text-align:center; padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b)); }
  .finale .frame-img{ position:absolute; inset:0; min-height:0; }
  .finale .frame-img img{ width:100%; height:100%; max-width:none; max-height:none; aspect-ratio:auto; object-fit:cover; filter:blur(6px) grayscale(.35) brightness(.7); }
  .finale.in-view .frame-img img{ filter:blur(0) grayscale(.28) brightness(.78); }
  .finale .scrim{ opacity:1; background:linear-gradient(rgba(2,2,2,.72), rgba(2,2,2,.9)); }
  .finale .scene-content{ align-items:center; max-width:640px; gap:22px; }
  .finale .social{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .finale .social a.social-text-link{ font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.14em; text-transform:uppercase; padding:14px 18px; border-bottom:1px solid var(--line); transition:border-color 300ms var(--ease), color 300ms var(--ease); }
  .finale .social a.social-text-link:hover{ border-color:var(--white); }
  /* The circular icon badges (see .social-badge above) are gated on
     .hero.ready in the hero context, but the finale scene reveals via its
     own .in-view class (see .finale.in-view .frame-img img above) — this
     mirrors that same reveal for badges rendered inside .finale. */
  .finale.in-view .social-badges .social-badge{ opacity:1; transform:translateY(0) scale(1); }
  .finale .signoff{ font-family:var(--font-display); font-style:italic; font-size:.9rem; color:var(--dim-2); margin:0; }
  .finale .teaser{ font-family:var(--font-display); font-style:italic; font-weight:400; font-size:1.05rem; color:var(--white); opacity:.92; margin:-6px 0 0; max-width:46ch; }

  /* "Continue Exploring" chapter-break card — same full-bleed/scrim
     treatment as .finale, but the whole card is a tap target that
     advances straight into the next unseen category (see the
     scroller click-delegation in JS, which reads data-next-slug). */
  .next-chapter{ cursor:pointer; }
  .next-chapter .frame-img img{ transition:transform 1400ms var(--ease); }

  /* Double-tap-to-like acknowledgment — the photo itself very briefly
     lifts in brightness/contrast and eases back, rather than any overlay
     or new visual element. Only ever runs once per successful like (see
     the JS trigger), and reduced-motion users already get filter:none
     !important below, which naturally cancels it. */
  @keyframes photoLikeFlash{
    0%{ filter:brightness(1) contrast(1); }
    35%{ filter:brightness(1.05) contrast(1.05); }
    100%{ filter:brightness(1) contrast(1); }
  }
  .scene .frame-img img.like-flash{ animation:photoLikeFlash 450ms ease-in-out; }
  .next-chapter.in-view .frame-img img{ transform:scale(1.045); }
  .next-chapter .next-chapter-btn{ pointer-events:none; }
  /* Small secondary link back to Hero A, sat above the card's own
     "Continue Exploring" tag. Kept deliberately quiet (dim, text-scale)
     so it never competes with the main "View [Category]" CTA — this is
     an escape hatch, not the card's purpose. pointer-events stays on
     (unlike .next-chapter-btn above) since this is its own real tap
     target; the click-delegation in JS checks for it before falling
     through to the whole-card "advance to next category" handler. */
  .next-chapter .back-home-btn{ position:relative; z-index:4; display:inline-flex; align-items:center; gap:9px; align-self:flex-start; background:none; border:none; padding:11px 3px; margin:-11px -3px 2px; font-family:var(--font-body); font-size:var(--size-meta); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); cursor:pointer; -webkit-tap-highlight-color:transparent; border-radius:2px; transition:color 300ms var(--ease); }
  .next-chapter .back-home-btn:hover, .next-chapter .back-home-btn:focus-visible{ color:var(--white); }
  .next-chapter .back-home-btn:focus-visible{ outline:1px solid var(--white); outline-offset:2px; }
  .next-chapter .back-home-btn svg{ width:14px; height:8px; flex:0 0 auto; }

  /* Sits at the top, below .cat-nav (which starts at top:calc(24px +
     safe-t) and runs roughly 70-80px tall) rather than at the bottom —
     the OS share sheet (both iOS and Android) slides up from the bottom
     edge and can cover a large chunk of the screen, which is exactly
     what was hiding this. z-index:80 already clears .cat-nav's own 50,
     so it sits cleanly above the tabs rather than behind them.
     Styled to match the site's own dark language (same rgba(5,5,5,.92) +
     blur(6px) as .admin-overlay, var(--line) hairline, var(--white) text)
     instead of the bright white pill it used to be — a solid white
     banner popping up over a photo reads as a foreign, generic "app"
     alert; this reads as one more quiet piece of the page itself. */
  .toast{
    position:fixed; left:50%; top:calc(88px + var(--safe-t)); transform:translate(-50%, -14px);
    background:rgba(5,5,5,.92); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:3px; box-shadow:0 8px 28px rgba(0,0,0,.45);
    color:var(--white); font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.02em;
    max-width:min(560px, calc(100% - 44px)); text-align:center;
    padding:13px 20px; z-index:80; opacity:0; transition:opacity 300ms var(--ease), transform 300ms var(--ease); pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }
  .empty-state{ height:100vh; height:100dvh; height:100svh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:var(--dim); font-family:var(--font-body); font-size:var(--size-nav); letter-spacing:.04em; }

  @media (min-width: 860px){
    .scene:not(.finale){ flex-direction:row; gap:76px; padding:calc(24px + var(--safe-t)) 72px calc(24px + var(--safe-b)); }
    .scene:not(.finale) .frame-img{ flex:0 1 auto; width:auto; max-width:54%; height:100%; min-height:0; }
    .scene:not(.finale) .scene-content{ flex:0 0 400px; max-width:400px; max-height:100%; overflow-y:auto; scrollbar-width:none; }
    .scene:not(.finale) .scene-content::-webkit-scrollbar{ display:none; }
    /* Photo → story transition on desktop: the normal side-by-side
       layout above is built for a short caption sitting next to the
       photo, not a full reading page, so reading mode drops back to the
       same centered, stacked composition mobile uses — same transition,
       one behavior, just wider. section.scene.reading (element + two
       classes) is used here purely to out-rank .scene:not(.finale)'s
       equal-specificity rules above regardless of source order. */
    section.scene.reading{ flex-direction:column; gap:20px; }
    section.scene.reading .frame-img{ max-width:100%; width:100%; }
    section.scene.reading .scene-content{ flex:0 0 auto; max-width:min(800px, calc(100% - 120px)); max-height:none; overflow-y:visible; }
  }
  @media (prefers-reduced-motion: reduce){
    .scene .frame-img img{ transition:none !important; transform:none !important; filter:none !important; opacity:1 !important; }
    .scene .frame-img, .scene .scrim, .scene h2, .scene p.caption.expanded, .scene-actions{ transition:none !important; }
    .scene.reading .frame-img{ opacity:0; filter:none; transform:none; }
    .scene .frame-img .wm-frame .photo-loader{ display:none !important; }
    .scene .tag, .scene h2, .scene p.caption, .scene-actions, .scene-rule{ transition:none !important; opacity:1 !important; transform:none !important; }
    .enter .arrow-line::after{ animation:none; }
    .hero .enter .arrow-line::after, .enter.hero-arrow .arrow-line::after{ animation:none; }
    .hero .enter .arrow-chevron, .enter.hero-arrow .arrow-chevron{ animation:none; }
    .grain{ display:none; }
    .like-btn.pulse svg{ animation:none; }
    .action-btn:active svg{ transform:none; }
    .signature-svg text{ stroke:none; fill-opacity:1 !important; transition:none !important; letter-spacing:normal !important; }
    .hero-backdrop img{ transition:none !important; opacity:1 !important; filter:none !important; }
    .hero-inner > *{ transition:none !important; opacity:1 !important; transform:none !important; }
    #hero .signature-wrap{ filter:none !important; }
    /* Only the entrance fade-in is disabled here — the hover lift/glow
       stays, since it's a small, user-triggered response rather than a
       looping or autoplaying motion. transform is intentionally NOT
       forced with !important (only opacity is): that would also pin it
       during :hover, since !important beats a pseudo-class's higher
       specificity — this just overrides the resting value so the
       entrance's translateY(10px)/scale(.9) offset doesn't apply, while
       leaving :hover/:focus-visible's own transform free to still win
       normally when they're active. */
    .social-badge{ transition:box-shadow 260ms var(--ease), background 260ms var(--ease), border-color 260ms var(--ease), transform 260ms var(--ease) !important; opacity:1 !important; transform:translateY(0) scale(1); }
