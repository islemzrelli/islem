  // Shared with the finale/contact scene below (see renderScenes()) so
  // both places can never drift out of sync — same platforms, same icons,
  // same link-building rules (about.* fields, WhatsApp digit-stripping).
  function socialLinksList(){
    return [
      about.instagram_url ? { label:'Instagram', href:about.instagram_url, icon:'instagram', external:true } : null,
      about.facebook_url  ? { label:'Facebook',  href:about.facebook_url,  icon:'facebook',  external:true } : null,
      about.tiktok_url    ? { label:'TikTok',     href:about.tiktok_url,    icon:'tiktok',    external:true } : null,
      about.contact_email ? { label:'Email',      href:'mailto:'+about.contact_email, icon:'email', external:false } : null,
      about.whatsapp_number ? (function(){
        var digits = String(about.whatsapp_number).replace(/[^0-9]/g, '');
        return digits ? { label:'WhatsApp', href:'https://wa.me/'+digits, icon:'whatsapp', external:true } : null;
      })() : null
    ].filter(Boolean);
  }
  // Same badge markup used for #heroContactA, #heroContact AND the finale
  // scene's social row — a plain string, since the finale is built as an
  // HTML string in renderScenes() rather than targeting an element by id
  // the way the two hero contact strips do.
  function socialBadgesHtml(links){
    if(!links.length) return '';
    return '<div class="social-badges">'+links.map(function(l){
      return '<a class="social-badge" href="'+escapeHtml(l.href)+'" aria-label="'+escapeHtml(l.label)+'"'+
        (l.external ? ' target="_blank" rel="noopener noreferrer"' : '')+'>'+
        '<img src="'+SOCIAL_ICON_DATA[l.icon]+'" alt="" aria-hidden="true">'+
      '</a>';
    }).join('')+'</div>';
  }

  // Renders into whichever hero element id is passed in — used for both
  // #heroContactA and #heroContact, so the two can never drift out of
  // sync. Each badge is a real <a> (not a button), so ctrl/cmd-click,
  // "open in new tab", and screen readers all work like a normal link —
  // the icon is decorative (aria-hidden) and the accessible name comes
  // from the platform label via aria-label, since there's no visible text.
  function renderHeroContact(elId){
    var el = document.getElementById(elId || 'heroContact');
    if(!el) return;

    var links = socialLinksList();

    if(!links.length){ el.innerHTML = ''; el.classList.remove('has-content'); return; }

    el.innerHTML = socialBadgesHtml(links);
    el.classList.add('has-content');
  }


  // The landing-page count is the total number of published photographs
  // across the whole gallery (not the currently filtered category) —
  // it's what the visitor sees before they've chosen anything. `photos`
  // is already the published-only, already-fetched collection loadPublicData
  // uses everywhere else, so this reuses that data rather than a new query.
  // The kicker line now shows a real starting count in the static HTML
  // (see #heroPhotoCount) and animates in immediately with the rest of the
  // hero text, instead of staying hidden until this network fetch resolves
  // — that hidden-until-loaded approach was what made the whole line pop
  // in late and briefly show "0". This just quietly corrects the number
  // in place once the fetch completes, in the rare case it's changed.
  function updateHeroPhotoCount(){
    if(!heroPhotoCountEl) return;
    heroPhotoCountEl.textContent = galleryPhotos().length;
  }

  // Reads about.hero_a_text / about.hero_b_text (see the SQL comment
  // "HERO TEXT CONTROL") and applies every admin-configurable hero
  // string + size/position/overlay value to the live DOM. A missing
  // column, a missing row, or a config that only sets some fields all
  // fall back to exactly the site's original hardcoded text/appearance —
  // the defaults objects below ARE that original copy, so an
  // unconfigured site (or one that hasn't run the migration yet) renders
  // pixel-identical to before this feature existed.
  //
  // *_scale multiplies the target line's existing responsive font-size
  // (a clamp()/rem value already in the CSS — see .hero-role etc.), never
  // replaces it with a fixed px size, so "bigger" stays proportionally
  // bigger on every screen. *_y is a small px nudge, clamped defensively
  // here (the admin UI's sliders already clamp it too) to a safe range
  // that can't push text into the corner mark / language switcher /
  // contact badges on any device.
  function applyHeroTextConfig(source){
    function clampScale(n){ n = parseFloat(n); return isFinite(n) ? Math.max(0.6, Math.min(1.8, n)) : 1; }
    function clampY(n){ n = parseFloat(n); return isFinite(n) ? Math.max(-30, Math.min(30, n)) : 0; }
    // block_y moves the ENTIRE text block (every line together) rather
    // than nudging one line — the actual fix for a specific photo's
    // subject landing right where the centered text block naturally sits
    // (e.g. a face behind the "Enter Gallery" button). Wider range than a
    // single line's clampY since shifting the whole block toward the top
    // or bottom of the frame is exactly the point, not a small nudge —
    // still bounded so it can't be pushed into the contact row/corner
    // mark/safe-area insets on any device.
    function clampBlockY(n){ n = parseFloat(n); return isFinite(n) ? Math.max(-160, Math.min(160, n)) : 0; }
    function clampOpacity(n){ n = parseFloat(n); return isFinite(n) ? Math.max(0, Math.min(1, n)) : 1; }
    function setExtraLine(id, cfg){
      var el = document.getElementById(id);
      if(!el) return;
      var show = !!(cfg && cfg.enabled && cfg.text && cfg.text.trim());
      el.style.display = show ? '' : 'none';
      el.textContent = show ? cfg.text : '';
    }

    // Accepts an optional stand-in data source so this same function can
    // run twice: once early and synchronously from a cached
    // localStorage snapshot (before the real fetch below has even
    // started — see the FOUC fix at fireHeroEntranceOnce()), and once
    // for real once loadPublicData()'s fetch resolves with the live
    // `about` row. Both calls go through identical logic, so there's
    // only ever one code path to keep correct.
    var src = source || about;
    var a = mergeHeroTextConfig(HERO_A_TEXT_DEFAULTS, src.hero_a_text);
    var b = mergeHeroTextConfig(HERO_B_TEXT_DEFAULTS, src.hero_b_text);

    // ---- Hero A ----
    var heroEl = document.getElementById('hero');
    var sigText = document.getElementById('signatureTextA');
    if(sigText && sigText.textContent !== a.name){
      sigText.textContent = a.name;
      // Only restart the draw-in animation if the hero has already been
      // revealed once (heroEntranceFired) — i.e. this is a genuine live
      // change, not just the early pre-fetch cache application setting
      // the starting text before anything is visible yet. Restarting
      // unconditionally would fire the animation a split second before
      // animateHeroEntrance() fires it again anyway (on the very first
      // load, whenever the cached name differs from the static HTML
      // fallback) — harmless, but redundant on every single load rather
      // than only on an actual after-the-fact change.
      if(heroEntranceFired && typeof animateSignature === 'function') animateSignature('signatureTextA');
    }
    var roleLine = document.getElementById('heroRoleLine');
    if(roleLine) roleLine.textContent = a.role;
    var enterLabel = document.getElementById('enterBtnLabel');
    if(enterLabel) enterLabel.textContent = a.button_label;
    setExtraLine('heroAExtra1', a.extra1);
    setExtraLine('heroAExtra2', a.extra2);
    if(heroEl){
      heroEl.style.setProperty('--sig-scale', clampScale(a.name_scale));
      heroEl.style.setProperty('--sig-y', clampY(a.name_y) + 'px');
      heroEl.style.setProperty('--role-scale', clampScale(a.role_scale));
      heroEl.style.setProperty('--role-y', clampY(a.role_y) + 'px');
      heroEl.style.setProperty('--extra1-scale', clampScale(a.extra1.scale));
      heroEl.style.setProperty('--extra1-y', clampY(a.extra1.y) + 'px');
      heroEl.style.setProperty('--extra2-scale', clampScale(a.extra2.scale));
      heroEl.style.setProperty('--extra2-y', clampY(a.extra2.y) + 'px');
      heroEl.style.setProperty('--scrim-opacity', clampOpacity(a.scrim_opacity));
      heroEl.style.setProperty('--block-y', clampBlockY(a.block_y) + 'px');
      heroEl.style.setProperty('--contact-scale', clampScale(a.contact_scale));
      heroEl.style.setProperty('--contact-y', clampY(a.contact_y) + 'px');
    }

    // ---- Hero B ----
    var heroWorkEl = document.getElementById('heroWork');
    var placeEl = document.getElementById('heroWorkPlace');
    if(placeEl) placeEl.textContent = b.location;
    var creditEl = document.getElementById('heroCreditLine');
    if(creditEl) creditEl.textContent = b.credit;
    var heroWorkEnterLabel = document.getElementById('heroWorkEnterLabel');
    if(heroWorkEnterLabel) heroWorkEnterLabel.textContent = b.button_label;
    setExtraLine('heroBExtra1', b.extra1);
    setExtraLine('heroBExtra2', b.extra2);
    if(heroWorkEl){
      heroWorkEl.style.setProperty('--place-scale', clampScale(b.location_scale));
      heroWorkEl.style.setProperty('--place-y', clampY(b.location_y) + 'px');
      heroWorkEl.style.setProperty('--credit-scale', clampScale(b.credit_scale));
      heroWorkEl.style.setProperty('--credit-y', clampY(b.credit_y) + 'px');
      heroWorkEl.style.setProperty('--extra1-scale', clampScale(b.extra1.scale));
      heroWorkEl.style.setProperty('--extra1-y', clampY(b.extra1.y) + 'px');
      heroWorkEl.style.setProperty('--extra2-scale', clampScale(b.extra2.scale));
      heroWorkEl.style.setProperty('--extra2-y', clampY(b.extra2.y) + 'px');
      heroWorkEl.style.setProperty('--scrim-opacity', clampOpacity(b.scrim_opacity));
      heroWorkEl.style.setProperty('--block-y', clampBlockY(b.block_y) + 'px');
      heroWorkEl.style.setProperty('--contact-scale', clampScale(b.contact_scale));
      heroWorkEl.style.setProperty('--contact-y', clampY(b.contact_y) + 'px');
    }
  }

  // "Continue Exploring" chapter-break/bridge card, appended right after
  // the finale/contact scene. Always points at the next category in the
  // infinite loop (categoryLoopList()/nextCategorySlugAfter()) — never
  // gated on session-visited state — so it's always present and the
  // finale never becomes a true dead end. Sits AFTER the finale on
  // purpose — About/Contact should never feel buried behind it, so it's
  // a bonus last stop before continuing, not a detour. Only returns ''
  // when there is truly nowhere to loop into (every category is empty).
  function nextChapterSceneHtml(){
    var nextSlug = nextCategorySlugAfter(currentCategorySlug);
    if(!nextSlug) return '';
    var nextCat = navCategoryList().find(function(c){ return c.slug === nextSlug; });
    if(!nextCat) return '';
    var nextCatPhotos = photosForCategory(nextSlug);
    var preview = nextCatPhotos.find(function(p){ return p.featured; }) || nextCatPhotos[0];
    var previewUrl = (preview && preview.image_url) || 'https://picsum.photos/seed/izrelli-' + nextSlug + '/1600/2400';
    return ''+
    '<section class="scene finale next-chapter" aria-label="Continue exploring" data-next-slug="'+escapeHtml(nextSlug)+'">'+
      '<div class="frame-img"><img '+sizedPhotoAttrs(previewUrl, heroSizeTarget())+' alt="" loading="lazy"></div>'+
      '<div class="scrim"></div>'+
      '<div class="scene-content">'+
        '<button type="button" class="back-home-btn" aria-label="Back to home">'+
          '<svg viewBox="0 0 20 11" aria-hidden="true"><path d="M19 10L10 1 1 10"/></svg>'+
          '<span>Back to the Beginning</span>'+
        '</button>'+
        '<span class="tag">Continue Exploring</span>'+
        '<h2>'+escapeHtml(nextCat.name)+'</h2>'+
        '<button type="button" class="enter next-chapter-btn hero-arrow" aria-label="View '+escapeHtml(nextCat.name)+'">'+
          '<span>View '+escapeHtml(nextCat.name)+'</span>'+
          '<span class="arrow-line" aria-hidden="true"></span>'+
          '<svg class="arrow-chevron" viewBox="0 0 20 11" aria-hidden="true"><path d="M1 1l9 9 9-9"/></svg>'+
        '</button>'+
      '</div>'+
    '</section>';
  }

  // The single per-photo scene template — full photo, scrim, title, story,
  // like/share/edit actions. Shared by renderScenes() (the category
  // gallery) and renderIntroStory() (the "Islem Zrelli" mini-story) below,
  // so the two are guaranteed to stay visually identical rather than two
  // copies quietly drifting apart. `eagerCount` controls how many of the
  // first photos in THIS list get an eager `src` (vs. lazy `data-src`
  // only, picked up by setupImageLazyLoading's IntersectionObserver) —
  // defaults to 2, matching the gallery's original tuning; renderIntroStory
  // passes its own full (small) list length, since all 3-4 intro photos
  // sit near the very top of the page anyway.
  function photoSceneHtml(s, i, total, eagerCount){
    var eager = eagerCount == null ? 2 : eagerCount;
    var num = String(i+1).padStart(2,'0');
    var isLiked = !!liked[s.id];
    var count = (s.likes || 0);
    var trTitle = tText(s, 'title');
    var trStory = tText(s, 'story');
    var langDir = currentLang === 'ar' ? ' dir="rtl"' : '';
    var isEager = i < eager;
    var displayUrl = sizedPhotoUrl(s.image_url, gallerySizeTarget());
    return ''+
    '<section class="scene" id="scene-'+s.id+'" data-index="'+(i+1)+'" data-id="'+s.id+'" data-slug="'+escapeHtml(s._slug)+'" aria-label="'+escapeHtml(trTitle)+'">'+
      '<div class="frame-img"><div'+wmFrameAttrs(s)+'><img '+(isEager?'src="'+escapeHtml(displayUrl)+'" ':'')+'data-src="'+escapeHtml(displayUrl)+'" data-orig="'+escapeHtml(s.image_url)+'" alt="'+escapeHtml(s.alt_text || s.title || 'Photograph by Islem Zrelli')+'" decoding="async" fetchpriority="'+(isEager?'high':'low')+'"><div class="photo-loader" aria-hidden="true"></div><div class="retry-photo" role="button" tabindex="0">Tap to retry</div></div></div>'+
      '<div class="scrim"></div>'+
      '<div class="scene-content">'+
        (trTitle ? '<h2'+langDir+'>'+escapeHtml(trTitle)+'</h2>' : '')+
        '<p class="caption clamped" id="caption-'+s.id+'"'+langDir+'>'+escapeHtml(trStory)+'</p>'+
        '<button type="button" class="read-more-btn" data-caption-id="caption-'+s.id+'">Read more</button>'+
        '<div class="scene-rule"></div>'+
        '<div class="scene-actions">'+
          '<div class="actions-left">'+
            '<button class="action-btn like-btn'+(isLiked?' liked':'')+'" data-id="'+s.id+'" aria-pressed="'+isLiked+'" aria-label="Like this photo">'+
              svgHeart(isLiked)+'<span class="like-count">'+count.toLocaleString()+'</span>'+
            '</button>'+
            '<span class="action-divider" aria-hidden="true"></span>'+
            '<button class="action-btn share-btn" data-id="'+s.id+'" data-title="'+escapeHtml(trTitle)+'" aria-label="Share this photo">'+
              svgShare+'<span>Share</span>'+
            '</button>'+
            '<span class="action-divider" aria-hidden="true"></span>'+
            '<button class="action-btn story-btn" data-id="'+s.id+'" aria-label="Share this photo to your Instagram Story">'+
              svgStory+'<span>Story</span>'+
            '</button>'+
            '<span class="action-divider admin-only" aria-hidden="true"></span>'+
            '<button class="action-btn edit-btn admin-only" data-id="'+s.id+'" aria-label="Edit this photo (admin)">'+
              svgEdit+
            '</button>'+
          '</div>'+
          '<div class="frame-counter"><b>'+num+'</b> — '+String(total).padStart(2,'0')+'</div>'+

  }

  // Populates #introStory (the "Islem Zrelli" mini-story between the two
  // hero screens) from the hidden "Islem Zrelli" category's photos, if the
  // admin has set one up — see the SQL comment block near the top of this
  // file for the one-time setup steps. Deliberately does NOT fall back to
  // photosForCategory()'s own "category not found" behavior (which returns
  // every photo) — no configured category should mean no intro story, not
  // every photograph on the site rendered twice.
  //
  // Called once on initial load (before the first renderScenes(), so its
  // .scene elements exist in the DOM in time for that call's own
  // setupSceneBehavior() to pick them up — see navSlides() below for how
  // they're woven into scroll navigation) and again on every language
  // switch (so the intro story's title/story text stays in sync, the same
  // way renderScenes() does for the gallery) — but never on category
  // switches, since it has nothing to do with which category is active.
  function renderIntroStory(){
    var introEl = document.getElementById('introStory');
    if(!introEl) return;
    var aboutCat = aboutIslemCategory();
    var list = aboutCat ? photosForCategory(ISLEM_INTRO_SLUG) : [];
    if(!list.length){ introEl.innerHTML = ''; return; }
    var html = '';
    list.forEach(function(s, i){ html += photoSceneHtml(s, i, list.length, list.length); });
    introEl.innerHTML = html;
  }

  function renderScenes(){
    var list = activePhotos;
    var total = list.length;
    var scenesTrack = document.getElementById('scenesTrack');

    if(total === 0){
      scenesTrack.innerHTML = '<div class="empty-state">No photographs in this category yet.</div>';
      return;
    }

    var html = '';
    list.forEach(function(s, i){
      html += photoSceneHtml(s, i, total, 2);
    });

    var hasNextChapter = !!nextCategorySlugAfter(currentCategorySlug);

    html += ''+
    '<section class="scene finale" aria-label="Contact">'+
      '<div class="frame-img"><img '+sizedPhotoAttrs(about.profile_image_url || 'https://picsum.photos/seed/izrelli-finale/1600/2400', heroSizeTarget())+' alt="Islem Zrelli" loading="lazy"></div>'+
      '<div class="scrim"></div>'+
      '<div class="scene-content">'+
        '<span class="tag">'+escapeHtml(about.finale_tag || 'End of the Story — For Now')+'</span>'+
        '<h2>'+escapeHtml(about.finale_heading || 'Let\'s Tell the Next One')+'</h2>'+
        '<p class="caption">'+escapeHtml(about.short_bio || 'Available for documentary commissions, environmental campaigns and collaborations across the Mediterranean and beyond.')+'</p>'+
        (about.next_project ? '<p class="teaser">'+escapeHtml(about.next_project)+'</p>' : '')+
        '<div class="social">'+
          socialBadgesHtml(socialLinksList())+
          // Vimeo and Journal have no icon in SOCIAL_ICON_DATA yet, so
          // they stay as plain text links alongside the icon row rather
          // than being silently dropped.
          (about.vimeo_url ? '<a class="social-text-link" href="'+escapeHtml(about.vimeo_url)+'" target="_blank" rel="noopener noreferrer">Vimeo</a>' : '')+
          (about.journal_url ? '<a class="social-text-link" href="'+escapeHtml(about.journal_url)+'" target="_blank" rel="noopener noreferrer">Journal</a>' : '')+
        '</div>'+
        '<p class="signoff">'+escapeHtml(about.name || 'Islem Zrelli')+' — Tunisia</p>'+
        (hasNextChapter ? '<button type="button" class="enter continue-cue hero-arrow" aria-label="Continue exploring the next chapter"><span>Continue Exploring</span><span class="arrow-line" aria-hidden="true"></span><svg class="arrow-chevron" viewBox="0 0 20 11" aria-hidden="true"><path d="M1 1l9 9 9-9"/></svg></button>' : '')+
      '</div>'+
    '</section>';

    html += nextChapterSceneHtml();

    scenesTrack.innerHTML = html;
    setupSceneBehavior();
    setupReadMore();

  // Every photo now opens into the full photo → story transition (see
  // .scene.reading in the CSS above), not just ones whose caption
  // overflows its 4-line clamp — so the "Read more" control always
  // shows, rather than only appearing when there's literally more text
  // to reveal. Re-run on every renderScenes() (category switch, language
  // switch, initial load all rebuild the DOM from scratch), kept as its
  // own pass in case future per-caption conditions are needed again.
  // ---- Story open/close state --------------------------------------
  // A story opens ONLY when the visitor taps "Read more", and closes ONLY
  // when they tap "Go back" (or explicitly jump elsewhere via the category
  // nav / home, which reset it). While it's open the page scroller is
  // locked (see .scroller.reading-lock), so scrolling can neither leave
  // the story nor leave one "still open" to reappear later.
  function isStoryOpen(){ return !!document.querySelector('.scene.reading'); }
  function syncReadingLock(){
    if(scroller) scroller.classList.toggle('reading-lock', isStoryOpen());
  }
  function closeAllStories(){
    document.querySelectorAll('.scene.reading').forEach(function(sceneEl){
      sceneEl.classList.remove('reading', 'story-closing');
      var cap = sceneEl.querySelector('p.caption');
      if(cap){ cap.classList.remove('expanded'); cap.classList.add('clamped'); cap.scrollTop = 0; }
      var b = sceneEl.querySelector('.read-more-btn');
      if(b){ b.textContent = 'Read more'; b.setAttribute('aria-expanded', 'false'); }
    });
    syncReadingLock();
  }
  // Opens/closes ONE story. Opening applies everything at once (the CSS
  // choreography — see "Read more" choreography above — handles the timing).
  // Closing first plays a short fade-out (.story-closing) and only then
  // collapses, so the text never just snaps away; taps during that fade are
  // ignored, and reduced-motion users skip the wait entirely.
  var STORY_CLOSE_MS = 240;
  function applyStoryState(sceneEl, caption, btn, open){
    caption.classList.toggle('expanded', open);
    caption.classList.toggle('clamped', !open);
    if(!open) caption.scrollTop = 0; // collapsing mid-scroll shouldn't leave the next reveal scrolled partway down
    if(sceneEl){
      sceneEl.classList.remove('story-closing');
      // Drives the whole photo → story transition (see .scene.reading in
      // the CSS): photo fades/collapses, scrim darkens, title lifts, the
      // caption becomes the reading pane. Kept in sync with .expanded.
      sceneEl.classList.toggle('reading', open);
    }
    btn.textContent = open ? 'Go back' : 'Read more';
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    syncReadingLock();
    updateScrollNavState();
  }
  function toggleStory(btn){
    var caption = document.getElementById(btn.getAttribute('data-caption-id'));
    if(!caption) return;
    var sceneEl = caption.closest('.scene');
    if(sceneEl && sceneEl.classList.contains('story-closing')) return; // mid fade-out: ignore extra taps
    if(!caption.classList.contains('expanded')){ applyStoryState(sceneEl, caption, btn, true); return; }
    if(!sceneEl || reduceMotion){ applyStoryState(sceneEl, caption, btn, false); return; }
    sceneEl.classList.add('story-closing');
    setTimeout(function(){
      // closeAllStories()/a re-render may have reset this scene meanwhile — only finish if still closing
      if(sceneEl.classList.contains('story-closing')) applyStoryState(sceneEl, caption, btn, false);
    }, STORY_CLOSE_MS);
  }

  function setupReadMore(){
    syncReadingLock(); // a re-render rebuilt the DOM — drop the lock if no story is open any more
    document.querySelectorAll('.read-more-btn').forEach(function(btn){
      // See the NOTE this used to carry: .read-more-btn's only display
      // rule in the stylesheet is "display:none", so an explicit
      // non-none value is required to actually reveal it — clearing the
      // inline style would just fall back to that same hidden default.
      btn.style.display = 'inline-block';
      btn.textContent = 'Read more';
      btn.setAttribute('aria-expanded', 'false');
    });
  }

  var ioInstance = null;
  var imgNearObserver = null, imgFarObserver = null;
  // Custom image loading, not relying on the browser's native loading="lazy" —
  // some in-app/embedded browsers (this is what was crashing in Telegram's
  // in-app browser) don't reliably honor it, and with hundreds of photos that
  // means every full-size image trying to load at once. This preloads a
  // photo shortly before it's needed and frees it again once you've
  // scrolled well past it, so memory use stays bounded regardless of gallery size.
  // Drives the .is-loaded class that the CSS entrance transition above
  // keys off of — the single source of truth for "should this photo be
  // visible yet", called anywhere a photo's src is set, cleared or
  // re-set. Cheap to call repeatedly: it no-ops once a given src has
  // already been armed, so re-observing an already-loaded photo (e.g. a
  // scene re-entering view) never replays the reveal. Keyed off the src
  // value itself (not just presence/absence) so a photo that's unloaded
  // by imgFarObserver and later reloaded is correctly treated as loading
  // again rather than staying stuck in its old "loaded" state.
  // A ~1-2KB, heavily blurred rendition of the photo, used as the
  // wm-frame's own CSS background so there's something recognizable on
  // screen (colors/shapes of the actual photo, not just a dark box)
  // before the full photo has finished loading — the classic "blur-up"
  // placeholder. No load listener needed for this one: a CSS
  // background simply paints whenever its bytes arrive, and it already
  // sits behind the real <img> by definition (backgrounds always paint
  // below element content), so there's nothing to sequence — it's just
  // what's visible until the real photo (which starts at opacity:0
  // above it) finishes revealing itself.
  function lqipUrl(url){
    if(!url) return '';
    return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=24&q=40&blur=12&output=webp';
  }
  function setLqipBackground(img){
    var frame = img.closest('.wm-frame');
    var orig = img.dataset.orig;
    if(!frame || !orig || frame.dataset.lqipSet) return; // once per photo is enough — it never changes
    frame.style.backgroundImage = 'url("' + lqipUrl(orig) + '")';
    frame.style.backgroundSize = 'cover';
    frame.style.backgroundPosition = 'center';
    frame.dataset.lqipSet = '1';
  }
  // ---- Persistent, session-wide load bookkeeping -------------------------
  // Keyed by the actual resolved URL (not by DOM element — elements get
  // thrown away and recreated on every category/language switch, but the
  // same photo's URL is stable across that). This is what makes a
  // re-render idempotent: a photo we've already shown once this session
  // reveals INSTANTLY on redraw, with no spinner and no replayed
  // blur-in — it never looks like it's "loading" a second time.
  var loadedPhotoUrls = Object.create(null);   // url -> true once successfully decoded
  var failedPhotoUrls = Object.create(null);   // original-url -> attempt count, so a hard-failing photo isn't re-hammered every time it scrolls back into range
  var pendingTimers = new WeakMap();           // img -> timeout id, so a stale timer from a previous src can never fire against a repurposed element
  var LOAD_TIMEOUT_MS = 9000;                  // if neither load nor error has fired by here, the request is presumed hung — this is what stops "stuck forever"
  var MAX_ATTEMPTS_PER_PHOTO = 2;              // resized rendition, then one direct-original fallback — beyond that we stop retrying and show the retry affordance instead
  var FREE_COOLDOWN_MS = 1500;                 // an image can't be freed by the far observer within this long of being armed — kills any near/far boundary thrash
  function clearPendingTimer(img){
    var t = pendingTimers.get(img);
    if(t){ clearTimeout(t); pendingTimers.delete(img); }
  }

  // ---- Small concurrency gate for background (non-eager) loads -----------
  // Without this, a big rootMargin meant every photo drifting into range
  // could start downloading its full-size rendition at once — on a slow
  // connection that's bandwidth contention that makes the ONE photo the
  // visitor is actually looking at take far longer to appear, and the
  // pile-up of simultaneous blur/opacity/filter transitions is what read
  // as stuttering "flashing". Eager (already-src'd) photos bypass this
  // entirely, same as before; only observer-triggered background loads
  // queue behind it.
  var MAX_BACKGROUND_LOADS = 2;
  var activeBackgroundLoads = 0;
  var loadQueue = [];
  function startLoad(img, src){
    img.setAttribute('src', src);
    armPhotoReveal(img);
  }
  function requestLoad(img, src){
    if(activeBackgroundLoads < MAX_BACKGROUND_LOADS){
      activeBackgroundLoads++;
      img.dataset.queuedLoad = '1';
      startLoad(img, src);
    } else if(loadQueue.indexOf(img) === -1){
      loadQueue.push(img);
    }
  }
  function releaseLoadSlot(img){
    if(img.dataset.queuedLoad){
      delete img.dataset.queuedLoad;
      activeBackgroundLoads = Math.max(0, activeBackgroundLoads - 1);
    }
    var i = loadQueue.indexOf(img);
    if(i !== -1) loadQueue.splice(i, 1); // no longer needed (freed before its turn) — drop it rather than loading something off-screen
    while(loadQueue.length && activeBackgroundLoads < MAX_BACKGROUND_LOADS){
      var next = loadQueue.shift();
      if(!document.body.contains(next)) continue; // stale — its scene was torn down by a re-render before its turn came up
      var nextSrc = next.getAttribute('data-src');
      if(!nextSrc || next.getAttribute('src') === nextSrc) continue;
      activeBackgroundLoads++;
      next.dataset.queuedLoad = '1';
      startLoad(next, nextSrc);
    }
  }

  function armPhotoReveal(img){
    if(!img) return;
    var src = img.getAttribute('src');
    if(!src){
      clearPendingTimer(img);
      releaseLoadSlot(img);
      img.classList.remove('is-loaded', 'is-error');
      var frame0 = img.closest('.wm-frame');
      if(frame0) frame0.classList.remove('load-error');
      delete img.dataset.revealSrc;
      return;
    }
    if(img.dataset.revealSrc === src) return; // already armed for this exact resource — no-op, so redundant observer callbacks can never replay the reveal
    clearPendingTimer(img);
    img.dataset.revealSrc = src;
    img.dataset.armedAt = String(Date.now()); // protects this photo from the far observer's free-cooldown for a moment, regardless of how it was armed
    var frame = img.closest('.wm-frame');
    if(frame) frame.classList.remove('load-error');
    setLqipBackground(img);

    // Already shown successfully once this session — the browser's HTTP
    // cache makes the actual request instant either way, but jumping
    // straight to the finished state also skips the spinner and the
    // blur-in transition, so a revisited (or re-rendered) photo never
    // looks like it's loading again.
    if(loadedPhotoUrls[src]){
      img.classList.remove('is-error');
      img.classList.add('is-loaded');
      releaseLoadSlot(img);
      return;
    }

    img.classList.remove('is-loaded', 'is-error');

    function finalizeSuccess(){
      clearPendingTimer(img);
      loadedPhotoUrls[src] = true;
      delete failedPhotoUrls[img.dataset.orig];
      img.classList.add('is-loaded');
      releaseLoadSlot(img);
    }
    // `load` firing doesn't guarantee the browser has finished decoding
    // the pixel data yet — decoding="async" (needed for the in-app-
    // browser fix noted above) explicitly lets it happen after `load`.
    // Starting the blur/scale/opacity transition right at `load` could
    // then race actual decode work, which is what showed up as a
    // flickery jitter on larger (desktop-sized) photos — see
    // revealAfterDecode().
    function revealWhenDecoded(){ revealAfterDecode(img, finalizeSuccess); }

    function finalizeFailure(){
      clearPendingTimer(img);
      img.classList.remove('is-loaded');
      img.classList.add('is-error');
      if(frame) frame.classList.add('load-error');
      releaseLoadSlot(img);
    }
    function attemptFallbackOrGiveUp(){
      var orig = img.dataset.orig;
      var attempts = failedPhotoUrls[orig] || 0;
      if(orig && img.getAttribute('src') !== orig && attempts + 1 < MAX_ATTEMPTS_PER_PHOTO){
        failedPhotoUrls[orig] = attempts + 1;
        img.removeEventListener('load', revealWhenDecoded);
        img.removeEventListener('error', onError);
        img.setAttribute('src', orig); // retry once directly against the original, untransformed photo, in case the resize proxy itself is what's unreachable
        delete img.dataset.revealSrc;  // src changed — let armPhotoReveal treat this as a genuinely new attempt
        armPhotoReveal(img);
        return;
      }
      failedPhotoUrls[orig] = MAX_ATTEMPTS_PER_PHOTO; // remembered for the rest of the session — scrolling this photo out and back never re-hammers a URL that's already proven broken
      finalizeFailure();
    }
    function onError(){ attemptFallbackOrGiveUp(); }

    // Some connections (slow mobile, or the wsrv.nl resize proxy under
    // load) neither fire `load` nor `error` — the request just hangs.
    // Left alone, that scene stays in its loading state forever. This
    // timeout is what turns a hung request into the same fallback/retry
    // path a hard error would take, instead of a permanently blank photo.
    var timer = setTimeout(function(){
      img.removeEventListener('load', revealWhenDecoded);
      img.removeEventListener('error', onError);
      attemptFallbackOrGiveUp();
    }, LOAD_TIMEOUT_MS);
    pendingTimers.set(img, timer);

    // Already-cached images fire no `load` event once src is (re)assigned
    // to the same resolved URL — .complete + naturalWidth catches those
    // so they still reveal instead of sitting hidden forever. decode()
    // resolves immediately (no extra work) if it's already decoded.
    if(img.complete && img.naturalWidth){ revealWhenDecoded(); }
    else {
      img.addEventListener('load', revealWhenDecoded, { once:true });
      img.addEventListener('error', onError, { once:true });
    }
  }

  function setupImageLazyLoading(){
    if(imgNearObserver) imgNearObserver.disconnect();
    if(imgFarObserver) imgFarObserver.disconnect();
    loadQueue.length = 0; activeBackgroundLoads = 0; // fresh gallery view (category/language switch) — don't carry a stale queue referencing scenes that no longer exist
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.frame-img img[data-src]'));
    if(!imgs.length) return;
    imgs.forEach(function(img){
      armPhotoReveal(img); // picks up eager (already-src'd) photos — these bypass the queue entirely, same priority as before
      var retryBtn = img.closest('.wm-frame');
      retryBtn = retryBtn && retryBtn.querySelector('.retry-photo');
      if(retryBtn && !retryBtn.dataset.wired){
        retryBtn.dataset.wired = '1';
        retryBtn.addEventListener('click', function(){
          var dataSrc = img.getAttribute('data-src');
          if(!dataSrc) return;
          delete failedPhotoUrls[img.dataset.orig];
          delete img.dataset.revealSrc; // force a genuinely fresh attempt, not a no-op
          img.setAttribute('src', dataSrc);
          armPhotoReveal(img);
        });
      }
    });
    imgNearObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        var img = entry.target;
        var src = img.getAttribute('data-src');
        if(!src) return;
        if(img.getAttribute('src') === src){ armPhotoReveal(img); return; }
        // A background load (not the current, already-eager photo) —
        // goes through the small concurrency queue so it never competes
        // for bandwidth with whatever the visitor is actually looking at.
        requestLoad(img, src);
      });
      // Photos that just entered view outrank ones only queued because
      // they were nearby — bump anything now on-screen to the front.
      loadQueue.sort(function(a, b){
        var ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        return Math.abs(ra.top) - Math.abs(rb.top);
      });
    }, { root: scroller, rootMargin: '120% 0px', threshold: 0 });
    imgFarObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting) return;
        var img = entry.target;
        var armedAt = parseInt(img.dataset.armedAt || '0', 10);
        if(Date.now() - armedAt < FREE_COOLDOWN_MS) return; // just loaded — never tear down and re-request within the same gesture
        if(img.getAttribute('src')){
          img.removeAttribute('src'); // data-src keeps the URL so it reloads on the way back
          armPhotoReveal(img);
        }
      });
    }, { root: scroller, rootMargin: '280% 0px', threshold: 0 });
    imgs.forEach(function(img){ imgNearObserver.observe(img); imgFarObserver.observe(img); });
  }

  function setupSceneBehavior(){
    var allScenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
    if(ioInstance) ioInstance.disconnect();
    ioInstance = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.55){
          entry.target.classList.add('in-view');
          // No title/URL updates while a deep link is unresolved, and none from an entry that no
          // longer describes what's on screen (entries can be delivered after the page has moved on).
          if(routeHold() || visibleRatio(entry.target) < 0.45) return;
          var slug = entry.target.getAttribute('data-slug');
          if(slug){
            var match = photos.find(function(p){ return p._slug === slug; });
            if(match) updateHeadForPhoto(match);
            // Keeps the address bar itself as the single source of truth for
            // "what the visitor is currently looking at" — a plain refresh,
            // opening this URL in a new tab, or sharing it all resolve back
            // to this exact photo via applyInitialRoute(), with no reliance
            // on any in-memory variable or localStorage guess. replaceState
            // (never pushState) on purpose: this fires on every ordinary
            // scroll step, and turning each one into a Back-button stop
            // would make Back nearly unusable — category switches already
            // get their own real history entry in selectCategory().
            syncPhotoUrl({ _slug: slug });
          } else {
            resetHeadToDefault();
            // A non-photo scene (a category's "Continue Exploring" card, or
            // the final contact panel) has no /work/ URL of its own — fall
            // back to the category root so a refresh here still lands
            // somewhere sensible inside the same category rather than on a
            // stale photo URL.
            if(currentCategorySlug) safeHistory('replaceState', { category: currentCategorySlug }, categoryUrlPath(currentCategorySlug));
          }
        } else if (entry.intersectionRatio < 0.15) {
          entry.target.classList.remove('in-view');
        }
      });
    }, { root: scroller, threshold:[0, .15, .55, .8] });
    allScenes.forEach(function(s){ ioInstance.observe(s); });
    requestAnimationFrame(function(){
      if(allScenes[0]){
        allScenes[0].classList.add('in-view');
      }
    });

    setupImageLazyLoading();
    window._allScenes = allScenes;
    updateScrollNavState();
  }

  // Tracks the hero itself so scrolling back up to it — and refreshing or
  // sharing the URL from there — resolves back to the plain landing page,
  // same URL-is-truth principle as the scene observer above. Set up once;
  // the hero element is never replaced by renderScenes(), unlike the
  // scenes it observes above.
  (function setupHeroUrlTracking(){
    if(!heroEl || !scroller) return;
    var firstNotification = true;
    var heroObserver = new IntersectionObserver(function(entries){
      // ROOT CAUSE of the "shared /work/<slug>/ link opens the homepage" bug. This observer is created
      // at parse time; its FIRST notification just reports where things stand at load ("the hero is
      // on screen" — true for a moment even on a deep link, because the scroller is only hidden, not
      // laid out elsewhere yet) and used to answer it with replaceState(<landing URL>). That fired
      // ~1 frame after load — before the Supabase fetch could possibly return — erasing
      // /work/<slug>/, so applyInitialRoute() then saw a plain landing visit. Now:
      //  - the initial notification is not a "scrolled back to the hero" event, so it is ignored;
      //  - nothing is written while a deep link is unresolved (routeHold());
      //  - a later entry must still be true NOW (entries can arrive after the page has moved on).
      var initial = firstNotification;
      firstNotification = false;
      if(initial || routeHold()) return;
      entries.forEach(function(entry){
        if(entry.isIntersecting && entry.intersectionRatio > 0.5 && visibleRatio(heroEl) >= 0.45) safeHistory('replaceState', {}, BASE_PATH + '/');
      });
    }, { root: scroller, threshold:[0, .5] });
    heroObserver.observe(heroEl);
  })();

  // Fades Hero B's text in the same way animateHeroEntrance() does for the
  // landing hero, except triggered by scrolling into view rather than page
  // load — Hero B is never the first thing a visitor sees, so there's no
  // "on load" moment for it. One-time: once revealed it stays revealed,
  // same as every other scene's own in-view treatment; the observer
  // disconnects itself after the first reveal rather than sitting there
  // toggling .ready back and forth on every scroll past.
  (function setupHeroWorkReveal(){
    if(!heroWorkEl || !scroller) return;
    if(reduceMotion){ heroWorkEl.classList.add('ready'); return; }
    var workObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          heroWorkEl.classList.add('ready');
          workObserver.disconnect();
        }
      });
    }, { root: scroller, threshold:0.15 });
    workObserver.observe(heroWorkEl);
  })();

  // Desktop/trackpad "TikTok-style" scene advance, shared by wheel input
  // (see the listener below) and the up/down .scroll-nav buttons. Touch is
  // left to native momentum + CSS scroll-snap:mandatory (tuned above), which
  // already guarantees landing on a full scene on phones. Wheel input and
  // button clicks don't have that native momentum-to-snap behavior, so this
  // buffers a short burst of wheel deltas (or a single button press) into
  // one deliberate move that always lands exactly on a scene.
  var sceneNav = (function setupSceneNav(){
    var isAnimating = false;
    var scrollAnimFrame = null;
    var wheelBuffer = 0;
    var wheelTimer = null;
    var ADVANCE_DURATION = 420; // ms — matches the site's --dur-1 easing feel
    var BUFFER_WINDOW = 70;     // ms — how long a wheel "burst" is allowed to accumulate

    function easeOutExpo(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); } // close match to var(--ease)

    function cancelAnim(){
      if(scrollAnimFrame){ cancelAnimationFrame(scrollAnimFrame); scrollAnimFrame = null; }
      isAnimating = false;
    }

    function animateScrollTo(targetTop){
      cancelAnim();
      var startTop = scroller.scrollTop;
      var distance = targetTop - startTop;
      if(Math.abs(distance) < 1) return;
      isAnimating = true;
      // scroll-snap-type:mandatory (see .scroller) fights a manually-driven
      // scrollTop animation on some browsers — once our per-frame writes
      // stop, the browser re-asserts its own snap and can land one scene
      // further than intended, which reads as the advance "skipping" a
      // photo. Suspending snap for the duration of the animation and
      // restoring it the instant we land exactly on the target scene
      // avoids that fight entirely.
      scroller.style.scrollSnapType = 'none';
      var startTime = null;
      function step(ts){
        if(startTime === null) startTime = ts;
        var t = Math.min(1, (ts - startTime) / ADVANCE_DURATION);
        scroller.scrollTop = startTop + distance * easeOutExpo(t);
        if(t < 1){ scrollAnimFrame = requestAnimationFrame(step); }
        else { isAnimating = false; scrollAnimFrame = null; scroller.style.scrollSnapType = ''; }
      }
      scrollAnimFrame = requestAnimationFrame(step);
    }

    // The full slide list for navigation purposes: the hero counts as
    // slide 0, followed by every "Islem Zrelli" intro-story scene (if any
    // — see renderIntroStory()), then Hero B (the work-title screen, if
    // present), then every regular .scene (photos + finale). Built fresh
    // on every call rather than cached, since which intro scenes exist
    // can change on a language switch (renderIntroStory() rebuilds them)
    // and window._allScenes is rebuilt on every renderScenes() too.
    // window._allScenes conflates intro-story scenes and gallery scenes
    // (both are plain .scene elements, queried document-wide by
    // setupSceneBehavior — see its own comment) — introScenes is split out
    // here specifically so Hero B can be inserted between the two groups.
    function navSlides(){
      var introScenes = Array.prototype.slice.call(document.querySelectorAll('#introStory .scene'));
      var gallery = (window._allScenes || []).filter(function(s){ return introScenes.indexOf(s) === -1; });
      var slides = [heroEl].concat(introScenes);
      if(heroWorkEl) slides.push(heroWorkEl);
      return slides.concat(gallery);
    }

    function currentSceneIndex(){
      var slides = navSlides();
      var best = 0, bestDist = Infinity;
      slides.forEach(function(s, i){
        var d = Math.abs(s.offsetTop - scroller.scrollTop);
        if(d < bestDist){ bestDist = d; best = i; }
      });
      return best;
    }

    // Splits navSlides() into "the one-time landing prelude" (hero, the
    // Islem Zrelli intro story, Hero B) and "the current category's
    // gallery" (its photos + finale + the always-present bridge card),
    // and returns the index at which the gallery portion begins (-1 if
    // the current category has no photos at all, e.g. mid-render). Used
    // to know when a scroll/swipe/wheel step is about to leave the
    // gallery — which is exactly when the infinite category loop needs to
    // take over instead of the normal clamp.
    function galleryBounds(){
      var slides = navSlides();
      var introScenes = Array.prototype.slice.call(document.querySelectorAll('#introStory .scene'));
      var gallery = (window._allScenes || []).filter(function(s){ return introScenes.indexOf(s) === -1; });
      var start = gallery.length ? slides.indexOf(gallery[0]) : -1;
      return { slides: slides, start: start };
    }

    function isInGallery(){
      var b = galleryBounds();
      if(b.start === -1) return false;
      return currentSceneIndex() >= b.start;
    }

    // True when the currently active category is the very first one in
    // the infinite loop's order (FAVOURITE, normally — see
    // categoryLoopList()). That category is the one true "start" of the
    // photography experience: scrolling backward past its first photo
    // should drop back into Hero A (the landing page), not wrap around to
    // the last category the way every other category's backward step
    // does. Scrolling forward from Hero A afterward naturally lands back
    // on this exact same category's first photo, since nothing about
    // currentCategorySlug/activePhotos changes along the way — just the
    // scroll position.
    function isFirstLoopCategory(){
      var list = categoryLoopList();
      return !!(list.length && list[0].slug === currentCategorySlug);
    }

    // Moves into the next (dir 1) or previous (dir -1) category in the
    // infinite loop, wrapping at both ends — see categoryLoopList()/
    // nextCategorySlugAfter()/prevCategorySlugBefore(). Forward entry
    // lands on the new category's first photo (the normal
    // selectCategory() default); backward entry lands on its finale, so
    // continuing to scroll backward keeps walking through its photos in
    // reverse rather than re-entering it at the top.
    function advanceCategory(dir){
      var targetSlug = dir > 0 ? nextCategorySlugAfter(currentCategorySlug) : prevCategorySlugBefore(currentCategorySlug);
      if(!targetSlug) return; // nowhere to loop into — every category is empty
      selectCategory(targetSlug, { enterAt: dir > 0 ? 'start' : 'end' });
    }

    function goToSceneIndex(i){
      // A story is open: no scrolling to another scene until the visitor
      // taps "Go back" (covers the up/down buttons, arrow keys, the
      // continue cue and every other caller).
      if(isStoryOpen()) return;
      // Nothing may move the gallery while a deep link is still being resolved (or is showing its
      // not-found/error screen) — arrow keys, wheel, buttons and the continue cue all funnel through here.
      if(routeHold()) return;
      var b = galleryBounds();
      var slides = b.slides;
      if(!slides.length) return;
      var lastIndex = slides.length - 1;

      // Once inside the photography experience (any category's photos),
      // forward navigation must never dead-end: past the last slide
      // always continues into the next category, cyclically. Backward
      // navigation loops the same way from any category EXCEPT the very
      // first one in the loop — there, scrolling past the first photo
      // instead falls through to the plain clamp below, which naturally
      // carries the visitor back into Hero B, the intro story, and Hero A
      // in that order, exactly like the one-time landing prelude always
      // has. Only checked while actually IN the gallery, so none of this
      // ever hijacks ordinary hero/intro-story/Hero B navigation itself.
      if(b.start !== -1 && currentSceneIndex() >= b.start){
        if(i > lastIndex){ advanceCategory(1); return; }
        if(i < b.start && !isFirstLoopCategory()){ advanceCategory(-1); return; }
      }

      i = Math.max(0, Math.min(lastIndex, i));
      animateScrollTo(slides[i].offsetTop);
    }

    scroller.addEventListener('wheel', function(e){
      if(window.innerWidth < 768) return; // touch devices use native scroll+snap instead
      // Reading a story (.scene.reading — see the photo → story
      // transition CSS above): pause the wheel-driven scene advance
      // entirely while it's open, not just while the pointer happens to
      // be over the caption's own scrollable text. A story sitting open
      // over a darkened, collapsed photo should never get swept away by
      // a scroll that lands on the title or the dark backdrop around
      // it — only the text itself (.caption.expanded) actually needs
      // its native scroll passed through, everywhere else in an open
      // story just does nothing rather than advancing the gallery.
      if(isStoryOpen()){
        // Story open: only the text box itself may scroll (natively).
        // Everywhere else the wheel is swallowed, so it can never fall
        // through to the scroller's native scroll-snap and advance.
        if(!e.target.closest('.caption.expanded')) e.preventDefault();
        return;
      }
      e.preventDefault();
      if(isAnimating) return; // ignore extra input while settling — avoids overshoot/jitter
      wheelBuffer += e.deltaY;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(function(){
        var dir = wheelBuffer > 0 ? 1 : -1;
        var mag = Math.abs(wheelBuffer);
        var advance = 1;
        if(mag > 260) advance = 2;
        if(mag > 520) advance = 3;
        goToSceneIndex(currentSceneIndex() + dir * advance);
        wheelBuffer = 0;
      }, BUFFER_WINDOW);
    }, { passive:false });

    // ============================================================
    // MOBILE TOUCH NAVIGATION — one swipe = exactly one scene, always.
    // Touch used to rely purely on native momentum scrolling + CSS
    // scroll-snap: normally fine, but a hard/fast flick can carry enough
    // native momentum to glide straight past several snap points before
    // the browser's own snap logic catches up — that's the "skips
    // photos" bug. This replaces native touch scrolling with the exact
    // same locked, single-step, cinematically-eased advance the wheel
    // handler above already uses (goToSceneIndex/animateScrollTo), so
    // touch gets the identical "one gesture, one scene, every time"
    // guarantee — same transition, same routing, one system, not two.
    // ============================================================
    var MOBILE_BREAKPOINT = 768; // matches the wheel handler's own check above
    var SWIPE_THRESHOLD = 28;    // px — how far a drag must travel before it's treated as a decisive swipe rather than a tap or jitter
    var touchStartY = null;
    var touchStartX = null;
    var touchGestureDone = false; // true the instant THIS gesture has spent its one allowed advance — set before we even know if we'll act on it, so a long/fast continued drag can never trigger a second one
    // True for a gesture that starts somewhere inside an open story
    // (.scene.reading) but outside its own scrollable text — the dark
    // backdrop, the lifted title, the pinned actions bar. Those spots
    // have nothing of their own to scroll, so without this the browser's
    // native scroll-snap would take over the drag and advance the
    // gallery, which is exactly what a story being open should prevent
    // (see .caption.expanded's own carve-out just below for the text
    // itself, which *should* keep scrolling natively).
    var touchBlockReadingAdvance = false;

    function isMobileWidth(){ return window.innerWidth < MOBILE_BREAKPOINT; }

    scroller.addEventListener('touchstart', function(e){
      if(!isMobileWidth() || !e.touches[0]) return;
      // Reading an expanded story on mobile: a touch starting inside the
      // story's own bounded reading pane (.caption.expanded) belongs to
      // that pane's native scroll, not a photo-to-photo swipe. Leaving
      // touchStartY/X unset means the touchmove/touchend handlers below
      // skip their swipe logic for the rest of this gesture too, letting
      // native scrolling handle it — the gallery swipe stays disabled for
      // the whole gesture as long as it started in the story.
      if(e.target.closest('.caption.expanded')) return;
      touchBlockReadingAdvance = !!e.target.closest('.scene.reading');
      touchStartY = e.touches[0].clientY;
      touchStartX = e.touches[0].clientX;
      touchGestureDone = false;
    }, { passive:true });

    scroller.addEventListener('touchmove', function(e){
      if(!isMobileWidth() || touchStartY === null || !e.touches[0]) return;
      if(e.target.closest('.caption.expanded')) return;
      if(touchBlockReadingAdvance){ e.preventDefault(); return; } // open story, dragging outside its text: swallow the gesture, never advance or hand off to native scroll
      var dy = touchStartY - e.touches[0].clientY; // positive = finger moved up = swiping forward
      var dx = touchStartX - e.touches[0].clientX;
      if(Math.abs(dy) < 6 && Math.abs(dx) < 6) return; // too small to be a real drag yet — let it resolve as a tap
      // From here on this is unmistakably a drag, not a tap: take over
      // from native scrolling for the rest of THIS gesture so it can
      // never fight the JS-driven scrollTop animation below.
      e.preventDefault();
      if(touchGestureDone) return; // this gesture already spent its one advance — ignore all further movement from it, no matter how far/fast
      if(Math.abs(dy) < SWIPE_THRESHOLD) return; // still building up to a decisive swipe
      touchGestureDone = true;
      if(isAnimating) return; // a still-finishing transition (from a separate gesture) owns the screen right now — drop this one rather than queueing a second/third advance behind it
      goToSceneIndex(currentSceneIndex() + (dy > 0 ? 1 : -1));
    }, { passive:false });

    function endTouchGesture(e){
      // Fallback for short, quick flicks: a fast short flick can lift the
      // finger between touchmove samples before dy ever crosses
      // SWIPE_THRESHOLD mid-drag. If this gesture hasn't already spent
      // its one advance, decide here instead, using the total distance
      // travelled by lift — same one-advance-per-gesture guarantee,
      // just resolved at touchend rather than mid-move. Also skipped
      // entirely for a gesture touchBlockReadingAdvance flagged, for the
      // same reason touchmove above swallows it rather than advancing.
      if(isMobileWidth() && touchStartY !== null && !touchGestureDone && !touchBlockReadingAdvance && e && e.changedTouches && e.changedTouches[0] && !isAnimating){
        var touch = e.changedTouches[0];
        var dy = touchStartY - touch.clientY;
        var dx = touchStartX - touch.clientX;
        if(Math.abs(dy) >= 18 && Math.abs(dy) > Math.abs(dx)){
          goToSceneIndex(currentSceneIndex() + (dy > 0 ? 1 : -1));
        }
      }
      touchStartY = null;
      touchStartX = null;
      touchBlockReadingAdvance = false;
    }
    scroller.addEventListener('touchend', endTouchGesture, { passive:true });
    scroller.addEventListener('touchcancel', function(){ touchStartY = null; touchStartX = null; }, { passive:true });

    // Dedicated "return to Hero A" jump — deliberately NOT goToSceneIndex(0).
    // goToSceneIndex has its own infinite-category-loop logic that treats
    // any backward jump made from inside the gallery as "go to the
    // previous category" unless the current category happens to be the
    // very first one in the loop (see the b.start/isFirstLoopCategory
    // check above) — which is exactly why "back to the beginning" only
    // ever worked from that one category. This skips that logic and
    // always scrolls straight to slides[0] (Hero A), regardless of which
    // category is currently active.
    function goHome(){
      closeAllStories();
      var slides = navSlides();
      if(!slides.length) return;
      animateScrollTo(slides[0].offsetTop);
    }

    // Direct jump to one specific slide — deliberately bypasses
    // goToSceneIndex's infinite-category-loop logic (which reads any
    // backward jump made from inside the gallery as "previous category").
    // Used for explicit "take me to THAT place" navigation, like the
    // Islem Zrelli nav tab, so it lands there from every category.
    function goToSlide(i){
      if(routeHold()) return; // see goToSceneIndex
      var slides = navSlides();
      if(!slides.length) return;
      i = Math.max(0, Math.min(slides.length - 1, i));
      animateScrollTo(slides[i].offsetTop);
    }

    return { goToSceneIndex: goToSceneIndex, goToSlide: goToSlide, goHome: goHome, currentSceneIndex: currentSceneIndex, navSlides: navSlides, isAnimating: function(){ return isAnimating; }, isInGallery: isInGallery };
  })();

  // Keeps the up/down buttons in sync with scroll position: disabled at
  // the very first/last slide (hero counts as the first) rather than just
  // doing nothing on click, so it's visually obvious there's nowhere
  // further to go.
  function updateScrollNavState(){
    var slides = sceneNav.navSlides();
    if(!slides.length){ scrollUpBtn.disabled = true; scrollDownBtn.disabled = true; return; }
    var i = sceneNav.currentSceneIndex();
    // Inside the photography experience, both directions always lead
    // somewhere (the infinite category loop), so the up/down buttons
    // should never show as disabled there — only the one-time landing
    // prelude (hero/intro story/Hero B) has a true start (index 0).
    var inGallery = sceneNav.isInGallery();
    var storyOpen = isStoryOpen();
    scrollUpBtn.disabled = ((i <= 0) && !inGallery) || storyOpen;
    scrollDownBtn.disabled = ((i >= slides.length - 1) && !inGallery) || storyOpen;
  }
  scrollUpBtn.addEventListener('click', function(){ sceneNav.goToSceneIndex(sceneNav.currentSceneIndex() - 1); });
  scrollDownBtn.addEventListener('click', function(){ sceneNav.goToSceneIndex(sceneNav.currentSceneIndex() + 1); });

  document.getElementById('enterBtn').addEventListener('click', function(){
    sceneNav.goToSceneIndex(1);
  });

  // Hero B's own "keep scrolling" cue — same idea as #enterBtn above, but
  // NOT hardcoded to a fixed index: Hero B's own position in
  // sceneNav.navSlides() moves depending on how many intro-story photos
  // are configured (see firstCategorySceneTop()'s comment for the exact
  // same lesson learned the hard way on selectCategory()). Advancing
  // "whatever slide comes after wherever we currently are" is both
  // correct regardless of that count AND identical in spirit to how the
  // up/down scroll-nav buttons already work.
  var heroWorkEnterBtn = document.getElementById('heroWorkEnterBtn');
  if(heroWorkEnterBtn) heroWorkEnterBtn.addEventListener('click', function(){
    sceneNav.goToSceneIndex(sceneNav.currentSceneIndex() + 1);
  });

  var scrollNavTicking = false;
  function updateOnScroll(){
    scrollNavTicking = false;
    updateScrollNavState();
    var slides = sceneNav.navSlides();
    var idx = sceneNav.currentSceneIndex();
    var onHero = slides[idx] === heroEl || slides[idx] === heroWorkEl;
    langSwitch.classList.toggle('show', onHero);
    if(idx > 0){
      scrollNav.classList.add('show');
      document.getElementById('catNav').classList.add('show');
    }
    // The nav bar's active tab should track where the visitor actually is,
    // not just currentCategorySlug — which never changes while they're
    // scrolled through the #introStory "Islem Zrelli" scenes (on purpose,
    // see ISLEM_INTRO_SLUG above, so those photos never get treated as a
    // real, re-renderable category). navSlides() is always ordered
    // [hero, ...introScenes, heroWork?, ...gallery], so anything strictly
    // between the hero and Hero B/gallery is intro-story territory.
    var introScenes = Array.prototype.slice.call(document.querySelectorAll('#introStory .scene'));
    var inIntro = introScenes.length && idx >= 1 && idx <= introScenes.length;
    // idx === 0 (slides[idx] === heroEl specifically — not heroWorkEl,
    // whose "Work Title" screen leads straight into a real category and
    // should keep showing that category as active) means the visitor
    // hasn't actually browsed anything yet, so no nav tab should light up.
    var onLandingHero = slides[idx] === heroEl;
    var wantSlug = onLandingHero ? NO_ACTIVE_NAV_SLUG : (inIntro ? ISLEM_INTRO_SLUG : null);
    if(wantSlug !== visualActiveNavSlug){
      visualActiveNavSlug = wantSlug;
      renderCategoryNav();
    }
  }
  scroller.addEventListener('scroll', function(){
    if(!scrollNavTicking){ scrollNavTicking = true; requestAnimationFrame(updateOnScroll); }
  }, { passive:true });
  window.addEventListener('resize', updateOnScroll);
  updateOnScroll(); // sets the language switcher's initial (landing-page-only) visibility

  // Re-lays-out the orbit ring on a real width change (rotating the
  // phone, resizing a desktop window) — but NOT on every resize event,
  // since mobile browsers fire one just from the address bar
  // showing/hiding as you scroll, which only changes height. Debounced,
  // and gated on width specifically (not height) so that never triggers
  // a rebuild/flicker of a ring that's already laid out correctly.
  var heroOrbitResizeTimer = null;
  var heroOrbitLastWidth = window.innerWidth;
  window.addEventListener('resize', function(){
    clearTimeout(heroOrbitResizeTimer);
    heroOrbitResizeTimer = setTimeout(function(){
      if(Math.abs(window.innerWidth - heroOrbitLastWidth) < 40) return;
      heroOrbitLastWidth = window.innerWidth;
      renderHeroOrbit();
    }, 200);
  });

  function showToast(msg, duration){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, duration || 2200);
  }

  // Shared like/unlike mutation — the one place that ever writes to a
  // photo's like state. Used by the like button (toggle, either
  // direction) and, below, the double-tap-on-photo gesture (like-only,
  // Instagram-style — it only ever calls this with nowLiked=true).
  // Handles the optimistic UI update, the DB write, and rollback on
  // failure, exactly as before — this is a refactor, not a behavior change.
  function setPhotoLiked(id, nowLiked){
    var photo = photos.find(function(p){ return String(p.id) === String(id); });
    if(!photo) return;
    var prevLikes = photo.likes || 0;
    var delta = nowLiked ? 1 : -1;
    liked[id] = nowLiked;
    setLiked(liked);
    photo.likes = Math.max(0, prevLikes + delta);
    var btn = document.querySelector('.like-btn[data-id="'+id+'"]');
    if(btn){
      btn.classList.toggle('liked', nowLiked);
      btn.setAttribute('aria-pressed', String(nowLiked));
      var svgEl = btn.querySelector('svg');
      if(svgEl) svgEl.outerHTML = svgHeart(nowLiked);
      var countEl = btn.querySelector('.like-count');
      if(countEl) countEl.textContent = photo.likes.toLocaleString();
      btn.classList.remove('pulse');
      void btn.offsetWidth; // restart animation even on rapid re-triggers
      btn.classList.add('pulse');
    }
    sb.rpc('increment_photo_likes', { p_id: id, p_delta: delta }).then(function(result){
      // If the database function returns the new total, trust that exact
      // number over our local +1/-1 math — this is what keeps the count
      // correct when someone else likes the same photo around the same
      // time, instead of both browsers' optimistic guesses drifting apart.
      var serverCount = result && result.data;
      if(serverCount && typeof serverCount === 'object') serverCount = serverCount.likes;
      if(typeof serverCount === 'number'){
        photo.likes = serverCount;
        var freshBtn = document.querySelector('.like-btn[data-id="'+id+'"]');
        var countEl2 = freshBtn && freshBtn.querySelector('.like-count');
        if(countEl2) countEl2.textContent = serverCount.toLocaleString();
      }
    }).catch(function(){
      // The like never reached the database — undo the optimistic change
      // instead of leaving the UI showing a "like" that doesn't exist
      // anywhere else.
      liked[id] = !nowLiked;
      setLiked(liked);
      photo.likes = prevLikes;
      var freshBtn = document.querySelector('.like-btn[data-id="'+id+'"]');
      if(freshBtn){
        freshBtn.classList.toggle('liked', !nowLiked);
        freshBtn.setAttribute('aria-pressed', String(!nowLiked));
        var svgEl2 = freshBtn.querySelector('svg');
        if(svgEl2) svgEl2.outerHTML = svgHeart(!nowLiked);
        var countEl3 = freshBtn.querySelector('.like-count');
        if(countEl3) countEl3.textContent = prevLikes.toLocaleString();
      }
      showToast("Couldn't save your like — check your connection and try again.");
    });
  }

  // Double-tap-on-photo-to-like — mirrors the familiar photo-app gesture.
  // Scoped to a real photo's .frame-img only (matched via the enclosing
  // .scene's data-id, which the finale/next-chapter cards never have, so
  // this can't fire on them). Two taps within DOUBLE_TAP_WINDOW on the
  // SAME photo count as a double-tap; anything slower, or on a different
  // photo, just restarts the count from one. Deliberately like-only (never
  // unlikes) and a no-op if already liked, so rapid/repeated double-taps
  // can never queue up duplicate like requests — same one-way behavior
  // Instagram's own double-tap uses, unlike the like button's toggle.
  // The photo's own brief brightness/contrast acknowledgment — see the
  // photoLikeFlash keyframes. Only ever called on a successful new like
  // (never on a redundant double-tap of an already-liked photo), and
  // uses the same remove/reflow/re-add trick as the like button's pulse
  // so back-to-back likes on different photos each restart cleanly.
  function flashPhotoLike(sceneId){
    var img = document.querySelector('.scene[data-id="'+sceneId+'"] .frame-img img');
    if(!img) return;
    img.classList.remove('like-flash');
    void img.offsetWidth;
    img.classList.add('like-flash');
  }

  var DOUBLE_TAP_WINDOW = 300; // ms
  var lastPhotoTapId = null;
  var lastPhotoTapTime = 0;
  function handlePhotoTap(sceneId){
    var now = Date.now();
    var isDoubleTap = (lastPhotoTapId === sceneId) && (now - lastPhotoTapTime < DOUBLE_TAP_WINDOW);
    if(isDoubleTap){
      lastPhotoTapId = null; // consume it — a third quick tap starts fresh, doesn't chain into another "double"
      lastPhotoTapTime = 0;
      if(liked[sceneId]){
        // Already liked: still acknowledge the gesture with the existing
        // pulse animation so it doesn't feel like nothing happened, but
        // never re-like it — this is the "no duplicate like" requirement.
        var btn = document.querySelector('.like-btn[data-id="'+sceneId+'"]');
        if(btn){
          btn.classList.remove('pulse');
          void btn.offsetWidth;
          btn.classList.add('pulse');
        }
      } else {
        setPhotoLiked(sceneId, true);
        flashPhotoLike(sceneId);
      }
    } else {
      lastPhotoTapId = sceneId;
      lastPhotoTapTime = now;
    }
  }

  scroller.addEventListener('click', function(e){
    var readMoreBtn = e.target.closest('.read-more-btn');
    if(readMoreBtn){
      toggleStory(readMoreBtn);
      return;
    }
    var continueCueEl = e.target.closest('.continue-cue');
    if(continueCueEl){
      sceneNav.goToSceneIndex(sceneNav.currentSceneIndex() + 1);
      return;
    }
    var backHomeEl = e.target.closest('.back-home-btn');
    if(backHomeEl){
      // Checked before the .next-chapter whole-card handler below, since
      // this button sits nested inside that card — without this early
      // return, a tap here would also match .closest('.next-chapter')
      // and advance into the next category instead of going home.
      sceneNav.goHome();
      return;
    }
    var nextChapterEl = e.target.closest('.next-chapter');
    if(nextChapterEl){
      selectCategory(nextChapterEl.getAttribute('data-next-slug'));
      return;
    }
    var likeBtn = e.target.closest('.like-btn');
    if(likeBtn){
      var id = likeBtn.getAttribute('data-id');
      setPhotoLiked(id, !liked[id]);
      return;
    }
    var tagLink = e.target.closest('.tag-link');
    if(tagLink){
      goToCategoryTop(tagLink.getAttribute('data-cat-slug'));
      return;
    }
    var tappedFrame = e.target.closest('.scene[data-id] .frame-img');
    if(tappedFrame){
      // A tap on the photo itself never does anything on its own (no
      // navigation, no toggle) — only a second quick tap on the SAME
      // photo does anything, and even then only ever likes it. This is
      // what keeps normal single-tap/swipe browsing completely unaffected.
      var tappedScene = tappedFrame.closest('.scene[data-id]');
      handlePhotoTap(tappedScene.getAttribute('data-id'));
      return;
    }
    var shareBtn = e.target.closest('.share-btn');
    if(shareBtn){
      var sid = shareBtn.getAttribute('data-id');
      var stitle = shareBtn.getAttribute('data-title');

      } else if(navigator.clipboard){
        navigator.clipboard.writeText(url).then(function(){ showToast('Link copied'); });
      } else {
        showToast(url);

      return;

    var storyBtn = e.target.closest('.story-btn');
    if(storyBtn){

      if(storyPhoto) shareToStory(storyPhoto, storyBtn);

    }
    var editBtn = e.target.closest('.edit-btn');
    if(editBtn){
      // The button's visibility is purely a CSS convenience (see
      // .admin-only) — this is the real check. A logged-out visitor
      // couldn't normally see or reach this button at all, but if the DOM
      // were tampered with client-side, they'd still hit this guard.
      if(!session){ return; }
      var eid = editBtn.getAttribute('data-id');
      var photoToEdit = photos.find(function(p){ return String(p.id) === String(eid); });

  });

  // If 404.html bounced a deep link here (e.g. someone opened/refreshed/shared
  // a /work/<slug>/ URL directly), restore the real address bar path before
  // anything reads window.location.pathname. Called once, at startup, from the
  // route-capture block near safeHistory() — before the route is captured.
  function restoreRedirectedPath(){

  // Determines which category the gallery opens on: whatever /category/<slug>/
  // was requested, else the "Favorite" default landing collection.
  // If Favorite is empty (nothing marked yet, e.g. on a fresh site), falls
  // back to showing every published photo rather than an empty gallery.
  function initCategoryState(){
    var pathSlug = DEEP.kind === 'category' ? DEEP.slug : null;
    // The virtual ISLEM ZRELLI chapter (ISLEM_INTRO_SLUG) never counts as
    // a valid deep-link target here — it has no #scenesTrack rendering of
    // its own (see selectCategory()'s guard above), so a stray
    // /category/islem-zrelli/ link falls back to Favorite instead of
    // duplicating the intro photos into the gallery.
    var valid = navCategoryList().some(function(c){ return c.slug === pathSlug && !c.virtual; });
    currentCategorySlug = valid ? pathSlug : 'favorite';
