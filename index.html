  // category's first photo back when the hero was the only thing before
  // it, but hasn't been since the intro story and Hero B were added
  // between the hero and the gallery; using that stale index was exactly
  // what sent every category switch back to the first Islem Zrelli photo
  // instead of the category actually selected.
  function firstCategorySceneEl(){
    var track = document.getElementById('scenesTrack');
    return track ? track.querySelector('.scene') : null;
  }
  function firstCategorySceneTop(){
    var first = firstCategorySceneEl();
    return first ? first.offsetTop : null;
  }
  // The true finale/contact scene of the CURRENT category — deliberately
  // excludes the "Continue Exploring" bridge card (.next-chapter also
  // carries the .finale class) so entering a category "at its end" for
  // the backward leg of the infinite loop lands on its actual ending,
  // not on the forward-only bridge into whatever comes after it.
  function lastCategorySceneTop(){
    var track = document.getElementById('scenesTrack');
    var finale = track ? track.querySelector('.scene.finale:not(.next-chapter)') : null;
    return finale ? finale.offsetTop : null;
  }

  function selectCategory(slug, opts){
    opts = opts || {};
    var list = navCategoryList();
    var target = list.find(function(c){ return c.slug === slug; });
    // The virtual ISLEM ZRELLI chapter is never a real, renderable
    // category — see ISLEM_INTRO_SLUG above — so it's refused here too,
    // not just at the catNav click handler, in case anything else (a
    // deep link, browser back/forward) ever tries to pass its slug
    // through. Its own nav button is handled separately, by scrolling
    // back into the existing #introStory content instead.
    if(!target || target.virtual) return;
    closeAllStories(); // an explicit category pick always starts every photo collapsed
    currentCategorySlug = slug;
    activePhotos = photosForCategory(slug);
    // An explicit category pick always wins over whatever the intro-story
    // scroll tracking (see updateOnScroll()) last set, even before the
    // next scroll event fires.
    visualActiveNavSlug = null;
    renderCategoryNav();
    renderScenes();
    if(activePhotos.length) injectGalleryLd(activePhotos);
    if(!opts.skipHead) updateHeadForCategory(slug);
    if(!opts.skipHistory){
      safeHistory('pushState', { category: slug }, categoryUrlPath(slug));
    }
    if(!opts.skipScrollReset){
      // Jump straight to the first photo of the new category by default —
      // never back to the hero — so switching categories mid-browse never
      // feels like "leaving" the gallery. opts.enterAt === 'end' is used
      // by the infinite loop's backward leg: entering the PREVIOUS
      // category from its own ending, not its start, so continuing to
      // scroll backward keeps moving through its photos in reverse.
      requestAnimationFrame(function(){
        var top = opts.enterAt === 'end' ?
          (lastCategorySceneTop() != null ? lastCategorySceneTop() : firstCategorySceneTop()) :
          firstCategorySceneTop();
        if(top != null) scroller.scrollTop = top;
        updateScrollNavState();
      });
    }
  }

  // When someone reaches the very end of a category — the "Continue
  // Exploring" card — and keeps scrolling/swiping past it instead of
  // tapping it directly, this carries them into the next category, same
  // as tapping the card would. Returns true if it handled the advance.
  function tryAdvancePastNextChapter(){
    var slides = sceneNav.navSlides();
    var last = slides[slides.length - 1];
    if(last && last.classList && last.classList.contains('next-chapter')){
      var nextSlug = last.getAttribute('data-next-slug');
      if(nextSlug){ selectCategory(nextSlug); return true; }
    }
    return false;
  }

  // Scrolls back to the very first scene of the "Islem Zrelli" intro
  // story (the existing #introStory content between the two hero
  // screens) — what clicking the virtual ISLEM ZRELLI nav chapter does.
  // Deliberately does NOT go through selectCategory()/renderScenes(): the
  // 3 personal photos already live in #introStory and must never be
  // re-rendered into #scenesTrack as a second, "real" category.
  function goToIslemIntroStart(){
    closeAllStories();
    var introScenes = Array.prototype.slice.call(document.querySelectorAll('#introStory .scene'));
    if(!introScenes.length) return; // not configured — nothing to jump to
    var idx = sceneNav.navSlides().indexOf(introScenes[0]);
    if(idx !== -1) sceneNav.goToSlide(idx);
  }

  document.getElementById('catNav').addEventListener('click', function(e){
    var btn = e.target.closest('.cat-btn');
    if(!btn) return;
    var slug = btn.getAttribute('data-slug');
    closeAllStories(); // a tab tap is a deliberate jump — never blocked by, or left behind an open story
    if(slug === ISLEM_INTRO_SLUG){
      goToIslemIntroStart();
      return;
    }
    if(slug === currentCategorySlug){
      // A quiet "home" button for whichever section the visitor is
      // already in: jump back to its first photo, using the exact same
      // animated, snap-respecting scroll as every other in-gallery move
      // (sceneNav.goToSceneIndex) — never a page reload, never back to
      // the hero, never a category change (selectCategory is never
      // called here at all).
      var first = firstCategorySceneEl();
      if(!first) return;
      var idx = sceneNav.navSlides().indexOf(first);
      if(idx !== -1) sceneNav.goToSceneIndex(idx);
      return;
    }
    selectCategory(slug);
  });
  // Left/right arrow keys move focus between category buttons when the
  // nav itself has focus, per the accessibility requirement for
  // horizontal category browsing.
  document.getElementById('catNav').addEventListener('keydown', function(e){
    if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var btns = Array.prototype.slice.call(document.querySelectorAll('.cat-btn'));
    var idx = btns.indexOf(document.activeElement);
    if(idx === -1) return;
    e.preventDefault();
    var next = btns[idx + (e.key === 'ArrowRight' ? 1 : -1)];
    if(next) next.focus();
  });

  var LIKED_KEY = 'iz_liked_scenes_v1';
  function getLiked(){ try{ return JSON.parse(localStorage.getItem(LIKED_KEY) || '{}'); }catch(e){ return {}; } }
  function setLiked(obj){ try{ localStorage.setItem(LIKED_KEY, JSON.stringify(obj)); }catch(e){} }

  // INFINITE CATEGORY LOOP — pure ordering, no "visited" state at all.
  // The photography experience (as opposed to the one-time landing/About
  // prelude) is never allowed to dead-end: every category, in the exact
  // order navCategoryList() already defines, leads into the next one, and
  // the last one wraps back around to the first. Categories are allowed —
  // expected — to repeat indefinitely as the visitor keeps scrolling;
  // nothing here tracks or cares whether a category has been shown
  // before. Empty categories (nothing to display) are skipped when
  // picking a neighbor so the loop never lands somewhere with no photos,
  // but they're never removed from navCategoryList() itself. The virtual
  // ISLEM ZRELLI chapter (see ISLEM_INTRO_SLUG) is excluded here too —
  // it's a one-time nav shortcut back into the landing/About prelude, not
  // a stop in the FAVOURITE → other-categories loop, and it isn't backed
  // by a real, renderable #scenesTrack category to loop into anyway.
  function categoryLoopList(){
    return navCategoryList().filter(function(c){ return !c.virtual && photosForCategory(c.slug).length > 0; });
  }
  // dir: 1 for the next category in the loop, -1 for the previous one.
  // Wraps in both directions. Returns null only if literally no category
  // anywhere has any photos to show.
  function neighborCategorySlug(slug, dir){
    var list = categoryLoopList();
    if(!list.length) return null;
    var idx = list.findIndex(function(c){ return c.slug === slug; });
    if(idx === -1) idx = dir > 0 ? -1 : 0; // current category itself has no photos — anchor from an edge so the loop still resolves sensibly
    var target = (idx + dir + list.length) % list.length;
    return list[target].slug;
  }
  function nextCategorySlugAfter(slug){ return neighborCategorySlug(slug, 1); }
  function prevCategorySlugBefore(slug){ return neighborCategorySlug(slug, -1); }
  var liked = getLiked();

  var scroller = document.getElementById('scroller');
  var heroEl = document.getElementById('hero');
  var heroWorkEl = document.getElementById('heroWork');
  var scrollNav = document.getElementById('scrollNav');
  var scrollUpBtn = document.getElementById('scrollUpBtn');
  var scrollDownBtn = document.getElementById('scrollDownBtn');
  var toastEl = document.getElementById('toast');
  var langSwitch = document.getElementById('langSwitch');
  var heroPhotoCountEl = document.getElementById('heroPhotoCount');
  var heroLocationLineEl = document.getElementById('heroLocationLine');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Draws Hero A's signature like it's being written, then lets the ink
  // "settle" into a solid fill. Takes the target <text> element's id
  // (rather than being hard-coded to one) mainly so this stays reusable —
  // Hero B carried its own copy of this same treatment for a while, but
  // on review that made the two heroes redundant (the same dramatic name
  // reveal twice in a row), so Hero B dropped back to a quiet "By Islem
  // Zrelli" text credit instead. This function only has one caller now,
  // but keeping it parameterized costs nothing and means resurrecting a
  // second animated signature later is a one-line change, not a rewrite.
  //
  // Triggered from animateHeroEntrance() below the moment Hero A itself
  // reveals — not hard-coded to fire unconditionally on module load —
  // since a hero further down the page (Hero B, previously) reached only
  // after scrolling would otherwise finish its animation off-screen
  // before anyone scrolled far enough to see it.
  //
  // This animates a real <text> element (correct, legible letterforms) —
  // not a hand-authored calligraphy path — so there's nothing to draw
  // incorrectly. Text elements don't support getTotalLength(), so instead
  // of measuring the exact stroke length we use a dasharray/dashoffset
  // value (4000) that's comfortably longer than the glyphs' total stroke
  // perimeter at this font size within the SVG's fixed 700-wide viewBox —
  // since the viewBox coordinate space doesn't change with screen size,
  // one constant works everywhere.
  function animateSignature(textId){
    var text = document.getElementById(textId);
    if(!text) return;
    if(reduceMotion) return; // CSS already shows it fully filled, no JS needed
    var DASH = 4000;
    text.style.strokeDasharray = DASH;
    text.style.strokeDashoffset = DASH;
    // Force layout so the browser registers the starting offset before
    // the transition below is triggered — otherwise it can jump straight
    // to the end state instead of animating.
    text.getBoundingClientRect();
    text.style.transition = 'stroke-dashoffset 1500ms cubic-bezier(.65,0,.35,1)';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        text.style.strokeDashoffset = '0';
      });
    });
    setTimeout(function(){ text.classList.add('filled'); }, 1150);
  }

  // Early, synchronous signal for whether this load might land somewhere
  // other than the hero — an explicit /work/ or /category/ URL. (This used
  // to also check a returning visitor's saved scroll position, but that
  // auto-restore has been removed — see applyInitialRoute — so a saved
  // position no longer counts as "might leave the hero".)
  // Computed from the URL alone, so it's known instantly, with no need to
  // wait on the photo fetch that applyInitialRoute() otherwise depends on.
  // This is what used to be missing: the hero used to always animate in
  // immediately, then — once that fetch resolved and the URL turned out to
  // point deeper in — get scrolled away from abruptly, which is what
  // looked like a glitch. Now, when this is true, the whole .scroller
  // stays hidden (see .route-pending) until applyInitialRoute() has
  // actually decided where to land and set the scroll position, so the
  // hero either never renders in the first place or the jump has already
  // happened before anything is shown — never both in view at once.
  var mightLeaveHero = DEEP.kind !== null;
  if(mightLeaveHero && scroller){
    scroller.classList.add('route-pending');
    showRouteNotice('loading');
    // Deliberately NO timeout here. This gate used to be force-lifted after 4s, later 12s, which
    // dropped the visitor on the landing page whenever the Supabase fetch was merely slow (and
    // applyInitialRoute() would then finish later, unseen). A slow request is a LOADING state, not
    // an invalid route: the loading screen simply stays up (with a "still loading / try again"
    // hint after a while — see showRouteNotice) until the data arrives or genuinely fails, and a
    // failure is shown as an explicit error screen — never as the homepage.
  }

  // Fades and rises the hero text into place on load — title, then role
  // line, then button — instead of it just snapping into view. Runs
  // independently of the hero photo/data fetch below so the text doesn't
  // wait on network before appearing, UNLESS mightLeaveHero is true, in
  // which case applyInitialRoute() calls this itself once it's confirmed
  // the visitor is actually staying on the hero.
  function animateHeroEntrance(){
    var hero = document.getElementById('hero');
    if(!hero) return;
    if(reduceMotion){ hero.classList.add('ready'); return; } // CSS already shows it in place
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        hero.classList.add('ready');
        animateSignature('signatureTextA');
      });
    });
  }

  // Guards animateHeroEntrance() so it only ever actually runs once, no
  // matter which of the (now two) call sites reaches it first — the
  // early cache-based path just below, or the real post-fetch path in
  // loadPublicData()/revealScroller(). Whichever fires first wins; the
  // other becomes a no-op.
  var heroEntranceFired = false;
  function fireHeroEntranceOnce(){
    if(heroEntranceFired) return;
    heroEntranceFired = true;
    animateHeroEntrance();
  }

  // The actual FOUC fix: apply a cached hero text config (if one exists
  // from a previous visit) synchronously, right here, before the hero is
  // ever revealed — see the longer explanation on loadCachedHeroTextConfig()
  // above. If there's no cache yet (first-ever visit), entrance is left
  // to fire later, from inside loadPublicData() once the real config is
  // in — see the matching fireHeroEntranceOnce() call there.
  var cachedHeroText = loadCachedHeroTextConfig();
  if(cachedHeroText) applyHeroTextConfig(cachedHeroText);
  if(!mightLeaveHero && cachedHeroText) fireHeroEntranceOnce();

  // Right-click / drag deterrent for gallery photos AND the hero backdrop
  // photo (see the CSS comment above .wm-frame::after for what this can
  // and can't do). Delegated on document rather than attached per-<img>,
  // so it keeps working after renderScenes() replaces scroller.innerHTML —
  // no need to re-bind listeners every time the gallery re-renders.
  (function setupImageProtection(){
    function isProtectedImg(el){ return !!(el && el.tagName === 'IMG' && el.closest('.frame-img, .hero-backdrop')); }
    document.addEventListener('contextmenu', function(e){
      if(!isProtectedImg(e.target)) return;
      e.preventDefault();
      showToast('Images are protected — © Islem Zrelli');
    });
    document.addEventListener('dragstart', function(e){
      if(isProtectedImg(e.target)) e.preventDefault();
    });
  })();

  function svgHeart(filled){
    return '<svg viewBox="0 0 24 24" fill="'+(filled?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.4"><path d="M12 20.6s-7.6-4.6-10-9.2C.4 8 2 4.4 5.6 3.6c2.1-.5 4.2.4 5.4 2.1a1 1 0 001.6 0c1.2-1.7 3.3-2.6 5.4-2.1C21.6 4.4 23.2 8 21.6 11.4 19.2 16 12 20.6 12 20.6z"/></svg>';
  }
  var svgShare = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 12v6a1 1 0 001 1h8a1 1 0 001-1v-6M16 8l-4-4-4 4M12 4v13"/></svg>';
  var svgEdit = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
  // Generic "send to phone" glyph (a phone outline + an upward arrow) for
  // the Share-to-Story button — deliberately not a redraw of Instagram's
  // own logo (that's trademarked); the button's "Story" label next to it
  // already carries the specific meaning.
  var svgStory = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M12 15V8M12 8l-3 3M12 8l3 3"/></svg>';

  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // `load` firing doesn't guarantee the browser has finished decoding an
  // image's pixel data yet (this matters most for decoding="async" images,
  // but costs nothing to use everywhere) — starting a reveal transition
  // right at `load` can race that decode work, which shows up as a
  // flickery jitter, worst on larger images. img.decode() resolves only
  // once the image is fully ready to paint with no further work, so a
  // transition kicked off after it always starts on a settled frame.
  function revealAfterDecode(img, callback){
    if(img.decode){ img.decode().then(callback).catch(callback); }
    else { callback(); }
  }

  // Admin-panel thumbnails don't need full-resolution bytes — this asks
  // Supabase's Storage image-transform endpoint for a small resized
  // rendition instead. Only rewrites URLs that actually match Supabase's
  // public-storage path shape (anything else is left untouched). Pair
  // this with onerror="this.onerror=null;this.src='...'" pointing at the
  // original URL wherever it's used, so a project without Image
  // Transformations enabled (it's a paid-tier feature) just silently
  // falls back to the full image instead of showing a broken thumbnail.
  function adminThumbUrl(url, size){
    if(!url) return url;
    var marker = '/storage/v1/object/public/';
    var i = url.indexOf(marker);
    if(i === -1) return url;
    var px = size || 100;
    return url.slice(0, i) + '/storage/v1/render/image/public/' + url.slice(i + marker.length) + '?width=' + px + '&height=' + px + '&resize=cover&quality=60';
  }
  function adminThumbAttrs(url, size){
    return 'src="'+escapeHtml(adminThumbUrl(url, size))+'" onerror="this.onerror=null;this.src=\''+escapeHtml(url||'')+'\';"';
  }

  // Requests a rendition sized to how large the photo will actually
  // appear on screen, rather than always sending the full ~2000px
  // upload master to every visitor regardless of device — via wsrv.nl,
  // a free (no signup, no plan tier) image resize/cache proxy backed by
  // a Cloudflare CDN. Supabase's own Storage image-transform endpoint
  // (used above for admin thumbnails) does the same job but is a
  // Pro-plan-and-up feature, so it's not usable on the Free plan this
  // site is running on. Passing only `w` (no `h`) scales proportionally
  // rather than cropping, so this never distorts or letterboxes the
  // photo; `default=` tells wsrv.nl to fall back to the untouched photo
  // itself if it ever can't fetch/transform it. See https://wsrv.nl/docs.
  function sizedPhotoUrl(url, targetWidth){
    if(!url) return url;
    var w = Math.max(1, Math.min(2500, Math.round(targetWidth) || 1600));
    return 'https://wsrv.nl/?url=' + encodeURIComponent(url) + '&w=' + w + '&q=80&output=webp&default=' + encodeURIComponent(url);
  }
  // Same idea, inlined as ready-to-use src+onerror attributes — for the
  // handful of plain <img> spots (finale portrait, "Continue Exploring"
  // preview) that don't run through the custom lazy-load/armPhotoReveal
  // system the main gallery photos use, so they still need their own
  // fallback-to-original if wsrv.nl itself is ever unreachable.
  function sizedPhotoAttrs(url, targetWidth){
    return 'src="'+escapeHtml(sizedPhotoUrl(url, targetWidth))+'" onerror="this.onerror=null;this.src=\''+escapeHtml(url||'')+'\';"';
  }

  // Upper bound on how wide a gallery photo can actually render, given
  // the scene layout rules in the CSS (frame-img is full-width on mobile,
  // max-width:54% of the viewport on desktop — see the min-width:860px
  // block). Deliberately errors on the generous side (e.g. desktop's own
  // height constraint can shrink a tall photo further, but never widen
  // it past this), and scales for device pixel ratio so retina screens
  // still get a crisp image, capped so a 3x phone doesn't request more
  // pixels than the original upload even has.
  function gallerySizeTarget(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth || document.documentElement.clientWidth || 900;
    var cssWidth = vw >= 860 ? vw * 0.54 : vw;
    return Math.round(Math.min(cssWidth * dpr, 2000));
  }

  // Same idea as gallerySizeTarget() above, but for the full-bleed
  // photos (hero backdrops, the finale portrait, the "Continue
  // Exploring" preview) that always render at the full viewport width
  // regardless of desktop/mobile, rather than the 54%-capped gallery layout.
  function heroSizeTarget(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var vw = window.innerWidth || document.documentElement.clientWidth || 1200;
    return Math.round(Math.min(vw * dpr, 2200));
  }

  /* ================= SEO: slugs, clean URLs, dynamic head ================= */

  function parseTags(p){
    return String((p && p.tags) || '').split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  }

  // What actually becomes the URL/slug for a photo. Tags win when present —
  // that's the whole point of the field (e.g. tags "gabes, pollution" ->
  // /work/gabes-pollution/, shareable across every photo tagged the same
  // way). Falls back to location, then category, then finally the title
  // itself, so older photos saved before this field existed still get a
  // sensible slug instead of breaking.
  function slugSourceFor(p){
    var tags = parseTags(p);
    if(tags.length) return tags.slice(0, 2).join(' ');
    if(p.location) return p.location;
    if(p.category) return p.category;
    return p.title;
  }

  function slugify(str){
    return String(str || '')
      .toLowerCase()
      .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 80) || 'photo';
  }

  // Was: recomputed EVERY page load, purely from `list`'s current order —
  // fine for a single photo with a unique tag/location/title, but two or
  // more photos sharing the same slug source (by design — see
  // slugSourceFor's comment above) got disambiguated as -2, -3, etc.
  // purely by their position in that load. Reordering, publishing, or
  // editing ANY photo in that shared-slug group could silently bump every
  // other photo in it to a different number — so a link shared as
  // /work/gabes-pollution-3/ could stop pointing at that photo at all
  // after a totally unrelated admin edit, landing whoever opens it later
  // on the plain landing page (applyInitialRoute()'s photos.find() finding
  // nothing) instead of the photo they were sent. categories.slug never
  // had this problem because it's a real, stored column — photos never
  // had one.
  // Now: a photo's slug is computed like this only once, ever, the first
  // time it's loaded with no `slug` value already on the row — then
  // written straight back to the DB so every load after that reads the
  // same fixed value directly, rather than recomputing it. Self-healing:
  // there's no separate backfill step to run — every existing photo just
  // gets its (identical, since the algorithm's unchanged) slug locked in
  // the first time this runs after the DB column exists. Requires a
  // `slug` text column on `photos` (doesn't exist yet as of this comment)
  // — until it's added, the update below simply fails silently and
  // behavior is exactly what it was before this change.
  function ensureSlugs(list){
    var seen = {};
    var toPersist = [];
    // Pass 1: register every slug that's ALREADY persisted before handing out any new one. A single
    // pass in list order let a photo still needing a slug take one that belonged to a persisted
    // photo further down the list — two photos then shared /work/<slug>/ and the link resolved to
    // whichever came first.
    list.forEach(function(p){
      if(p.slug){ // already locked in — never recompute or move a slug once it might be a live link
        if(seen[p.slug]) console.warn('[deep-link] duplicate persisted photo slug:', p.slug, '(photo id ' + p.id + ') — /work/' + p.slug + '/ is ambiguous');
        p._slug = p.slug;
        seen[p.slug] = true;
      }
    });
    // Pass 2: only photos with no stored slug yet get one, guaranteed not to collide.
    list.forEach(function(p){
      if(p.slug) return;
      var base = slugify(slugSourceFor(p));
      var slug = base, n = 2;
      while(seen[slug]){ slug = base + '-' + n; n++; }
      seen[slug] = true;
      p._slug = slug;
      toPersist.push(p);
    });
    // Fire-and-forget: doesn't block rendering on a write, and a failure
    // here (most likely: the `slug` column doesn't exist yet) just means
    // this same photo computes its slug fresh again next load, same as
    // before this change existed — never a harder failure than that.
    toPersist.forEach(function(p){
      sb.from('photos').update({ slug: p._slug }).eq('id', p.id).then(function(){}).catch(function(){});
    });
  }

  function photoUrl(p){ return SITE_URL + '/work/' + p._slug + '/'; }

  /* ================= SHARE TO STORY ================= */
  // Generates a branded, ready-to-post 1080x1920 vertical image for
  // Instagram/Snapchat Stories (photo + title + a short excerpt + a
  // "Read more on <domain>" line), then hands it to the OS share sheet so
  // the visitor can drop it straight into their Story in one tap.
  //
  // Two deliberate choices worth knowing if this needs touching later:
  //  - The domain shown in "Read more on <domain>" is read live from
  //    window.location.hostname every time this runs — never hardcoded —
  //    so it always matches wherever the site actually happens to be
  //    running, with nothing to update if the domain ever changes. As of
  //    now SITE_URL/photoUrl() above are ALSO always-live for the same
  //    reason (they used to be a hardcoded string; not anymore — see the
  //    SITE_URL comment), so this feature just reuses photoUrl() directly
  //    rather than keeping a second, now-redundant way to build the same
  //    URL.
  //  - Instagram gives no way for a website to make a Story link tappable
  //    on its own — only a Link Sticker the *visitor* adds themselves,
  //    inside Instagram, after the image loads there. This function
  //    can't skip that step (nobody can); what it does instead is copy
  //    the photo's URL to the clipboard right before handing off to the
  //    share sheet, so adding that sticker is a paste, not a retype.

  // Live current domain (+ path), for the "Read more on <domain>" line on
  // the generated image — e.g. "islemzrelli.github.io/islem/".
  // Reuses SITE_URL rather than reading window.location.hostname alone:
  // every other live-domain reader in the file (photoUrl(), canonical,
  // Open Graph, the sitemap) already goes through SITE_URL, which
  // correctly carries both the live domain AND the fixed GitHub Pages
  // subpath (SITE_SUBPATH — this is a username.github.io/islem project
  // site, not a custom domain). This function was the one holdout still
  // building the domain from window.location.hostname by itself, which is
  // exactly what silently dropped "/islem" from this specific label while
  // every other URL on the site already had it right.
  function liveDisplayDomain(){
    var withoutProtocol = String(SITE_URL || '').replace(/^https?:\/\//i, '').replace(/^www\./i, '');
    return withoutProtocol ? (withoutProtocol + '/') : 'this site';
  }

  // Loads an image with crossOrigin set (required to read it back out of
  // a canvas at all — without this, toBlob() on a cross-origin image
  // throws a SecurityError instead of producing a file). Routed through
  // sizedPhotoUrl()/wsrv.nl like the rest of the gallery's images, which
  // already serves permissive CORS headers, unlike some storage providers'
  // raw URLs.
  function loadImageForCanvas(url){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error('Image failed to load')); };
      img.src = url;
    });
  }

  // Waits for the two fonts this image is drawn with to actually be
  // ready — canvas text silently falls back to a default font if you
  // draw before a webfont finishes loading, which on a fast repeat visit
  // is unlikely but on a first visit (fonts still downloading) is a real
  // risk. document.fonts.ready alone isn't quite enough here since it
  // resolves once whatever's been requested so far is done, not once
  // every weight/style this function needs specifically is — so both
  // exact declarations used below are explicitly requested too.
  function ensureStoryFontsReady(){
    var specs = [
      'italic 500 100px Newsreader',
      '400 100px Inter',
      '500 100px Inter',
      '600 100px Inter'
    ];
    return Promise.all(specs.map(function(spec){
      return document.fonts.load(spec).catch(function(){});
    })).then(function(){ return document.fonts.ready; });
  }

  // Minimal word-wrap for canvas text (no built-in equivalent to CSS's
  // white-space handling exists for <canvas>). Wraps at word boundaries
  // up to maxLines, appending an ellipsis to the last line if the text
  // doesn't fit rather than overflowing off the image. Returns the lines
  // actually drawn, for the caller to know how much vertical space they
  // took.
  function wrapCanvasLines(ctx, text, maxWidth, maxLines){
    var words = String(text || '').split(/\s+/).filter(Boolean);
    var lines = [];
    var current = '';
    for(var i = 0; i < words.length; i++){
      var attempt = current ? current + ' ' + words[i] : words[i];
      if(ctx.measureText(attempt).width > maxWidth && current){
        lines.push(current);
        current = words[i];
        if(lines.length === maxLines) break;
      } else {
        current = attempt;
      }
    }
    if(lines.length < maxLines && current) lines.push(current);
    // If words remain unconsumed at this point, the text was cut off —
    // mark the last line with an ellipsis rather than silently truncating.
    var consumed = lines.join(' ').split(/\s+/).length;
    if(consumed < words.length && lines.length){
      // Trim by whole words first, never mid-word (a trailing fragment
      // like "...where t…" reads as broken, not intentionally shortened).
      var lastWords = lines[lines.length - 1].split(' ');
      var last = lastWords.join(' ');
      while(lastWords.length > 1 && ctx.measureText(last + '…').width > maxWidth){
        lastWords.pop();
        last = lastWords.join(' ');
      }
      // Only falls back to trimming characters if even a single word is
      // wider than the line on its own — rare, but keeps this safe rather
      // than ever overflowing maxWidth.
      while(ctx.measureText(last + '…').width > maxWidth && last.length > 1){
        last = last.slice(0, -1);
      }
      lines[lines.length - 1] = last + '…';
    }
    return lines;
  }

  // Builds the actual 1080x1920 Story image for `photo` and resolves with
  // a PNG Blob. See the section comment above for the domain/URL notes.
  async function generateStoryImageBlob(photo){
    await ensureStoryFontsReady();
    var W = 1080, H = 1920;
    var img = await loadImageForCanvas(sizedPhotoUrl(photo.image_url, 1350));
    var canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext('2d');

    // Background: a flat fill matching .scene{background:var(--ink)} on
    // the real site exactly — no blur, no color pulled from the photo.
    // The real gallery is a plain near-black page behind every photo;
    // matching that (rather than a decorative colored glow, which was an
    // earlier, more "designed" version of this feature) is what makes the
    // Story image actually look like a piece of the site, not a separate
    // template that merely borrows its photo.
    ctx.fillStyle = '#050505'; // var(--ink)
    ctx.fillRect(0, 0, W, H);

    // The photo, fully intact — scaled to CONTAIN within a safe content
    // box (never cropped, never upscaled beyond native res, exactly like
    // object-fit:contain on .wm-frame img on the real site), positioned
    // in the upper portion so the text block below has clear room and
    // stays clear of Instagram's own bottom UI.
    // boxH was 1180 (61% of the 1920 canvas) — trimmed to 1020 (~53%)
    // specifically to free up room for a bigger title and a longer
    // caption below without either the text block or the bottom margin
    // above Instagram's own reply-bar UI getting tight. Every text
    // measurement below (textTop, and everything that follows it) is
    // derived from boxH, so this one number is the actual lever for the
    // photo/text balance — nothing further down needs touching to
    // rebalance it again later.
    var boxX = 64, boxY = 150, boxW = W - 128, boxH = 1020;
    var containScale = Math.min(boxW / img.width, boxH / img.height, 1 /* never upscale past native resolution */);
    var drawW = img.width * containScale, drawH = img.height * containScale;
    var drawX = boxX + (boxW - drawW) / 2, drawY = boxY + (boxH - drawH) / 2;
    ctx.save();
    // Matches the real site's current photo treatment exactly — see
    // .scene.in-view .frame-img .wm-frame's box-shadow:0 0 24px 2px
    // rgba(255,255,255,.04): not a drop shadow (which would look like a
    // separate designed embellishment), just the same barest hint of the
    // photo's own presence spilling past its edges that every photo on
    // the live site already has.
    ctx.shadowColor = 'rgba(255,255,255,0.05)';
    ctx.shadowBlur = 26;
    ctx.drawImage(img, drawX, drawY, drawW, drawH);
    ctx.restore();

    // Text block below the photo — LEFT-aligned starting at the same x as
    // the photo, not centered. On the real site only the special "About"
    // panel (.scene.finale) is centered; every ordinary photo's title and
    // caption (.scene-content, no text-align override) are left-aligned,
    // editorial-style. Centering this would be a genuinely different look
    // from what visitors already see on every photo on the site.
    var textTop = boxY + boxH + 64;
    var textX = boxX;
    var maxTextWidth = boxW;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#f6f4ef'; // matches --white, same as .scene h2

    var title = tText(photo, 'title') || '';
    ctx.font = 'italic 500 66px Newsreader'; // was 58px — the room for this came from trimming boxH above, not from crowding what follows
    var titleLines = wrapCanvasLines(ctx, title, maxTextWidth, 2);
    var y = textTop;
    titleLines.forEach(function(line){ ctx.fillText(line, textX, y); y += 78; }); // was 68, matching the larger font

    // Caption: was clamped to 4 lines (matching .scene p.caption.clamped's
    // -webkit-line-clamp:4, the real site's own default unexpanded view).
    // Bumped to 6 here specifically — this image has no "Read more" tap to
    // reveal the rest the way the site does, so it's the only chance this
    // text gets to actually say something, and the boxH trim above made
    // the room for it without shrinking the line-height/font below.
    var story = tText(photo, 'story') || '';
    if(story){
      y += 18; // was 14 — a touch more air now that the title above it is bigger
      ctx.font = '300 34px Inter';
      ctx.fillStyle = 'rgba(246,244,239,0.58)'; // matches --dim exactly (was a lighter custom value before)
      var captionLines = wrapCanvasLines(ctx, story, maxTextWidth, 6);
      captionLines.forEach(function(line){ ctx.fillText(line, textX, y); y += 46; });
    }

    // Divider — a full-width hairline directly under the caption, matching
    // .scene-rule (height:1px, background:var(--line-soft), spans the
    // full caption column) exactly, standing in here for where the
    // like/share/story/edit action row sits on the real site (those
    // buttons themselves don't make sense baked into a static image).
    y += 32; // was 28 — slightly more separation now that there's more text above to settle from
    ctx.strokeStyle = 'rgba(246,244,239,0.09)'; // matches --line-soft
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(textX, y);
    ctx.lineTo(textX + maxTextWidth, y);
    ctx.stroke();

    // "Read more on <domain>" — the one piece of this image with no real
    // equivalent on the site itself (it's the call to action that only
    // makes sense on an exported image), so it's deliberately styled a
    // little differently from the caption above it — dimmer, tracked
    // uppercase, like the site's own nav/meta labels — rather than
    // trying to disguise it as though it were part of the page. Domain
    // is read live — see liveDisplayDomain() above.
    ctx.font = '500 30px Inter';
    ctx.fillStyle = 'rgba(246,244,239,0.58)'; // matches --dim
    // Manual letter-spacing: canvas has no native letter-spacing property
    // (unlike CSS), so it's approximated by drawing each character with a
    // small fixed gap after it, matching the site's own uppercase/tracked
    // labels (e.g. the nav, meta text) closely enough at this size.
    var ctaText = ('Read more on ' + liveDisplayDomain()).toUpperCase();
    var spacing = 2.4;
    var cx = textX;
    var ctaY = y + 56;
    for(var cj = 0; cj < ctaText.length; cj++){
      ctx.fillText(ctaText[cj], cx, ctaY);
      cx += ctx.measureText(ctaText[cj]).width + spacing;
    }

    return new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
  }

  // Orchestrates the button's whole click: generate the image, copy the
  // live link to the clipboard (for the Link Sticker paste), then hand
  // off to the native share sheet — or fall back to a plain download if
  // the browser can't share files at all (most desktop browsers today).
  async function shareToStory(photo, btnEl){
    if(btnEl.classList.contains('loading')) return; // guards against a double-tap firing this twice
    btnEl.classList.add('loading');
    try{
      var url = photoUrl(photo);
      var blob = await generateStoryImageBlob(photo);
      if(!blob) throw new Error('Could not generate the image');
      var file = new File([blob], (photo._slug || 'photo') + '-story.png', { type: 'image/png' });

      // Copied regardless of which path below runs — it's the one manual
      // step Instagram requires (see the section comment above), so it
      // should be ready to paste whichever way the image itself gets to
      // the visitor's phone.
      var clipboardPromise = navigator.clipboard ? navigator.clipboard.writeText(url).catch(function(){}) : Promise.resolve();

      if(navigator.canShare && navigator.canShare({ files: [file] })){
        // navigator.share()'s promise resolves the instant the visitor
        // taps a target app in the OS share sheet — which, on a phone, is
        // essentially the same moment this browser tab gets backgrounded
        // as Instagram opens in front of it. A toast shown only *after*
        // that await (the previous approach here) is therefore very
        // likely never actually seen. Showing the instruction first
        // instead — with a brief pause so it's legible before the sheet
        // slides up over it — puts it in front of the visitor while
        // they're still looking at this page, which is the only point in
        // this whole flow guaranteed to still be on-screen. It also folds
        // in the link-sticker reminder that used to be a separate
        // (equally unseen) post-share toast, since this is the one
        // moment that reliably gets read.
        // The two Instagram-internal taps this describes (pick Instagram,
        // then pick Story over Post) can't be skipped from a website —
        // see this function's section comment above — so the goal here
        // is just making sure the visitor knows they're coming, not
        // pretending they're not needed.
        showToast('Pick Instagram, then tap Story to post — your link\u2019s copied for the Story sticker', 6000);
        await clipboardPromise;
        await new Promise(function(r){ setTimeout(r, 900); }); // gives the toast above a moment to actually be read before the OS sheet covers it
        await navigator.share({ files: [file], title: 'Islem Zrelli — ' + (tText(photo,'title')||'') });
      } else {
        // No file-sharing support (typical on desktop browsers, which
        // have no Instagram app for a website to hand a file to, and no
        // web-upload path that accepts a file via URL either) — save the
        // image locally instead, framed as a deliberate handoff to their
        // phone rather than a plain, unexplained download.
        var dlUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = dlUrl; a.download = file.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(dlUrl); }, 4000);
        await clipboardPromise;
        showToast('Saved \u2014 open Instagram on your phone to post it. Link\u2019s copied for the Story sticker.', 6000);
      }
      sb.rpc('increment_photo_shares', { p_id: photo.id }).then(function(){}).catch(function(){});
    } catch(err){
      // AbortError just means the visitor closed the share sheet without
      // picking anything — not a real failure, so it stays silent rather
      // than showing an error toast for a normal cancel.
      if(err && err.name !== 'AbortError'){
        showToast('Couldn\'t create the Story image — try again');
      }
    } finally {
      btnEl.classList.remove('loading');
    }
  }


  function setMetaContent(selector, content){
    var el = document.querySelector(selector);
    if(el) el.setAttribute('content', content);
  }

  function updateHeadForPhoto(p){
    var title = 'Islem Zrelli — ' + p.title;
    var desc = (p.story || DEFAULT_DESC).slice(0, 160);
    var url = photoUrl(p);
    document.title = title;
    setMetaContent('meta[name="description"]', desc);
    setMetaContent('meta[property="og:title"]', title);
    setMetaContent('meta[property="og:description"]', desc);
    setMetaContent('meta[property="og:url"]', url);
    setMetaContent('meta[property="og:type"]', 'article');
    if(p.image_url){
      setMetaContent('meta[property="og:image"]', p.image_url);
      setMetaContent('meta[name="twitter:image"]', p.image_url);
    }
    setMetaContent('meta[property="og:image:alt"]', p.alt_text || title);
    setMetaContent('meta[name="twitter:title"]', title);
    setMetaContent('meta[name="twitter:description"]', desc);
    var canon = document.getElementById('canonicalLink');
    if(canon) canon.href = url;
    injectPhotoLd(p, url);
    syncPhotoUrl(p);
  }

  function resetHeadToDefault(){
    document.title = DEFAULT_TITLE;
    setMetaContent('meta[name="description"]', DEFAULT_DESC);
    setMetaContent('meta[property="og:title"]', DEFAULT_TITLE);
    setMetaContent('meta[property="og:description"]', DEFAULT_DESC);
    setMetaContent('meta[property="og:url"]', SITE_URL + '/');
    setMetaContent('meta[property="og:type"]', 'website');
    setMetaContent('meta[property="og:image"]', DEFAULT_OG_IMAGE);
    setMetaContent('meta[property="og:image:alt"]', DEFAULT_OG_IMAGE_ALT);
    setMetaContent('meta[name="twitter:image"]', DEFAULT_OG_IMAGE);
    setMetaContent('meta[name="twitter:title"]', DEFAULT_TITLE);
    setMetaContent('meta[name="twitter:description"]', DEFAULT_DESC);
    var canon = document.getElementById('canonicalLink');
    if(canon) canon.href = SITE_URL + '/';
    removePhotoLd();
    safeHistory('replaceState', null, BASE_PATH + '/');
  }

  function injectPhotoLd(p, url){
    var el = document.getElementById('ldPhoto');
    if(!el){
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'ldPhoto';
      document.head.appendChild(el);
    }
    var tags = parseTags(p);
    var keywords = tags.length ? tags.join(', ') : [p.category, p.location].filter(Boolean).join(', ');
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Photograph",
      "name": p.title,
      "description": p.story || '',
      "contentUrl": p.image_url,
      "url": url,
      "creator": { "@type": "Person", "name": "Islem Zrelli" },
      "contentLocation": p.location ? { "@type": "Place", "name": p.location } : undefined,
      "genre": p.category || undefined,
      "keywords": keywords || undefined
    });
  }

  function removePhotoLd(){
    var el = document.getElementById('ldPhoto');
    if(el) el.remove();
  }

  function injectGalleryLd(list){
    var el = document.getElementById('ldGallery');
    if(!el){
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = 'ldGallery';
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Islem Zrelli — Photo Stories",
      "url": SITE_URL + '/',
      "image": list.map(function(p){ return p.image_url; })
    });

  function slugFromPath(path){
    var base = BASE_PATH.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); // escape for regex (dots in the repo/domain name)
    var re = new RegExp('^' + base + '\\/work\\/([^\\/]+)\\/?$');
    var m = String(path || '').replace(/\/+$/, '').match(re);
    return m ? m[1] : null;
  }


  // Releases the .route-pending gate set near animateHeroEntrance (if it
  // was set at all — on a plain first visit it never is, and this whole
  // file has no effect). stayedOnHero tells it whether the hero's own
  // entrance animation still needs to run: every branch of
  // applyInitialRoute() that does NOT set scroller.scrollTop to jump
  // somewhere else counts as "stayed on hero", since the visitor is still
  // looking at scrollTop 0 either way.
  function revealScroller(stayedOnHero){
    if(stayedOnHero) fireHeroEntranceOnce();
    if(scroller) scroller.classList.remove('route-pending');
    hideRouteNotice();
  }

  // Given a photo (found only via its own /work/<slug>/ URL, which carries
  // no category info), figures out which category to restore the visitor
  // into. This is what lets "browsing PEOPLE, on Photo 17, then refresh"
  // actually come back to PEOPLE instead of falling back to an uncategorized
  // flat list — see applyInitialRoute() below. Prefers a real category (in
  // the admin's own display order) over the Favorite pseudo-category, since
  // a photo can be a favorite AND belong to a specific story at once, and
  // the specific story is the more useful context to land back in.
  function categoryForPhoto(photo){
    if(!photo) return null;
    var ids = photoCategoryMap[photo.id] || [];
    if(ids.length){
      var cat = categories.find(function(c){ return ids.indexOf(c.id) !== -1 && c.is_visible !== false; });
      if(cat) return cat.slug;
    }
    if(photo.is_favorite) return 'favorite';
    return null;
  }

  /* ---------- Deep-link resolution ---------- */

  // Looks a photo up by its PERSISTED slug (the stable `slug` column on the row) — never by array
  // position, so reordering, re-categorising, uploading, deleting or unpublishing other photos can
  // never change which photo a link points at. Exact match first, then a case-insensitive fallback
  // so a hand-typed /work/Gabes-5/ still resolves. `photos` only ever holds PUBLISHED rows, so an
  // unpublished photo is (correctly) indistinguishable from a nonexistent one here.
  function findPhotoBySlug(slug){
    if(!slug) return null;
    var exact = photos.find(function(p){ return p._slug === slug; });
    if(exact) return exact;
    var lower = String(slug).toLowerCase();
    return photos.find(function(p){ return String(p._slug || '').toLowerCase() === lower; }) || null;
  }
  // The scene is located by the photo's database id, not by its index in any list.
  function sceneElForPhoto(p){ return p ? document.getElementById('scene-' + p.id) : null; }

  // Fraction of `el` currently inside the scroller's viewport, measured NOW. IntersectionObserver
  // entries describe the moment they were computed and can be delivered later — after the page has
  // already moved on — so observer callbacks that write the URL re-check live geometry first.
  function visibleRatio(el){
    if(!el || !scroller) return 0;
    var r = el.getBoundingClientRect(), v = scroller.getBoundingClientRect();
    var overlap = Math.min(r.bottom, v.bottom) - Math.max(r.top, v.top);
    return Math.max(0, overlap) / (r.height || 1);
  }

  // The ONE place a /work/<slug>/ address is written. If the address bar already identifies this
  // exact photo it is left completely alone — so a link opened as /work/gabes-5 stays exactly
  // /work/gabes-5 (no trailing-slash rewrite, no redundant history writes on every scene).
  function syncPhotoUrl(p){
    if(!p || !p._slug) return;
    var cur = slugFromPath(window.location.pathname);
    if(cur && decodeSlug(cur) === p._slug) return;
    safeHistory('replaceState', { photo: p._slug, category: currentCategorySlug }, BASE_PATH + '/work/' + p._slug + '/');
  }

  /* ---------- Status screen: loading / not found / error ---------- */
  function showRouteNotice(state){
    var ov = document.getElementById('dlOverlay');
    if(!ov) return;
    var titleEl = document.getElementById('dlTitle'), subEl = document.getElementById('dlSub'), actEl = document.getElementById('dlActions');
    clearTimeout(DEEP.slowTimer); DEEP.slowTimer = null;
    DEEP.status = state;
    ov.setAttribute('data-state', state);
    ov.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
    ov.classList.add('show');
    var homeBtn = '<button type="button" class="dl-btn" data-dl-action="home">View the gallery</button>';
    if(state === 'loading'){
      titleEl.textContent = DEEP.kind === 'photo' ? 'Loading photo…' : 'Loading…';
      subEl.textContent = '';
      actEl.innerHTML = '';
      // Still just a loading state after a long wait — say so, and offer a manual retry. Never a redirect.
      DEEP.slowTimer = setTimeout(function(){
        if(DEEP.status !== 'loading') return;
        subEl.textContent = 'Still loading — the connection seems slow. Waiting for the photo…';
        actEl.innerHTML = '<button type="button" class="dl-btn" data-dl-action="retry">Try again</button>';
      }, 8000);
    } else if(state === 'notfound'){
      titleEl.textContent = 'Photo not found';
      subEl.textContent = 'This photo doesn\u2019t exist, or it isn\u2019t available to the public.';
      actEl.innerHTML = homeBtn;
      document.title = 'Photo not found \u2014 Islem Zrelli';
    } else { // 'error'
      titleEl.textContent = 'Couldn\u2019t load this photo';
      subEl.textContent = 'The gallery didn\u2019t respond. Check your connection and try again.';
      actEl.innerHTML = '<button type="button" class="dl-btn" data-dl-action="retry">Try again</button>' + homeBtn;
    }
    if(state !== 'loading'){
      var first = actEl.querySelector('button');
      if(first){ try{ first.focus({ preventScroll:true }); }catch(e){} }
    }
  }
  function hideRouteNotice(){
    clearTimeout(DEEP.slowTimer); DEEP.slowTimer = null;
    var ov = document.getElementById('dlOverlay');
    if(ov){ ov.classList.remove('show'); ov.setAttribute('aria-busy', 'false'); }
  }
  // Leaving a not-found/error screen is always an explicit visitor choice (this button) — nothing
  // ever does it automatically.
  function leaveDeepLinkToLanding(){
    if(!DEEP.dataReady){ window.location.assign(BASE_PATH + '/'); return; } // nothing loaded to show in place — do a clean full load of the landing page
    DEEP.status = 'none'; DEEP.kind = null; DEEP.slug = null;
    resetHeadToDefault(); // canonical landing head + address "/"
    if(scroller) scroller.scrollTop = 0;
    revealScroller(true);
  }
  function retryDeepLink(){
    DEEP.dataReady = false;
    showRouteNotice('loading');
    loadPublicData();
  }
  (function bindRouteNotice(){
    var ov = document.getElementById('dlOverlay');
    if(!ov) return;
    ov.addEventListener('click', function(e){
      var btn = e.target.closest('[data-dl-action]');
      if(!btn) return;
      var action = btn.getAttribute('data-dl-action');
      if(action === 'retry') retryDeepLink();
      else if(action === 'home') leaveDeepLinkToLanding();
    });
  })();

  // Brings the exact scene for `match` into view. Shared by the initial deep link and by
  // back/forward navigation, so both use one code path. Does NOT write history or head — callers do
  // that once the route is resolved. Returns the scene element, or null if it could not be rendered.
  function goToPhoto(match, opts){
    opts = opts || {};
    var el = sceneElForPhoto(match); // already rendered (current category, or the Islem intro story)?
    if(!el){
      // A deep link may point at a photo outside the current (default Favorite) category. Restore
      // into a real category that actually contains it — same engine the category nav buttons use —
      // preferring the category recorded with the history entry, then the photo's own best category.
      var tried = {};
      [opts.preferCategory, categoryForPhoto(match)].forEach(function(cs){
        if(el || !cs || tried[cs]) return;
        tried[cs] = true;
        if(photosForCategory(cs).indexOf(match) === -1) return; // never switch into a category that doesn't contain it
        selectCategory(cs, { skipHistory:true, skipScrollReset:true, skipHead:true });
        el = sceneElForPhoto(match);
      });
    }
    if(!el){
      currentCategorySlug = null;
      activePhotos = photos.slice();
      renderCategoryNav();
      renderScenes();
      el = sceneElForPhoto(match);
    }
    if(!el) return null;
    dlog('TARGET SCENE FOUND', 'scene-' + match.id, 'category=' + currentCategorySlug);
    var targetImg = el.querySelector('.frame-img img[data-src]');
    if(targetImg && !targetImg.getAttribute('src')) targetImg.setAttribute('src', targetImg.getAttribute('data-src'));
    if(targetImg) armPhotoReveal(targetImg);
    // Jump straight past the hero to this exact scene — no animation, since this is a starting
    // state / history jump, not a user-triggered scroll.
    dlog('NAVIGATING TO TARGET', match._slug, 'scrollTop ->', el.offsetTop);
    scroller.scrollTop = el.offsetTop;
    scrollNav.classList.add('show');
    document.getElementById('catNav').classList.add('show');
    langSwitch.classList.remove('show'); // deep link starts inside the gallery, not the landing page
    return el;
  }

  // Runs once, right after the data has loaded and the gallery has rendered. Reads the route that was
  // captured at startup (DEEP) — NOT window.location, which by now may have been touched by others.
  // Every branch either shows exactly what was asked for, or an explicit not-found/error screen.
  // The landing page is only ever shown here for a genuine non-deep-link visit.
  function applyInitialRoute(){
    var kind = DEEP.kind, slug = DEEP.slug;
    dlog('APPLY INITIAL ROUTE', kind, slug);

    if(kind === 'category' && slug !== 'favorite' && slug !== ISLEM_INTRO_SLUG){
      // (A /category/islem-zrelli/ link isn't a real gallery category — see ISLEM_INTRO_SLUG — so it
      // is treated like any other unrecognized path below instead.)
      DEEP.status = 'none';
      try{
        scrollNav.classList.add('show');
        document.getElementById('catNav').classList.add('show');
        langSwitch.classList.remove('show'); // deep link starts inside the gallery, not the landing page
        updateHeadForCategory(slug);
      } finally { revealScroller(true); }
      dlog('DEEP LINK COMPLETE (category)', slug);
      return;
    }

    if(kind !== 'photo'){
      // Always start fresh on the landing page for a plain visit/refresh — no silent jump into the
      // gallery based on a remembered scroll position.
      DEEP.status = 'none';
      revealScroller(true);
      return;
    }

    var match = findPhotoBySlug(slug);
    if(!match){
      dlog('ROUTING FAILURE: no PUBLISHED photo has slug', slug, '— unknown slug or published=false. Showing the not-found screen (NOT the homepage).');
      showRouteNotice('notfound');
      return;
    }
    dlog('SLUG MATCH', slug, 'id=' + match.id);
    var el = goToPhoto(match);
    if(!el){
      dlog('ROUTING FAILURE: photo matched but its scene could not be rendered', match.id);
      showRouteNotice('error');
      return;
    }
    // Resolved. Only NOW may the URL/head be written (routeHold() is released) — and the write is a
    // no-op when the address already names this photo.
    DEEP.status = 'none';
    try{ updateHeadForPhoto(match); }
    catch(e){ console.error('Head update failed for', match._slug, e); }
    finally { revealScroller(false); }
    dlog('DEEP LINK COMPLETE', match._slug, 'final URL', window.location.pathname);
  }

  /* ================= PUBLIC SITE ================= */

  // Picks the featured photo (set via the admin panel's "Feature" toggle,
  // previously unused on the public site) as the hero backdrop, falling
  // back to the first published photo so the hero still gets an image
  // even before anything's been explicitly featured. Reveals it with the
  // same blur/desaturate/darken-to-clear treatment used on every scene
  // and the finale photo, so the very first thing a visitor sees is
  // consistent with the rest of the site rather than a plain text splash.
  function renderHeroBackdrop(){
    var backdrop = document.getElementById('heroBackdrop');
    var img = document.getElementById('heroBackdropImg');
    if(!backdrop || !img) return;
    // A landing-page image picked in the admin's Landing Page tab always
    // wins; only falls back to the featured/first gallery photo when none
    // is set (e.g. a brand-new site before the admin has picked one).
    var url = about.hero_image_url || (photos.find(function(p){ return p.featured; }) || photos[0] || {}).image_url;
    if(!url){
      backdrop.style.display = 'none';
      return;
    }
    backdrop.style.display = '';
    applyHeroCrop(img);
    var displayUrl = sizedPhotoUrl(url, heroSizeTarget());
    function reveal(){ backdrop.classList.add('in-view'); }
    function revealWhenDecoded(){ revealAfterDecode(img, reveal); }
    function onError(){
      if(img.getAttribute('src') !== url){ img.addEventListener('load', revealWhenDecoded, { once:true }); img.src = url; }
      else reveal(); // genuinely failed — don't leave the hero stuck hidden
    }
    if(img.complete && img.naturalWidth && img.src === displayUrl){ revealWhenDecoded(); }
    else {
      backdrop.classList.remove('in-view');
      img.addEventListener('load', revealWhenDecoded, { once:true });
      img.addEventListener('error', onError, { once:true });
    }
    img.src = displayUrl;
  }

  // Hero A's orbiting photo ring (see the .hero-orbit CSS above for the
  // per-card rotation math). Uses the admin's explicit picks
  // (about.hero_orbit_photo_ids, set from the Landing Page tab's orbit
  // grid) when there are any; otherwise falls back to a random spread of
  // published photos, same as before that admin control existed. Not
  // gated on about.hero_image_url the way renderHeroBackdrop() above is,
  // since the ring's whole point is showing a scatter of the work, not
  // one chosen backdrop — and hides the flat backdrop behind it so the
  // hero reads as just the ring on black, matching the reference look.
  // about.hero_orbit_enabled === false is the admin's explicit opt-out;
  // undefined (pre-migration, or just never touched) still means "on".
  var ORBIT_MIN_PHOTOS = 4;
  var ORBIT_MAX_CARDS = 12;
  // How many photos the ring actually shows — admin-adjustable from the
  // Landing Page tab's -/+ stepper (about.hero_orbit_count), clamped to
  // [ORBIT_MIN_PHOTOS, ORBIT_MAX_CARDS] so it can't be pushed past the
  // crowding/clipping ceiling the ring's layout math above was tuned
  // for. Unset (pre-migration, or never touched) falls back to
  // ORBIT_MAX_CARDS — the exact count every site showed before this
  // control existed, so nothing changes until the admin actually moves
  // it. Shared between the public renderer below and the admin form's
  // own stepper/picker-limit so both always agree on the same number.
  function clampOrbitCount(n){
    n = parseInt(n, 10);
    if(!isFinite(n)) return ORBIT_MAX_CARDS;
    return Math.min(ORBIT_MAX_CARDS, Math.max(ORBIT_MIN_PHOTOS, n));
  }
  var heroOrbitRAF = null;
  function renderHeroOrbit(){
    var orbit = document.getElementById('heroOrbit');
    var flatBackdrop = document.getElementById('heroBackdrop');
    if(!orbit) return;
    if(heroOrbitRAF){ cancelAnimationFrame(heroOrbitRAF); heroOrbitRAF = null; }
    if(about.hero_orbit_enabled === false){
      orbit.innerHTML = '';
      orbit.classList.remove('ready');
      return;
    }
    var wantCount = clampOrbitCount(about.hero_orbit_count);
    var picks;
    var curated = Array.isArray(about.hero_orbit_photo_ids) ? about.hero_orbit_photo_ids : [];
    if(curated.length){
      var byId = {};
      photos.forEach(function(p){ byId[p.id] = p; });
      // Silently drops any picked id that's since been unpublished or
      // deleted, rather than leaving a gap or erroring — see the SQL
      // comment above.
      picks = curated.map(function(id){ return byId[id]; }).filter(Boolean).slice(0, wantCount);
    } else {
      if(photos.length < ORBIT_MIN_PHOTOS){
        orbit.innerHTML = '';
        orbit.classList.remove('ready');
        return;
      }
      var pool = photos.slice();
      for(var i = pool.length - 1; i > 0; i--){ // Fisher-Yates — purely decorative, a fresh shuffle each load is fine
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      picks = pool.slice(0, Math.min(wantCount, pool.length));
    }
    if(!picks.length){
      orbit.innerHTML = '';
      orbit.classList.remove('ready');
      return;
    }
    var n = picks.length;
    var vw = window.innerWidth || 900, vh = window.innerHeight || 900;
    // A phone's width is what actually constrains the ring (its height is
    // usually 2x+ that), so on a narrow screen the ring is sized off width
    // alone, with cards pushed further out, sized bigger, and fewer of
    // them — without this, base = Math.min(vw, vh) still came out ≈ vw
    // here anyway, but with the *same* radius/size fractions as desktop
    // the cards read as small and clustered right behind the name/role
    // text instead of a real ring, and packing 12 small cards into that
    // same tight space made it look crowded rather than open.
    var isNarrow = vw < 640;
    var base = isNarrow ? vw : Math.min(vw, vh);
    // Tightened considerably from the first pass — that version let cards
    // land anywhere across a wide band of distances from center, which
    // read as a loose scatter rather than a ring, and let some cards get
    // clipped by up to ~half their own width off the screen edge. Now:
    // a narrower radius band (reads as one consistent ring), a hard cap
    // on how far any card's edge can reach (maxOuterReachF, applied per-
    // card below — a firm guarantee, not just a narrower random range),
    // and a smaller max card size so the cap doesn't have to fight size
    // as much to hold it.
    var minRadiusF = isNarrow ? 0.42 : 0.30;
    var maxRadiusF = isNarrow ? 0.50 : 0.42;
    var minSizeF = isNarrow ? 0.18 : 0.15;
    var maxSizeF = isNarrow ? 0.26 : 0.21;
    var maxOuterReachF = isNarrow ? 0.60 : 0.50; // hard ceiling on radius+size/2, in units of `base` — the actual anti-clipping guarantee
    if(isNarrow) picks = picks.slice(0, Math.min(n, 9)); // a couple more than before — a tighter ring needs more cards to avoid visible gaps around it
    n = picks.length;
    var maxReach = 0; // how far the farthest card's outer edge actually sits from center, in px — drives the vignette mask below
    var html = '<div class="hero-orbit-track" id="heroOrbitTrack">';
    var slot = 360 / n;
    picks.forEach(function(p, i){
      // A loose slot (not an even division + tiny jitter) so the ring
      // reads as scattered rather than "n images spaced evenly on a
      // circle" — each card can land anywhere within roughly two-thirds
      // of its slot's width either side of center.
      var angle = slot * i + (Math.random() * slot * 0.7 - slot * 0.35);
      // depth: 0 = drifted near the viewer (bigger, brighter, sharp),
      // 1 = receded into the dark (smaller, faint, soft) — this one
      // value drives size/opacity/blur/radius together so a card reads
      // as being at a consistent distance, rather than each of those
      // varying independently and never quite looking like "depth".
      var depth = Math.random();
      var radius = base * (minRadiusF + Math.random() * (maxRadiusF - minRadiusF)) + depth * base * 0.02;
      var size = base * (minSizeF + (1 - depth) * (maxSizeF - minSizeF)) * (0.94 + Math.random() * 0.12);
      // Hard cap, not just a narrower random range above — guarantees no
      // card's outer edge can ever land past maxOuterReachF regardless of
      // how the random draws line up, which is what actually stops the
      // "half the photo is gone" clipping rather than just making it rarer.
      var maxRadiusForSize = base * maxOuterReachF - size / 2;
      if(radius > maxRadiusForSize) radius = maxRadiusForSize;
      maxReach = Math.max(maxReach, radius + size / 2);
      var tilt = (Math.random() * 22 - 11);
      var delay = Math.round(Math.random() * 700);
      // Narrowed from the first pass (was 0.22–0.90, blur up to 2.4px) —
      // "far" cards should still clearly read as photographs, not fade
      // into illegible smudges.
      var opacity = (0.42 + (1 - depth) * 0.50).toFixed(2); // 0.42 (receded) .. 0.92 (near/bright)
      var blur = (depth * 1.4).toFixed(2);
      // Only a minority of cards get the slow "drift closer, then
      // recede" treatment, each on its own long, desynced timer — see
      // the heroOrbitBreathe keyframes above.
      var breathe = Math.random() < 0.32;
      var breatheDuration = (24 + Math.random() * 20).toFixed(1);
      var breatheDelay = (-(Math.random() * breatheDuration)).toFixed(1); // negative = starts mid-cycle, so it's not in lockstep with any other breathing card
      var url = sizedPhotoUrl(p.image_url, Math.round(size * 2));
      html += '<div class="hero-orbit-card" style="--card-angle:'+angle.toFixed(2)+'deg;--radius:'+radius.toFixed(0)+'px;--card-size:'+size.toFixed(0)+'px;--card-tilt:'+tilt.toFixed(2)+'deg;">'+
        '<div class="hero-orbit-card-inner" style="--card-opacity:'+opacity+';--card-blur:'+blur+'px;--card-delay:'+delay+'ms;--breathe-duration:'+breatheDuration+'s;--breathe-delay:'+breatheDelay+'s;"'+(breathe ? ' data-breathe="1"' : '')+'>'+
          '<img src="'+escapeHtml(url)+'" alt="" loading="eager" decoding="async">'+
        '</div>'+
      '</div>';
    });
    html += '</div>';
    orbit.innerHTML = html;
    // The fade-out mask is sized off maxReach (how far the cards actually
    // spread, in px) rather than a fixed percentage of the hero box — a
    // fixed percentage looked fine on desktop's roughly-square framing,
    // but on a phone's tall, narrow box that same percentage carved out a
    // huge ellipse relative to the much smaller ring sitting inside it, so
    // the fade essentially never kicked in and the ring just read as a
    // small, flatly-opaque cluster instead of a soft-edged portal.
    var track = orbit.querySelector('.hero-orbit-track');
    if(track){
      var rx = Math.round(maxReach * 1.3);
      // On a narrow phone screen the cards already sit close to maxReach
      // (see maxOuterReachF above), so a vertical mask radius that close
      // to maxReach fades the top/bottom cards almost to nothing right
      // where they sit — they don't get a soft "fade near the edge", they
      // land inside the fade already. Giving mobile a looser vertical
      // radius (and pushing the fade stops further out) keeps the same
      // "fades near top/bottom" portal look without erasing photos that
      // are meant to be part of the visible ring, like the top ones
      // sitting near the status bar.
      var ry = Math.round(maxReach * (isNarrow ? 1.25 : 0.95));
      var fadeStart = isNarrow ? '62%' : '46%';
      var fadeEnd = isNarrow ? '98%' : '92%';
      var maskCss = 'radial-gradient(ellipse '+rx+'px '+ry+'px at 50% 50%, #000 '+fadeStart+', transparent '+fadeEnd+')';
      track.style.webkitMaskImage = maskCss;
      track.style.maskImage = maskCss;
    }
    if(flatBackdrop) flatBackdrop.style.display = 'none';
    requestAnimationFrame(function(){ orbit.classList.add('ready'); });
    startHeroOrbitSpin();
  }

  // One rAF loop drives the entire ring: it only ever writes a single
  // CSS custom property (--ring-rotation) on the shared track element,
  // which every card's transform above reads back out — so this stays
  // cheap regardless of card count, rather than touching N elements a
  // frame. Respects reduced-motion by never starting the loop at all,
  // leaving every card at its own static --card-angle position.
  function startHeroOrbitSpin(){
    var track = document.getElementById('heroOrbitTrack');
    if(!track) return;
    if(reduceMotion) return;
    var DEG_PER_SEC = 2.4; // slow ambient drift, not a carousel you'd consciously track
    var deg = 0, last = null;
    function step(ts){
      if(document.hidden){ heroOrbitRAF = requestAnimationFrame(step); return; } // paused, not cancelled — keeps the same rAF handle valid for renderHeroOrbit()'s cancel check
      if(last == null) last = ts;
      deg = (deg + DEG_PER_SEC * (ts - last) / 1000) % 360;
      last = ts;
      track.style.setProperty('--ring-rotation', deg + 'deg');
      heroOrbitRAF = requestAnimationFrame(step);
    }
    heroOrbitRAF = requestAnimationFrame(step);
  }

  // Same idea as renderHeroBackdrop() above, for the second ("Hero B" /
  // work-title) screen — set from the admin's Landing Page tab's own
  // "Work Title Backdrop" picker (about.work_title_image_url). Falls back
  // to the landing hero's own image/crop when nothing's been picked yet,
  // so this screen never renders blank on a site that hasn't set it up —
  // see the "HERO B" SQL comment near the top of this file.
  function renderHeroWorkBackdrop(){
    var backdrop = document.getElementById('heroWorkBackdrop');
    var img = document.getElementById('heroWorkBackdropImg');
    if(!backdrop || !img) return;
    var url = about.work_title_image_url || about.hero_image_url || (photos.find(function(p){ return p.featured; }) || photos[0] || {}).image_url;
    if(!url){
      backdrop.style.display = 'none';
      return;
    }
    backdrop.style.display = '';
    var crop = Object.assign({ scale:1, x:50, y:50 }, about.work_title_crop || about.hero_crop || {});
    img.style.objectPosition = crop.x + '% ' + crop.y + '%';
    img.style.transform = crop.scale && crop.scale !== 1 ? 'scale(' + crop.scale + ')' : '';
    var displayUrl = sizedPhotoUrl(url, heroSizeTarget());
    function reveal(){ backdrop.classList.add('in-view'); }
    function revealWhenDecoded(){ revealAfterDecode(img, reveal); }
    function onError(){
      if(img.getAttribute('src') !== url){ img.addEventListener('load', revealWhenDecoded, { once:true }); img.src = url; }
      else reveal(); // genuinely failed — don't leave the hero stuck hidden
    }
    if(img.complete && img.naturalWidth && img.src === displayUrl){ revealWhenDecoded(); }
    else {
      backdrop.classList.remove('in-view');
      img.addEventListener('load', revealWhenDecoded, { once:true });
      img.addEventListener('error', onError, { once:true });
    }
    img.src = displayUrl;
  }

  // Hero B's photo wall — real photos in slowly drifting, blurred columns
  // (see the #heroWork .photo-wall CSS above). Built once, the first time
  // photos are available: language switches, admin edits, and re-renders
  // of anything else on the page never rebuild it, so the drift never
  // visibly resets mid-visit. galleryPhotos() (not the raw `photos`
  // array) is used so the 3 personal "Islem Zrelli" About photos never
  // show up here either — this wall is the documentary work itself, same
  // rule as Favorite/All.
  var HERO_WORK_WALL_COLS = 4;
  var HERO_WORK_WALL_TILES_PER_COL = 6;
  var HERO_WORK_WALL_SPEEDS = [46, 60, 38, 66]; // seconds per loop, one per column — deliberately uneven so columns never sync up
  var heroWorkWallBuilt = false;
  function renderHeroWorkPhotoWall(){
    if(heroWorkWallBuilt) return;
    var wall = document.getElementById('heroWorkPhotoWall');
    if(!wall) return;
    var pool = galleryPhotos().filter(function(p){ return !!p.image_url; });
    if(!pool.length) return; // nothing published yet — try again next time photos load; the flat backdrop this replaces stays hidden either way, so plain black shows in the meantime

    // Shuffle a copy so the wall doesn't always open on the same handful
    // of photos in admin sort order, and so reloading the page shows a
    // different arrangement.
    var shuffled = pool.slice();
    for(var i = shuffled.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    var idx = 0;
    function nextPhoto(){ var p = shuffled[idx % shuffled.length]; idx++; return p; } // cycles with repeats if the library is smaller than the wall needs

    // 360px source is plenty here: every tile is heavily blurred by CSS
    // (see the filter above), so a sharp, larger image would just be
    // wasted bytes — this is the "make the photos less clear" fix at the
    // network level, not only the visual one.
    var html = '';
    for(var c = 0; c < HERO_WORK_WALL_COLS; c++){
      html += '<div class="wcol ' + (c % 2 === 0 ? 'up' : 'down') + '" style="animation-duration:' + HERO_WORK_WALL_SPEEDS[c % HERO_WORK_WALL_SPEEDS.length] + 's">';
      // doubled tile set back-to-back so the translateY(-50%) loop is seamless
      for(var rep = 0; rep < 2; rep++){
        for(var t = 0; t < HERO_WORK_WALL_TILES_PER_COL; t++){
          html += '<img ' + sizedPhotoAttrs(nextPhoto().image_url, 360) + ' alt="" decoding="async" loading="eager">';
        }
      }
      html += '</div>';
    }
    wall.innerHTML = html;
    heroWorkWallBuilt = true;
  }

  // Reproduces the admin's chosen landing-image composition (see the
  // "Position & Crop" tool in the Landing Page admin tab) on the actual
  // public backdrop. object-position is a PERCENTAGE of the image, so the
  // one stored focal point re-crops correctly at every viewport size —
  // deliberately not a hard-coded `object-position: center`. Falls back to
  // dead-center, no zoom, for sites that haven't set a crop yet.
  function applyHeroCrop(img){
    var crop = Object.assign({ scale:1, x:50, y:50 }, about.hero_crop || {});
    img.style.objectPosition = crop.x + '% ' + crop.y + '%';
    img.style.transform = crop.scale && crop.scale !== 1 ? 'scale(' + crop.scale + ')' : '';
  }
