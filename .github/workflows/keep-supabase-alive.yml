# Keeps the free Supabase project from being paused for inactivity.
#
# JOB 1 - ping: Supabase pauses free projects that get too little database
#   activity over a week. This sends a few tiny, read-only requests (the same
#   kind your website makes when someone visits) once a day.
#
# JOB 2 - keep-schedule-active: GitHub switches off scheduled workflows in
#   public repos after 60 days with no activity in the repo. If the last commit
#   is 45+ days old, this adds one empty commit so that never happens.
#
# Install: put this file in your repo at  .github/workflows/keep-supabase-alive.yml
# Test it:  repo -> Actions tab -> "Keep Supabase awake" -> Run workflow
#
# The URL and key below are the same public values already in your index.html
# (the "publishable" key is designed to be public), so no secrets are needed.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: https://bkjwzdspuriquurfxcnp.supabase.co
          SUPABASE_KEY: sb_publishable_8SR8bCmRJAcQtP1eGe6PDA_YDr3AXJ1
        run: |
          for table in photos categories site_settings; do
            code=$(curl -sS --max-time 30 --retry 2 -o /dev/null -w '%{http_code}' \
              "$SUPABASE_URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $SUPABASE_KEY")
            echo "$table -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Supabase did not answer normally for '$table' (HTTP $code). The project may be paused: open the Supabase dashboard and click Restore."
              exit 1
            fi
          done

  keep-schedule-active:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # only this job may push its one empty commit
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Add an empty commit if the repo has been quiet for 45+ days
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Last commit was $days day(s) ago."
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow active"
            git push
            echo "Added an empty commit so GitHub keeps the daily schedule switched on."
          else
            echo "Nothing to do."
          fi
