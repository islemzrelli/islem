<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Evidence — Stories from Gabès</title>
<meta name="description" content="Documented environmental evidence about Gabès: scientific studies, laboratory analyses, audits, official reports and legislation, each traced to its source.">
<link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="evidence.css">
<script src="transition.js"></script>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to content</a>

<!-- GLOBAL NAVIGATION: the only navigation system on the page.
     Left: way back to the photo gallery. Middle: the three destinations. Right: search of the whole archive. -->
<header class="top">
  <div class="bar">
    <a class="back" href="../"><span aria-hidden="true">←</span> Stories from Gabès</a>
    <a class="wordmark" href="#" id="wordmark">The Evidence</a>
    <nav class="mainnav" aria-label="The Evidence">
      <a href="#" data-nav="overview">Overview</a>
      <a href="#explore" data-nav="explore">Explore evidence</a>
      <a href="#sources" data-nav="sources">Sources</a>
    </nav>
    <form class="hsearch" role="search" id="searchForm">
      <label class="vh" for="q">Search all findings and sources</label>
      <input id="q" type="search" placeholder="Search a chemical, report or institution" autocomplete="off" spellcheck="false" enterkeyhint="search" disabled>
      <button type="submit" class="vh">Search</button>
    </form>
  </div>
</header>

<main id="main" class="ev" tabindex="-1">
  <div id="devbanner" class="note" hidden></div>
  <div id="status" aria-live="polite"></div>

  <!-- All views are drawn into this one container by evidence.js -->
  <div id="view" hidden></div>
</main>

<noscript><p class="note" style="margin:2rem">The Evidence archive needs JavaScript to search and display findings.</p></noscript>
<script src="evidence.js" defer></script>
</body>
</html>
